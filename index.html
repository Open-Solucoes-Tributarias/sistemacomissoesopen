<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://ogkrrlssdrtctdyyvkql.supabase.co; base-uri 'none'; object-src 'none'; form-action 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>HUB Comercial · Open Soluções Tributárias</title>
</head>
<body>
<div id="root"></div>
<style>
  :root{
    /* Identidade visual da Open Soluções Tributárias (mapa de produto):
       marinho profundo na marca e nas faixas, azul claro como destaque,
       fundo azulado bem claro, cartões brancos de borda azul com filete
       colorido no topo, e rótulos em caixa alta bem espaçados. */
    --bg:#F4F7FB;
    --surface:#FFFFFF;
    --ink:#11243D;
    --ink-soft:#5A6E88;
    --ink-faint:#93A3B8;
    --border:#D8E4F0;
    --border-soft:#EDF3F9;
    --navy:#0A2540;          /* marinho da marca */
    --navy-2:#14508C;        /* fim do degradê da faixa */
    --azul-claro:#4FA3E3;    /* destaque do título e do filete */
    --primary:#1C6FBF;
    --primary-hover:#155A9E;
    --primary-soft:#E6F0FA;
    --ring:#A9CDEC;
    --danger:#EF4444;
    --danger-soft:#FEECEC;
    --shadow-sm:0 1px 2px rgba(21,34,56,.04), 0 1px 1px rgba(21,34,56,.03);
    --shadow-md:0 4px 14px rgba(21,34,56,.06), 0 1px 3px rgba(21,34,56,.04);
    --shadow-lg:0 18px 38px -20px rgba(10,37,64,.30), 0 2px 8px rgba(10,37,64,.05);
    --radius-xl:22px;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    /* Degradês e curva de animação — a mesma paleta, com mais profundidade. */
    --grad-primary:linear-gradient(135deg,var(--primary) 0%,var(--azul-claro) 100%);
    --grad-navy:linear-gradient(115deg,#061729 0%,var(--navy) 38%,#123F70 74%,var(--navy-2) 100%);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;}
  body,#root{margin:0;padding:0;}
  /* Banner fixo de "versão nova" — precisa ficar visível não importa em
     que tela/rolagem a pessoa esteja, por isso position:fixed e um
     z-index bem alto, acima até dos modais. */
  .versao-nova-aviso{
    position:fixed;top:0;left:0;right:0;z-index:9999;
    background:var(--navy);color:#fff;font-family:var(--font);font-size:13px;font-weight:700;
    padding:10px 16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .versao-nova-aviso button{
    margin-left:10px;font-family:var(--font);font-size:12.5px;font-weight:800;cursor:pointer;
    padding:5px 14px;border-radius:999px;border:1px solid #8FCBF5;background:#8FCBF5;color:var(--navy);
  }
  .versao-nova-aviso button:hover{background:#fff;}
  #root{
    /* Fundo com dois halos suaves da própria paleta: dá profundidade sem
       tirar a leitura das tabelas, que continuam sobre branco. */
    background:
      radial-gradient(1100px 620px at 100% -12%, rgba(79,163,227,.13) 0%, transparent 62%),
      radial-gradient(900px 520px at -8% 108%, rgba(28,111,191,.09) 0%, transparent 62%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font);
    min-height:100vh;
    padding:0;
    -webkit-font-smoothing:antialiased;
  }
  /* Barras de rolagem discretas, no tom do contorno */
  *::-webkit-scrollbar{width:11px;height:11px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{
    background:#C6D8E9;border-radius:999px;
    border:3px solid transparent;background-clip:content-box;
  }
  *::-webkit-scrollbar-thumb:hover{background:var(--ring);background-clip:content-box;}
  .wrap{max-width:100%;margin:0 auto;}

  /* ---------- Casca: barra lateral + conteúdo ---------- */
  .shell{display:flex;align-items:stretch;min-height:100vh;}
  .sidebar{
    width:238px;flex:none;
    background:linear-gradient(180deg,#FFFFFF 0%,#FAFCFF 55%,#F6FAFE 100%);
    border-right:1px solid var(--border);
    padding:18px 14px 20px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
    display:flex;flex-direction:column;
  }
  /* ---------- Marca ---------- */
  .marca-open{display:flex;align-items:center;gap:9px;}
  .marca-open .logo-globo{flex:none;display:block;}
  .marca-texto{min-width:0;line-height:1;}
  .marca-nome{
    font-size:var(--marca-nome,21px);font-weight:800;letter-spacing:.01em;
    color:var(--navy);line-height:.95;
  }
  .marca-assinatura{
    font-size:calc(var(--marca-nome,21px) * .30);font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);
    margin-top:3px;white-space:nowrap;
  }
  .marca-open.clara .marca-nome{color:#fff;}
  .marca-open.clara .marca-assinatura{color:rgba(255,255,255,.62);}

  .brand{display:block;padding:2px 6px 12px;border-bottom:1px solid var(--border-soft);}
  .brand-text{min-width:0;margin-top:12px;}
  .brand-sub{
    font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-faint);line-height:1.3;margin-top:4px;
  }

  /* ---------- Assinatura do produto: HUB Comercial ----------
     Vai no topo da barra lateral, na faixa e na tela de login, pra que o
     nome do aplicativo apareça sempre — a etiqueta "HUB" em degradê e a
     palavra ao lado, em caixa alta espaçada. */
  .hub-marca{display:flex;align-items:center;gap:7px;min-width:0;}
  .hub-chip{
    font-size:10px;font-weight:900;letter-spacing:.13em;line-height:1;
    background:var(--grad-primary);color:#fff;
    padding:4px 7px;border-radius:6px;flex:none;
    box-shadow:0 4px 12px -4px rgba(28,111,191,.55);
  }
  .hub-nome{
    font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--navy);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* Sobre fundo marinho (faixa do topo e login) */
  .hub-marca.clara .hub-chip{
    background:linear-gradient(135deg,var(--azul-claro) 0%,#8FCBF5 100%);
    color:#06203A;box-shadow:0 4px 14px -4px rgba(79,163,227,.65);
  }
  .hub-marca.clara .hub-nome{
    color:rgba(255,255,255,.92);font-size:11px;font-weight:800;
    letter-spacing:.22em;text-transform:uppercase;
  }
  .nav{margin-top:6px;}
  .nav-group-label{
    font-size:9.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);padding:0 9px;margin:18px 0 6px;
  }
  .nav-item{
    position:relative;
    display:flex;align-items:center;gap:9px;width:100%;
    font-family:var(--font);font-size:13px;font-weight:600;color:var(--ink-soft);
    background:none;border:none;cursor:pointer;text-align:left;line-height:1.3;
    padding:8px 9px;border-radius:10px;margin-bottom:2px;
    transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);
  }
  .nav-item svg{flex:none;width:16px;height:16px;opacity:.7;transition:opacity .18s,transform .18s var(--ease);}
  .nav-item:hover{background:var(--border-soft);color:var(--ink);transform:translateX(2px);}
  .nav-item:hover svg{opacity:1;transform:scale(1.08);}
  .nav-item.active{
    background:linear-gradient(100deg,rgba(28,111,191,.13) 0%,rgba(79,163,227,.07) 100%);
    color:var(--primary);font-weight:800;transform:none;
    box-shadow:0 6px 16px -12px rgba(28,111,191,.9);
  }
  /* filete arredondado à esquerda, no lugar da barra dura */
  .nav-item.active::before{
    content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;
    border-radius:0 3px 3px 0;background:var(--grad-primary);
  }
  .nav-item.active svg{opacity:1;}
  .sidebar-foot{
    margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);
    font-size:11.5px;color:var(--ink-faint);font-weight:600;
  }
  .sidebar-foot .sidebar-user{
    display:block;color:var(--ink-soft);word-break:break-all;line-height:1.4;margin-bottom:8px;
  }
  .sidebar-foot .logout-btn{
    background:none;border:1px solid var(--border);border-radius:8px;
    color:var(--ink-soft);cursor:pointer;font-family:var(--font);
    font-weight:700;font-size:12px;padding:6px 12px;transition:all .13s;
  }
  .sidebar-foot .logout-btn:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .main{flex:1;min-width:0;padding:20px 22px 60px;}

  /* ---------- Faixa de título (padrão do mapa de produto) ---------- */
  .hero{
    position:relative;overflow:hidden;
    background:var(--grad-navy);
    border-radius:var(--radius-xl) var(--radius-xl) 0 0;
    color:#fff;padding:24px 30px;
    display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;
    box-shadow:0 20px 40px -26px rgba(6,23,41,.85);
  }
  /* dois halos que dão volume à faixa, na própria paleta */
  .hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 160% at 10% -30%, rgba(79,163,227,.30) 0%, transparent 58%),
      radial-gradient(90% 130% at 88% 130%, rgba(28,111,191,.34) 0%, transparent 62%);
  }
  /* filete azul claro embaixo, como no material impresso — agora com o
     degradê correndo devagar, pra faixa não ficar estática */
  .hero-linha{
    height:4px;border-radius:0 0 var(--radius-xl) var(--radius-xl);margin-bottom:20px;
    background:linear-gradient(90deg,var(--azul-claro) 0%,#2E82CE 28%,var(--navy-2) 52%,#2E82CE 76%,var(--azul-claro) 100%);
    background-size:220% 100%;
    animation:linhaFluxo 14s linear infinite;
  }
  @keyframes linhaFluxo{from{background-position:0 0;}to{background-position:-220% 0;}}
  .hero-marca{display:flex;align-items:center;gap:20px;min-width:0;position:relative;z-index:1;}
  .hero-divisor{width:1px;height:44px;background:rgba(255,255,255,.22);flex:none;}
  .hero-eyebrow{
    font-size:9.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;
    color:var(--azul-claro);margin-bottom:5px;
  }
  .hero .hub-marca{margin-bottom:7px;}
  .hero h1{font-size:23px;font-weight:800;letter-spacing:-.015em;margin:0;color:#fff;line-height:1.15;}
  .hero h1 em{font-style:normal;color:var(--azul-claro);}
  .hero-right{
    display:flex;flex-direction:column;align-items:flex-end;gap:6px;
    position:relative;z-index:1;text-align:right;
  }
  .hero-info{font-size:12.5px;font-weight:700;color:#fff;}
  .hero-info-sub{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);}
  .hero .save-chip{
    background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);
    color:rgba(255,255,255,.92);box-shadow:none;
    backdrop-filter:blur(6px);
  }
  /* globo d'água no canto, como na arte */
  .hero-globo{
    position:absolute;right:-40px;top:50%;transform:translateY(-50%);
    width:210px;height:210px;opacity:.08;pointer-events:none;
  }
  .hero-globo svg{width:100%;height:100%;}

  /* ---------- Entrada da aba ----------
     Só roda quando a pessoa troca de aba (setTab marca `animarEntrada`),
     nunca a cada tecla digitada num filtro — senão a tela piscaria. */
  @keyframes aparecer{
    from{opacity:0;transform:translateY(9px);}
    to{opacity:1;transform:none;}
  }
  .main.entrando > *{animation:aparecer .34s var(--ease) both;}
  .main.entrando > *:nth-child(2){animation-delay:.04s;}
  .main.entrando > *:nth-child(3){animation-delay:.07s;}
  .main.entrando > *:nth-child(n+4){animation-delay:.1s;}
  .main.entrando .kpi-card{animation:aparecer .42s var(--ease) both;}
  .main.entrando .kpi-card:nth-child(2){animation-delay:.05s;}
  .main.entrando .kpi-card:nth-child(3){animation-delay:.09s;}
  .main.entrando .kpi-card:nth-child(4){animation-delay:.13s;}
  .main.entrando .kpi-card:nth-child(5){animation-delay:.17s;}
  .main.entrando .kpi-card:nth-child(n+6){animation-delay:.21s;}

  /* Quem pediu menos movimento no sistema operacional não vê nenhum */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
    .main.entrando > *,.main.entrando .kpi-card{animation:none !important;}
  }

  @media (max-width:900px){
    .shell{flex-direction:column;}
    .sidebar{
      width:auto;height:auto;position:static;border-right:none;
      border-bottom:1px solid var(--border);padding:12px 14px;
    }
    .nav{display:flex;gap:5px;overflow-x:auto;margin-top:10px;padding-bottom:2px;}
    .nav-group{display:contents;}
    .nav-group-label{display:none;}
    .nav-item{width:auto;white-space:nowrap;margin-bottom:0;}
    .sidebar-foot{margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .sidebar-foot .sidebar-user{margin-bottom:0;}
    .main{padding:16px 14px 60px;}
    .hero{padding:20px 18px;}
  }

  /* Header */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:16px;margin-bottom:22px;
  }
  .company-name{
    font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--primary);margin-bottom:4px;
  }
  .title-block h1{
    font-size:24px;font-weight:800;letter-spacing:-0.02em;
    margin:0 0 4px;color:var(--ink);
  }
  .title-block .sub{font-size:14px;color:var(--ink-soft);font-weight:500;}
  .topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .year-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .year-row .topbar-actions{margin-left:auto;}
  .year-row-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .year-pill{font-weight:800;}
  .year-pill.year-add{color:var(--primary);}
  .year-pill.year-add:hover{background:var(--primary-soft);}
  .save-chip{
    display:flex;align-items:center;gap:7px;
    font-size:12.5px;font-weight:600;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--border);
    padding:7px 13px 7px 10px;border-radius:999px;box-shadow:var(--shadow-sm);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#22C55E;transition:background .25s;}
  .dot.saving{background:var(--primary);animation:pulse 1s infinite;}
  .dot.error{background:var(--danger);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .storage-warning{
    background:var(--danger-soft);border:1px solid #F5B5B5;color:#9A2E2E;
    border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:18px;
    font-size:13px;font-weight:600;line-height:1.5;
  }
  .storage-warning.read-only-notice{
    background:var(--primary-soft);border-color:var(--ring);color:var(--primary);
  }
  .read-only-badge{
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
    background:var(--primary-soft);color:var(--primary);padding:3px 8px;border-radius:999px;
  }

  /* Modo somente leitura: some com tudo que edita/apaga e trava os campos */
  .read-only-mode .btn-add,
  .read-only-mode .action-btn,
  .read-only-mode .admin-only-btn,
  .read-only-mode .year-add{
    display:none !important;
  }
  .read-only-mode tbody td input,
  .read-only-mode tbody td select,
  .read-only-mode .meta-input-wrap input{
    pointer-events:none;background:var(--border-soft);color:var(--ink-soft);
  }
  .read-only-mode tbody td input[type="checkbox"]{
    pointer-events:none;opacity:.55;
  }

  .metas-panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);padding:16px 18px;margin-bottom:26px;
  }
  .meta-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
  .meta-row:last-child{border-bottom:none;}
  .meta-name{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;width:110px;flex:none;}
  .meta-input-wrap{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px;width:140px;flex:none;}
  .meta-input-wrap input{border:none;background:transparent;width:100%;font-size:13px;padding:3px 0;outline:none;}
  .meta-bar-track{flex:1;height:10px;background:var(--border-soft);border-radius:999px;overflow:hidden;}
  .meta-bar-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s;}
  .meta-bar-fill.complete{background:#22C55E;}
  .meta-pct{width:44px;text-align:right;font-weight:800;font-size:13px;flex:none;}

  .chart-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);padding:18px 18px 10px;margin-bottom:26px;
  }

  tr.row-pending{background:#FFF8E8;}
  tr.row-pending:hover{background:#FFF2D6;}
  tr.row-locked{background:#F3F3F6;}
  tr.row-locked input, tr.row-locked select{color:var(--ink-faint);}
  .pending-badge{margin-left:4px;font-size:11px;vertical-align:middle;}
  .parcela-badge{
    display:inline-block;margin-left:4px;font-size:10px;font-weight:700;
    background:var(--primary-soft);color:var(--primary);padding:2px 6px;border-radius:999px;
    vertical-align:middle;white-space:nowrap;
  }
  .dup-badge{
    display:inline-block;margin-left:4px;font-size:10px;font-weight:700;
    background:#EDE9FE;color:#6D28D9;padding:2px 6px;border-radius:999px;
    vertical-align:middle;white-space:nowrap;
  }
  tr.row-duplicate{background:#F5F3FF;}
  tr.row-duplicate:hover{background:#EDE9FE;}
  tr.linha-destacada{background:#FEF3C7 !important; outline:2px solid #FCD34D; outline-offset:-2px;}
  .atraso-badge{
    display:inline-block;font-size:11px;font-weight:700;
    background:#FEE2E2;color:#B91C1C;padding:2px 8px;border-radius:999px;white-space:nowrap;
  }
  .inadimplente-grupo{margin-bottom:18px;}
  .inadimplente-grupo:last-child{margin-bottom:0;}
  .inadimplente-grupo-titulo{font-weight:800;font-size:13px;padding:0 16px 8px;color:var(--ink-soft);}

  .pagamento-cell{padding:8px 10px !important;}
  .pay-toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .pay-toggle input{width:15px;height:15px;accent-color:#22C55E;cursor:pointer;}
  .pagamento-cell select{margin-top:4px;font-size:11.5px;padding:4px 6px !important;}
  /* Nota paga num mês diferente do lançamento: o seletor fica em âmbar, pra
     essa diferença não passar batida — é ela que decide em que mês a
     comissão é liberada. */
  select.sel-pgto-outro-mes{
    background:#FEF3C7 !important;color:#92400E !important;
    font-weight:800 !important;border-radius:6px;
    box-shadow:inset 0 0 0 1px #FCD34D;
  }

  /* ---------- Relatório mensal (só existe na impressão) ---------- */
  #relatorio-print{display:none;}
  .rel-doc{
    color:#111;font-family:var(--font);font-size:10.5px;line-height:1.45;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;   /* cores dos gráficos saem no papel */
  }
  /* Faixa do relatório: a mesma do topo do sistema. */
  .rel-faixa{
    position:relative;overflow:hidden;
    background:linear-gradient(100deg,#071B30 0%,#0A2540 42%,#14508C 100%);
    color:#fff;padding:14px 18px;border-radius:5px 5px 0 0;
    display:flex;justify-content:space-between;align-items:center;gap:18px;
  }
  .rel-faixa-linha{
    height:3px;border-radius:0 0 5px 5px;margin-bottom:14px;
    background:linear-gradient(90deg,#4FA3E3 0%,#2E82CE 55%,#14508C 100%);
  }
  .rel-faixa-globo{
    position:absolute;right:-26px;top:50%;transform:translateY(-50%);
    width:150px;height:150px;opacity:.08;pointer-events:none;
  }
  .rel-faixa-globo svg{width:100%;height:100%;}
  .rel-marca{display:flex;align-items:center;gap:14px;min-width:0;position:relative;z-index:1;}
  .rel-divisor{width:1px;height:30px;background:rgba(255,255,255,.25);flex:none;}
  .rel-empresa{font-size:8px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#4FA3E3;}
  .rel-faixa h1{font-size:15px;font-weight:800;margin:3px 0 0;color:#fff;}
  .rel-emissao{position:relative;z-index:1;text-align:right;white-space:nowrap;}
  .rel-emissao-tit{font-size:9.5px;font-weight:700;color:#fff;}
  .rel-emissao-sub{font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:3px;}
  .rel-sec{margin-bottom:13px;}
  .rel-sec h2{
    font-size:11px;font-weight:800;margin:0 0 6px;padding-bottom:3px;
    letter-spacing:.1em;text-transform:uppercase;color:#0A2540;
    border-bottom:1.5px solid #1C6FBF;display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  }
  .rel-sub{font-size:9px;font-weight:700;color:#666;letter-spacing:.02em;text-transform:none;}
  .rel-cards{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
  .rel-card{
    border:1px solid #ccc;border-top:2.5px solid #1C6FBF;
    border-radius:4px;padding:6px 10px;min-width:118px;flex:1;
  }
  .rel-card span{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:#666;font-weight:700;}
  .rel-card b{font-size:12.5px;}
  .rel-card-total{background:#0A2540;color:#fff;border-color:#0A2540;border-top-color:#4FA3E3;}
  .rel-card-total span{color:rgba(255,255,255,.6);}
  .rel-tabela{width:100%;border-collapse:collapse;}
  .rel-tabela th{
    text-align:left;font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;
    color:#444;border-bottom:1px solid #999;padding:4px 6px;font-weight:800;
  }
  .rel-tabela td{padding:4px 6px;border-bottom:1px solid #e4e4e4;vertical-align:top;}
  .rel-tabela th.num, .rel-tabela td.num{text-align:right;white-space:nowrap;}
  .rel-tabela td.destaque{font-weight:800;}
  .rel-tabela td.mini{font-size:9px;color:#444;}
  .rel-vazio{font-size:9.5px;color:#777;font-style:italic;margin:4px 0 0;}
  .rel-ranking{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-bottom:9px;}
  .rel-ranking-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:4px 7px;border:1px solid #e0e0e0;border-radius:4px;font-size:9.5px;
  }
  .rel-lideres{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .rel-lider{display:inline-flex;align-items:center;gap:3px;font-weight:700;}
  .rel-lider i{width:7px;height:7px;border-radius:2px;display:inline-block;}
  .rel-sem{color:#999;font-style:italic;}
  .rel-campea{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    border:1.5px solid #333;border-radius:5px;padding:8px 11px;margin-bottom:6px;
  }
  .rel-campea-rot{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:#666;font-weight:700;}
  .rel-campea b{font-size:14px;}
  .rel-campea-sub{display:block;font-size:9px;color:#666;}
  .rel-campea-lista{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;font-size:9px;color:#555;}
  .rel-nota{font-size:8.5px;color:#777;margin:0;}
  .rel-graf{margin-bottom:10px;break-inside:avoid;}
  .rel-graf h3{font-size:10px;font-weight:800;margin:0 0 4px;color:#333;}
  .rel-legenda{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-size:9px;color:#555;}
  .rel-legenda span{display:inline-flex;align-items:center;gap:4px;}
  .rel-legenda i{width:8px;height:8px;border-radius:2px;display:inline-block;}
  @media (max-width:640px){ .rel-ranking{grid-template-columns:1fr;} }
  .rel-rodape{margin-top:14px;padding-top:8px;border-top:1px solid #bbb;font-size:8.5px;color:#777;text-align:center;}

  @media print{
    body.imprimindo-relatorio > #root{ display:none !important; }
    body.imprimindo-relatorio #relatorio-print{ display:block !important; }
    /* Nada de quebra forçada: o conteúdo corre e só evita cortar no meio de
       um bloco pequeno. Quebra à força deixava meia página em branco. */
    body.imprimindo-relatorio .rel-sec h2{ break-after:avoid; }
    body.imprimindo-relatorio .rel-graf,
    body.imprimindo-relatorio .rel-campea,
    body.imprimindo-relatorio .rel-faixa{ break-inside:avoid; }
    body.imprimindo-relatorio .rel-tabela tr{ break-inside:avoid; }
    /* Tabela que atravessa a página repete o cabeçalho */
    body.imprimindo-relatorio .rel-tabela thead{ display:table-header-group; }
    @page{ margin:10mm; }
    .topbar-actions, .tabs-nav, .filters-row, .toolbar, .kpi-toggle-row, .row-actions, .del-cell, .search-row, .year-row,
    .contrato-nota-btn, .contrato-add{
      display:none !important;
    }
    body, #root{ background:#fff; }
    .sidebar{ display:none !important; }
    .main{ padding:0 !important; }
    .hero{ background:#fff !important; color:#000 !important; padding:0 0 10px !important; box-shadow:none !important; }
    .hero::before{ display:none !important; }
    .hero h1, .hero-info, .hero-info-sub, .marca-open.clara .marca-nome{ color:#000 !important; }
    .hero .hub-nome{ color:#000 !important; }
    .hero .hub-chip{ background:none !important; color:#000 !important; box-shadow:none !important; padding:0 !important; }
    .hero-globo, .hero-linha{ display:none !important; }
    .main.entrando > *, .main.entrando .kpi-card{ animation:none !important; }
    .kpi-card::after, .panel::before{ display:none !important; }
    .table-card, .chart-card, .metas-panel{ box-shadow:none; border:1px solid #999; break-inside:avoid; }
    input, select{ border:none !important; background:transparent !important; color:#000 !important; }
    .kpi-value.masked{ display:none; }
    /* No papel tudo sai aberto, mesmo o que estiver minimizado na tela */
    .sections-toolbar, .panel-chevron{ display:none !important; }
    .panel .panel-body, .panel.collapsed .panel-body{ display:block !important; }
    .panel{ box-shadow:none; border:1px solid #999; break-inside:avoid; }
    .panel-head{ border-bottom:1px solid #999 !important; }
  }

  /* Tabs nav */
  .tabs-nav{
    display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border);
  }
  .tab-btn{
    font-family:var(--font);font-weight:700;font-size:14.5px;
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    padding:11px 4px;margin-right:26px;border-bottom:2.5px solid transparent;
    transition:all .15s;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}

  /* KPI cards */
  .kpis{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;margin-bottom:26px;
  }
  .kpi-card{
    position:relative;overflow:hidden;
    background:var(--surface);border:1px solid var(--border);
    border-top:3px solid var(--kc,var(--primary));
    border-radius:var(--radius-md);padding:14px 16px 13px;
    box-shadow:var(--shadow-sm);
    transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s;
    min-width:0;
  }
  /* halo na cor do próprio indicador, que cresce no hover */
  .kpi-card::after{
    content:"";position:absolute;right:-52px;top:-58px;width:170px;height:170px;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, var(--kc,var(--primary)) 0%, transparent 68%);
    opacity:.14;
    transition:opacity .28s var(--ease), transform .38s var(--ease);
  }
  .kpi-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--ring);}
  .kpi-card:hover::after{opacity:.24;transform:scale(1.18);}
  .kpi-card > *{position:relative;z-index:1;}
  .kpi-card .kpi-label{
    font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-faint);margin-bottom:8px;display:flex;align-items:center;gap:6px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .kpi-dot{width:8px;height:8px;border-radius:50%;background:var(--kc,var(--primary));flex:none;}
  .kpi-card .kpi-value{
    font-size:19px;font-weight:800;letter-spacing:-0.01em;color:var(--ink);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .kpi-card.total{
    background:linear-gradient(125deg,#071B30 0%,var(--navy) 45%,var(--navy-2) 100%);
    border-color:var(--navy);border-top-color:var(--azul-claro);
    box-shadow:0 14px 30px -20px rgba(10,37,64,.85);
  }
  .kpi-card.total::after{
    background:radial-gradient(circle, var(--azul-claro) 0%, transparent 68%);opacity:.30;
  }
  .kpi-card.total:hover{border-color:var(--azul-claro);}
  .kpi-card.total:hover::after{opacity:.44;}
  .kpi-card.total .kpi-label{color:rgba(255,255,255,.55);}
  .kpi-card.total .kpi-value{color:#fff;font-size:20px;}

  .kpi-toggle-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .resumo-section-title{
    font-size:13px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;
    letter-spacing:.04em;margin:0 0 10px;
  }
  .eye-toggle{
    font-family:var(--font);font-weight:700;font-size:12.5px;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:7px 14px;cursor:pointer;color:var(--ink-soft);box-shadow:var(--shadow-sm);
    transition:border-color .18s, color .18s, transform .16s var(--ease), box-shadow .2s var(--ease), background .18s;
  }
  .eye-toggle:hover{
    border-color:var(--primary);color:var(--primary);background:var(--primary-soft);
    transform:translateY(-1px);box-shadow:var(--shadow-md);
  }
  .danger-toggle:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .kpi-value.masked{letter-spacing:3px;color:var(--ink-faint);font-weight:800;}

  /* Month / vendor pills */
  .filters-row{
    display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center;
  }
  .months{
    display:flex;gap:4px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--border);
    padding:5px;border-radius:999px;
    box-shadow:var(--shadow-sm);width:fit-content;max-width:100%;overflow-x:auto;
  }
  .months.seller-filter{background:var(--border-soft);border-color:var(--border);}
  .seller-pill.active{
    background:linear-gradient(135deg,var(--navy) 0%,#17548F 100%);
    color:#fff;box-shadow:0 8px 18px -8px rgba(18,51,94,.7);
  }

  .search-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .search-input{
    font-family:var(--font);font-size:13px;font-weight:500;
    padding:9px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);color:var(--ink);outline:none;
    min-width:190px;flex:1 1 190px;box-shadow:var(--shadow-sm);
    transition:border-color .15s, box-shadow .15s;
  }
  .search-input::placeholder{color:var(--ink-faint);font-weight:400;}
  .search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .pill{
    font-size:13px;font-weight:600;letter-spacing:-0.005em;
    padding:8px 15px;border-radius:999px;border:none;
    background:transparent;color:var(--ink-soft);cursor:pointer;
    transition:all .15s;white-space:nowrap;
  }
  .pill:hover{color:var(--ink);background:var(--border-soft);}
  .pill.active{
    background:linear-gradient(135deg,var(--navy) 0%,#17548F 100%);
    color:#fff;box-shadow:0 8px 18px -8px rgba(10,37,64,.75);
    letter-spacing:.03em;
  }

  /* Toolbar */
  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;flex-wrap:wrap;gap:10px;
  }
  .count{font-size:13.5px;color:var(--ink-soft);font-weight:500;}
  .count b{color:var(--ink);font-weight:700;}
  .btn-row{display:flex;gap:8px;}
  .btn-add{
    font-family:var(--font);font-weight:700;font-size:13.5px;
    background:var(--grad-primary);color:#fff;border:none;border-radius:10px;
    padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    box-shadow:0 8px 20px -8px rgba(28,111,191,.65);
    transition:filter .18s, transform .16s var(--ease), box-shadow .22s var(--ease);
  }
  .btn-add:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 12px 26px -10px rgba(28,111,191,.7);}
  .btn-add:active{transform:translateY(0) scale(.98);}
  .btn-secondary{
    background:var(--surface);color:var(--ink);border:1px solid var(--border);
    box-shadow:var(--shadow-sm);
  }
  .btn-secondary:hover{background:var(--border-soft);border-color:var(--ring);box-shadow:var(--shadow-md);}

  /* Table */
  .table-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
    overflow:hidden;
    transition:box-shadow .22s var(--ease);
  }
  .table-card:hover{box-shadow:var(--shadow-lg);}
  .table-scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;table-layout:auto;}
  thead th{
    background:linear-gradient(180deg,#FCFDFF 0%,#F4F8FD 100%);
    color:var(--ink-faint);
    font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.13em;
    text-align:left;padding:12px 10px 10px;white-space:nowrap;
    border-bottom:1px solid var(--border);
  }
  thead th.num{text-align:right;}
  thead th .th-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;}
  tbody td{padding:0;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tbody tr{transition:background .1s;}
  tbody tr:hover{background:#F7FAFE;}
  tbody tr:last-child td{border-bottom:none;}
  tbody td input, tbody td select{
    width:100%;border:none;background:transparent;
    font-family:var(--font);font-size:12.5px;color:var(--ink);font-weight:500;
    padding:8px 8px;outline:none;border-radius:0;
  }
  tbody td select{font-weight:600;cursor:pointer;color:var(--primary);}
  tbody td input.num{text-align:right;font-variant-numeric:tabular-nums;}
  tbody td input::placeholder{color:var(--ink-faint);font-weight:400;}
  tbody td input:focus, tbody td select:focus{
    background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--ring);border-radius:6px;
  }
  td.cliente input{min-width:230px;}
  td.venda select{min-width:150px;}
  /* Larguras das colunas das tabelas de lançamento.
     Como a tabela é larga e rola na horizontal, o navegador encolhe cada
     coluna até o conteúdo do cabeçalho — por isso o piso vai em min-width,
     e não em width, que ele ignora nessa situação. */
  .col-valor{min-width:96px;width:96px;}
  .col-mes{min-width:104px;}
  /* Nome da empresa / órgão / curso: sem piso a coluna encolhia e cortava o
     nome. O piso empurra o resto para a rolagem horizontal, que já existe. */
  .col-nome{min-width:290px;}
  .col-nome input{min-width:270px;}
  /* Tráfego pago tem 17 colunas — sem piso, a tabela auto-layout espreme a
     coluna Conta a quase nada e "Foco Tributário" corta pra uma letra. */
  .col-conta{min-width:150px;}
  .currency-wrap{display:flex;align-items:center;}
  .currency-wrap input{text-align:right;padding-left:2px;}
  .currency-prefix{
    display:inline-block;color:var(--ink-faint);font-size:12px;font-weight:600;
    padding-left:8px;user-select:none;flex:none;
  }
  .pct-wrap{display:flex;align-items:center;justify-content:flex-end;}
  .pct-wrap input{text-align:right;padding-right:2px;}
  .pct-suffix{color:var(--ink-faint);font-size:12px;font-weight:600;padding-right:10px;user-select:none;}
  .pct-disabled{display:block;text-align:right;padding-right:14px;color:var(--ink-faint);}
  /* Comissão do Sistema: % em cima, valor embaixo */
  .com-cell{padding:4px 0 !important;min-width:96px;}
  .com-cell .pct-wrap input.pct-mini{
    font-size:11.5px;padding:2px 0;color:var(--ink-soft);font-weight:600;
  }
  .com-cell .pct-wrap .pct-suffix{font-size:10.5px;padding-right:8px;}
  .com-cell.por-pct .pct-wrap input.pct-mini{color:var(--primary);font-weight:800;}
  .com-cell.por-pct input[data-field]{color:var(--primary);font-weight:700;}
  .col-pct{width:110px;}
  .extra-vendedores-btn{
    background:var(--primary-soft);border:1px solid var(--ring);color:var(--primary);
    font-family:var(--font);font-weight:700;font-size:11.5px;
    padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;
    transition:all .15s;
  }
  .extra-vendedores-btn:hover{background:var(--ring);}
  .extra-vendedor-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .extra-vendedor-row{display:flex;align-items:center;gap:8px;}
  .extra-vendedor-row select{
    flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-family:var(--font);font-size:13px;color:var(--ink);background:var(--surface);
  }
  .extra-vendedor-row .pct-wrap{width:100px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px 0;}
  .calc-value{
    text-align:right;padding:0 14px 8px;font-size:11px;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;font-weight:600;
  }
  .del-cell{width:96px;text-align:center;}
  .row-actions{display:flex;gap:2px;justify-content:center;opacity:0;transition:opacity .15s;}
  tr:hover .row-actions{opacity:1;}
  .action-btn{
    background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:13.5px;
    width:26px;height:26px;border-radius:7px;
    display:inline-flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .action-btn:hover{background:var(--primary-soft);color:var(--primary);}
  .action-btn.danger:hover{background:var(--danger-soft);color:var(--danger);}

  .empty-row td{padding:48px 10px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .empty-row .empty-icon{font-size:26px;display:block;margin-bottom:8px;}

  .footnote{margin-top:16px;text-align:right;}
  .reset-link{
    font-size:12px;color:var(--ink-faint);background:none;border:none;cursor:pointer;
    font-family:var(--font);font-weight:600;padding:6px 10px;border-radius:6px;
    transition:all .15s;
  }
  .reset-link:hover{color:var(--danger);background:var(--danger-soft);}

  @media (max-width:980px){
    .kpis{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width:560px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    #root{padding:20px 14px 60px;}
  }

  /* Modal (replaces native confirm/prompt/alert, which can be blocked in sandboxed iframes) */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(21,34,56,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:1000;padding:20px;
  }
  .modal-box{
    background:var(--surface);border-radius:var(--radius-lg);
    box-shadow:0 20px 50px rgba(20,22,43,.25);
    padding:22px;max-width:380px;width:100%;
  }
  .modal-box.modal-box-wide{max-width:640px;max-height:85vh;overflow-y:auto;}
  .modal-box.modal-box-xwide{max-width:980px;max-height:85vh;overflow-y:auto;}
  /* Empresas por lançamento tem muita coluna (Empresa/CNPJ/Responsável/
     Telefone/E-mail/Valor/Nota fiscal/Anexo) — 980px cortava a última
     coluna, obrigando a rolar dentro da própria tabela. */
  .modal-box.modal-box-empresas{max-width:1400px;}
  .tabela-detalhe-scroll{max-height:50vh;overflow-y:auto;}
  .tabela-detalhe-scroll thead th{position:sticky;top:0;background:var(--surface);z-index:1;}
  .modal-textarea{
    width:100%;min-height:220px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-family:'Courier New',Consolas,monospace;font-size:12px;color:var(--ink);outline:none;
    margin-bottom:12px;resize:vertical;background:var(--border-soft);
  }
  .modal-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .modal-error{
    font-size:13px;color:var(--danger);font-weight:600;margin:-4px 0 12px;
  }
  .modal-msg{font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.5;margin-bottom:14px;}
  .modal-input{
    width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-family:var(--font);font-size:14px;color:var(--ink);outline:none;margin-bottom:16px;
  }
  .modal-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  .modal-btn{
    font-family:var(--font);font-weight:700;font-size:13.5px;
    border:none;border-radius:var(--radius-sm);padding:9px 16px;cursor:pointer;
    transition:opacity .15s;
  }
  .modal-btn:hover{opacity:.88;}
  .modal-btn:disabled{opacity:.4;cursor:not-allowed;}
  .modal-btn:disabled:hover{opacity:.4;}
  .modal-btn-ghost{background:var(--border-soft);color:var(--ink-soft);}
  .modal-btn-primary{background:var(--primary);color:#fff;}
  .modal-btn-danger{background:var(--danger);color:#fff;}

  /* Auth (login / recuperar senha) */
  /* ---------- Tela de login com a cara da empresa ---------- */
  .auth-screen{
    position:relative;overflow:hidden;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:20px;
    background:linear-gradient(125deg,#061626 0%,var(--navy) 45%,var(--navy-2) 100%);
  }
  /* halos da paleta, pro fundo do login não ser um bloco chapado */
  .auth-screen::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 55% at 18% 12%, rgba(79,163,227,.28) 0%, transparent 60%),
      radial-gradient(55% 50% at 84% 88%, rgba(28,111,191,.30) 0%, transparent 62%);
  }
  .auth-globo{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:620px;height:620px;opacity:.055;pointer-events:none;
  }
  .auth-globo svg{width:100%;height:100%;}
  .auth-card{
    position:relative;z-index:1;
    background:var(--surface);border:1px solid rgba(255,255,255,.14);
    border-radius:var(--radius-xl);box-shadow:0 30px 70px -20px rgba(0,0,0,.55);
    padding:0;max-width:400px;width:100%;overflow:hidden;
    animation:aparecer .5s var(--ease) both;
  }
  .auth-topo{
    background:var(--grad-navy);
    padding:20px 30px 18px;display:flex;flex-direction:column;align-items:center;gap:11px;
    border-bottom:3px solid var(--azul-claro);
  }
  .auth-topo .hub-marca{justify-content:center;}
  .auth-corpo{padding:28px 30px 30px;}
  .auth-eyebrow{
    font-size:9.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
    color:var(--primary);margin-bottom:7px;
  }
  .auth-rodape{
    position:relative;z-index:1;
    font-size:11px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.42);
  }
  /* Tela dedicada da conta "solicitante" (ex.: Luciana pedindo nota) —
     mesma linguagem visual do login, mas mais larga (tem formulário +
     lista) e com scroll de verdade, já que .auth-screen/.auth-card são
     pensados pro cartão de login, mais curto e sempre cabe na tela. */
  .solicitar-screen{
    position:relative;min-height:100vh;overflow-y:auto;
    display:flex;justify-content:center;padding:40px 20px;
    background:linear-gradient(125deg,#061626 0%,var(--navy) 45%,var(--navy-2) 100%);
  }
  .solicitar-card{
    position:relative;z-index:1;background:var(--surface);border:1px solid rgba(255,255,255,.14);
    border-radius:var(--radius-xl);box-shadow:0 30px 70px -20px rgba(0,0,0,.55);
    max-width:720px;width:100%;height:fit-content;
    animation:aparecer .5s var(--ease) both;
  }
  .auth-logo{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:6px;}
  .auth-card h1{font-size:19px;margin:0 0 5px;font-weight:800;color:var(--ink);letter-spacing:-.01em;line-height:1.2;}
  .auth-card .auth-sub{font-size:13px;color:var(--ink-soft);margin:0 0 22px;font-weight:500;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .auth-input-wrap{position:relative;}
  .auth-input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:14px;color:var(--ink);outline:none;}
  .auth-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .auth-input-wrap .auth-input{padding-right:44px;}
  .auth-toggle-pwd{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:12.5px;font-weight:700;padding:6px 8px;border-radius:6px;}
  .auth-toggle-pwd:hover{color:var(--primary);background:var(--primary-soft);}
  .auth-error{background:var(--danger-soft);color:#9A2E2E;border:1px solid #F5B5B5;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px;line-height:1.4;}
  .auth-notice{background:var(--primary-soft);color:var(--primary);border:1px solid var(--ring);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px;line-height:1.4;}
  .auth-submit{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;transition:background .15s;}
  .auth-submit:hover{background:var(--primary-hover);}
  .auth-submit:disabled{opacity:.6;cursor:not-allowed;}
  .auth-link{background:none;border:none;color:var(--primary);font-family:var(--font);font-weight:700;font-size:12.5px;cursor:pointer;padding:6px 0;}
  .auth-link:hover{text-decoration:underline;}
  .auth-foot{text-align:center;margin-top:16px;}

  .user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface);border:1px solid var(--border);padding:7px 12px;border-radius:999px;}
  .user-chip .logout-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-family:var(--font);font-weight:700;font-size:12px;padding:0;}
  .user-chip .logout-btn:hover{color:var(--danger);}

  /* ---------- Painéis recolhíveis ----------
     Filete azul no topo e título em caixa alta espaçada, como os cartões
     das linhas de produto do mapa. */
  .panel{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    margin-bottom:18px;overflow:hidden;
    transition:box-shadow .22s var(--ease), border-color .22s;
  }
  /* filete do topo em degradê, no lugar da borda chapada */
  .panel::before{
    content:"";display:block;height:3px;
    background:linear-gradient(90deg,var(--primary) 0%,var(--azul-claro) 100%);
  }
  .panel:hover{box-shadow:var(--shadow-md);border-color:var(--ring);}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:13px 16px;border-bottom:1px solid var(--border-soft);
    transition:border-color .18s, background .15s;
  }
  .panel-head:hover{background:#FAFCFF;}
  .panel.collapsed .panel-head{border-bottom-color:transparent;}
  .panel-toggle{
    display:flex;align-items:center;gap:10px;flex:1;min-width:0;
    background:none;border:none;cursor:pointer;padding:2px 0;
    font-family:var(--font);text-align:left;color:var(--ink);
  }
  .panel-chevron{
    flex:none;width:18px;height:18px;border-radius:5px;
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink-faint);transition:transform .2s ease, color .15s;
  }
  .panel-chevron::before{
    content:"";width:5px;height:5px;
    border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;
    transform:rotate(45deg);margin-top:-2px;
  }
  .panel.collapsed .panel-chevron{transform:rotate(-90deg);}
  .panel-toggle:hover .panel-chevron{color:var(--primary);}
  .panel-title{
    font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .panel-toggle:hover .panel-title{color:var(--primary);}
  .panel-head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .panel-meta{font-size:12.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
  .panel-meta b{color:var(--ink);font-weight:800;}
  tr.linha-subtotal td{
    background:var(--border-soft);font-weight:800;font-size:12.5px;color:var(--ink);
    border-top:1px solid var(--border);
  }
  .dica-filtro{
    font-size:12px;color:var(--ink-faint);font-weight:600;
    margin:-4px 16px 12px;line-height:1.45;
  }
  .dica-filtro b{color:var(--ink-soft);}
  .aviso-previsao{
    background:#FFF8E8;border:1px solid #F5DFA8;color:#8A6114;
    border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;font-weight:600;
    line-height:1.5;margin:0 16px 14px;
  }

  .ordem-wrap{display:inline-flex;align-items:center;gap:7px;}
  .ordem-wrap > span{font-size:12px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
  .ordem-wrap select{
    font-family:var(--font);font-size:13px;font-weight:600;color:var(--ink);
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:9px 10px;cursor:pointer;outline:none;
  }
  .ordem-wrap select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .read-only-mode .ordem-wrap{display:inline-flex !important;}

  /* ---------- Painel da Equipe ---------- */
  .painel-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .painel-titulo{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-0.01em;}
  .painel-sub{font-size:13px;color:var(--ink-soft);font-weight:500;margin-top:2px;}
  .painel-abas{display:flex;gap:3px;background:var(--border-soft);border-radius:10px;padding:3px;}
  .painel-aba{
    font-family:var(--font);font-size:13px;font-weight:700;border:none;cursor:pointer;
    background:transparent;color:var(--ink-soft);padding:8px 15px;border-radius:8px;transition:all .15s;
  }
  .painel-aba:hover{color:var(--ink);}
  .painel-aba.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}

  .painel-grid{display:grid;grid-template-columns:minmax(300px,2fr) 3fr;gap:18px;align-items:start;}
  @media (max-width:900px){ .painel-grid{grid-template-columns:1fr;} }

  .painel-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin-bottom:14px;}
  .painel-chip{
    font-family:var(--font);font-size:12.5px;font-weight:700;cursor:pointer;
    padding:9px 6px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-soft);transition:all .15s;
  }
  .painel-chip:hover{border-color:var(--ink-faint);color:var(--ink);}
  .painel-chip.active{background:var(--vc);border-color:transparent;color:#fff;}

  .painel-campo{display:block;margin-bottom:12px;}
  .painel-campo > span{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .painel-campo select, .painel-campo input{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-family:var(--font);font-size:13.5px;color:var(--ink);background:var(--surface);outline:none;
    font-variant-numeric:tabular-nums;
  }
  .painel-campo select:focus, .painel-campo input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .painel-campos{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  @media (max-width:520px){ .painel-campos{grid-template-columns:1fr;} }
  .painel-salvar{
    width:100%;margin-top:6px;padding:11px;border:none;border-radius:var(--radius-sm);
    background:var(--ink);color:#fff;font-family:var(--font);font-size:13.5px;font-weight:700;
    cursor:pointer;transition:opacity .15s;
  }
  .painel-salvar:hover{opacity:.9;}

  .painel-calc{
    background:var(--primary-soft);border:1px solid var(--ring);
    border-radius:var(--radius-sm);padding:11px 13px;margin:4px 0 14px;
  }
  .painel-calc-tit{
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    color:var(--primary);margin-bottom:7px;
  }
  .painel-calc-linha{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12.5px;color:var(--ink-soft);font-weight:600;padding:3px 0;
  }
  .painel-calc-linha b{color:var(--ink);font-variant-numeric:tabular-nums;}
  .painel-calc-nota{font-size:11px;color:var(--primary);opacity:.8;font-weight:600;margin-top:6px;line-height:1.45;}

  /* Dois valores em dinheiro no mesmo cartão não cabem lado a lado —
     ficavam cortados. Vão um embaixo do outro, separados por um filete. */
  .painel-duplo{display:flex;flex-direction:column;gap:9px;}
  .painel-duplo > div + div{border-top:1px solid var(--border-soft);padding-top:9px;}
  .painel-num{
    font-size:19px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;
    line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .painel-num-rot{font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:2px;}
  /* Cartões do painel pedem mais largura que os KPIs normais. */
  .kpis.painel-kpis{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));}

  /* ---------- Ranking: quem foi melhor em cada quesito ----------
     É o bloco principal desta aba, então tem peso próprio: um cartão por
     indicador, com o nome de quem liderou em destaque. */
  .painel-ranking-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
    gap:10px;margin-bottom:14px;
  }
  .rank-card{
    border:1px solid var(--border);border-top:3px solid var(--vc,var(--primary));
    border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface);
    box-shadow:var(--shadow-sm);
  }
  .rank-metrica{
    font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:7px;
  }
  .rank-lider{display:flex;flex-wrap:wrap;gap:4px 12px;}
  .rank-lider span{
    display:inline-flex;align-items:center;gap:6px;
    font-size:16px;font-weight:800;color:var(--vc);letter-spacing:-.01em;line-height:1.15;
  }
  .rank-lider i{width:9px;height:9px;border-radius:3px;background:var(--vc);flex:none;}
  .rank-valor{
    font-size:13px;font-weight:700;color:var(--ink);margin-top:5px;
    font-variant-numeric:tabular-nums;
  }
  .rank-card.vazio{border-top-color:var(--border);background:var(--border-soft);box-shadow:none;}
  .rank-card.vazio .rank-metrica{color:var(--ink-faint);}
  .rank-sem{font-size:12.5px;color:var(--ink-faint);font-weight:600;font-style:italic;}

  .painel-melhor{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:18px 22px;border-radius:var(--radius-md);margin-bottom:14px;
    background:linear-gradient(100deg,#071B30 0%,var(--navy) 45%,var(--navy-2) 100%);
    color:#fff;
  }
  .painel-melhor-globo{
    position:absolute;right:-24px;top:50%;transform:translateY(-50%);
    width:150px;height:150px;opacity:.09;pointer-events:none;
  }
  .painel-melhor-globo svg{width:100%;height:100%;}
  .painel-melhor-esq{position:relative;z-index:1;min-width:0;}
  .painel-melhor-rot{
    font-size:9.5px;text-transform:uppercase;letter-spacing:.2em;font-weight:800;
    color:var(--azul-claro);
  }
  .painel-melhor-nome{font-size:26px;font-weight:800;color:#fff;margin-top:4px;letter-spacing:-.02em;line-height:1.1;}
  .painel-melhor-sub{font-size:12px;font-weight:600;color:rgba(255,255,255,.7);margin-top:4px;}
  .painel-melhor-pontos{text-align:right;position:relative;z-index:1;}
  .painel-melhor-pontos > div:last-child{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px;}
  .painel-melhor-pontos span{font-size:12px;font-weight:600;color:rgba(255,255,255,.55);white-space:nowrap;}
  .painel-melhor-pontos span.destaque{color:#fff;font-weight:800;}
  @media (max-width:560px){
    .painel-melhor-pontos{text-align:left;}
    .painel-melhor-pontos > div:last-child{justify-content:flex-start;}
  }
  .painel-nota{font-size:11.5px;color:var(--ink-faint);font-weight:600;line-height:1.5;margin-top:10px;}
  .painel-legenda{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;}
  .painel-legenda span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:600;}
  .painel-legenda i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  /* ---------- Metas ---------- */
  .metas-lista{display:flex;flex-direction:column;gap:12px;}
  .meta-empty{color:var(--ink-soft);font-size:13.5px;line-height:1.5;padding:6px 2px;}
  .meta-card{
    border:1px solid var(--border);border-radius:var(--radius-md);
    padding:13px 15px;background:var(--surface);
  }
  .meta-card.batida{border-color:#A7E8C4;background:#F4FCF7;}
  .meta-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .meta-card-quem{display:flex;align-items:center;gap:8px;font-size:14px;}
  .meta-card-acoes{display:flex;gap:2px;}
  .meta-card-acoes .action-btn{opacity:.55;}
  .meta-card-acoes .action-btn:hover{opacity:1;}
  .meta-tag{
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
    background:var(--border-soft);color:var(--ink-soft);padding:3px 8px;border-radius:999px;
  }
  .meta-tag.ok{background:#DCFCE7;color:#15803D;}
  .meta-card-regra{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:9px;line-height:1.45;}
  .meta-card .meta-bar-track{margin-bottom:8px;}
  .meta-card-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .meta-card-num{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .meta-card-num b{color:var(--ink);}

  .meta-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:560px){ .meta-form-grid{grid-template-columns:1fr;} }
  .meta-field{display:block;margin-bottom:12px;}
  .meta-field > span{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .meta-field select, .meta-field input{
    width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-family:var(--font);font-size:14px;color:var(--ink);background:var(--surface);outline:none;
  }
  .meta-field select:focus, .meta-field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .meta-field-money{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding-left:10px;background:var(--surface);}
  .meta-field-money:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .meta-field-money input{border:none;box-shadow:none;padding-left:6px;}
  .meta-field-money input:focus{border:none;box-shadow:none;}
  .meta-form-preview{
    background:var(--primary-soft);color:var(--primary);border-radius:var(--radius-sm);
    padding:10px 12px;font-size:12.5px;font-weight:600;line-height:1.5;margin-bottom:14px;
  }

  .divisao-cell{padding:8px 10px !important;}
  .divisao-btn{
    font-family:var(--font);font-size:12.5px;font-weight:700;cursor:pointer;
    background:#FFF8E8;color:#B45309;border:1.5px solid #F5DFA8;
    border-radius:var(--radius-sm);padding:7px 12px;width:100%;text-align:left;
    transition:all .13s;
  }
  .divisao-btn:hover{border-color:#E0A93B;}
  .divisao-btn.ok{background:#F0FDF4;color:#15803D;border-color:#BBF7D0;}
  .divisao-alerta{color:#B45309 !important;font-weight:700;}
  .divisao-minha{
    font-size:13.5px;font-weight:800;color:var(--primary);
    font-variant-numeric:tabular-nums;line-height:1.2;
  }
  .divisao-minha span{
    display:block;font-size:10px;font-weight:700;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.08em;margin-top:2px;
  }
  .divisao-nada{color:var(--ink-faint);font-weight:600;}
  .divisao-explica{
    font-size:12.5px;color:var(--ink-soft);font-weight:500;line-height:1.55;margin-bottom:14px;
  }
  .divisao-lista{display:flex;flex-direction:column;gap:8px;}
  .divisao-linha{display:flex;align-items:center;gap:8px;}
  .divisao-linha select{
    flex:1;min-width:0;font-family:var(--font);font-size:13.5px;font-weight:600;color:var(--ink);
    background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);
    padding:9px 10px;outline:none;
  }
  .divisao-linha select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .divisao-money{
    display:flex;align-items:center;gap:4px;width:150px;flex:none;
    border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0 10px;background:var(--surface);
  }
  .divisao-money:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .divisao-money input{
    border:none;outline:none;background:transparent;width:100%;text-align:right;
    font-family:var(--font);font-size:13.5px;font-weight:600;color:var(--ink);padding:9px 0;
  }
  .divisao-vazio{
    font-size:12.5px;color:var(--ink-faint);font-weight:600;line-height:1.5;
    padding:14px;border:1.5px dashed var(--border);border-radius:var(--radius-sm);text-align:center;
  }
  .divisao-conferencia{
    margin-top:12px;padding:10px 12px;border-radius:var(--radius-sm);
    font-size:12.5px;font-weight:600;background:#FFF8E8;color:#8A6114;border:1px solid #F5DFA8;
  }
  .divisao-conferencia.ok{background:#F0FDF4;color:#15803D;border-color:#BBF7D0;}
  .read-only-mode .divisao-btn{cursor:default;}

  .resp-cell select{font-weight:600;}
  .resp-cell select.sem-resp{
    color:#B45309;background:#FFF8E8;
    box-shadow:inset 0 0 0 1.5px #F5DFA8;border-radius:var(--radius-sm);
  }
  .storage-warning.aviso-resp{
    background:#FFF8E8;border-color:#F5DFA8;color:#8A6114;
  }

  .painel-topo-acoes{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .painel-topo-sub{display:flex;justify-content:flex-end;margin-bottom:12px;}
  .equipe-rodape{display:flex;justify-content:center;margin-top:4px;}
  .rank-peso{
    float:right;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:none;
    color:var(--ink-faint);background:var(--border-soft);border-radius:999px;padding:2px 7px;
  }
  .pesos-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;}
  .peso-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;background:var(--surface);
  }
  .peso-item.zerado{opacity:.55;}
  .peso-nome{font-size:12.5px;font-weight:700;color:var(--ink);}
  .peso-item select{
    border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--surface);
    font-family:var(--font);font-size:12px;font-weight:700;color:var(--primary);cursor:pointer;
  }
  .equipe-rodape .modal-btn{min-width:320px;}
  .painel-periodo{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--primary);
    border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:14px;
  }
  .painel-periodo > span{
    font-size:9.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);
  }
  .painel-periodo select{
    font-family:var(--font);font-size:13.5px;font-weight:700;color:var(--ink);
    background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);
    padding:8px 10px;cursor:pointer;outline:none;
  }
  .painel-periodo select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .painel-periodo > b{
    margin-left:auto;font-size:12px;font-weight:800;color:var(--primary);
    background:var(--primary-soft);border-radius:999px;padding:5px 12px;
  }
  /* ---------- Usuários e acessos ---------- */
  .usuario-aviso{
    background:var(--primary-soft);border:1px solid var(--ring);color:var(--primary);
    border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:16px;
    font-size:12.5px;font-weight:600;line-height:1.55;
  }
  .senha-campo{display:flex;gap:8px;align-items:center;}
  .senha-campo input{flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em;}
  .senha-campo .eye-toggle{flex:none;}
  .usuario-tipo{
    display:flex;align-items:flex-start;gap:10px;cursor:pointer;
    border:1.5px solid var(--border);border-radius:var(--radius-sm);
    padding:11px 13px;margin-bottom:12px;font-size:13px;color:var(--ink-soft);line-height:1.45;
  }
  .usuario-tipo input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;margin-top:1px;flex:none;}
  .usuario-tipo b{color:var(--ink);}
  .usuario-tipo.sel{border-color:var(--primary);background:var(--primary-soft);}
  .usuario-niveis{display:grid;gap:8px;margin-bottom:12px;}
  .usuario-niveis .usuario-tipo{margin-bottom:0;}
  .usuario-dica{
    font-size:12px;color:var(--ink-faint);font-weight:600;line-height:1.5;margin:-4px 0 14px;
  }
  .usuario-tag{
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    background:var(--border-soft);color:var(--ink-soft);padding:3px 9px;border-radius:999px;white-space:nowrap;
  }
  .usuario-tag.admin{background:var(--primary-soft);color:var(--primary);}
  .usuario-tag.fin{background:#E8F3EC;color:#166534;}
  .usuario-tag.alerta{background:#FFF8E8;color:#B45309;}
  button.usuario-tag.link-tag{border:none;cursor:pointer;font-family:inherit;}
  button.usuario-tag.link-tag:hover{filter:brightness(0.95);text-decoration:underline;}
  .usuario-nunca{color:var(--ink-faint);font-style:italic;}
  .senha-nova{
    border:2px solid var(--primary);border-radius:var(--radius-md);
    background:var(--primary-soft);padding:16px 18px;margin-bottom:18px;
  }
  .senha-nova-tit{
    font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:var(--primary);margin-bottom:10px;
  }
  .senha-nova-linha{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .senha-nova-linha > span{
    font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);width:130px;flex:none;
  }
  .senha-nova-linha > b{font-size:14.5px;color:var(--ink);word-break:break-all;}
  .senha-valor{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px !important;
    background:#fff;border:1px solid var(--ring);border-radius:6px;padding:4px 10px;
    user-select:all;
  }
  .senha-nova-nota{font-size:12px;color:var(--ink-soft);font-weight:600;line-height:1.55;margin:10px 0 12px;}

  .painel-periodo-tag{
    font-size:11.5px;font-weight:700;color:var(--ink-soft);
  }
  .painel-equipe-nota{font-size:12.5px;color:var(--ink-soft);font-weight:600;line-height:1.5;margin-bottom:12px;}

  /* Empresas com contrato assinado (equipe de consultoria) */
  .contrato-linha-input, .contrato-linha-select{
    width:100%;border:1px solid transparent;background:transparent;border-radius:6px;
    font-family:var(--font);font-size:13px;color:var(--ink);font-weight:600;
    padding:6px 8px;outline:none;
  }
  .contrato-linha-select{color:var(--primary);font-weight:700;cursor:pointer;}
  .contrato-linha-input:hover, .contrato-linha-select:hover{border-color:var(--border);}
  .contrato-linha-input:focus, .contrato-linha-select:focus{
    border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--surface);
  }
  .contrato-linha-input::placeholder{color:var(--ink-faint);font-weight:400;}
  .contrato-cnpj-aviso{display:block;font-size:10.5px;color:#B45309;font-weight:700;padding:1px 8px 0;}
  .col-cnpj{min-width:180px;}
  /* Colunas de apoio: estão ali para conferência, não para competir com o
     total. Ficam em cinza para o olho ir primeiro no número que importa. */
  table.table-plain td.col-apoio, thead th.col-apoio{color:var(--ink-faint);}
  .col-apoio-nota{font-weight:600;font-size:10px;text-transform:none;letter-spacing:0;}
  .fechamento-datas{font-size:11px;font-weight:600;color:var(--ink-faint);margin-top:2px;font-variant-numeric:tabular-nums;}
  table.table-plain td.celula-clicavel{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;}
  table.table-plain td.celula-clicavel:hover{background:var(--primary-soft);}
  .totais-nota{padding:12px 16px 16px;font-size:12px;color:var(--ink-soft);font-weight:600;line-height:1.55;}
  .col-rent{min-width:300px;}
  .col-resp{min-width:150px;}
  /* contrato de renovação é bem maior que os valores das outras abas */
  .col-valor-larga{width:130px;min-width:130px;}
  .selo-sistema{
    margin-left:6px;font-family:var(--font);font-size:10px;font-weight:800;cursor:pointer;
    letter-spacing:.04em;padding:2px 7px;border-radius:999px;white-space:nowrap;
    background:var(--primary-soft);border:1px solid var(--ring);color:var(--primary);
  }
  .selo-sistema:hover{background:var(--ring);color:var(--navy);}
  /* Lançada em Órgãos Públicos, não em Sistema: outro tom, pra dar pra ver
     de longe em qual aba a renovação foi parar. */
  .selo-sistema.selo-publicos{background:#DCFCE7;color:#15803D;border-color:#86EFAC;}
  .selo-sistema.selo-publicos:hover{background:#BBF7D0;color:#166534;}
  .selo-renovacao{
    margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap;
    padding:2px 7px;border-radius:999px;background:#DCFCE7;border:1px solid #86EFAC;color:#15803D;
  }
  .action-btn.ativo{background:#DCFCE7;color:#15803D;}
  .selo-novo{
    margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap;
    padding:2px 7px;border-radius:999px;background:var(--primary-soft);border:1px solid var(--ring);color:var(--primary);
  }
  .action-btn.ativo-novo{background:var(--primary-soft);color:var(--primary);}
  .selo-upgrade{
    margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap;
    padding:2px 7px;border-radius:999px;background:#FEF3C7;border:1px solid #FCD34D;color:#B45309;
  }
  .action-btn.ativo-upgrade{background:#FEF3C7;color:#B45309;}
  .selo-incompany{
    margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap;
    padding:2px 7px;border-radius:999px;background:#E0E7FF;border:1px solid #C7D2FE;color:#4338CA;
  }
  .action-btn.ativo-incompany{background:#E0E7FF;color:#4338CA;}
  .selo-empresas{
    margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap;
    padding:2px 7px;border-radius:999px;background:#CFFAFE;border:1px solid #A5F3FC;color:#0E7490;
  }
  button.selo-empresas{font-family:var(--font);cursor:pointer;}
  button.selo-empresas:hover{background:#A5F3FC;}
  .selo-empresas.selo-empresas-vazio{background:var(--border-soft);border-color:var(--border-soft);color:var(--ink-faint);}
  .selo-empresas.selo-empresas-vazio:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--ring);}
  .selo-empresas.selo-empresas-emitida{background:#DCFCE7;border-color:#86EFAC;color:#15803D;}
  .selo-empresas.selo-empresas-emitida:hover{background:#BBF7D0;}
  /* Dia combinado pra emitir nota de contrato Mensal/Plano Premium. */
  button.selo-prazo{
    margin-left:6px;font-family:var(--font);font-size:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap;
    cursor:pointer;padding:2px 7px;border-radius:999px;background:#FEF3C7;border:1px solid #FCD34D;color:#B45309;
  }
  button.selo-prazo:hover{background:#FDE68A;}
  button.selo-prazo.selo-prazo-vazio{background:var(--border-soft);border-color:var(--border-soft);color:var(--ink-faint);}
  button.selo-prazo.selo-prazo-vazio:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--ring);}
  button.selo-prazo.selo-prazo-avista{background:#DCFCE7;border-color:#86EFAC;color:#15803D;}
  button.selo-prazo.selo-prazo-avista:hover{background:#BBF7D0;}
  .kpi-sub{font-size:11.5px;font-weight:700;color:var(--ink-faint);margin-top:2px;font-variant-numeric:tabular-nums;}
  .import-arquivo{display:block;margin:4px 0 10px;}
  .import-arquivo input{display:none;}
  .import-arquivo span{
    display:block;text-align:center;cursor:pointer;
    border:1.5px dashed var(--ring);border-radius:var(--radius-sm);
    padding:14px;background:var(--primary-soft);color:var(--primary);
    font-family:var(--font);font-size:13.5px;font-weight:800;transition:all .15s;
  }
  .import-arquivo span:hover{background:var(--ring);color:var(--navy);}
  .import-resumo{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-top:10px;line-height:1.5;}
  .import-alerta{color:#B45309;}
  .import-previa{max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);}
  .import-previa table.table-plain tbody td{padding:7px 10px;font-size:12.5px;}
  .kpi-card.total .kpi-sub{color:rgba(255,255,255,.75);}
  /* Rentável x não rentável: dois botões, um só ativo. Clicar no que já
     está ativo desmarca — o contrato pode entrar antes da avaliação. */
  .rent-toggle{display:flex;gap:6px;}
  .rent-btn{
    flex:1;font-family:var(--font);font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;
    padding:7px 8px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-faint);transition:all .15s;
  }
  .rent-btn:hover:not(:disabled){border-color:var(--ink-faint);color:var(--ink-soft);}
  .rent-btn.sim.on{background:#DCFCE7;border-color:#86EFAC;color:#15803D;}
  .rent-btn.up.on{background:#FEF3C7;border-color:#FCD34D;color:#B45309;}
  /* O visto da nota fiscal: apagado enquanto falta emitir, verde depois. */
  .nota-btn{
    font-family:var(--font);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;
    padding:5px 11px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-faint);transition:all .15s;
  }
  .nota-btn:hover{border-color:var(--ink-faint);color:var(--ink-soft);}
  .nota-btn.on{background:#DCFCE7;border-color:#86EFAC;color:#15803D;}
  .pode-emitir-btn{
    font-family:var(--font);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;
    padding:5px 11px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-faint);transition:all .15s;margin-right:5px;
  }
  .pode-emitir-btn:hover{border-color:var(--ink-faint);color:var(--ink-soft);}
  .pode-emitir-btn.on{background:#FEF3C7;border-color:#FCD34D;color:#B45309;}
  .nota-selo{font-size:11px;font-weight:800;color:#15803D;white-space:nowrap;}
  .nota-selo-pode{color:#B45309;}
  .nota-selo-bloqueada{color:#B91C1C;}
  .nota-editar-data{
    margin-left:4px;font-size:11px;cursor:pointer;background:none;border:none;padding:2px;
    opacity:.6;transition:opacity .15s;vertical-align:middle;
  }
  .nota-editar-data:hover{opacity:1;}
  /* Anexo do arquivo da nota fiscal: um pill compacto, com ou sem arquivo já anexado. */
  .anexo-upload{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;
    padding:5px 10px;border-radius:999px;border:1px dashed var(--border);color:var(--ink-faint);transition:all .15s;
  }
  .anexo-upload:hover{border-color:var(--ink-faint);color:var(--ink-soft);}
  .anexo-upload input{display:none;}
  .anexo-arquivo{display:inline-flex;align-items:center;gap:6px;font-size:11px;}
  .anexo-link{
    font-family:var(--font);font-weight:700;cursor:pointer;white-space:nowrap;max-width:120px;overflow:hidden;
    text-overflow:ellipsis;color:var(--primary);background:none;border:none;padding:0;text-decoration:underline;
  }
  .anexo-remover{font-size:12px;line-height:1;cursor:pointer;color:var(--ink-faint);background:none;border:none;padding:0;}
  .anexo-remover:hover{color:#B91C1C;}
  .notas-pendentes,.notas-ok{
    font-size:12.5px;font-weight:700;line-height:1.5;padding:10px 16px 0;
  }
  .notas-pendentes{color:#B45309;}
  .notas-ok{color:#15803D;}
  /* Alerta de dia de emissão vencido — só aparece pro financeiro. */
  .notas-alerta-prazo{
    margin:12px 16px 0;padding:12px 14px;border-radius:var(--radius-sm);
    background:var(--danger-soft);border:1px solid #FCA5A5;color:#991B1B;
    font-size:12.5px;font-weight:700;line-height:1.5;
  }
  .notas-alerta-prazo ul{margin:6px 0 0;padding-left:18px;font-weight:600;}
  .notas-alerta-prazo li{margin-top:2px;}
  .rent-btn.nao.on{background:var(--danger-soft);border-color:#FCA5A5;color:#B91C1C;}
  .rent-btn:disabled{cursor:default;}
  /* o valor do plano novo fica colado no valor da carteira: dá para ler
     de quanto para quanto a conta subiu sem abrir nada */
  .upgrade-novo{
    display:block;margin-top:3px;font-family:var(--font);font-size:10.5px;font-weight:800;
    cursor:pointer;letter-spacing:.02em;padding:2px 7px;border-radius:999px;white-space:nowrap;
    background:#FEF3C7;border:1px solid #FCD34D;color:#B45309;
  }
  .upgrade-novo:hover{background:#FDE68A;}
  .divisao-conferencia.upgrade-alerta{color:#B91C1C;}
  .contrato-resumo{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:12px 16px 0;font-size:12.5px;font-weight:700;color:var(--ink-soft);
  }
  .contrato-tag{padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;}
  .contrato-tag.sim{background:#DCFCE7;color:#15803D;}
  .contrato-tag.nao{background:var(--danger-soft);color:#B91C1C;}
  .contrato-tag.aval{background:var(--border-soft);color:var(--ink-soft);}
  /* Colunas da lista de leads: nome e empresa precisam de largura pra não
     cortar razão social; cargo é o que mais varia de tamanho. */
  .col-lead-nome{min-width:170px;}
  .col-lead-cargo{min-width:180px;}
  .col-lead-empresa{min-width:200px;}
  .col-lead-fone{min-width:145px;}
  .col-lead-email{min-width:200px;}
  /* Telefone e e-mail viram link pra conta que só lê: um toque liga ou
     abre o e-mail, que é o que se faz com um lead. */
  .lead-link{color:var(--primary);text-decoration:none;font-weight:600;}
  .lead-link:hover{text-decoration:underline;}
  /* A caixa de "substituir a lista inteira" é destrutiva: fundo âmbar pra
     não ser marcada sem querer no meio da conferência. */
  .leads-substituir{
    display:flex;align-items:flex-start;gap:9px;margin-top:12px;
    background:#FEF3C7;border:1px solid #FCD34D;border-radius:var(--radius-sm);
    padding:10px 12px;font-size:12.5px;font-weight:600;color:#92400E;
    line-height:1.45;cursor:pointer;
  }
  .leads-substituir input{width:16px;height:16px;flex:none;margin:1px 0 0;accent-color:#B45309;cursor:pointer;}
  .contrato-nota{padding:10px 16px 0;font-size:12px;color:#B45309;font-weight:600;line-height:1.5;}
  .contrato-nota-lista{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .contrato-nota-lista li{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  /* O atalho vive dentro do aviso âmbar, então herda a cor dele em vez de
     usar o azul de ação — senão briga com o tom do alerta. */
  .contrato-nota-btn{
    font-family:var(--font);font-size:11.5px;font-weight:800;cursor:pointer;
    background:#FEF3C7;border:1px solid #FCD34D;color:#92400E;
    padding:4px 11px;border-radius:999px;white-space:nowrap;
    transition:background .15s, border-color .15s, transform .15s var(--ease);
  }
  .contrato-nota-btn:hover{background:#FDE68A;border-color:#F59E0B;transform:translateY(-1px);}
  .contrato-nota-btn:active{transform:none;}
  .contrato-add{padding:14px 16px;}
  .painel-equipe-lista{display:flex;flex-wrap:wrap;gap:8px;}
  .painel-equipe-item{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    border:1.5px solid var(--border);border-radius:999px;padding:7px 14px 7px 11px;
    font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface);
    transition:all .13s;
