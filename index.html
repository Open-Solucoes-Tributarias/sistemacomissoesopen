/* ---------------- Regularizar pagamentos antigos (em lote) ----------------
   Marca "Pago" bota SEMPRE a data de hoje em pagoEm — é o que decide em
   qual PERÍODO DE FECHAMENTO a comissão de parceiro cai (ver
   dentroDoPeriodoDeFechamento). Pra lançamento antigo que já foi pago
   de verdade lá atrás e só nunca foi registrado, isso seria um problema
   sério: bater "Pago" em massa hoje faria tudo cair no período aberto
   AGORA, inflando as contas deste mês, exatamente o medo da Soraya.

   Por isso esse fluxo NUNCA seta pagoEm. Sem pagoEm,
   elegivelNoFechamento cai no "melhor esforço": (mesPagamento || mes)
   === mês do filtro — ou seja, a comissão aparece liberada no mês
   ESCOLHIDO aqui (o próprio mês do lançamento, por padrão), nunca no
   mês atual. Por ser uma correção deliberada de dado histórico, esse
   fluxo também ignora a trava de "mês fechado" de propósito. */
function abrirRegularizarPagamentos(){
  if(!isAdmin) return;
  modalState = { type:'regularizar-pagamentos', produto:'Todos', ateMes: MONTHS[new Date().getMonth()], busca:'', selecionados:{}, mesEscolhido:{} };
  render();
}
function candidatosRegularizacao(){
  const m = modalState;
  if(!m || m.type !== 'regularizar-pagamentos') return [];
  const ateIdx = MONTHS.indexOf(m.ateMes);
  const produtos = m.produto === 'Todos' ? ['vendas','consultoria','publicos'] : [m.produto];
  const out = [];
  produtos.forEach(function(p){
    if(p === 'vendas'){
      rows.forEach(function(r){
        if(r.pago) return;
        if((r.ano||2026) !== yearFilter) return;
        if(MONTHS.indexOf(r.mes) > ateIdx) return;
        out.push({ chave:'vendas:'+r.id, origem:'Sistema', produtoKey:'vendas', id:r.id, cliente:r.cliente||r.venda||'—', mes:r.mes, ano:r.ano||2026, valor:Number(r.valor)||0 });
      });
    } else {
      const mainField = ENTITIES[p].fields[0].key;
      state[p].rows.forEach(function(r){
        if(r.pago) return;
        if((r.ano||2026) !== yearFilter) return;
        if(MONTHS.indexOf(r.mes) > ateIdx) return;
        out.push({ chave:p+':'+r.id, origem:ENTITIES[p].tabLabel, produtoKey:p, id:r.id, cliente:r[mainField]||'—', mes:r.mes, ano:r.ano||2026, valor:Number(r.valorContrato)||0 });
      });
    }
  });
  const busca = String(m.busca||'').trim().toLowerCase();
  const filtrado = busca ? out.filter(function(c){ return c.cliente.toLowerCase().indexOf(busca) !== -1; }) : out;
  return filtrado.sort(function(a,b){ return MONTHS.indexOf(a.mes) - MONTHS.indexOf(b.mes) || String(a.cliente).localeCompare(String(b.cliente),'pt-BR'); });
}

/* ---------------- Parcelamento de contratos ---------------- */

function nextMonthYear(mes, ano, stepsForward){
  let idx = MONTHS.indexOf(mes) + stepsForward;
  const yearOffset = Math.floor(idx / 12);
  idx = ((idx % 12) + 12) % 12;
  return {mes: MONTHS[idx], ano: (ano||2026) + yearOffset};
}

function splitIntoInstallments(total, n){
  const amounts = [];
  let remaining = total;
  const base = Math.round((total/n)*100)/100;
  for(let i=0;i<n;i++){
    if(i === n-1) amounts.push(Math.round(remaining*100)/100);
    else { amounts.push(base); remaining -= base; }
  }
  return amounts;
}

function parcelarRow(id){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  if(isMonthClosedFor('vendas', r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    return;
  }
  if(!r.valor || Number(r.valor) <= 0){
    showAlert("Preencha o Valor do Contrato antes de parcelar.");
    return;
  }
  showPrompt("Em quantas parcelas mensais? (2 a 24)", (val) => {
    const n = parseInt(val, 10);
    if(!n || n < 2 || n > 24){ showAlert("Digite um número de parcelas entre 2 e 24."); return; }
    const amounts = splitIntoInstallments(Number(r.valor), n);
    const origMes = r.mes, origAno = r.ano||2026;
    r.valor = amounts[0];
    r.parcelaLabel = `1/${n}`;
    for(let i=1;i<n;i++){
      const nm = nextMonthYear(origMes, origAno, i);
      const copy = {...r, id: nextId++, mes: nm.mes, ano: nm.ano, valor: amounts[i], pago:false, mesPagamento:null, parcelaLabel:`${i+1}/${n}`, comissaoPercents: Object.assign({}, r.comissaoPercents)};
      recalcComissoesPorPercent(copy);
      rows.push(copy);
    }
    persist();
  });
}

function isMonthClosed(ano, mes){
  return closedMonths.indexOf(ano+'-'+mes) !== -1;
}
/* Sistema e Cursos recebem lançamento/matrícula o mês inteiro, até o
   dia 31 — fechar o mês pra edição travaria lançamento legítimo de
   fim de mês. Por isso essas duas áreas nunca travam por "mês fechado
   pra edição" (closedMonths); Consultoria e Órgãos Públicos continuam
   travando normalmente. Isso não mexe no fechamento de PAGAMENTO
   (fechamentosMes), que é outra trava, sempre separada. */
const PRODUTOS_SEM_TRAVA_DE_EDICAO = ['vendas', 'cursos'];
function isMonthClosedFor(produto, ano, mes){
  if(PRODUTOS_SEM_TRAVA_DE_EDICAO.indexOf(produto) !== -1) return false;
  return isMonthClosed(ano, mes);
}
function toggleMonthClosed(ano, mes){
  const key = ano+'-'+mes;
  const idx = closedMonths.indexOf(key);
  if(idx === -1) closedMonths.push(key);
  else closedMonths.splice(idx,1);
  persistClosedMonths();
  render();
}



/* ---------------- Metas mensais ----------------
   Uma meta é um GATILHO DA EMPRESA que premia uma pessoa:
   "quando a empresa faturar R$ X em <origem> no mês, fulana ganha Y".
   O prêmio é um valor fixo em R$ ou uma % sobre o total faturado
   (sobre o total inteiro, não sobre o que passou do alvo).
   Como depende do faturamento geral, só admin configura e acompanha. */

const META_ORIGENS = [
  {key:'cursos',      label:'Cursos'},
  {key:'sistema',     label:'Sistema'},
  {key:'consultoria', label:'Consultoria'},
  {key:'publicos',    label:'Consultorias e site para Órgãos Públicos'},
  {key:'todas',       label:'Todas as abas somadas'},
];
function origemLabel(key){
  const o = META_ORIGENS.find(x => x.key === key);
  return o ? o.label : key;
}

/* Total faturado pela empresa numa origem, no mês/ano informado.
   Usa o valor cheio do contrato, antes de comissões e parceiros. */
function faturamentoDaOrigem(origem, ano, mes){
  let total = 0;
  if(origem === 'sistema' || origem === 'todas'){
    rows.forEach(r => {
      if((r.ano||2026) !== ano || r.mes !== mes) return;
      total += Number(r.valor)||0;
    });
  }
  ENTITY_KEYS.forEach(key => {
    if(origem !== 'todas' && origem !== key) return;
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== ano || r.mes !== mes) return;
      total += Number(r.valorContrato)||0;
    });
  });
  return total;
}

/* Situação de uma meta: quanto já faturou, se bateu e quanto vale o prêmio. */
function avaliarMeta(m){
  const faturado = faturamentoDaOrigem(m.origem, m.ano, m.mes);
  const bateu = m.alvo > 0 && faturado >= m.alvo;
  const premio = !bateu ? 0
    : (m.premioTipo === 'fixo' ? Number(m.premioValor)||0
                               : faturado * ((Number(m.premioValor)||0) / 100));
  const pct = m.alvo > 0 ? Math.round((faturado / m.alvo) * 100) : 0;
  return { faturado, bateu, premio, pct, falta: Math.max(0, m.alvo - faturado) };
}

function metaDescricaoRegra(m){
  const gatilho = `Quando a empresa faturar ${fmtMoney(m.alvo)} em ${origemLabel(m.origem)}`;
  const premio = m.premioTipo === 'fixo'
    ? `${fmtMoney(m.premioValor)} fixos`
    : `${String(m.premioValor).replace('.',',')}% do total faturado`;
  return `${gatilho} → ${premio}`;
}

function metasDoMes(){
  if(partnerMonthFilter === "Todos") return [];
  return metas.filter(m => m.ano === yearFilter && m.mes === partnerMonthFilter);
}
function bonusDaMeta(metaId){
  return bonusRows.find(b => b.metaId === metaId);
}

/* ---- criar / editar / excluir uma meta ---- */
function novaMeta(){
  if(partnerMonthFilter === "Todos"){
    showAlert("Escolha um mês no filtro acima para criar uma meta — metas são mensais.");
    return;
  }
  modalState = {

    meta:{ id:null, ano:yearFilter, mes:partnerMonthFilter, vendedor:'',
           origem:'cursos', alvo:null, premioTipo:'fixo', premioValor:null },
    error:'',
  };
  render();
}
function editarMeta(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  modalState = { type:'meta-form', meta: Object.assign({}, m), error:'' };
  render();
}
function excluirMeta(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  showConfirm(
    `Excluir a meta de ${m.vendedor}? ${metaDescricaoRegra(m)}. O bônus já lançado a partir dela, se houver, continua na aba Bônus e Metas.`,
    () => {
      marcarParaApagar('metas', id);
      metas = metas.filter(x => x.id !== id);
      persistMetas();
      render();
    },
    "Excluir"
  );
}
function onMetaFormChange(el, campo){
  if(!modalState || modalState.type !== 'meta-form') return;
  const v = el.value;
  if(campo === 'alvo' || campo === 'premioValor') modalState.meta[campo] = v === '' ? null : parseFloat(v);
  else modalState.meta[campo] = v;
  if(campo === 'premioTipo') render();
}
function salvarMeta(){
  if(!modalState || modalState.type !== 'meta-form') return;
  const m = modalState.meta;
  if(!m.vendedor){ modalState.error = 'Escolha quem recebe o prêmio.'; render(); return; }
  if(!(Number(m.alvo) > 0)){ modalState.error = 'Informe o valor que a empresa precisa faturar.'; render(); return; }
  if(!(Number(m.premioValor) > 0)){ modalState.error = 'Informe o valor do prêmio.'; render(); return; }
  if(m.premioTipo === 'percentual_total' && Number(m.premioValor) > 100){
    modalState.error = 'A porcentagem do prêmio não pode passar de 100%.'; render(); return;
  }
  if(m.id === null){
    m.id = metasNextId++;
    metas.push(m);
  } else {
    const i = metas.findIndex(x => x.id === m.id);
    if(i !== -1) metas[i] = m;
  }
  modalState = null;
  persistMetas();
  render();
}

/* Regras costumam valer o ano inteiro; isso evita recadastrar toda virada
   de mês. Pula meses que já tiverem uma regra idêntica. */
function mesmaRegra(a, b){
  return a.vendedor === b.vendedor && a.origem === b.origem
      && Number(a.alvo) === Number(b.alvo)
      && a.premioTipo === b.premioTipo
      && Number(a.premioValor) === Number(b.premioValor);
}
function repetirMetaNoAno(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  const idx = MONTHS.indexOf(m.mes);
  const restantes = MONTHS.slice(idx + 1);
  if(restantes.length === 0){
    showAlert("Dezembro é o último mês do ano — não há meses seguintes para repetir.");
    return;
  }
  const alvos = restantes.filter(mes =>
    !metas.some(x => x.ano === m.ano && x.mes === mes && mesmaRegra(x, m)));
  if(alvos.length === 0){
    showAlert("Todos os meses seguintes de " + m.ano + " já têm essa mesma regra.");
    return;
  }
  showConfirm(
    `Repetir esta regra de ${m.vendedor} (${metaDescricaoRegra(m)}) em ${alvos.join(', ')} de ${m.ano}? Meses que já tiverem uma regra igual serão pulados.`,
    () => {
      alvos.forEach(mes => {
        metas.push(Object.assign({}, m, {id: metasNextId++, mes: mes}));
      });
      persistMetas();
      render();
    },
    "Repetir"
  );
}

/* ---- lançar o bônus da meta batida (com confirmação) ---- */
function lancarBonusDaMeta(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  const av = avaliarMeta(m);
  if(!av.bateu){ showAlert("Esta meta ainda não foi batida."); return; }
  if(bonusDaMeta(id)){ showAlert("O bônus desta meta já foi lançado."); return; }
  if(isMonthClosed(m.ano, m.mes)){
    showAlert("Este mês está fechado para novos lançamentos. Reabra em Resumo Geral para poder lançar.");
    return;
  }
  showConfirm(
    `Lançar ${fmtMoney(av.premio)} de bônus para ${m.vendedor} em ${m.mes}/${m.ano}? A empresa faturou ${fmtMoney(av.faturado)} em ${origemLabel(m.origem)} (meta: ${fmtMoney(m.alvo)}). O lançamento vai para a aba Bônus e Metas e pode ser editado lá.`,
    () => {
      const desc = m.premioTipo === 'fixo'
        ? `Meta batida — ${origemLabel(m.origem)} ${fmtMoney(m.alvo)}`
        : `Meta batida — ${String(m.premioValor).replace('.',',')}% de ${fmtMoney(av.faturado)} em ${origemLabel(m.origem)}`;
      bonusRows.unshift({
        id: bonusNextId++, ano: m.ano, mes: m.mes, vendedor: m.vendedor,
        descricao: desc, valor: Math.round(av.premio*100)/100, metaId: m.id,
      });
      persistBonus();
      render();
    },
    "Lançar bônus"
  );
}

function getPartnerEntries(){
  const out = [];
  const sources = [
    {origem:'Sistema', list: rows, valorField:'valor', labelFn: r => r.cliente || r.venda || ''},
    {origem:'Consultoria', list: state.consultoria.rows, valorField:'valorContrato', labelFn: r => r.empresa || ''},
    {origem:'Consultorias e site para Órgãos Públicos', list: state.publicos.rows, valorField:'valorContrato', labelFn: r => r.orgao || ''},
    {origem:'Cursos', list: state.cursos.rows, valorField:'valorContrato', labelFn: r => r.curso || ''},
  ];
  sources.forEach(src => {
    src.list.forEach(r => {
      if(!r.parceiro) return;
      if((r.ano||2026) !== yearFilter) return;
      /* Comissão de parceiro só entra depois que o cliente PAGOU — o mesmo
         padrão que já vale pra comissão de vendedora (elegivelNoFechamento).
         Antes contava assim que o lançamento era feito, sem esperar
         pagamento nenhum, o que inflava o "ganho" do parceiro com contas
         ainda pendentes (foi o caso do Clebeson: Cesob de Fev e Mai ainda
         não pagas entravam no total junto com a de Ago, já paga). */
      if(!elegivelNoFechamento(r, partnerMonthFilter)) return;
      const valorContrato = Number(r[src.valorField])||0;
      const pct = parsePercent(r.participacao);
      const honorario = valorContrato * (pct/100);
      out.push({ origem: src.origem, mes: r.mes, label: src.labelFn(r), valorContrato, parceiro: r.parceiro, pct, honorario });
    });
  });
  return out;
}

function computePartnerTotals(entries){
  const t = {};
  partners.forEach(p => t[p] = 0);
  entries.forEach(e => {
    if(t[e.parceiro] === undefined) t[e.parceiro] = 0;
    t[e.parceiro] += e.honorario;
  });
  return t;
}

function addSalarioRow(){
  const mes = bonusFilter === "Todos" ? "Janeiro" : bonusFilter;
  if(isMonthClosed(yearFilter, mes)){

  render();
}

function repeatSalarioForYear(id){
  const r = bonusRows.find(x => x.id === id);
  if(!r) return;
  const startIdx = MONTHS.indexOf(r.mes);
  if(startIdx === -1 || startIdx === MONTHS.length - 1){
    showAlert("Esse lançamento já está em Dezembro — não há meses seguintes pra repetir.");
    return;
  }
  const restantes = MONTHS.slice(startIdx + 1);
  const quem = r.vendedor || "esse colaborador";
  showConfirm(
    `Repetir o salário de ${quem} nos meses restantes de ${r.ano||yearFilter} (${restantes.join(', ')})? Meses fechados, ou que já tenham um salário lançado para a mesma pessoa, serão pulados.`,
    () => {
      const ano = r.ano || yearFilter;
      restantes.forEach(mes => {
        if(isMonthClosed(ano, mes)) return;
        const existe = bonusRows.some(x => (x.ano||2026) === ano && x.mes === mes
          && isSalarioRow(x) && (x.vendedor||"") === (r.vendedor||""));
        if(existe) return;
        bonusRows.push({...r, id: bonusNextId++, mes: mes, metaId: null});
      });
      persistBonus();
      render();
    },
    "Repetir"
  );
}

function duplicateBonusRow(id){
  const r = bonusRows.find(r => r.id === id);
  if(!r) return;
  bonusRows.unshift({...r, id: bonusNextId++});
  persistBonus();
  render();
}

function deleteBonusRow(id){
  const r = bonusRows.find(r => r.id === id);
  if(r && isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado. Reabra em Resumo Geral para poder excluir.");
    return;
  }
  showConfirm(isSalarioRow(r) ? "Excluir este lançamento de salário?" : "Excluir este bônus/meta?", () => {
    marcarParaApagar('bonus', id);
    bonusRows = bonusRows.filter(r => r.id !== id);
    persistBonus();
  });
}

function isSalarioRow(r){ return r && r.tipo === BONUS_TIPO_SALARIO; }

function bonusDoAnoEMes(){
  let list = bonusRows.filter(r => (r.ano||2026) === yearFilter);

function computeBonusTotals(visible){
  const t = {};
  SELLERS.forEach(s => t[s.label] = 0);
  visible.forEach(r => {
    if(!r.vendedor) return;
    if(t[r.vendedor] === undefined) t[r.vendedor] = 0;
    t[r.vendedor] += Number(r.valor)||0;
  });
  return t;
}

function updateBonusSummaries(){
  const visible = getBonusVisible();
  const totals = computeBonusTotals(visible);
  SELLERS.forEach(s => {
    const el = document.getElementById('kpi-bonus-'+s.key);
    if(el) el.textContent = bonusValuesRevealed ? fmtMoney(totals[s.label]) : '••••••';
  });
  const totalEl = document.getElementById('kpi-bonus-total');
  if(totalEl) totalEl.textContent = fmtMoney(visible.reduce((s,r)=>s+(Number(r.valor)||0),0));
  const countEl = document.getElementById('count-bonus');
  if(countEl){
    countEl.innerHTML = `<b>${visible.length}</b> lançamento${visible.length===1?"":"s"} ${bonusFilter!=="Todos" ? "em <b>"+esc(bonusFilter)+"</b>" : ""}`;
  }

  const salCountEl = document.getElementById('count-salario');
  if(salCountEl){

    salCountEl.innerHTML = `<b>${salarios.length}</b> salário${salarios.length===1?'':'s'}${bonusFilter!=="Todos" ? " em <b>"+esc(bonusFilter)+"</b>" : " no ano"}${salarios.length ? ' · '+(bonusValuesRevealed ? fmtMoney(totSal) : '••••••') : ''}`;

/* ---------------- Resumo Geral (vendedores + parceiros) ---------------- */

function getSellerBreakdown(){
  const by = {};
  SELLERS.forEach(s => { by[s.label] = {sistema:0, consultoria:0, publicos:0, cursos:0, bonus:0}; });
  const ensure = (name) => { if(!by[name]) by[name] = {sistema:0, consultoria:0, publicos:0, cursos:0, bonus:0}; };

  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
    SELLERS.forEach(s => { by[s.label].sistema += Number(r[s.key])||0; });
  });

  ENTITY_KEYS.forEach(key => {
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
      const base = entityRemainingAfterPartner(r);
      const premium = key === 'publicos' && r.tipo === 'Plano Premium';
      const contaComoSistema = premium || r.upgrade;
      getRowSellerAssignments(r).forEach(a => {
        ensure(a.vendedor);
        const valor = base * (a.percent/100);
        /* Plano premium (Órgãos Públicos) e upgrade (qualquer entidade) são
           lançados fora do Sistema, mas pra quem é vendedora de Sistema
           (Rios, Soraya, Angela, Luciana, Uilma) a comissão entra no total
           de Sistema — só lá, não soma de novo no lugar onde foi lançado.
           Gustavo, Arick e Matheus Costa não são vendedores de Sistema:
           ficam detalhados no lugar de sempre. */
        if(contaComoSistema && ehVendedorDeSistema(a.vendedor)) by[a.vendedor].sistema += valor;
        else by[a.vendedor][key] += valor;
      });
    });
  });

  /* Honorário do professor de curso: valor fixo por lançamento, não %
     de comissão — soma direto no total de Cursos de quem der a aula,
     sem passar pela divisão de vendedor/vendedor2/vendedor3. */
  state.cursos.rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
    [['professor','honorarioProfessor'],['professor2','honorarioProfessor2']].forEach(function(par){
      if(!r[par[0]]) return;
      ensure(r[par[0]]);
      by[r[par[0]]].cursos += Number(r[par[1]])||0;
    });
  });

  bonusRows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(isSalarioRow(r)) return;              // salário não é ganho de comissão
    if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
    if(!r.vendedor) return;
    ensure(r.vendedor);
    by[r.vendedor].bonus += Number(r.valor)||0;
  });

  return by;
}

/* Uma nota "espera pagamento" entra no fechamento do mês em que foi
   FECHADA — não num dia fixo do calendário. Cada mês fechado grava um
   carimbo (fechamentosMes: quando o admin clicou "Fechar"), em ORDEM
   DE TEMPO. Uma nota pertence ao período entre o fechamento anterior
   (exclusive) e o fechamento deste mês (inclusive). O mês ainda não
   fechado é o período "aberto": tudo pago desde o último fechamento
   até agora é candidato dele — é só uma prévia, vira definitivo
   quando alguém fechar.
   Isso troca a regra antiga (01 do mês anterior a 16 do mês), que
   vencia sozinha no dia 16 mesmo com o fechamento ainda em revisão —
   foi o que fez a correção da Prefeitura de Catu (feita dia 17) cair
   em Outubro por engano, quando devia valer pra Setembro. */
function getFechamentoDoMes(ano, mes){
  return fechamentosMes.find(f => f.ano === ano && f.mes === mes) || null;
}
function fechamentosMesEmOrdem(ano){
  return fechamentosMes.filter(f => f.ano === ano).slice().sort((a,b) => new Date(a.fechadoEm) - new Date(b.fechadoEm));
}
function periodoDoFechamento(mes, ano){
  const lista = fechamentosMesEmOrdem(ano);
  const idx = lista.findIndex(f => f.mes === mes);
  if(idx === -1){
    // ainda não fechado: início é o último fechamento que já rolou (sem fim — é o período aberto agora)
    const ultimo = lista.length ? lista[lista.length-1] : null;
    return { inicio: ultimo ? new Date(ultimo.fechadoEm) : null, fim: null };
  }
  const anterior = idx > 0 ? lista[idx-1] : null;
  return { inicio: anterior ? new Date(anterior.fechadoEm) : null, fim: new Date(lista[idx].fechadoEm) };
}
/* Mês que ainda nem começou (ex.: olhar Outubro em pleno Setembro) não
   pode ter nada "no período aberto" — sem isso, todo mês ainda não
   fechado herdava o MESMO período aberto (desde o último fechamento
   até agora), e um pagamento batido hoje aparecia junto em Setembro
   E em Outubro ao mesmo tempo, mesmo Outubro não tendo nem começado. */
function mesAindaNaoComecou(mes, ano){
  const hoje = new Date();
  const idxMes = MONTHS.indexOf(mes);
  if(idxMes === -1) return false;
  if((ano||2026) !== hoje.getFullYear()) return (ano||2026) > hoje.getFullYear();
  return idxMes > hoje.getMonth();
}
function dentroDoPeriodoDeFechamento(pagoEmIso, mes, ano){
  if(!pagoEmIso) return false;
  if(mesAindaNaoComecou(mes, ano)) return false;
  const d = new Date(pagoEmIso);
  if(isNaN(d.getTime())) return false;
  const p = periodoDoFechamento(mes, ano);
  if(p.inicio && d <= p.inicio) return false;
  if(p.fim && d > p.fim) return false;
  return true;
}
/* Só chega aqui quem já espera pagamento (Consultoria pra vendedora de
   Sistema; tudo pra quem não é). r.fechamentoMes é uma trava manual
   numa nota específica — exceção pra correção retroativa, feita direto
   no banco quando um pagamento precisa contar num mês já fechado. Sem
   essa trava, vale o período do fechamento do mês (fechamentosMes). */
function elegivelNoFechamento(r, mes){
  if(!r.pago) return false;
  if(mes === "Todos" || !mes) return true;
  if(r.fechamentoMes) return r.fechamentoMes === mes;
  if(r.pagoEm) return dentroDoPeriodoDeFechamento(r.pagoEm, mes, yearFilter);
  return (r.mesPagamento || r.mes) === mes;   // pago sem data exata ainda: melhor esforço, como antes
}

/* getSellerBreakdown soma TUDO que foi ganho, pago ou não — é o "ganhos
   totais" do Resumo Geral. Pra fechamento (o que dá pra mandar pagar
   agora), a liberação da comissão depende de QUEM ganhou e de QUE
   ORIGEM:
   - Vendedoras de Sistema (Rios, Angela, Soraya, Luciana, Uilma): Sistema,
     Órgãos Públicos, Cursos e Bônus liberam na hora, no mês do próprio
     lançamento, entram mesmo sem o cliente ter pago a nota ainda. Só a
     comissão de Consultoria espera o pagamento (regra abaixo).
   - Todo mundo fora dessa lista (Arick, Gustavo, Matheus Costa e quem
     mais aparecer): tudo espera o cliente pagar, não importa o produto. */
function getSellerReceivable(mes){
  const by = {};
  const ensure = (name) => { if(!by[name]) by[name] = {sistema:0, consultoria:0, publicos:0, cursos:0, bonus:0}; };
  const noPeriodoLancamento = function(r){
    return (r.ano||2026) === yearFilter && (mes === "Todos" || !mes || r.mes === mes);
  };

  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    SELLERS.forEach(s => {
      const valor = Number(r[s.key])||0;
      if(!valor) return;
      const ok = ehVendedorDeSistema(s.label) ? noPeriodoLancamento(r) : elegivelNoFechamento(r, mes);
      if(!ok) return;
      ensure(s.label);
      by[s.label].sistema += valor;
    });
  });

  ENTITY_KEYS.forEach(key => {
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      const base = entityRemainingAfterPartner(r);
      const premium = key === 'publicos' && r.tipo === 'Plano Premium';
      const contaComoSistema = premium || r.upgrade;
      getRowSellerAssignments(r).forEach(a => {
        const deSistema = ehVendedorDeSistema(a.vendedor);
        const liberaSemPagar = deSistema && key !== 'consultoria';
        const ok = liberaSemPagar ? noPeriodoLancamento(r) : elegivelNoFechamento(r, mes);
        if(!ok) return;
        ensure(a.vendedor);
        const valor = base * (a.percent/100);
        const destino = (contaComoSistema && deSistema) ? 'sistema' : key;
        by[a.vendedor][destino] += valor;
      });
    });
  });

  /* Honorário do professor libera igual ao Bônus: no mês do próprio
     lançamento, sem esperar pagamento — não é comissão de venda. */
  state.cursos.rows.forEach(r => {
    if(!noPeriodoLancamento(r)) return;
    [['professor','honorarioProfessor'],['professor2','honorarioProfessor2']].forEach(function(par){
      if(!r[par[0]]) return;
      ensure(r[par[0]]);
      by[r[par[0]]].cursos += Number(r[par[1]])||0;
    });
  });

  bonusRows.forEach(r => {
    if(!noPeriodoLancamento(r)) return;
    if(isSalarioRow(r)) return;
    if(!r.vendedor) return;
    ensure(r.vendedor);
    by[r.vendedor].bonus += Number(r.valor)||0;
  });

  return by;
}

/* Detalhamento de uma célula do Fechamento: cada lançamento que compõe
   aquele número, pra conferir sem precisar perguntar. Espelha a mesma
   regra de elegibilidade de getSellerReceivable — muda ali, muda aqui
   também. */
function detalheFechamento(pessoa, origem, mes){
  const linhas = [];
  const noPeriodoLancamento = function(r){
    return (r.ano||2026) === yearFilter && (mes === 'Todos' || !mes || r.mes === mes);
  };
  const deSistema = ehVendedorDeSistema(pessoa);

  if(origem === 'sistema'){
    rows.forEach(function(r){
      SELLERS.forEach(function(s){
        if(s.label !== pessoa) return;
        const valor = Number(r[s.key])||0;
        if(!valor) return;
        const ok = deSistema ? noPeriodoLancamento(r) : elegivelNoFechamento(r, mes);
        if(!ok) return;
        linhas.push({ origemLabel: 'Sistema', mes: r.mes, cliente: r.cliente || r.venda || '—',
          valorContrato: Number(r.valor)||0, percent: null, comissao: valor, pago: !!r.pago, mesPagamento: r.mesPagamento });
      });
    });
    ENTITY_KEYS.forEach(function(key){
      state[key].rows.forEach(function(r){
        if((r.ano||2026) !== yearFilter) return;
        const premium = key === 'publicos' && r.tipo === 'Plano Premium';
        const contaComoSistema = premium || r.upgrade;
        if(!contaComoSistema || !deSistema) return;
        const mainField = ENTITIES[key].fields[0].key;
        const base = entityRemainingAfterPartner(r);
        getRowSellerAssignments(r).forEach(function(a){
          if(a.vendedor !== pessoa) return;
          const ok = (key !== 'consultoria') ? noPeriodoLancamento(r) : elegivelNoFechamento(r, mes);
          if(!ok) return;
          linhas.push({ origemLabel: ENTITIES[key].tabLabel + (premium ? ' · premium' : ' · upgrade'), mes: r.mes,
            cliente: r[mainField] || '—', valorContrato: Number(r.valorContrato)||0,
            percent: a.percent, comissao: base*(a.percent/100), pago: !!r.pago, mesPagamento: r.mesPagamento });
        });
      });
    });
  } else if(origem === 'bonus' || origem === 'salario'){
    bonusRows.forEach(function(r){
      if(isSalarioRow(r) !== (origem === 'salario')) return;
      if(r.vendedor !== pessoa) return;
      if(!noPeriodoLancamento(r)) return;
      linhas.push({ origemLabel: origem === 'salario' ? 'Salário fixo' : 'Bônus', mes: r.mes,
        cliente: r.descricao || '—', valorContrato: null, percent: null,
        comissao: Number(r.valor)||0, pago: true, mesPagamento: null });
    });
  } else if(ENTITY_KEYS.indexOf(origem) !== -1){
    const key = origem;
    const mainField = ENTITIES[key].fields[0].key;
    state[key].rows.forEach(function(r){
      if((r.ano||2026) !== yearFilter) return;
      const premium = key === 'publicos' && r.tipo === 'Plano Premium';
      const contaComoSistema = premium || r.upgrade;
      if(contaComoSistema && deSistema) return;   // esse foi pro total de Sistema, não conta aqui
      const base = entityRemainingAfterPartner(r);
      getRowSellerAssignments(r).forEach(function(a){
        if(a.vendedor !== pessoa) return;
        const liberaSemPagar = deSistema && key !== 'consultoria';
        const ok = liberaSemPagar ? noPeriodoLancamento(r) : elegivelNoFechamento(r, mes);
        if(!ok) return;
        linhas.push({ origemLabel: ENTITIES[key].tabLabel, mes: r.mes, cliente: r[mainField] || '—',
          valorContrato: Number(r.valorContrato)||0, percent: a.percent, comissao: base*(a.percent/100),
          pago: !!r.pago, mesPagamento: r.mesPagamento });
      });
      if(key === 'cursos'){
        [['professor','honorarioProfessor','Cursos · honorário professor'],['professor2','honorarioProfessor2','Cursos · honorário professor 2']].forEach(function(par){
          if(r[par[0]] !== pessoa) return;
          const honor = Number(r[par[1]])||0;
          if(honor && noPeriodoLancamento(r)){
            linhas.push({ origemLabel: par[2], mes: r.mes, cliente: r[mainField] || '—',
              valorContrato: Number(r.valorContrato)||0, percent: null, comissao: honor,
              pago: true, mesPagamento: null });
          }
        });
      }
    });
  }

  return linhas.sort(function(a,b){ return MONTHS.indexOf(a.mes) - MONTHS.indexOf(b.mes); });
}

function abrirDetalheFechamento(pessoa, origem, origemLabel, mes){
  const linhas = detalheFechamento(pessoa, origem, mes);
  modalState = { type: 'detalhe-fechamento', pessoa: pessoa, origemLabel: origemLabel, mes: mes, linhas: linhas };
  render();
}
/* Célula clicável do Fechamento: só vira link quando tem algo por trás
   — clicar num R$ 0,00 não levaria a lugar nenhum — e só quando os
   valores estão revelados, senão o clique furaria o "Ocultar valores". */
function celulaFechamento(pessoa, origem, origemLabel, valorNum, mes, textoFormatado, classeExtra, revelado){
  const classes = 'num' + (classeExtra ? ' ' + classeExtra : '');
  if(!valorNum || !revelado) return `<td class="${classes}">${textoFormatado}</td>`;
  return `<td class="${classes} celula-clicavel" title="Ver o que está contando aqui" onclick="abrirDetalheFechamento('${escJs(pessoa)}','${origem}','${escJs(origemLabel)}','${escJs(mes)}')">${textoFormatado}</td>`;
}

/* Fecha o mês: grava só um carimbo de tempo (fechamentosMes), não mexe
   em nenhuma nota. É esse carimbo que passa a valer como fronteira do
   período — tudo pago até agora é definitivo neste mês; tudo pago
   depois vira candidato do próximo, sem precisar travar nota por nota. */
function travarFechamentoDoMes(mes){
  if(!mes || mes === 'Todos'){ showAlert('Escolha um mês específico antes de fechar.'); return; }
  if(getFechamentoDoMes(yearFilter, mes)){ showAlert('Os recebíveis de ' + mes + ' já estão fechados.'); return; }
  showConfirm(
    'Fechar os recebíveis de ' + mes + '? A partir de agora, tudo que for marcado como pago passa a contar pro PRÓXIMO fechamento — '
      + mes + ' fica definitivo, com tudo que já foi pago até este momento.',
    function(){
      persistFechamentoDoMes(yearFilter, mes);
      closeModal();
    },
    'Fechar'
  );
}

async function persistFechamentoDoMes(ano, mes){
  saving = true; updateSaveStatus();
  try{
    const fechadoEm = new Date().toISOString();
    await sbUpsert('fechamentos_mes', [{ano, mes, fechado_em: fechadoEm}], 'ano,mes');
    fechamentosMes.push({ano, mes, fechadoEm});
    saveError = false;
  }catch(e){ console.error('Falha ao fechar o mês', e); saveError = true; }
  finally{ saving = false; updateSaveStatus(); render(); }
}

/* Desfaz um fechamento — só quando foi engano. Reabrir NÃO desfaz as
   travas manuais (fechamentoMes) que alguém já tenha posto em notas
   específicas; é só o carimbo do mês em si. */
function reabrirFechamentoDoMes(mes){
  const f = getFechamentoDoMes(yearFilter, mes);
  if(!f) return;
  showConfirm(
    'Reabrir ' + mes + '? Ele volta a valer como o período aberto, junto com o que vier depois — não é pra desfazer sem motivo.',
    async function(){
      saving = true; updateSaveStatus();
      try{
        await sbDeleteAll('fechamentos_mes', 'ano=eq.'+yearFilter+'&mes=eq.'+encodeURIComponent(mes));
        fechamentosMes = fechamentosMes.filter(x => !(x.ano === yearFilter && x.mes === mes));
        saveError = false;
      }catch(e){ console.error('Falha ao reabrir o fechamento', e); saveError = true; }
      finally{ saving = false; updateSaveStatus(); closeModal(); render(); }
    },
    'Reabrir'
  );
}

/* Botão de ação do painel de Fechamento: fecha o mês (se ainda aberto)
   ou mostra quando fechou + opção de reabrir (se já fechado). Usado
   nos dois lugares que mostram a tabela de Fechamento (Bônus e Resumo
   Geral), pra não desalinhar os dois. */
function fechamentoActionButtonHtml(mes){
  if(!isAdmin || !mes || mes === "Todos") return '';
  const f = getFechamentoDoMes(yearFilter, mes);
  /* Rótulo bem diferente do outro botão "🔒 Fechar Agosto" que já existe
     (esse aqui é o mês fechado pra EDIÇÃO, toggleMonthClosed) — os dois
     aparecem juntos na mesma tela e não podem se confundir. */
  if(f){
    const dataFmt = new Date(f.fechadoEm).toLocaleDateString('pt-BR');
    return `<button class="eye-toggle" title="Reabrir volta os recebíveis de ${esc(mes)} a valer como período em aberto" onclick="reabrirFechamentoDoMes('${escJs(mes)}')">🔓 Recebíveis de ${esc(mes)} fechados em ${esc(dataFmt)} — reabrir</button>`;
  }
  return `<button class="eye-toggle" onclick="travarFechamentoDoMes('${escJs(mes)}')">🔒 Fechar recebíveis de ${esc(mes)}</button>`;
}

/* getSellerBreakdown lê o filtro de mês do Resumo Geral. Para usar o
   mesmo cálculo com o filtro de outra aba, aponta o filtro pro mês pedido
   e devolve no fim — mesmo jeito que o relatório em PDF faz. */
function sellerBreakdownDoMes(mes){
  const antigo = partnerMonthFilter;
  partnerMonthFilter = mes || 'Todos';
  const b = getSellerBreakdown();
  partnerMonthFilter = antigo;
  return b;
}

/* Quem NÃO entra no fechamento. Guarda-se a lista de fora, e não a de
   dentro, de propósito: assim uma pessoa nova aparece na folha sozinha, em
   vez de sumir calada — esquecer alguém num relatório de pagamento é bem
   pior do que ter uma linha a mais para tirar. */

let fechamentoEditando = false;
let fechamentoForaTimer = null;

function persistFechamentoFora(){
  saving = true; updateSaveStatus();
  if(fechamentoForaTimer) clearTimeout(fechamentoForaTimer);
  fechamentoForaTimer = setTimeout(function(){
    (async function(){
      try{
        if(!carregouDoBanco['fechamento-fora']) return;   // nunca apagar sem ter lido antes
        await sbDeleteAll('entity_vendors', 'entidade=eq.fechamento_fora');
        const linhas = fechamentoFora.map(function(v){ return { entidade:'fechamento_fora', vendor_name:v }; });
        if(linhas.length) await sbUpsert('entity_vendors', linhas, 'entidade,vendor_name');
        saveError = false;
      }catch(e){ console.error(e); saveError = true; }
      finally{ saving = false; updateSaveStatus(); }
    })();
  }, 450);
}

/* O que vai para a contabilidade no mês: por pessoa, a comissão já
   liberada de cada origem + bônus + salário fixo. É o número que a Soraya
   manda pagar — ver getSellerReceivable pra regra de quem libera o quê
   sem esperar o cliente pagar.

   "Pendente" é o resto: o que a pessoa já ganhou mas ainda não pode
   receber, porque depende do cliente pagar. Fica de fora do total a
   pagar, só como referência de quanto está por vir.

   A lista de pessoas não é só a das vendedoras do Sistema: quem só recebe
   salário (a equipe de consultoria, por exemplo) também precisa entrar,
   senão faltaria gente na folha. */
function fechamentoPagamentos(mes, todos){
  const bruto = sellerBreakdownDoMes(mes);
  const realizado = getSellerReceivable(mes);
  const noPeriodo = function(r){
    return (r.ano||2026) === yearFilter && (mes === 'Todos' || !mes || r.mes === mes);
  };
  const salarioPorPessoa = {};
  bonusRows.forEach(function(r){
    if(!isSalarioRow(r) || !r.vendedor || !noPeriodo(r)) return;
    const chave = Object.keys(salarioPorPessoa).find(function(k){ return name_matches_client(k, r.vendedor); }) || r.vendedor;
    salarioPorPessoa[chave] = (salarioPorPessoa[chave] || 0) + (Number(r.valor)||0);
  });

  const nomes = [];
  const juntar = function(n){
    const t = String(n===null||n===undefined?'':n).trim();
    if(!t) return;
    if(!isAdmin && !name_matches_client(t, currentPersonName)) return;
    if(nomes.some(function(x){ return name_matches_client(x, t); })) return;
    nomes.push(t);
  };
  sellersForCurrentUser().forEach(function(sv){ juntar(sv.label); });
  Object.keys(bruto).forEach(juntar);
  Object.keys(realizado).forEach(juntar);
  Object.keys(salarioPorPessoa).forEach(juntar);

  return nomes.map(function(nome){
    const b = realizado[nome] || {sistema:0, consultoria:0, publicos:0, cursos:0, bonus:0};
    const g = bruto[nome] || {sistema:0, consultoria:0, publicos:0, cursos:0, bonus:0};
    const chaveSal = Object.keys(salarioPorPessoa).find(function(k){ return name_matches_client(k, nome); });
    const salario = chaveSal ? salarioPorPessoa[chaveSal] : 0;
    const aPagar = b.sistema + b.consultoria + b.publicos + b.cursos + b.bonus + salario;
    const totalGanho = g.sistema + g.consultoria + g.publicos + g.cursos + g.bonus + salario;
    const pendente = Math.max(0, totalGanho - aPagar);
    return {
      pessoa: nome, cor: corDoVendedor(nome),
      sistema: b.sistema, publicos: b.publicos, cursos: b.cursos,
      bonus: b.bonus, salario: salario, aPagar: aPagar,
      consultoria: b.consultoria, pendente: pendente,
    };
  }).filter(function(l){
    if(todos) return true;
    if(!estaNoFechamento(l.pessoa)) return false;       // tirada da folha à mão
    return l.aPagar !== 0 || l.pendente !== 0;          // sem nada no período só polui
  }).sort(function(a,b){ return b.aPagar - a.aPagar; });
}

/* Quem pode aparecer na folha: todo mundo que o sistema conhece, mais
   quem tem valor no período mesmo sem estar em nenhuma lista. */
function fechamentoCandidatos(mes){
  const out = pessoasConhecidas();
  fechamentoPagamentos(mes, true).forEach(function(l){
    if(!out.some(function(x){ return name_matches_client(x, l.pessoa); })) out.push(l.pessoa);
  });
  return out.sort(function(a,b){ return a.localeCompare(b, 'pt-BR', {sensitivity:'base'}); });
}

function getSellerGrandTotals(){
  const breakdown = getSellerBreakdown();
  const totals = {};
  Object.keys(breakdown).forEach(name => {
    const b = breakdown[name];
    totals[name] = b.sistema + b.consultoria + b.publicos + b.cursos + b.bonus;
  });
  return totals;
}

function getPartnerBreakdown(){
  const by = {};
  partners.forEach(p => { by[p] = {sistema:0, consultoria:0, publicos:0, cursos:0}; });
  const ensure = (name) => { if(!by[name]) by[name] = {sistema:0, consultoria:0, publicos:0, cursos:0}; };

  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(!r.parceiro) return;
    if(!elegivelNoFechamento(r, partnerMonthFilter)) return;
    ensure(r.parceiro);
    by[r.parceiro].sistema += (Number(r.valor)||0) * (parsePercent(r.participacao)/100);
  });

  ENTITY_KEYS.forEach(key => {
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      if(!r.parceiro) return;
      if(!elegivelNoFechamento(r, partnerMonthFilter)) return;
      ensure(r.parceiro);
      by[r.parceiro][key] += (Number(r.valorContrato)||0) * (parsePercent(r.participacao)/100);
    });
  });

  return by;
}

function getMonthlyTotals(){
  const totals = {};
  MONTHS.forEach(m => totals[m] = 0);
  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    SELLERS.forEach(s => { totals[r.mes] += Number(r[s.key])||0; });
  });
  ENTITY_KEYS.forEach(key => {
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      const base = entityRemainingAfterPartner(r);
      getRowSellerAssignments(r).forEach(a => {
        totals[r.mes] += base * (a.percent/100);
      });
    });
  });
  bonusRows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(isSalarioRow(r)) return;              // salário é despesa, não faturamento
    totals[r.mes] += Number(r.valor)||0;
  });
  return totals;
}

function renderMonthlyChart(){
  const totals = getMonthlyTotals();
  const values = MONTHS.map(m => totals[m]);
  const max = Math.max(...values, 1);
  const w = 760, h = 180, padBottom = 24, padTop = 10, barGap = 6;
  const barW = (w / 12) - barGap;
  const bars = MONTHS.map((m,i) => {
    const val = values[i];
    const barH = Math.max((val/max) * (h-padTop-padBottom), val>0?2:0);
    const x = i * (w/12) + barGap/2;
    const y = h - padBottom - barH;
    const fill = m === partnerMonthFilter ? 'var(--primary)' : '#C7C2FB';
    const tooltipVal = partnersValuesRevealed ? fmtMoney(val) : 'valor oculto';
    return `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="${fill}">
      <title>${m}: ${tooltipVal}</title>
    </rect>
    <text x="${x+barW/2}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--ink-faint)">${monthNumber(m)}</text>`;
  }).join('');
  /* O título e a moldura vêm do painel que envolve o gráfico. */
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="overflow:visible;display:block;">${bars}</svg>`;
}

/* Faturamento total da empresa — todos os produtos somados (Sistema,
   Consultoria, Órgãos Públicos, Cursos), mês a mês. Diferente do
   gráfico de comissões acima: é o valor do contrato, não o que a
   equipe ganha. Mesmo padrão de "valor oculto" pra quem não revelou
   os números, e é o mesmo gráfico que sai no Relatório do mês. */

    const val = values[i];
    const barH = Math.max((val/max) * (h-padTop-padBottom), val>0?2:0);
    const x = i * (w/12) + barGap/2;
    const y = h - padBottom - barH;
    const fill = m === partnerMonthFilter ? 'var(--primary)' : '#8FD4C1';

/* ---------- Comissão do Sistema por percentual ----------
   A comissão de cada vendedora continua guardada em reais — é dela que
   sai todo o resto do sistema. A % é opcional: quando preenchida, o valor
   passa a ser calculado por ela e se refaz sozinho se o contrato ou a
   participação do parceiro mudarem. Digitar o valor à mão limpa a %.
   A base é a mesma das outras abas: o contrato menos a parte do parceiro. */
function vendaBaseComissao(r){
  const v = Number(r.valor)||0;
  if(!r.parceiro) return v;
  return v - (v * (parsePercent(r.participacao)/100));
}

function recalcComissoesPorPercent(r){
  const pcts = r.comissaoPercents || {};
  const base = vendaBaseComissao(r);
  let mudou = false;
  Object.keys(pcts).forEach(function(k){
    const p = pcts[k];
    if(p === null || p === undefined || p === '') return;
    r[k] = base * (Number(p)/100);
    mudou = true;
  });
  return mudou;
}

/* Escreve os valores recalculados direto nos campos, sem re-renderizar a
   tabela inteira — assim quem está digitando não perde o cursor. */
function pintarComissoesDaLinha(r){
  SELLERS.forEach(function(sv){
    const el = document.querySelector('input[data-id="' + r.id + '"][data-field="' + sv.key + '"]');
    if(!el) return;
    const v = r[sv.key];
    const novo = (v === null || v === undefined) ? '' : String(Math.round(Number(v)*100)/100);
    if(el.value !== novo && document.activeElement !== el) el.value = novo;
  });
}

function onComissaoPctInput(el){
  const id = Number(el.dataset.id), key = el.dataset.seller;
  const r = rows.find(function(x){ return x.id === id; });
  if(!r) return;
  if(isMonthClosedFor('vendas', r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    render();
    return;
  }
  if(!r.comissaoPercents) r.comissaoPercents = {};
  const pct = numOrNull(el.value);
  if(pct === null){
    delete r.comissaoPercents[key];          // voltou a ser valor digitado à mão
  } else {
    r.comissaoPercents[key] = pct;
    r[key] = vendaBaseComissao(r) * (pct/100);
    pintarComissoesDaLinha(r);
  }
  persist();
  updateSummaries();
}

function updateCell(id, field, value){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  if(isMonthClosedFor('vendas', r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    render();
    return;
  }
  // Valor de comissão digitado à mão deixa de seguir a %.
  if(!VENDA_NON_SELLER_FIELDS.has(field) && r.comissaoPercents) delete r.comissaoPercents[field];
  r[field] = value;
  // Mudou o contrato ou a fatia do parceiro: as comissões com % se refazem.
  if(field === "valor" || field === "participacao" || field === "parceiro") recalcComissoesPorPercent(r);
  if(isFinanceiro && !isAdmin){
    const campoDb = VENDAS_CAMPOS_FINANCEIRO[field];
    if(campoDb) editarCampoFinanceiroRPC('vendas', id, campoDb, value);
  } else {
    persist();
  }
  if(field === "mes" || field === "parceiro") render();
  else {
    updateSummaries();
    if(field === "valor" || field === "participacao"){
      pintarComissoesDaLinha(r);
      updateRowPartnerCalc(id);
    }
  }
}

function marcarNaturezaVenda(id, campo){
  const r = rows.find(function(x){ return x.id === id; });
  if(!r) return;
  if(isMonthClosedFor('vendas', r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    return;
  }
  const ligar = !r[campo];
  r.renovacao = false;
  r.novoContrato = false;
  r.upgrade = false;
  r[campo] = ligar;
  persist();
  render();
  if(campo === 'renovacao' || !ligar) setTimeout(tryLoadPainelTotaisAsync, 900);
}

   produto é premium) mas foi digitada — ou ficou parada — em Sistema. Move

   renovação que a gerou. */
function moverVendaParaPublicos(id){
  const r = rows.find(function(v){ return v.id === id; });
  if(!r) return;
  if(isMonthClosedFor('vendas', r.ano||2026, r.mes)){
    showAlert("Este mês está fechado. Reabra em Resumo Geral para poder mover.");
    return;
  }
  showConfirm(
    'Mover "' + (r.cliente || 'esta venda') + '" para a aba Consultorias e site para Órgãos Públicos? '
      + 'Ela sai do Sistema (deixa de contar no ranking de vendas) e a comissão de cada vendedora vai junto, quando estiver em percentual.',
    function(){ executarMoverVendaParaPublicos(id); },
    'Mover'
  );
}

function executarMoverVendaParaPublicos(id){
  const r = rows.find(function(v){ return v.id === id; });
  if(!r) return;

  /* Órgãos Públicos só entende comissão em percentual. Junta quem tem
     percentual definido, das maiores pras menores — as 3 primeiras vão nos
     campos principais, o resto em extraVendedores. */
  const comissoes = [];
  let semPercentual = false;
  SELLERS.forEach(function(s){
    const pct = (r.comissaoPercents || {})[s.key];
    const temPct = pct !== null && pct !== undefined && pct !== '';
    if(temPct) comissoes.push({vendedor: s.label, percent: numOrNull(pct)});
    else if(numOrNull(r[s.key]) !== null) semPercentual = true;
  });
  comissoes.sort(function(a,b){ return (b.percent||0) - (a.percent||0); });

  if(state.publicos.nextId < 100001) state.publicos.nextId = 100001;
  const novoId = state.publicos.nextId++;
  state.publicos.rows.unshift({
    id: novoId, ano: r.ano, mes: r.mes,
    orgao: r.cliente, valorContrato: numOrNull(r.valor),
    tipo: '', parceiro: r.parceiro || '', participacao: numOrNull(r.participacao),
    formaPagamento: r.formaPagamento || '', colaborador: r.colaborador || '',
    observacoes: [r.venda || '', r.observacoes || '', r.vendedorResponsavel ? 'vendeu: ' + r.vendedorResponsavel : '']
                   .filter(function(x){ return x; }).join(' · '),
    comissaoPercent: comissoes[0] ? comissoes[0].percent : null, vendedor: comissoes[0] ? comissoes[0].vendedor : '',
    comissaoPercent2: comissoes[1] ? comissoes[1].percent : null, vendedor2: comissoes[1] ? comissoes[1].vendedor : '',
    comissaoPercent3: comissoes[2] ? comissoes[2].percent : null, vendedor3: comissoes[2] ? comissoes[2].vendedor : '',
    extraVendedores: comissoes.slice(3).map(function(c, i){ return {id: Date.now()+i, vendedor: c.vendedor, percent: c.percent}; }),
    pago: !!r.pago, mesPagamento: r.mesPagamento || null,
    notaEmitida: !!r.notaEmitida, notaEmitidaEm: r.notaEmitidaEm || null,
    podeEmitir: !!r.podeEmitir, podeEmitirEm: r.podeEmitirEm || null,
  });

  marcarParaApagar('vendas', id);
  rows = rows.filter(function(v){ return v.id !== id; });

  renovacoes.forEach(function(rv){
    if(rv.vendaId === id && destinoDaRenovacao(rv) === 'vendas'){
      rv.vendaId = novoId;
      rv.vendaEntidade = 'publicos';
    }
  });

  persist();
  persistEntityRows('publicos');
  persistRenovacoes();
  closeModal();
  showAlert('Movida para Consultorias e site para Órgãos Públicos.'
    + (semPercentual ? ' Uma comissão estava em valor fixo (R$), não percentual — confira e preencha o % por lá.' : ''));
  setTimeout(tryLoadPainelTotaisAsync, 900);
}

function repeatRowForYear(id){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  const startIdx = MONTHS.indexOf(r.mes);
  if(startIdx === -1 || startIdx === MONTHS.length - 1){
    showAlert("Esse lançamento já está em Dezembro — não há meses seguintes pra repetir.");
    return;
  }
  const remainingMonths = MONTHS.slice(startIdx + 1);
  const label = r.cliente || r.venda || "esse lançamento";
  showConfirm(
    `Repetir "${label}" para todos os meses restantes de ${r.ano} (${remainingMonths.join(', ')})? Meses que já tiverem um lançamento igual (mesmo cliente e produto) serão pulados.`,
    () => {
      remainingMonths.forEach(targetMonth => {
        const exists = rows.some(x => x.ano===r.ano && x.mes===targetMonth && (x.cliente||"")===(r.cliente||"") && (x.venda||"")===(r.venda||""));
        if(exists) return;
        const copy = {...r, id: nextId++, mes: targetMonth, comissaoPercents: Object.assign({}, r.comissaoPercents)};
        rows.push(copy);
      });
      persist();
    },
    "Repetir"
  );
}

/* "Zerar tudo" apaga os lançamentos de todo mundo, de todos os anos, sem
   volta — o botão mais destrutivo do sistema. Um clique + um "confirmar"
   é fácil demais de acertar sem querer (o dedo escorrega, alguém aperta
   Enter no lugar errado). Por isso, além do aviso, ela precisa DIGITAR
   "ZERAR TUDO": o botão de confirmar só liga quando o texto bate. */
function wipeAllData(){
  modalState = { type:'zerar-tudo', texto:'' };
  render();
}
function onZerarTudoInput(el){
  if(!modalState) return;
  modalState.texto = el.value;
  render();
  const ne = document.getElementById('zerar-tudo-input');
  if(ne){ ne.focus(); }
}
function confirmarZerarTudo(){
  if(!modalState || String(modalState.texto||'').trim().toUpperCase() !== 'ZERAR TUDO') return;
  closeModal();
  // Aqui apagar É a intenção: marca tudo antes de limpar, senão a tela
  // esvazia e o banco continua cheio.
  marcarListaParaApagar('vendas', rows);
  rows = [];
  nextId = 1;
  persist();

  ENTITY_KEYS.forEach(key => {
    marcarListaParaApagar('lancamentos', state[key].rows);
    state[key].rows = [];
    state[key].nextId = 1;
    persistEntityRows(key);
  });

  marcarListaParaApagar('bonus', bonusRows);
  bonusRows = [];
  bonusNextId = 1;
  persistBonus();

  closedMonths = [];
  persistClosedMonths();
}

   não manda os valores deles, mas a lista de nomes vinha do catálogo). */
function sellersForCurrentUser(){
  if(isAdmin) return SELLERS;
  return SELLERS.filter(s => name_matches_client(s.label, currentPersonName));
}

  const all = state[key].vendors || [];

}
function name_matches_client(a, b){
  return !!a && !!b && String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
}
function getVisible(){
  let list = rows.filter(r => (r.ano||2026) === yearFilter);
  list = filter === "Todos" ? list : list.filter(r => r.mes === filter);
  if(naturezaFilter === 'novo')       list = list.filter(r => r.novoContrato);
  else if(naturezaFilter === 'renov') list = list.filter(r => r.renovacao);
  else if(naturezaFilter === 'upg')   list = list.filter(r => r.upgrade);
  else if(naturezaFilter === 'sem')   list = list.filter(r => !r.novoContrato && !r.renovacao && !r.upgrade);
  if(sellerFilter !== "Todas"){
    list = list.filter(r => r[sellerFilter] !== null && r[sellerFilter] !== undefined && r[sellerFilter] !== "");
  }
  if(searchCliente.trim()){
    const q = searchCliente.trim().toLowerCase();
    list = list.filter(r => (r.cliente||"").toLowerCase().includes(q));
  }
  if(searchParceiro.trim()){
    const q = searchParceiro.trim().toLowerCase();
    list = list.filter(r => (r.parceiro||"").toLowerCase().includes(q));
  }
  if(searchColaborador.trim()){
    const q = searchColaborador.trim().toLowerCase();
    list = list.filter(r => (r.colaborador||"").toLowerCase().includes(q));
  }
  return ordenarEntityRows(list, vendasOrdem, 'cliente', 'valor');
}
function onVendasSearchInput(el, field){
  const pos = el.selectionStart;
  const id = el.id;
  if(field==='cliente') searchCliente = el.value;
  else if(field==='parceiro') searchParceiro = el.value;
  else if(field==='colaborador') searchColaborador = el.value;
  render();
  const ne = document.getElementById(id);
  if(ne){ ne.focus(); try{ ne.setSelectionRange(pos,pos); }catch(e){} }
}
function computeTotals(visible){
  const t = {valor:0};
  SELLERS.forEach(s => { t[s.key] = 0; });
  visible.forEach(r => {
    t.valor += Number(r.valor)||0;
    SELLERS.forEach(s => t[s.key] += Number(r[s.key])||0);
  });
  return t;
}
function numInputHtml(row, field){
  const v = (row[field] === null || row[field] === undefined) ? "" : row[field];
  return `<input class="num" type="number" step="0.01" placeholder="—" value="${esc(v)}"
            data-id="${row.id}" data-field="${field}" oninput="onNumInput(this)" />`;
}
function onNumInput(el){
  const id = Number(el.dataset.id);
  const field = el.dataset.field;
  const v = el.value;
  updateCell(id, field, v === "" ? null : parseFloat(v));
}
/* Mesma lista de campos do "Normalizar textos" — daqui pra frente, quem
   digita já vê em caixa alta na hora, sem precisar rodar o botão depois. */
const VENDAS_CAMPOS_CAIXA_ALTA = new Set(['cliente','formaPagamento']);
function aplicarCaixaAltaNoCampo(el, permitido){
  if(!permitido) return el.value;
  const maiusculo = el.value.toUpperCase();
  if(el.value !== maiusculo){
    const pos = el.selectionStart, posFim = el.selectionEnd;
    el.value = maiusculo;
    if(pos !== null && pos !== undefined) el.setSelectionRange(pos, posFim);
  }
  return el.value;
}
function onTextInput(el){
  const id = Number(el.dataset.id);
  const field = el.dataset.field;
  const value = aplicarCaixaAltaNoCampo(el, VENDAS_CAMPOS_CAIXA_ALTA.has(field));
  updateCell(id, field, value);
}
function onMonthSelect(el){
  const id = Number(el.dataset.id);
  updateCell(id, "mes", el.value);
}
function onVendedor2Select(el){
  const id = Number(el.dataset.id);
  updateCell(id, "vendedor2", el.value);
}
function onVendedor3Select(el){
  const id = Number(el.dataset.id);
  updateCell(id, "vendedor3", el.value);
}
function toggleSellerValues(){
  sellerValuesRevealed = !sellerValuesRevealed;
  render();
}

function updateSummaries(){
  const visible = getVisible();
  const totals = computeTotals(visible);
  const totalContract = document.getElementById('kpi-total');
  if(totalContract) totalContract.textContent = fmtMoney(totals.valor);
  SELLERS.forEach(s => {
    const el = document.getElementById('kpi-' + s.key);
    if(el) el.textContent = sellerValuesRevealed ? fmtMoney(totals[s.key]) : '••••••';
  });
  const countEl = document.getElementById('count-label');
  if(countEl){
    countEl.innerHTML = `<b>${visible.length}</b> venda${visible.length===1?"":"s"} ${filter!=="Todos" ? "em <b>"+esc(filter)+"</b>" : ""}`;
  }
}

/* Resumo do financeiro: faturamento das notas, e só isso. Em vez de tentar
   podar o Resumo Geral (que é feito de comissão do começo ao fim), a conta
   financeira recebe um quadro próprio — o que ela precisa, sem nada que
   ela não pode ver. */
function faturamentoDoMesPorOrigem(mes){
  const noMes = function(r){ return (r.ano||2026) === yearFilter && (!mes || mes === 'Todos' || r.mes === mes); };
  return {
    sistema:     rows.filter(noMes).reduce(function(a,r){ return a + (Number(r.valor)||0); }, 0),
    consultoria: state.consultoria.rows.filter(noMes).reduce(function(a,r){ return a + (Number(r.valorContrato)||0); }, 0),
    publicos:    state.publicos.rows.filter(noMes).reduce(function(a,r){ return a + (Number(r.valorContrato)||0); }, 0),
    cursos:      state.cursos.rows.filter(noMes).reduce(function(a,r){ return a + (Number(r.valorContrato)||0); }, 0),
  };
}

function notasDoAno(){
  const out = [];
  const noAno = function(r){ return (r.ano||2026) === yearFilter; };
  rows.filter(noAno).forEach(function(r){
    out.push({mes:r.mes, origem:'Sistema', nome:r.cliente || r.venda || '—', valor:Number(r.valor)||0,
              pago:r.pago, mesPagamento:r.mesPagamento, forma:r.formaPagamento||'',
              tabela:'vendas', entKey:'', id:r.id, emitida:!!r.notaEmitida, emitidaEm:r.notaEmitidaEm||null,
              podeEmitir:!!r.podeEmitir, podeEmitirEm:r.podeEmitirEm||null, dataMinimaEmissao:r.dataMinimaEmissao||null,
              notaArquivoPath:r.notaArquivoPath||null, notaArquivoNome:r.notaArquivoNome||null});
  });
  ENTITY_KEYS.forEach(function(key){
    const campo = ENTITIES[key].fields[0].key;
    state[key].rows.filter(noAno).forEach(function(r){
      // Curso com empresas cadastradas: uma nota por empresa, não uma pro
      // curso inteiro — é cada empresa que recebe sua própria nota fiscal.
      if(ENTITIES[key].hasEmpresas && Array.isArray(r.empresas) && r.empresas.length){
        r.empresas.forEach(function(e){
          out.push({mes:r.mes, origem:ENTITIES[key].tabLabel,
                    nome:(r[campo]||'—') + ' — ' + (e.nome||'empresa sem nome') + (e.cnpj ? ' (CNPJ ' + formatCnpj(e.cnpj) + ')' : ''),
                    valor:Number(e.valor)||0, pago:r.pago, mesPagamento:r.mesPagamento, forma:r.formaPagamento||'',
                    tabela:'lancamento_empresas', entKey:'', id:e.id, emitida:!!e.notaEmitida, emitidaEm:e.notaEmitidaEm||null,
                    podeEmitir:!!e.podeEmitir, podeEmitirEm:e.podeEmitirEm||null, dataMinimaEmissao:e.dataMinimaEmissao||null,
                    notaArquivoPath:e.notaArquivoPath||null, notaArquivoNome:e.notaArquivoNome||null});
        });
        return;
      }
      out.push({mes:r.mes, origem:ENTITIES[key].tabLabel, nome:r[campo] || '—', valor:Number(r.valorContrato)||0,
                pago:r.pago, mesPagamento:r.mesPagamento, forma:r.formaPagamento||'',
                tabela:'lancamentos', entKey:key, id:r.id, emitida:!!r.notaEmitida, emitidaEm:r.notaEmitidaEm||null,
                podeEmitir:!!r.podeEmitir, podeEmitirEm:r.podeEmitirEm||null,
                notaArquivoPath:r.notaArquivoPath||null, notaArquivoNome:r.notaArquivoNome||null});
    });
  });
  return out.sort(function(a,b){
    const d = MONTHS.indexOf(a.mes) - MONTHS.indexOf(b.mes);
    return d !== 0 ? d : String(a.nome).localeCompare(String(b.nome), 'pt-BR');
  });
}

/* Notas já conferidas ("Pode emitir") mas ainda não emitidas — é a fila
   de quem vai gerar a nota de fato. Usado pelo aviso que avisa a Marli
   assim que abre o sistema, sem precisar ela ir catar isso dentro de
   Pagamentos Realizados. */
function notasProntasParaEmitir(){
  return notasDoAno().filter(function(n){ return n.podeEmitir && !n.emitida; });
}
function irParaNotasProntas(){
  activeTab = 'parceiros';
  notaFiltro = 'PodeEmitir';
  render();
}

/* ---------- Lembrete de dia fixo pra emitir nota (Mensal/Plano Premium) ----------
   Contrato recorrente: o financeiro combina o dia UMA vez ("todo dia 10")
   e isso vale pra sempre, mês a mês — sem precisar redigitar a cada novo
   lançamento. Por isso o prazo fica preso ao NOME do cliente, não a um
   lançamento específico (cada mês vira um lançamento novo). O alerta em
   si (quem está atrasado) só aparece pro financeiro, na tela mesmo. */
function prazoEmissaoPara(entKey, nomeCliente){
  return prazosEmissaoNota.find(function(p){
    return p.entidade === entKey && name_matches_client(p.nomeCliente, nomeCliente);
  }) || null;
}

function definirPrazoEmissaoNota(entKey, nomeCliente){
  if(!isAdmin && !isFinanceiro) return;
  const atual = prazoEmissaoPara(entKey, nomeCliente);
  showPrompt(
    'Lembrar de emitir a nota de "' + nomeCliente + '" todo dia (1 a 28) do mês.'
    + (atual ? (atual.avista ? ' Hoje está marcado como "à vista, sem lembrete"' : ' Hoje está combinado o dia ' + atual.dia) + ' — digite outro número pra mudar,' : ' Digite o dia,')
    + ' digite "avista" se o contrato foi pago à vista (não tem mais nota recorrente pra emitir),'
    + ' ou deixe em branco pra remover o lembrete.',
    function(v){
      const texto = String(v||'').trim();
      if(!texto){ removerPrazoEmissaoNota(entKey, nomeCliente); return; }
      if(semAcento(texto).replace(/\s+/g,'') === 'avista'){
        persistPrazoEmissaoNota(entKey, nomeCliente, null, atual ? atual.id : null, true);
        return;
      }
      const dia = parseInt(texto, 10);
      if(!dia || dia < 1 || dia > 28){ showAlert('Informe um dia entre 1 e 28, digite "avista" pra marcar pago à vista, ou deixe em branco pra remover o lembrete.'); return; }
      persistPrazoEmissaoNota(entKey, nomeCliente, dia, atual ? atual.id : null, false);
    }
  );
}

function persistPrazoEmissaoNota(entKey, nomeCliente, dia, idExistente, avista){
  const id = idExistente || Date.now();
  const existente = prazosEmissaoNota.find(function(p){ return p.id === id; });
  if(existente){ existente.dia = dia; existente.avista = !!avista; }
  else prazosEmissaoNota.push({id: id, entidade: entKey, nomeCliente: nomeCliente, dia: dia, avista: !!avista});
  render();
  saving = true; updateSaveStatus();
  sbUpsert('prazos_emissao_nota', [{id: id, entidade: entKey, nome_cliente: nomeCliente, dia: dia, avista: !!avista}], 'id')
    .then(function(){ saveError = false; })
    .catch(function(e){
      console.error('Falha ao gravar o dia de emissão', e);
      saveError = true;
      showAlert('Não consegui gravar o dia de emissão. Confira a internet e tente de novo.');
    })
    .finally(function(){ saving = false; updateSaveStatus(); });
}

function removerPrazoEmissaoNota(entKey, nomeCliente){
  if(!isAdmin && !isFinanceiro) return;
  const atual = prazoEmissaoPara(entKey, nomeCliente);
  if(!atual) return;
  prazosEmissaoNota = prazosEmissaoNota.filter(function(p){ return p.id !== atual.id; });
  render();
  sbDeleteAll('prazos_emissao_nota', 'id=eq.'+atual.id).catch(function(e){ console.error('Falha ao apagar o dia de emissão', e); });
}

/* Quem está com o dia combinado já passado, este mês, e ainda não
   emitiu — só entram lançamentos Mensal/Plano Premium do mês corrente
   (o mesmo lançamento não "carrega" atraso de mês anterior: cada mês é
   um lançamento novo, e o que passou, passou). */
function alertasEmissaoPendentes(){
  const hoje = new Date();
  const anoAtual = hoje.getFullYear();
  const mesAtual = MONTHS[hoje.getMonth()];
  const diaAtual = hoje.getDate();
  const out = [];
  ENTITY_KEYS.forEach(function(key){
    if(!ENTITIES[key].hasPrazoEmissao) return;
    const mainField = ENTITIES[key].fields[0].key;
    state[key].rows.forEach(function(r){
      if((r.ano||2026) !== anoAtual || r.mes !== mesAtual) return;
      if(r.tipo !== 'Mensal' && r.tipo !== 'Plano Premium') return;
      if(r.notaEmitida) return;
      const prazo = prazoEmissaoPara(key, r[mainField]);
      if(!prazo || prazo.avista || diaAtual < prazo.dia) return;
      out.push({ origem: ENTITIES[key].tabLabel, nome: r[mainField] || '—', dia: prazo.dia, atraso: diaAtual - prazo.dia });
    });
  });
  return out;
}

/* ---------- Relatório de notas emitidas ----------
   Diferente de notasDoAno() (que olha o mês/ano do LANÇAMENTO e é
   sempre travado no yearFilter da tela), aqui o que importa é quando a
   nota foi de fato emitida — pra fechar o ano, a Marli quer "as notas
   que emiti em dezembro", não "os lançamentos de dezembro". Uma nota de
   Novembro emitida em Dezembro entra no relatório de Dezembro. */
function todasAsNotasEmitidas(){
  const out = [];
  rows.forEach(function(r){
    if(!r.notaEmitida || !r.notaEmitidaEm) return;
    out.push({ origem:'Sistema', nome:r.cliente || r.venda || '—', valor:Number(r.valor)||0,
               emitidaEm:r.notaEmitidaEm, mesLancamento:r.mes, anoLancamento:r.ano||2026 });
  });
  ENTITY_KEYS.forEach(function(key){
    const campo = ENTITIES[key].fields[0].key;
    state[key].rows.forEach(function(r){
      if(ENTITIES[key].hasEmpresas && Array.isArray(r.empresas) && r.empresas.length){
        r.empresas.forEach(function(e){
          if(!e.notaEmitida || !e.notaEmitidaEm) return;
          out.push({ origem:ENTITIES[key].tabLabel,
                     nome:(r[campo]||'—') + ' — ' + (e.nome||'empresa sem nome'),
                     valor:Number(e.valor)||0, emitidaEm:e.notaEmitidaEm, mesLancamento:r.mes, anoLancamento:r.ano||2026 });
        });
        return;
      }
      if(!r.notaEmitida || !r.notaEmitidaEm) return;
      out.push({ origem:ENTITIES[key].tabLabel, nome:r[campo] || '—', valor:Number(r.valorContrato)||0,
                 emitidaEm:r.notaEmitidaEm, mesLancamento:r.mes, anoLancamento:r.ano||2026 });
    });
  });
  return out;
}

function relatorioNotasEmitidasFiltrado(ano, mes, busca){
  const buscaNorm = semAcento(busca||'').trim();
  return todasAsNotasEmitidas().filter(function(n){
    const d = new Date(n.emitidaEm);
    if(d.getFullYear() !== ano) return false;
    if(mes && mes !== 'Todos' && MONTHS[d.getMonth()] !== mes) return false;
    if(buscaNorm && semAcento(n.nome).indexOf(buscaNorm) === -1) return false;
    return true;
  }).sort(function(a,b){
    return String(a.nome).localeCompare(String(b.nome), 'pt-BR') || new Date(a.emitidaEm) - new Date(b.emitidaEm);
  });
}

function abrirRelatorioNotasEmitidas(){
  if(!isAdmin && !isFinanceiro) return;
  const anos = todasAsNotasEmitidas().map(function(n){ return new Date(n.emitidaEm).getFullYear(); });
  const anoPadrao = anos.length ? Math.max.apply(null, anos) : new Date().getFullYear();
  modalState = { type:'relatorio-notas-emitidas', ano: anoPadrao, mes: 'Todos', busca: '' };
  render();
}
function onRelatorioNotasAnoChange(el){ if(modalState) modalState.ano = parseInt(el.value,10); render(); }
function onRelatorioNotasMesChange(el){ if(modalState) modalState.mes = el.value; render(); }
function onRelatorioNotasBuscaInput(el){ if(modalState) modalState.busca = el.value; render(); }

  });

  return `
    <div class="rel-doc">
      <header class="rel-faixa">
        <div class="rel-faixa-globo">${logoGloboSvg(150, '#ffffff')}</div>
        <div class="rel-marca">
          ${marcaOpenHtml({tam:32, clara:true, cor:'#8FCBF5'})}
          <div class="rel-divisor"></div>
