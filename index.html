          `).join('')}
        </tbody>
      </table>
    </div>
  `, { flush: true });

  // O ranking é o que essa aba tem de mais importante: quem foi melhor em
  // cada quesito. Vem primeiro e com destaque, antes de qualquer número.
  return seletorPeriodo + sectionsToolbarHtml() + ranking + cartoes + barras + linha + tabela;
}

/* ================= Usuários e acessos =================
   O cadastro de contas roda numa função no servidor (admin-usuarios), não
   aqui. É de propósito: criar conta e trocar senha exigem a chave de
   serviço do Supabase, e essa chave nunca pode ficar no navegador — com
   ela qualquer pessoa leria e escreveria o banco inteiro, passando por
   cima de todas as regras de acesso. O que vai daqui é só o token de quem
   está logado; o servidor confere se é admin antes de fazer qualquer
   coisa. */

let usuariosLista = null;
let usuariosCarregando = false;
let usuariosErro = '';
let usuarioForm = { email:'', senha:'', nivel:'restrita', pessoa:'' };
let usuarioCriado = null;   // {email, senha} — pra mostrar a senha uma vez

/* Os quatro níveis de acesso, num lugar só — o cadastro e a janela de
   "mudar acesso" desenham o mesmo seletor, então a explicação de cada
   nível nunca fica diferente entre as duas telas.
     admin       → vê e edita tudo, e gerencia contas;
     financeiro  → vê o valor das notas de todas as origens, e nenhuma
                   comissão de ninguém (nem a própria);
     solicitante → não vê NADA do sistema — só uma tela própria pra
                   pedir nota (cliente/CNPJ/valor), sem lançamento,
                   sem comissão, sem valor de ninguém;
     restrita    → é uma vendedora: vê só os lançamentos dela. */
const NIVEIS_ACESSO = [
  { id:'admin',       titulo:'Administrador', texto:'vê e edita tudo, e pode gerenciar usuários' },
  { id:'financeiro',  titulo:'Financeiro',     texto:'vê o valor de contrato de todas as notas (sistema, renovações, consultoria, órgãos públicos e cursos) e <b>nenhuma comissão</b> — nem percentual, nem bônus, nem meta, de ninguém' },
  { id:'solicitante', titulo:'Solicitante',    texto:'não vê <b>nada</b> do sistema — só uma tela própria pra pedir nota (cliente, CNPJ, valor); o admin vincula o pedido ao lançamento certo' },
  { id:'restrita',    titulo:'Restrita',       texto:'é uma vendedora: vê apenas os lançamentos em que o nome dela aparece' },
];
function seletorNivelHtml(nivelAtual, onchangeJs, grupo){
  return '<div class="usuario-niveis">' + NIVEIS_ACESSO.map(function(n){
    return `<label class="usuario-tipo ${nivelAtual === n.id ? 'sel' : ''}">
      <input type="radio" name="nivel-${grupo}" value="${n.id}"
             ${nivelAtual === n.id ? 'checked' : ''} onchange="${onchangeJs}" />
      <span><b>${n.titulo}</b> — ${n.texto}</span>
    </label>`;
  }).join('') + '</div>';
}

async function chamarAdminUsuarios(payload){
  const token = await ensureFreshToken();
  if(!token) throw new Error('Sessão expirada. Entre de novo.');
  const res = await fetch(SUPABASE_URL + '/functions/v1/admin-usuarios', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'apikey': SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(payload),
  });
  let json = {};
  try{ json = await res.json(); }catch(e){}
  if(!res.ok) throw new Error(json.erro || ('Não consegui falar com o servidor (erro ' + res.status + ').'));
  return json;
}

async function carregarUsuarios(){
  if(!isAdmin) return;
  usuariosCarregando = true; usuariosErro = ''; render();
  try{
    const r = await chamarAdminUsuarios({ acao:'listar' });
    usuariosLista = r.usuarios || [];
  }catch(e){
    usuariosErro = e.message || String(e);
  }finally{
    usuariosCarregando = false; render();
  }
}

/* Senha provisória forte, fácil de ditar por telefone: sem caracteres que
   se confundem (0/O, 1/l/I). */
function gerarSenhaProvisoria(){
  const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const minus  = 'abcdefghijkmnopqrstuvwxyz';
  const nums   = '23456789';
  const simb   = '!@#$%&*';
  const todos  = letras + minus + nums + simb;
  const sorteia = (s) => s[Math.floor(Math.random() * s.length)];
  let senha = sorteia(letras) + sorteia(minus) + sorteia(nums) + sorteia(simb);
  for(let i = 0; i < 8; i++) senha += sorteia(todos);
  return senha.split('').sort(() => Math.random() - 0.5).join('');
}
function onGerarSenha(){
  usuarioForm.senha = gerarSenhaProvisoria();
  render();
}
function onUsuarioFormInput(el, campo){
  usuarioForm[campo] = (el.type === 'checkbox') ? el.checked : el.value;
}

}

async function criarUsuario(){
  const f = usuarioForm;
  if(!f.email.trim()){ showAlert('Informe o e-mail.'); return; }
  if((f.senha||'').length < 8){ showAlert('A senha provisória precisa de pelo menos 8 caracteres. Use o botão "Gerar senha".'); return; }
  if(f.nivel === 'restrita' && !f.pessoa.trim()){
    showAlert('Para conta restrita, informe o nome exatamente como ele aparece nos lançamentos (ex: Rios).');
    return;
  }
  usuariosCarregando = true; usuariosErro = ''; render();
  try{
    await chamarAdminUsuarios({
      acao:'criar', email:f.email.trim(), senha:f.senha,
      admin: f.nivel === 'admin', financeiro: f.nivel === 'financeiro', solicitante: f.nivel === 'solicitante',
      pessoa: f.pessoa.trim(),
    });
    usuarioCriado = { email: f.email.trim(), senha: f.senha };
    usuarioForm = { email:'', senha:'', nivel:'restrita', pessoa:'' };
    await carregarUsuarios();
  }catch(e){
    usuariosErro = e.message || String(e);
    usuariosCarregando = false; render();
  }
}

function redefinirSenhaUsuario(id, email){
  const nova = gerarSenhaProvisoria();
  showConfirm(
    `Definir uma senha provisória nova para ${email}?\n\nA senha atual deixa de funcionar na hora.`,
    async function(){
      usuariosCarregando = true; usuariosErro = ''; render();
      try{
        await chamarAdminUsuarios({ acao:'senha', id: id, senha: nova });
        usuarioCriado = { email: email, senha: nova, trocada: true };
        await carregarUsuarios();
      }catch(e){
        usuariosErro = e.message || String(e);
        usuariosCarregando = false; render();
      }
    },
    'Definir senha nova'
  );
}

function abrirAcessoUsuario(id){
  const u = (usuariosLista||[]).find(x => x.id === id);
  if(!u) return;
  modalState = { type:'acesso-usuario', id: id, email: u.email,
                 nivel: u.admin ? 'admin' : (u.financeiro ? 'financeiro' : (u.solicitante ? 'solicitante' : 'restrita')),
                 pessoa: u.pessoa || '' };
  render();
}
function onAcessoFormChange(el, campo){
  if(!modalState) return;
  modalState[campo] = (el.type === 'checkbox') ? el.checked : el.value;
  if(campo === 'nivel') render();
}
async function salvarAcessoUsuario(){
  if(!modalState) return;
  const m = modalState;
  if(m.nivel === 'restrita' && !String(m.pessoa||'').trim()){
    modalState.error = 'Para conta restrita, informe o nome como aparece nos lançamentos.';
    render(); return;
  }
  const dados = { acao:'acesso', id:m.id,
                  admin: m.nivel === 'admin', financeiro: m.nivel === 'financeiro', solicitante: m.nivel === 'solicitante',
                  pessoa: String(m.pessoa||'').trim() };
  closeModal();
  usuariosCarregando = true; usuariosErro = ''; render();
  try{
    await chamarAdminUsuarios(dados);
    await carregarUsuarios();
  }catch(e){
    usuariosErro = e.message || String(e);
    usuariosCarregando = false; render();
  }
}

/* ---------------- App shell ---------------- */

/* Animação de entrada só na troca de aba. Filtro e busca chamam render() a
   cada tecla — se a animação valesse pra todo render, a tela piscaria. */
let animarEntrada = false;

function setTab(t){
  activeTab = t;
  animarEntrada = true;
  // Ao abrir o painel, relê os totais: eles podem ter mudado em outra aba
  // (ou por outra pessoa) desde que a página abriu.
  if(t === 'painel') tryLoadPainelTotaisAsync();
  render();
}

/* ---------- Foco por cima do render() ----------
   render() troca o innerHTML inteiro: o campo em que a pessoa está
   digitando é destruído e recriado, e o cursor vai embora. Quando o render
   nasce de algo assíncrono — o refresh dos totais do painel depois de
   salvar, a resposta de uma leitura do banco — isso cai no meio da
   digitação e o campo simplesmente "morre".

   Aqui o campo é anotado antes (pelos mesmos atributos com que é montado) e
   reencontrado depois, com a posição do cursor de volta. Se um modal
   estiver aberto, não devolvemos nada: o foco é dele. */
function focoParaRestaurar(){
  const el = document.activeElement;
  if(!el) return null;
  const tag = el.tagName;
  if(tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') return null;

  let seletor = null;
  if(el.id){
    seletor = '#' + (window.CSS && CSS.escape ? CSS.escape(el.id) : el.id);
  } else {
    const chaves = ['data-entity','data-id','data-field','data-vendor','data-key'];
    const presentes = chaves.filter(function(a){ return el.hasAttribute(a); });
    if(presentes.length){
      seletor = tag.toLowerCase() + presentes.map(function(a){
        const v = String(el.getAttribute(a)).replace(/["\\]/g, '\\$&');
        return '[' + a + '="' + v + '"]';
      }).join('');
    }
  }
  if(!seletor) return null;

  const guardado = { seletor: seletor, inicio: null, fim: null };
  // input[type=number] não deixa ler seleção em alguns navegadores
  try{ guardado.inicio = el.selectionStart; guardado.fim = el.selectionEnd; }catch(e){}
  return guardado;
}

function devolverFoco(guardado){
  if(!guardado || modalState) return;
  let el = null;
  try{ el = document.querySelector(guardado.seletor); }catch(e){ return; }
  if(!el || el === document.activeElement) return;
  try{ el.focus({ preventScroll:true }); }catch(e){ el.focus(); }
  if(guardado.inicio !== null && guardado.inicio !== undefined){
    try{ el.setSelectionRange(guardado.inicio, guardado.fim); }catch(e){}
  }
}

function render(){
  const root = document.getElementById('root');
  if(!authSession){ renderAuthScreen(); return; }
  if(!initialDataLoaded){
    root.innerHTML = `<div class="app-loading"><div class="spinner"></div><div>Carregando seus dados...</div></div>`;
    return;
  }
  // A conta solicitante tem uma tela própria, sem o shell normal —
  // ela não deve nem passar perto de sidebar/abas/relatórios, que
  // mostram lançamento e valor de todo mundo.
  if(isSolicitante){ renderSolicitarNotaScreen(); return; }
  const focoGuardado = focoParaRestaurar();
  ensurePartnersIncludeCurrent();
  if(isFinanceiro && ABAS_FINANCEIRO.indexOf(activeTab) === -1) activeTab = 'parceiros';
  const sectionHtml = activeTab === "vendas" ? renderVendasSection()
    : activeTab === "parceiros" ? (isFinanceiro ? renderFinanceiroResumo() : renderParceirosSection())
    : activeTab === "bonus" ? renderBonusSection()
    : activeTab === "marketing" ? renderMarketingSection()
    : activeTab === "equipeConsultoria" ? renderEquipeConsultoriaSection()
    : activeTab === "pagamentos" ? renderPagamentosSection()
    : activeTab === "painel" ? renderPainelSection()
    : activeTab === "renovacoes" ? renderPainelRenovacoes()
    : activeTab === "usuarios" ? renderUsuariosSection()
    : activeTab === "empresas" ? renderEmpresasCadastroSection()
    : renderEntitySection(activeTab);

  const years = getKnownYears();
  const yearPillsHtml = years.map(y => {
    const active = y === yearFilter ? ' active' : '';
    return `<button class="pill year-pill${active}" onclick="setYearFilter(${y})">${y}</button>`;
  }).join('') + `<button class="pill year-pill year-add" onclick="addYear()">+ Ano</button>`;

  const abaAtual = TABS.find(t => t.key === activeTab);

  root.innerHTML = `
    ${novaVersaoDisponivel ? `
      <div class="versao-nova-aviso">
        🔄 Tem uma versão mais nova do sistema. Esta aba está desatualizada — o que outras pessoas mudarem pode não aparecer aqui até atualizar.
        <button onclick="recarregarPagina()">Atualizar agora</button>
      </div>
    ` : ''}
    ${(dadosDesatualizados && !novaVersaoDisponivel) ? `
      <div class="versao-nova-aviso">
        🔄 Os lançamentos mudaram no banco depois que esta aba abriu (outra pessoa editou, ou você mesma em outra aba) — o que você está vendo aqui pode estar desatualizado.
        <button onclick="recarregarPagina()">Atualizar agora</button>
      </div>
    ` : ''}
    <div class="shell${isAdmin ? '' : ' read-only-mode'}">
      <aside class="sidebar">
        <div class="brand">
          ${marcaOpenHtml({tam:30})}
          <div class="brand-text">
            ${hubMarcaHtml({})}
            <div class="brand-sub">Painel Diretoria Comercial</div>
          </div>
        </div>
        <nav class="nav">${sidebarNavHtml()}</nav>
        <div class="sidebar-foot">
          <span class="sidebar-user" title="Conectado como">${esc((authSession.user && authSession.user.email) || '')}</span>
          ${isFinanceiro
            ? '<span class="read-only-badge" title="Você vê o valor das notas de todas as abas e marca as que já foram emitidas">financeiro</span> '
            : (!isAdmin ? '<span class="read-only-badge" title="Você só vê e não edita os próprios lançamentos">somente leitura</span> ' : '')}
          <button class="logout-btn" onclick="logout()" title="Sair da conta">Sair</button>
        </div>
      </aside>

      <div class="main${animarEntrada ? ' entrando' : ''}">
      <div class="hero">
        <div class="hero-globo">${logoGloboSvg(210, '#ffffff')}</div>
        <div class="hero-marca">
          ${marcaOpenHtml({tam:38, clara:true, cor:'#8FCBF5'})}
          <div class="hero-divisor"></div>
          <div>
            ${hubMarcaHtml({clara:true})}
            <h1>${esc(abaAtual ? abaAtual.label : 'Comissões')}</h1>
          </div>
        </div>
        <div class="hero-right">
          <div class="hero-info">Controle mensal de vendas e comissões</div>
          <div class="hero-info-sub">Exercício de ${yearFilter}</div>
          <div class="save-chip">
            <span id="save-dot" class="dot${saveError?' error':(saving?' saving':'')}"></span>
            <span id="save-label">${saveError?'erro ao salvar':(saving?'salvando':'salvo')}</span>
          </div>
        </div>
      </div>
      <div class="hero-linha"></div>

      ${isFinanceiro ? `
        <div class="storage-warning read-only-notice">
          📄 Acesso do financeiro — você vê o <b>valor das notas</b> de todas as abas e marca <b>“Emitida”</b> conforme
          emite cada nota fiscal. Comissões, bônus e salários não aparecem aqui. Para lançar ou corrigir um contrato,
          fale com a administração do HUB Comercial.

      ${(isFinanceiro && notasProntasParaEmitir().length) ? `

          para emissão — já conferida${notasProntasParaEmitir().length===1?'':'s'} ("Pode emitir"), só falta gerar a nota fiscal.

          👁 Modo somente leitura — você só vê os lançamentos relacionados a você${currentPersonName ? ` (<b>${esc(currentPersonName)}</b>)` : ''} e não pode editar. Pra lançar ou alterar algo, fale com a administração do HUB Comercial.

      ` : ''}

      ${storageAvailable === false ? `
        <div class="storage-warning">
          ⚠️ Não foi possível conectar ao banco de dados agora — os lançamentos podem não estar sendo salvos nem sincronizados entre pessoas. Verifique sua internet e recarregue a página.
        </div>

      <div class="year-row">
        <span class="year-row-label">Ano:</span>
        <div class="months">${yearPillsHtml}</div>
        <div class="topbar-actions">
          <button class="eye-toggle admin-only-btn" onclick="abrirRelatorioMes()" title="Gera um relatório do mês inteiro, com todas as abas, pra salvar em PDF ou imprimir">📄 Relatório do mês</button>
          <button class="eye-toggle" onclick="showExport()" title="Copia todos os dados em texto, pra guardar ou levar pra outro navegador">⬇ Exportar dados</button>
          <button class="eye-toggle admin-only-btn" onclick="showImport()" title="Cola um texto exportado antes e restaura os dados">⬆ Importar dados</button>
          <button class="eye-toggle admin-only-btn" onclick="normalizeAllText()" title="Coloca em CAIXA ALTA todos os textos já lançados">🔠 Normalizar textos</button>
          <button class="eye-toggle danger-toggle admin-only-btn" onclick="wipeAllData()" title="Apaga todos os lançamentos das três abas, mantendo produtos/vendedores/parceiros cadastrados">🗑 Zerar tudo</button>
        </div>
      </div>

      ${sectionHtml}
      </div>
    </div>
    ${renderModal()}
  `;
  if(!isAdmin){
    // .anexo-upload esconde um <input type="file"> dentro de um <td> só
    // pra caber o clique no label — travar ele aqui de propósito
    // impediria o financeiro de anexar nota, que é justamente uma das
    // poucas coisas que a conta dele pode fazer (via anexar_nota_arquivo).
    // Os campos do próprio lançamento (cliente/empresa, valor, forma de
    // pagamento, observações, tipo) seguem a mesma lógica: ficam
    // liberados só pro financeiro, e só gravam pela porta estreita
    // (editarCampoFinanceiroRPC) — ver updateCell/updateEntityCell.
    // .fin-empresa-campo é o modal "Empresas por lançamento" — essa
    // tabela não tem coluna de comissão nenhuma, então o financeiro tem
    // UPDATE/INSERT/DELETE direto (RLS), sem precisar de RPC.
    root.querySelectorAll('tbody td input, tbody td select, .meta-input-wrap input').forEach(function(el){
      if(el.closest('.anexo-upload')) return;
      if(isFinanceiro && el.classList.contains('fin-empresa-campo')) return;
      if(isFinanceiro && el.dataset.field){
        const campoDb = el.dataset.entity ? campoFinanceiroEntidade(el.dataset.entity, el.dataset.field) : VENDAS_CAMPOS_FINANCEIRO[el.dataset.field];
        if(campoDb) return;
      }
      el.disabled = true;
    });
  }
  devolverFoco(focoGuardado);
  animarEntrada = false;   // a animação vale só pra este render
}

function boot(){
  loadDataSync();
  checkStorageAvailability();
  const loaders = [
    loadCurrentUserAccess(),
    tryLoadFromStorageAsync(),
    tryLoadVendaProductsFromStorageAsync(),
    tryLoadSistemaSellersFromStorageAsync(),
    tryLoadPartnersFromStorageAsync(),
    tryLoadEmpresasCadastroAsync(),
    tryLoadExtraYearsFromStorageAsync(),
    tryLoadEntityFromStorageAsync('consultoria'),
    tryLoadEntityFromStorageAsync('publicos'),
    tryLoadEntityFromStorageAsync('cursos'),
    tryLoadBonusFromStorageAsync(),
    tryLoadMarketingAsync(),
    tryLoadMarketingIndicadoresAsync(),
    tryLoadTrafegoAsync(),
    tryLoadMarketingLeadsAsync(),
    tryLoadClosedMonthsFromStorageAsync(),
    tryLoadMetasFromStorageAsync(),
    tryLoadRelatoriosFromStorageAsync(),
    tryLoadPainelPesosAsync(),
    tryLoadPainelTotaisAsync(),
    tryLoadPainelVendedorasAsync(),
    tryLoadPainelContratosAsync(),
    tryLoadContratosNovosAsync(),
    tryLoadFechamentoForaAsync(),
    tryLoadFechamentosMesAsync(),
    tryLoadPrazosEmissaoNotaAsync(),
    tryLoadRenovacaoPessoasAsync(),
    tryLoadRenovacoesAsync(),
    tryLoadPedidosNotaAsync(),
  ];
  Promise.allSettled(loaders).then(function(){
    initialDataLoaded = true;
    // Com tudo lido, solta as renovações que ficaram apontando para vendas
    // já excluídas (inclusive as que travaram antes desta correção existir)
    // e garante que nenhum id de venda referenciado volte a ser distribuído.
    soltarRenovacoesOrfas();
    reservarNextIdVendas();
    render();
  });
  render();
}

/* ---------- Aviso de versão nova ----------
   O problema real que isso resolve: uma aba deixada aberta por dias não
   busca HTML novo sozinha (nem um F5 comum garante isso — o navegador
   pode servir do cache). Foi exatamente isso que aconteceu com o
   financeiro: a conta ficou presa numa versão de véspera, sem nenhum dos
   recursos lançados depois, e "peça pra recarregar" não é uma correção —
   é confiar que a pessoa vai lembrar disso sozinha.

   Em vez disso, a própria tela confere de tempos em tempos se o HTML
   publicado mudou (buscando ele de novo com cache:"no-store", que força
   ida à rede) e avisa com um banner fixo, sem forçar o recarregamento —
   quem está no meio de editar algo não perde nada. */
async function checkForNewVersion(){
  if(novaVersaoDisponivel) return;
  try{
    const res = await fetch(window.location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) return;
    const texto = await res.text();
    const m = texto.match(/const APP_BUILD = '([^']+)'/);
    if(m && m[1] !== APP_BUILD){
      novaVersaoDisponivel = true;
      render();
    }
  }catch(e){ /* rede instável não deve incomodar ninguém com isso */ }
}
function recarregarPagina(){ window.location.reload(); }

/* Duas pessoas logadas ao mesmo tempo (ex: Soraya edita, Marli só olha)
   não se enxergam: cada aba carrega os dados uma vez e nunca mais busca
   de novo sozinha — Marli podia passar a tarde inteira vendo um mês
   errado sem saber. Em vez de reescrever tudo em cima (arriscado: uma
   troca muda o array de rows debaixo de uma edição em andamento e o
   próximo autosave grava por cima do que a pessoa acabou de digitar —
   é exatamente o "bug que já pegou o fechamento" mencionado alhures),
   só avisa: busca de novo os campos que mudam com frequência, compara
   com o que tinha da última vez, e se for diferente mostra o aviso de
   "Atualizar agora" — mesmo botão/recarregamento inteiro de página já
   usado pra versão nova, então nunca corre o risco de misturar dado
   velho com novo na mesma sessão. */
async function verificarDadosDesatualizados(){
  if(dadosDesatualizados) return;
  if(!authSession || !initialDataLoaded || isSolicitante) return;
  try{
    const [vendasAgora, lancamentosAgora] = await Promise.all([
      sbSelectOpcional('vendas', 'select=id,mes,ano,valor,pago,mes_pagamento,nota_emitida,pode_emitir,cnpj&order=id.asc', null),
      sbSelectOpcional('lancamentos', 'select=id,entidade,mes,ano,valor_contrato,pago,mes_pagamento,nota_emitida,pode_emitir&order=id.asc', null),
    ]);
    if(vendasAgora === null || lancamentosAgora === null) return;   // erro/RLS: nunca compara com "vazio" por engano
    const novaAssinaturaVendas = JSON.stringify(vendasAgora);
    const novaAssinaturaLancamentos = JSON.stringify(lancamentosAgora);
    const primeiraChecagem = assinaturaVendasCheck === null;
    if(!primeiraChecagem && (novaAssinaturaVendas !== assinaturaVendasCheck || novaAssinaturaLancamentos !== assinaturaLancamentosCheck)){
      dadosDesatualizados = true;
      render();
    }
    assinaturaVendasCheck = novaAssinaturaVendas;
    assinaturaLancamentosCheck = novaAssinaturaLancamentos;
  }catch(e){ /* rede instável não deve incomodar ninguém com isso */ }
}

/* Link de recuperação de senha do Supabase volta com #access_token=...&type=recovery */
(function initAuth(){
  const hash = window.location.hash;
  if(hash && hash.length > 1){
    const params = new URLSearchParams(hash.slice(1));
    if(params.get('type') === 'recovery' && params.get('access_token')){
      authRecoveryToken = params.get('access_token');
      authScreen = 'reset';
      renderAuthScreen();
      return;
    }
  }
  authSession = loadStoredAuthSession();
  if(authSession) boot();
  else renderAuthScreen();
})();

/* Primeira conferência logo cedo (pra quem já está com a aba aberta
   numa versão velha agora mesmo não esperar 15 minutos pra saber), depois
   a cada 15 minutos, e também sempre que a aba volta a ficar visível —
   é assim que alguém que só alterna de aba (sem nunca fechar ou
   recarregar) acaba sendo avisado mesmo assim. */
setTimeout(checkForNewVersion, 60 * 1000);
setInterval(checkForNewVersion, 15 * 60 * 1000);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') checkForNewVersion();
});

/* Mesma lógica do aviso de versão nova, mas pros DADOS: primeira
   conferência logo cedo, depois a cada 90 segundos, e sempre que a aba
   volta a ficar visível — é o alt-tab de volta que mais importa aqui,
   porque é quando alguém que só deixou a aba aberta o dia inteiro
   precisa saber que mudou algo enquanto ela não estava olhando. */
setTimeout(verificarDadosDesatualizados, 60 * 1000);
setInterval(verificarDadosDesatualizados, 90 * 1000);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') verificarDadosDesatualizados();
});
</script>
