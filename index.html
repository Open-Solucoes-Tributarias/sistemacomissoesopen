async function onArquivoEmpresas(input){
  const arq = input.files && input.files[0];
  if(!arq) return;
  modalState.lendo = true; modalState.erro = ''; render();
  try{
    let linhas;
    if(/\.(csv|txt|tsv)$/i.test(arq.name)){
      let texto = await arq.text();
      if(texto.indexOf('�') >= 0){
        texto = new TextDecoder('iso-8859-1').decode(await arq.arrayBuffer());
      }
      linhas = linhasDeTexto(texto);
    } else {
      linhas = await linhasDoXlsx(await arq.arrayBuffer());
    }
    modalState.dados = prepararImportacaoEmpresas(linhas, modalState.entKey, modalState.rowId);
    modalState.erro = '';
  }catch(e){
    console.error(e);
    modalState.dados = null;
    modalState.erro = e && e.message ? e.message : 'Não consegui ler esse arquivo.';
  }
  modalState.lendo = false;
  render();
}
function onColarEmpresas(el){
  const texto = el.value;
  if(!String(texto).trim()){ modalState.dados = null; modalState.erro = ''; render(); return; }
  try{
    modalState.dados = prepararImportacaoEmpresas(linhasDeTexto(texto), modalState.entKey, modalState.rowId);
    modalState.erro = '';
  }catch(e){
    modalState.dados = null;
    modalState.erro = e && e.message ? e.message : 'Não consegui ler o que foi colado.';
  }
  render();
}
function confirmarImportacaoEmpresas(){
  const m = modalState;
  if(!m || !m.dados) return;
  const cfg = ENTITIES[m.entKey];
  const r = state[m.entKey].rows.find(function(x){ return x.id === m.rowId; });
  if(!r) return;
  const novos = m.dados.itens.filter(function(i){ return !i.duplicada; });
  if(!novos.length){ showAlert('Não há nada novo para importar.'); return; }
  if(!Array.isArray(r.empresas)) r.empresas = [];
  if(cfg.hasVendasPorVendedor && !Array.isArray(r.vendasVendedoras)) r.vendasVendedoras = [];

  // Enquanto lança a empresa, já junta quanto cada vendedora vendeu (pra
  // não digitar de novo lá em "Vendas por vendedora") — soma em cima do
  // que já tinha, nunca substitui. Só existe pra Cursos: as outras abas
  // não têm "Vendas por vendedora".
  const somaPorVendedora = {};
  novos.forEach(function(i, idx){
    const nova = {
      id: Date.now() + r.empresas.length + idx, nome: i.nome, cnpj: i.cnpj, responsavel: i.responsavel,
      telefone: i.telefone||'', email: i.email||'',
      valor: i.valor, observacoes: i.observacoes, notaEmitida: false, notaEmitidaEm: null,
    };
    r.empresas.push(nova);
    persistEmpresaCurso(nova, r.id);
    if(cfg.hasVendasPorVendedor && i.vendedora){
      somaPorVendedora[i.vendedora] = (somaPorVendedora[i.vendedora]||0) + (Number(i.valor)||0);
    }
  });
  if(cfg.hasVendasPorVendedor){
    Object.keys(somaPorVendedora).forEach(function(v){
      const existente = r.vendasVendedoras.find(function(x){ return name_matches_client(x.vendedor, v); });
      if(existente) existente.valor = (Number(existente.valor)||0) + somaPorVendedora[v];
      else r.vendasVendedoras.push({ id: Date.now() + r.vendasVendedoras.length, vendedor: v, valor: somaPorVendedora[v] });
    });
  }

  // "Total previsto" do lançamento passa a ser a soma de TODAS as
  // empresas cadastradas nele — as que já existiam mais as que acabaram
  // de entrar.
  r.valorContrato = r.empresas.reduce(function(a,e){ return a + (Number(e.valor)||0); }, 0);
  persistEntityRows(m.entKey);

  modalState = { type:'empresas-curso', entKey: m.entKey, rowId: r.id };
  render();
  showAlert(novos.length + (novos.length === 1 ? ' empresa importada. ' : ' empresas importadas. ')
    + 'Valor total atualizado pra ' + fmtMoney(r.valorContrato) + '.');
}

/* ---------- Renovação renovada vira venda na aba Sistema ----------
   A renovação que se confirma é faturamento do mês e precisa entrar na
   lista de comissões do Sistema, como qualquer outra venda. Mas isso é
   dinheiro: não acontece sozinho ao marcar "Renovado", e sim quando ela
   manda, numa conferência que mostra o que vai ser lançado e quanto dá.

   A renovação guarda o id da venda que gerou (vendaId), então a mesma
   nunca é lançada duas vezes — nem depois de recarregar a página. */

function renovacoesProntasParaSistema(mes){
  return renovacoes.filter(function(r){
    if(r.ano !== yearFilter) return false;
    if(mes && mes !== 'Todos' && r.mes !== mes) return false;
    return r.renovado === true && !r.vendaId && r.empresa && r.empresa.trim();
  });
}

/* A carteira de renovação se repete todo ano: as mesmas empresas vencem
   de novo doze meses depois. Copiar à mão 199 linhas não faz sentido.

   A cópia leva empresa, valor, responsável e mês, e zera o que é do ano
   anterior: a situação volta para "em aberto" e o vínculo com a venda é
   desfeito — senão o ano novo já nasceria com renovações dadas como
   resolvidas e lançadas. */
/* ---------- Montar a carteira do ano seguinte ----------
   O ciclo se fecha aqui: o que foi CONTRATO NOVO num ano vence no ano
   seguinte e vira renovação. Se depender de alguém lembrar disso em
   janeiro, um dia não vai lembrar — então a carteira do ano que vem é
   montada de duas fontes, e o sistema avisa sozinho quando falta algo.

   Fonte 1: as renovações do ano, que vencem de novo doze meses depois.
   Fonte 2: as vendas marcadas com "✨ Contrato novo" no ano — a conta que
            entrou agora é a renovação do ano que vem.

   Nos dois casos a cópia zera o que é do ano anterior: situação volta para
   "em aberto" e o vínculo com a venda é desfeito. */

function contratosNovosParaCarteira(anoOrigem, anoDestino){
  const jaLa = {};
  renovacoes.forEach(function(r){
    if(r.ano === anoDestino) jaLa[semAcento(r.empresa) + '|' + r.mes] = true;
  });
  return rows.filter(function(v){
    if((v.ano||2026) !== anoOrigem) return false;
    if(!v.novoContrato) return false;
    if(!v.cliente || !v.cliente.trim()) return false;
    return !jaLa[semAcento(v.cliente) + '|' + v.mes];
  });
}

function renovacoesParaCarteira(anoOrigem, anoDestino){
  const jaLa = {};
  renovacoes.forEach(function(r){
    if(r.ano === anoDestino) jaLa[semAcento(r.empresa) + '|' + r.mes] = true;
  });
  return renovacoes.filter(function(r){
    return r.ano === anoOrigem && r.empresa && r.empresa.trim()
        && !jaLa[semAcento(r.empresa) + '|' + r.mes];
  });
}

/* Quem cuida da renovação é a dupla da aba; o vendedor original só é
   aproveitado se estiver nessa lista. Senão fica em branco, para ela
   escolher — melhor um campo vazio do que um responsável errado. */
function responsavelDeRenovacao(nome){
  const pessoas = pessoasDeRenovacao();
  return pessoas.some(function(v){ return name_matches_client(v, nome); }) ? nome : '';
}

function montarCarteira(anoOrigem, anoDestino){
  if(!isAdmin) return;
  const daCarteira = renovacoesParaCarteira(anoOrigem, anoDestino);
  const dosNovos   = contratosNovosParaCarteira(anoOrigem, anoDestino);
  if(!daCarteira.length && !dosNovos.length){
    showAlert('A carteira de ' + anoDestino + ' já está completa: tudo de ' + anoOrigem + ' já foi trazido.');
    return;
  }
  const total = daCarteira.reduce(function(a,r){ return a + valorDeRenovacao(r); }, 0)
              + dosNovos.reduce(function(a,v){ return a + (Number(v.valor)||0); }, 0);
  const partes = [];
  if(daCarteira.length) partes.push('<b>' + daCarteira.length + '</b> ' + (daCarteira.length===1?'renovação':'renovações') + ' de ' + anoOrigem);
  if(dosNovos.length)   partes.push('<b>' + dosNovos.length + '</b> ' + (dosNovos.length===1?'contrato novo':'contratos novos') + ' de ' + anoOrigem + ' (que vencem em ' + anoDestino + ')');

  showConfirm(
    'Montar a carteira de ' + anoDestino + ' com ' + partes.join(' e ').replace(/<\/?b>/g,'') +
    ', somando ' + fmtMoney(total) + '? Todas entram no mesmo mês, como "em aberto" — a situação e o lançamento no Sistema recomeçam do zero.',
    function(){
      daCarteira.forEach(function(r){
        renovacoes.push({
          id: renovacoesNextId++, ano: anoDestino, mes: r.mes,
          pessoa: r.pessoa || '', empresa: r.empresa,
          // quem fez upgrade renova no ano que vem pelo valor NOVO
          valor: valorDeRenovacao(r) || null,
          renovado: null, vendaId: null, upgrade: false, valorUpgrade: null,
        });
      });
      dosNovos.forEach(function(v){
        renovacoes.push({
          id: renovacoesNextId++, ano: anoDestino, mes: v.mes,
          pessoa: responsavelDeRenovacao(v.vendedorResponsavel || ''), empresa: v.cliente.trim(),
          valor: (v.valor === null || v.valor === undefined) ? null : Number(v.valor),
          renovado: null, vendaId: null, upgrade: false, valorUpgrade: null,
        });
      });
      if(anoDestino !== 2026 && extraYears.indexOf(anoDestino) === -1){
        extraYears.push(anoDestino);
        persistExtraYears();
      }
      persistRenovacoes();
      render();
      showAlert((daCarteira.length + dosNovos.length) + ' empresas na carteira de ' + anoDestino +
                '. Use o filtro de ano, no topo da página, para abrir ' + anoDestino + '.');
    },
    'Montar ' + anoDestino
  );
}

function repetirCarteiraNoProximoAno(){ montarCarteira(yearFilter, yearFilter + 1); }
function trazerAnoAnterior(){ montarCarteira(yearFilter - 1, yearFilter); }

function abrirLancarNoSistema(){
  if(!isAdmin) return;
  const lista = renovacoesProntasParaSistema(renovacaoMes);
  if(!lista.length){
    const jaForam = renovacoes.filter(function(r){ return r.ano === yearFilter && r.vendaId; }).length;
    showAlert(jaForam
      ? 'Nenhuma renovação nova para lançar. As que já foram estão marcadas com “no Sistema”.'
      : 'Marque as empresas como “Renovado” primeiro — só as renovadas viram venda no Sistema.');
    return;
  }
  modalState = { type:'lancar-renovacoes', lista: lista, produto: '' };
  render();
}

/* Redesenha: é o produto que decide a aba de destino, e o modal mostra
   qual é — sem render o aviso ficaria desatualizado. */
function setLancarProduto(el){ modalState.produto = el.value; render(); }

function confirmarLancarNoSistema(){
  const m = modalState;
  if(!m || !m.lista || !m.lista.length) return;
  const fechados = [];
  let lancadas = 0;
  /* Premium não é venda de Sistema: vai para a aba de Órgãos Públicos. É o
     produto escolhido aqui que decide, e ele vale para o lote inteiro. */
  const destino = produtoEhPremium(m.produto) ? 'publicos' : 'vendas';

  m.lista.forEach(function(r){
    if(isMonthClosedFor(destino, r.ano, r.mes)){ fechados.push(r.mes); return; }
    // Renovar não é venda nova e fica fora do ranking. Subir o plano de um
    // cliente é: vai com a etiqueta de upgrade e conta no desempenho.
    const etiqueta = r.upgrade ? 'Upgrade de plano' : 'Renovação';
    let novoId;

    if(destino === 'publicos'){
      /* A aba de Órgãos Públicos não tem campo de produto, etiqueta nem
         "quem vendeu" — os três vão para Observações, na mesma forma usada
         na migração dos premium que já estavam lançados. E a comissão lá é
         percentual, não valor: nasce vazia, pra ser preenchida por lá. */
      /* Os ids de `lancamentos` são namespeados por aba (publicos em
         100001+). Se a lista de publicos vier vazia, o nextId nasce em 1 e
         colidiria com um lançamento de Consultoria — a tabela é a mesma. */
      if(state.publicos.nextId < 100001) state.publicos.nextId = 100001;
      novoId = state.publicos.nextId++;
      state.publicos.rows.unshift({
        id: novoId, ano: r.ano, mes: r.mes,
        orgao: r.empresa, valorContrato: valorDeRenovacao(r) || null,
        tipo: '', parceiro: '', participacao: null,
        formaPagamento: '', colaborador: '',
        observacoes: [m.produto || '', etiqueta, r.pessoa ? 'vendeu: ' + r.pessoa : '']
                       .filter(function(x){ return x; }).join(' · '),
        comissaoPercent: null, vendedor: '',
        comissaoPercent2: null, vendedor2: '',
        comissaoPercent3: null, vendedor3: '',
        extraVendedores: [],
        pago: false, mesPagamento: null,
        notaEmitida: false, notaEmitidaEm: null,
        renovacao: !r.upgrade, upgrade: !!r.upgrade,
      });
    } else {
      const venda = {
        id: nextId++, ano: r.ano, mes: r.mes,
        cliente: r.empresa, venda: m.produto || '',
        valor: valorDeRenovacao(r) || null,
        parceiro: '', participacao: null, formaPagamento: '', colaborador: '',
        vendedor2: '', vendedor3: '', vendedorResponsavel: r.pessoa || '',
        pago: false, mesPagamento: null,
        observacoes: etiqueta,
        renovacao: !r.upgrade,
        novoContrato: false, upgrade: !!r.upgrade,
        comissaoPercents: {},
      };
      SELLERS.forEach(function(sv){ venda[sv.key] = null; });
      rows.unshift(venda);
      novoId = venda.id;
    }

    r.vendaId = novoId;
    r.vendaEntidade = destino;
    lancadas++;
  });

  if(destino === 'publicos') persistEntityRows('publicos'); else persist();
  persistRenovacoes();
  closeModal();
  const aviso = fechados.length
    ? ' ' + fechados.filter(function(v,i,a){ return a.indexOf(v)===i; }).join(', ') + ' está fechado para lançamentos, então essas ficaram de fora.'
    : '';
  showAlert(lancadas
    ? lancadas + (lancadas === 1 ? ' renovação lançada' : ' renovações lançadas')
      + ' na aba ' + NOME_DA_ABA_DESTINO[destino] + '. Preencha o percentual de comissão de cada uma por lá.' + aviso
    : 'Nada foi lançado.' + aviso);
  setTimeout(tryLoadPainelTotaisAsync, 900);
}

/* Abrir a venda gerada, para conferir ou preencher a comissão. */
function irParaVendaDaRenovacao(id){
  const r = renovacoes.find(function(x){ return x.id === id; });
  if(!r || !r.vendaId) return;
  const destino = destinoDaRenovacao(r);
  const linha = linhaDoDestino(destino, r.vendaId);
  if(!linha){
    // É exatamente aqui que o sistema descobre que a linha sumiu — então é
    // aqui que ele solta a marca, em vez de só avisar e deixar presa.
    soltarRenovacoesOrfas();
    showAlert('O lançamento desta renovação não está mais na aba ' + NOME_DA_ABA_DESTINO[destino]
      + ' — deve ter sido excluído por lá. Soltei a marca: a renovação voltou para a fila de lançamento.');
    return;
  }
  if(destino === 'publicos'){
    activeTab = 'publicos';
    state.publicos.filter = linha.mes;
    state.publicos.vendorFilter = 'Todos';
    state.publicos.search.main = linha.orgao || '';
  } else {
    activeTab = 'vendas';
    filter = linha.mes;
    sellerFilter = 'Todas';
    searchCliente = linha.cliente || '';
  }
  render();
}

/* ---------- Renovação presa numa venda que não existe mais ----------
   A renovação guarda o id da venda que gerou (`vendaId`). Excluir essa venda
   na aba Sistema não limpava a marca, e a renovação ficava órfã — sem saída
   pela tela: continuava com o selo "no Sistema", não voltava para a fila de
   "Lançar no Sistema" (que exige `!vendaId`), e recusava virar upgrade
   pedindo justamente para excluir a venda — que já tinha sido excluída.

   Aqui a marca é soltada quando a venda apontada não está mais em `rows`. A
   situação (Renovado / Upgrade) é escolha de quem lançou e não se mexe: o
   que está velho é só o vínculo com a venda. Solta o vínculo, a renovação
   volta para a fila e aceita virar upgrade de novo.

   As duas travas de `carregouDoBanco` é o que torna isso seguro: antes de
   ter lido vendas E renovações do banco, `rows` pode estar vazio só porque
   a leitura não voltou ainda — e aí isso apagaria todo vínculo legítimo. */
/* ---------- Nunca reaproveitar id de venda que alguém aponta ----------
   O id de uma venda nova é calculado no navegador como `max(ids) + 1` (o
   banco tem sequence, mas o app manda o id junto no upsert, então ela nunca
   avança). Consequência: excluir a venda de MAIOR id devolvia aquele número
   para a fila, e a venda seguinte nascia com o id da que foi excluída.

   Quando a venda excluída era a de uma renovação, o `venda_id` guardado na
   renovação passava a apontar para uma venda **nova e sem relação nenhuma**
   com ela — outra empresa, outro mês, outro valor. Foi assim que a renovação
   do MP RR (Out/2026) acabou amarrada a uma venda do TRE PA de Set/2027, e a
   do INPI a uma do PRODAP: cada id ficou sendo reivindicado por duas
   renovações, e a antiga passou a mostrar dados da nova.

   A regra aqui: o próximo id fica acima do maior id de venda existente E do
   maior id ainda referenciado por alguma renovação. E só cresce — nunca
   diminui —, o que deixa a função segura de chamar de vários pontos de
   carga, em qualquer ordem. */
function reservarNextIdVendas(){
  const maiorVenda = rows.reduce(function(a, r){ return Math.max(a, r.id || 0); }, 0);
  // só os vínculos que apontam para a aba Sistema disputam o espaço de ids
  // de `vendas`; os de Órgãos Públicos vivem em outro espaço (100001+).
  const maiorReferenciado = renovacoes.reduce(function(a, r){
    return destinoDaRenovacao(r) === 'vendas' ? Math.max(a, r.vendaId || 0) : a;
  }, 0);
  const minimo = Math.max(maiorVenda, maiorReferenciado) + 1;
  if(nextId < minimo) nextId = minimo;
}

/* ---------- Para onde a renovação foi (ou vai) ----------
   Plano premium é lançado na aba de Órgãos Públicos; o resto, na aba
   Sistema. São TABELAS diferentes (`lancamentos` e `vendas`) e espaços de id
   diferentes, então o vínculo guarda os dois: o id e a entidade.

   Sem a entidade, `vendaId` seria um número ambíguo — a limpeza de vínculo
   morto não acharia a linha em `vendas`, concluiria que foi excluída, e
   soltaria o vínculo de um lançamento vivo em Órgãos Públicos. */
function destinoDaRenovacao(r){
  return (r && r.vendaEntidade === 'publicos') ? 'publicos' : 'vendas';
}

/* Premium é o que vai para Órgãos Públicos. A regra é o nome do produto:
   "GT Premium Mensal", "Plano Premium", "GT Plano Premium" — qualquer um
   com "premium" no nome, com ou sem acento e em qualquer caixa. */
function produtoEhPremium(nome){
  return /premium/.test(semAcento(String(nome || '')));
}

function linhaDoDestino(destino, id){
  if(destino === 'publicos') return state.publicos.rows.find(function(l){ return l.id === id; }) || null;
  return rows.find(function(v){ return v.id === id; }) || null;
}

/* A leitura da tabela de destino já voltou do banco? Antes disso a lista
   pode estar vazia só porque a resposta não chegou, e concluir "foi
   excluída" apagaria vínculo bom. */
function destinoJaLido(destino){
  return destino === 'publicos' ? !!carregouDoBanco['lanc-publicos'] : !!carregouDoBanco.vendas;
}

const NOME_DA_ABA_DESTINO = { vendas: 'Sistema', publicos: 'Consultorias e site para Órgãos Públicos' };

/* A renovação só está de fato presa se a linha que ela aponta continuar
   existindo. As travas de upgrade e de situação perguntavam apenas "tem
   vendaId?", e por isso barravam para sempre quem já tinha excluído a venda.
   Se o vínculo estiver morto, solta na hora e libera a ação. */
function renovacaoPresaNaVenda(r){
  if(!r || !r.vendaId) return false;
  const destino = destinoDaRenovacao(r);
  if(linhaDoDestino(destino, r.vendaId)) return true;
  if(!destinoJaLido(destino)) return true;
  soltarRenovacoesOrfas();
  return false;
}

function soltarRenovacoesOrfas(){
  if(!carregouDoBanco['renovacoes']) return false;
  let mudou = false;
  renovacoes.forEach(function(r){
    if(!r.vendaId) return;
    const destino = destinoDaRenovacao(r);
    if(!destinoJaLido(destino)) return;          // nunca apagar sem ter lido
    if(linhaDoDestino(destino, r.vendaId)) return;
    r.vendaId = null;
    r.vendaEntidade = null;
    mudou = true;
  });
  if(mudou) persistRenovacoes();
  return mudou;
}

function atualizarResumoRenovacoes(){

  });
  const soma = function(l){ return l.reduce(function(a,r){ return a + valorDeRenovacao(r); }, 0); };
  const grupos = {
    'renov-kpi-sim':    todas.filter(function(r){ return r.renovado === true; }),
    'renov-kpi-nao':    todas.filter(function(r){ return r.renovado === false; }),
    'renov-kpi-aberto': todas.filter(function(r){ return r.renovado === null || r.renovado === undefined; }),
    'renov-kpi-total':  todas,
  };
  Object.keys(grupos).forEach(function(id){
    const el = document.getElementById(id);
    if(el) el.textContent = fmtMoney(soma(grupos[id])) + (el.dataset.sufixo || '');
  });
}

   daqui, pra não mexer no que já está lançado; o sistema só mostra os
   dois lado a lado quando divergem, como conferência. */
let contratosNovos = [];
let contratosNovosNextId = 1;
let contratosNovosTimer = null;

async function tryLoadContratosNovosAsync(){

/* CNPJ: máscara 00.000.000/0000-00 e conferência dos dois dígitos
   verificadores. A conferência avisa, mas nunca bloqueia — o contrato
   pode ser cadastrado antes de alguém achar o número certo. */
function cnpjDigitos(v){ return String(v===null||v===undefined?'':v).replace(/\D/g,'').slice(0,14); }
/* A lista de empresas com contrato assinado sai em CSV, para abrir no Excel
   ou colar em outro lugar — é dela que saem os nomes e CNPJs quando alguém
   pede a relação de clientes novos do ano. Uma pessoa por arquivo, que é
   como o painel mostra. */
function exportarEmpresasContratoCSV(pessoa){
  try{
    const lista = contratosNovosDe(pessoa);
    if(!lista.length){
      showAlert('Não há empresa cadastrada para ' + pessoa + ' em ' + yearFilter + '.');
      return;
    }
    const avaliacao = function(r){
      return r === true ? 'Rentável' : (r === false ? 'Não rentável' : 'Sem avaliação');
    };
    let csv = 'Mes;Empresa;CNPJ;O negocio foi\n';
    lista.forEach(function(c){
      csv += [
        csvTexto(c.mes),
        csvTexto(c.empresa),
        csvTexto(formatCnpj(c.cnpj)),
        csvTexto(avaliacao(c.rentavel)),
      ].join(';') + '\n';
    });
    baixarTexto('empresas-contrato-' + slug(pessoa) + '-' + yearFilter + '.csv', csv);
  } catch(e){
    console.error('Falha ao exportar as empresas com contrato assinado', e);
    showAlert('Não foi possível gerar o arquivo. Tente novamente.');
  }
}

function formatCnpj(v){
  const d = cnpjDigitos(v);
  if(!d) return '';
  let s = d.slice(0,2);
  if(d.length > 2)  s += '.' + d.slice(2,5);
  if(d.length > 5)  s += '.' + d.slice(5,8);
  if(d.length > 8)  s += '/' + d.slice(8,12);
  if(d.length > 12) s += '-' + d.slice(12,14);
  return s;
}
function cnpjValido(v){
  const d = cnpjDigitos(v);
  if(d.length !== 14) return false;
  if(/^(\d)\1{13}$/.test(d)) return false;
  const digito = function(len){
    let soma = 0, peso = len - 7;
    for(let i = 0; i < len; i++){
      soma += Number(d[i]) * peso--;
      if(peso < 2) peso = 9;
    }
    const r = soma % 11;
    return r < 2 ? 0 : 11 - r;
  };
  return digito(12) === Number(d[12]) && digito(13) === Number(d[13]);
}

function contratosNovosDe(pessoa){
  return contratosNovos.filter(function(c){
    return c.ano === yearFilter && name_matches_client(c.pessoa, pessoa);
  }).sort(function(a,b){
    const d = MONTHS.indexOf(a.mes) - MONTHS.indexOf(b.mes);
    return d !== 0 ? d : ((a.id||0) - (b.id||0));
  });
}

/* ---------- O aviso de divergência vira ação ----------
   Quando o número digitado em "contratos assinados" é maior que a
   quantidade de empresas cadastradas, o painel só avisava e parava ali —
   quem conferia tinha que clicar em "+ Empresa", trocar o mês, repetir.
   Aqui o próprio aviso cria as linhas que faltam, já no mês certo, e põe o
   cursor na primeira: resta digitar os nomes.

   Só aparece quando FALTAM empresas. Quando há mais cadastradas do que
   lançado, o errado é o número digitado (ou uma linha sobrando), e
   adivinhar qual dos dois seria pior do que avisar. */
function cadastrarContratosFaltantes(pessoa, mes, quantas){
  if(!isAdmin) return;
  const faltam = Math.floor(Number(quantas) || 0);
  if(faltam < 1) return;
  // "Contratos assinados" é digitado à mão: um 500 por engano não pode
  // despejar 500 linhas em branco na tela.
  const criar = Math.min(faltam, 50);
  if(criar > 6){
    showConfirm(
      'Criar ' + criar + ' linhas em branco em ' + mes + ' para ' + pessoa + '? Os nomes e CNPJs você preenche depois.',
      function(){ criarContratosEmBranco(pessoa, mes, criar); },
      'Criar ' + criar
    );
    return;
  }
  criarContratosEmBranco(pessoa, mes, criar);
}

function criarContratosEmBranco(pessoa, mes, quantas){
  let primeiro = null;
  for(let i = 0; i < quantas; i++){
    const novo = {
      id: contratosNovosNextId++, ano: yearFilter,
      mes: mes, pessoa: pessoa,
      empresa: '', cnpj: '', rentavel: null,
    };
    contratosNovos.push(novo);
    if(!primeiro) primeiro = novo;
  }
  persistContratosNovos();
  render();
  setTimeout(function(){
    const el = document.getElementById('contrato-emp-' + primeiro.id);
    if(el){
      el.focus();
      try{ el.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){ el.scrollIntoView(); }
    }
  }, 40);
}

function onContratoNovoTexto(el, id, campo){
  const c = contratosNovos.find(function(x){ return x.id === id; });
  if(!c) return;
  if(campo === 'cnpj'){
    const antes = el.value, pos = el.selectionStart;
    el.value = formatCnpj(el.value);
    if(pos !== null){
      const novaPos = pos + (el.value.length - antes.length);
      try{ el.setSelectionRange(novaPos, novaPos); }catch(e){}
    }
    c.cnpj = el.value;
    const aviso = document.getElementById('contrato-cnpj-aviso-' + id);
    if(aviso) aviso.textContent = (cnpjDigitos(c.cnpj) && !cnpjValido(c.cnpj)) ? 'CNPJ incompleto' : '';
  } else {
    c[campo] = el.value;
  }
  persistContratosNovos();
}

function togglePessoaPainel(nome){

    lista.splice(i, 1);
  } else {
    lista.push(String(nome).trim());
  }
  painelVendedoras = lista;
  persistPainelVendedoras();
  render();
}

function persistPainelVendedoras(){
  saving = true; updateSaveStatus();
  if(entityTimers['painel-vendors']) clearTimeout(entityTimers['painel-vendors']);
  entityTimers['painel-vendors'] = setTimeout(function(){
    (async function(){
      try{
        if(!carregouDoBanco['painel-vendors']) return;   // nunca apagar sem ter lido antes
        await sbDeleteAll('entity_vendors', 'entidade=eq.painel');
        const linhas = (painelVendedoras || []).map(function(v){ return { entidade:'painel', vendor_name:v }; });
        if(linhas.length) await sbUpsert('entity_vendors', linhas, 'entidade,vendor_name');
        saveError = false;
      } catch(e){ console.error(e); saveError = true; }
      finally { saving = false; updateSaveStatus(); }
    })();
  }, 450);
}

async function tryLoadPainelVendedorasAsync(){
  try{

    carregouDoBanco['painel-vendors'] = true;

}

/* Valor de um indicador para uma pessoa num mês. Os manuais vêm do que foi
   lançado; os de venda vêm calculados pelo banco. */
function valorMetrica(vendedor, mes, key){
  const t = painelTotais.find(x => x.ano === yearFilter && x.mes === mes
                                && name_matches_client(x.vendedor, vendedor));
  if(t) return Number(t[key]) || 0;
  const r = getRelatorio(vendedor, mes);
  return r ? (Number(r[key]) || 0) : 0;
}
function fmtMetrica(m, valor){
  return m.moeda ? fmtMoney(valor) : (Number(valor)||0).toLocaleString('pt-BR');
}
function corDoVendedor(nome){
  const s = SELLERS.find(x => name_matches_client(x.label, nome));
  return s ? s.color : VENDOR_PALETTE[0];
}
function relatoriosDoAno(){ return relatorios.filter(r => r.ano === yearFilter); }
function getRelatorio(vendedor, mes){
  return relatoriosDoAno().find(r => name_matches_client(r.vendedor, vendedor) && r.mes === mes);
}
function mesesLancados(vendedor){
  return relatoriosDoAno()
    .filter(r => name_matches_client(r.vendedor, vendedor))
    .sort((a,b) => MONTHS.indexOf(a.mes) - MONTHS.indexOf(b.mes));
}
/* Valor de um indicador no período escolhido: o mês, ou a soma dos 12. */
function valorNoPeriodo(vendedor, key, periodo){
  const p = periodo || painelPeriodo;
  if(p && p !== 'Ano') return valorMetrica(vendedor, p, key);
  return MONTHS.reduce(function(a, mes){ return a + valorMetrica(vendedor, mes, key); }, 0);
}
function rotuloPeriodo(periodo){
  const p = periodo || painelPeriodo;
  return (p && p !== 'Ano') ? (p + ' de ' + yearFilter) : ('todo o ano de ' + yearFilter);
}

function totaisPorVendedorPainel(periodo){
  const out = {};
  vendedoresDoPainel().forEach(v => {
    const t = {};
    METRICAS.forEach(m => { t[m.key] = valorNoPeriodo(v, m.key, periodo); });
    out[v] = t;
  });
  return out;
}

function painelFormVazio(){
  const f = {};
  METRICAS.forEach(m => { f[m.key] = ''; });
  return f;
}
function carregarFormPainel(){
  const existente = getRelatorio(painelVendedor, painelMes);
  if(existente){
    const f = {};
    METRICAS.forEach(m => { f[m.key] = existente[m.key] === 0 ? '0' : String(existente[m.key] ?? ''); });
    painelForm = f;
  } else {
    painelForm = painelFormVazio();
  }
}
/* ================= Relatório mensal do sistema inteiro (PDF) =================
   Junta num documento só tudo o que aconteceu num mês: faturamento por
   origem, ganhos de cada vendedora, honorários de parceiros, os
   lançamentos de cada aba, bônus, comissões já liberadas e o desempenho
   da equipe. Sai pela impressão do navegador ("Salvar como PDF"), que é
   o caminho que funciona sem depender de biblioteca externa — o sistema
   bloqueia carregar script de fora por segurança. */

function abrirRelatorioMes(){
  const mesAtual = (partnerMonthFilter && partnerMonthFilter !== 'Todos') ? partnerMonthFilter
    : (filter && filter !== 'Todos') ? filter
    : MONTHS[new Date().getMonth()];
  modalState = { type:'relatorio-mes', mes: mesAtual };
  render();
}
function onRelatorioMesChange(el){ if(modalState) modalState.mes = el.value; }

function imprimirRelatorioMes(){
  const mes = (modalState && modalState.mes) || MONTHS[new Date().getMonth()];

    document.body.classList.remove('imprimindo-relatorio');

  setTimeout(function(){ window.print(); setTimeout(limpar, 1500); }, 60);
}

/* Comprovante de comissão de uma pessoa, só o mês escolhido — pra
   anexar junto do comprovante de pagamento. Junta todas as origens
   (mesma regra do Fechamento: sistema, órgãos públicos, consultoria,
   cursos, bônus, salário fixo) num único documento para impressão. */
function montarComprovanteFechamento(pessoa, mes){
  const ano = yearFilter;
  const agora = new Date();
  const emitido = agora.toLocaleDateString('pt-BR') + ' às ' + agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

  const origens = [
    {key:'sistema', label:'Sistema'},
    {key:'publicos', label:'Órgãos Públicos'},
    {key:'consultoria', label:'Consultoria'},
    {key:'cursos', label:'Cursos'},
    {key:'bonus', label:'Bônus'},
    {key:'salario', label:'Salário fixo'},
  ];
  let linhas = [];
  origens.forEach(function(o){ linhas = linhas.concat(detalheFechamento(pessoa, o.key, mes)); });
  linhas.sort(function(a,b){ return MONTHS.indexOf(a.mes) - MONTHS.indexOf(b.mes); });
  const total = linhas.reduce(function(a,l){ return a + l.comissao; }, 0);

  const linhasHtml = linhas.map(function(l){
    return `<tr><td>${esc(monthShort(l.mes))}</td><td>${esc(l.origemLabel)}</td><td>${esc(l.cliente)}</td>
      <td class="num">${l.valorContrato===null||l.valorContrato===undefined?'—':fmtMoney(l.valorContrato)}</td>
      <td class="num">${l.percent===null||l.percent===undefined?'—':esc(l.percent)+'%'}</td>
      <td class="num destaque">${fmtMoney(l.comissao)}</td></tr>`;
  });

  return `
    <div class="rel-doc">
      <header class="rel-faixa">
        <div class="rel-faixa-globo">${logoGloboSvg(150, '#ffffff')}</div>
        <div class="rel-marca">
          ${marcaOpenHtml({tam:32, clara:true, cor:'#8FCBF5'})}
          <div class="rel-divisor"></div>
          <div>
            <div class="rel-empresa">HUB Comercial · Painel Diretoria Comercial</div>
            <h1>Comprovante de comissão — ${esc(pessoa)}</h1>
          </div>
        </div>
        <div class="rel-emissao">
          <div class="rel-emissao-tit">Recebíveis de ${esc(mes)} de ${ano}</div>
          <div class="rel-emissao-sub">Emitido em ${esc(emitido)}</div>
        </div>
      </header>
      <div class="rel-faixa-linha"></div>

      <section class="rel-sec">
        <div class="rel-cards">
          <div class="rel-card rel-card-total"><span>Total a receber em ${esc(mes)}</span><b>${fmtMoney(total)}</b></div>
        </div>
        ${relTabela(
          [{label:'Mês'},{label:'Origem'},{label:'Cliente/Empresa'},{label:'Valor do contrato',num:true},{label:'%',num:true},{label:'Comissão',num:true}],
          linhasHtml, 'Nenhum recebível de ' + pessoa + ' em ' + mes + '.')}
        <p class="rel-nota">Considera só o que já está liberado para pagamento em ${esc(mes)} — o que ainda espera o cliente pagar não entra aqui.</p>
      </section>
    </div>
  `;
}

function montarRelatorioMes(mes){
  const ano = yearFilter;
  // getSellerBreakdown / getPartnerBreakdown / getPartnerEntries leem o
  // filtro global; aponta pro mês do relatório e devolve no fim.
  const filtroAntigo = partnerMonthFilter;
  partnerMonthFilter = mes;

  const fatur = [
    {label:'Sistema',                  valor: faturamentoDaOrigem('sistema', ano, mes)},
    {label:'Consultoria',              valor: faturamentoDaOrigem('consultoria', ano, mes)},
    {label:'Consultorias e site para Órgãos Públicos', valor: faturamentoDaOrigem('publicos', ano, mes)},
    {label:'Cursos',                   valor: faturamentoDaOrigem('cursos', ano, mes)},
  ];
  const faturTotal = fatur.reduce(function(a,x){ return a + x.valor; }, 0);

  // Faturamento total da empresa, todos os produtos somados, mês a mês
  // no ano — a mesma soma de `fatur` acima, só que repetida pros 12
  // meses em vez de só o mês do relatório.
  const faturMensalTotal = MONTHS.map(function(m){ return faturamentoDaOrigem('todas', ano, m); });

  const sellerBreak = getSellerBreakdown();
  const nomesVend = Object.keys(sellerBreak).filter(function(n){
    const b = sellerBreak[n];
    return (b.sistema + b.consultoria + b.publicos + b.cursos + b.bonus) > 0;
  }).sort(function(a,b){
    const ta = sellerBreak[a], tb = sellerBreak[b];
    return (tb.sistema+tb.consultoria+tb.publicos+tb.cursos+tb.bonus) - (ta.sistema+ta.consultoria+ta.publicos+ta.cursos+ta.bonus);
  });
  let totComissao = 0;
  const linhasVend = nomesVend.map(function(n){
    const b = sellerBreak[n];
    const t = b.sistema + b.consultoria + b.publicos + b.cursos + b.bonus;
    totComissao += t;
    return `<tr><td>${esc(n)}</td><td class="num">${fmtMoney(b.sistema)}</td><td class="num">${fmtMoney(b.consultoria)}</td>
      <td class="num">${fmtMoney(b.publicos)}</td><td class="num">${fmtMoney(b.cursos)}</td>
      <td class="num">${fmtMoney(b.bonus)}</td><td class="num destaque">${fmtMoney(t)}</td></tr>`;
  });

  const partnerEntries = getPartnerEntries();
  const totHonorarios = partnerEntries.reduce(function(a,e){ return a + e.honorario; }, 0);
  const linhasParc = partnerEntries.map(function(e){
    return `<tr><td>${esc(e.parceiro)}</td><td>${esc(e.origem)}</td><td>${esc(e.label)}</td>
      <td class="num">${fmtMoney(e.valorContrato)}</td><td class="num">${e.pct}%</td>
      <td class="num destaque">${fmtMoney(e.honorario)}</td></tr>`;
  });

  // Lançamentos de cada origem
  const vendasMes = rows.filter(function(r){ return (r.ano||2026) === ano && r.mes === mes; });
  const linhasSistema = vendasMes.map(function(r){
    const com = SELLERS.filter(function(sv){ return Number(r[sv.key]) > 0; })
      .map(function(sv){ return sv.label + ' ' + fmtMoney(Number(r[sv.key])||0); }).join(' · ');
    return `<tr><td>${esc(r.cliente||'—')}</td><td>${esc(r.venda||'—')}</td>
      <td class="num">${fmtMoney(Number(r.valor)||0)}</td>
      <td>${esc(r.vendedorResponsavel||'—')}</td>

  const blocosEntidade = ENTITY_KEYS.map(function(key){
    const cfg = ENTITIES[key];

    const lista = state[key].rows.filter(function(r){ return (r.ano||2026) === ano && r.mes === mes; });

  // Fechamento do mês: o que cada pessoa recebe, somando comissão já

  const rk = rankingDoMes(mes);

               }).join('')}<b>${esc(item.formatado)}</b></span>`

        </div>`;
      }).join('')}
    </div>
    ${rk.campeoes.length ? `
      <div class="rel-campea">
        <div>
          <span class="rel-campea-rot">${rk.campeoes.length > 1 ? 'Melhores do mês · empate' : 'Melhor do mês'}</span>
          <b>${rk.campeoes.map(function(c){ return esc(c.vendedor); }).join(' e ')}</b>
          <span class="rel-campea-sub">${fmtPontos(rk.campeoes[0].pontos)} de 100 pontos · liderou ${rk.campeoes[0].vitorias} de ${METRICAS.length} indicadores</span>

    <p class="rel-nota">Cada indicador vale um peso; quem lidera aquele indicador no mês leva o peso inteiro. Empate leva o peso inteiro pra cada um dos empatados — por isso a soma pode passar de 100 quando há empate.</p>`;

/* Ranking do mês: em cada indicador, quem lidera soma N pontos, o segundo
   N-1, e assim por diante. Vence quem somar mais no conjunto. */
/* Campeã do mês = quem venceu MAIS INDICADORES, não quem somou mais
   pontos. A soma de pontos premiava quem chegava em segundo lugar em
   tudo: num time de 4, quatro segundos lugares valiam mais que uma
   liderança, e acabava campeã quem não tinha vencido nada.

   Aqui vale o que a Soraya pediu: conta quantas vezes o nome da pessoa
   aparece liderando. Empate num indicador dá vitória para todas as
   empatadas, e quem está zerado não vence nada. */
/* Ranking com peso — versão da fatia, abandonada.

   A pontuação virou a FATIA que a pessoa tinha do total da equipe em cada
   indicador, multiplicada pelo peso daquele indicador. Resolvia o problema
   da margem (liderar por 1 valia igual a liderar pelo dobro), mas criou
   outro: dava pra ser campeã sem ter liderado o indicador de maior peso
   nenhuma vez, só por nunca zerar em nada. Foi o que aconteceu em
   agosto/2026 — a Rios liderou 5 dos 10 indicadores, dois deles os de
   venda mais forte, e ainda assim ficou em 3º lugar.

   Ranking com peso — versão atual: quem lidera o indicador leva o peso
   dele inteiro pra si; quem não lidera não leva nada daquele indicador,
   não importa quão perto tenha chegado. Empate leva o peso inteiro pra
   cada um dos empatados — a mesma regra que "quantos indicadores liderou"
   já usava. Por isso a soma de todo mundo pode passar de 100 quando há
   empate; não é mais garantido somar exatamente 100 como na fatia.

   Indicador em que a equipe inteira está zerada sai do cálculo, em vez de
   dar zero a todas; e peso 0 tira o indicador da conta sem tirá-lo da tela. */
function rankingDoMes(periodo){
  const vends = vendedoresDoPainel();
  const vitorias = {}, pontos = {};
  vends.forEach(v => { vitorias[v] = 0; pontos[v] = 0; });

  let pesoEmJogo = 0;
  const porMetrica = METRICAS.map(m => {
    const peso = pesoDaMetrica(m.key);
    const valores = vends
      .map(v => ({ vendedor: v, valor: valorNoPeriodo(v, m.key, periodo) }))
      .sort((a,b) => b.valor - a.valor);

    const lideres = valores.filter(x => x.valor > 0 && x.valor === valores[0].valor);
    lideres.forEach(l => { vitorias[l.vendedor] += 1; });

    const soma = valores.reduce((a,x) => a + (Number(x.valor)||0), 0);
    if(soma > 0 && peso > 0){
      pesoEmJogo += peso;
      // Quem lidera leva o peso do indicador — empate leva o peso inteiro
      // pra cada um dos empatados, a mesma regra que "quantos indicadores
      // liderou" já usa. Só liderar conta; a margem não pesa mais.
      lideres.forEach(l => { pontos[l.vendedor] += peso; });
    }

    return {
      metrica: m.label,
      chave: m.key,
      peso: peso,
      lideres: lideres,
      todos: valores,
      soma: soma,
      formatado: lideres.length ? fmtMetrica(m, lideres[0].valor) : '',
    };
  });

  const geral = vends
    .map(v => ({
      vendedor: v,
      vitorias: vitorias[v],
      pontos: pesoEmJogo ? (100 * pontos[v] / pesoEmJogo) : 0,
    }))
    .sort((a,b) => b.pontos - a.pontos);

  // Empate ocupa o mesmo lugar (1º, 1º, 3º...). Duas pessoas só empatam de
  // verdade quando a diferença é menor que meio décimo de ponto.
  const mesmoPonto = (a,b) => Math.abs(a - b) < 0.05;
  let pos = 0;
  geral.forEach(function(g, idx){
    if(idx === 0 || !mesmoPonto(g.pontos, geral[idx-1].pontos)) pos = idx + 1;
    g.posicao = pos;
  });
  const campeoes = geral.filter(g => g.pontos > 0 && mesmoPonto(g.pontos, geral[0].pontos));
  return { porMetrica, geral, campeoes, pesoEmJogo };
}

function fmtPontos(v){
  return (Number(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1});
}

/* ---------------- Painel da Equipe: gráficos em SVG ---------------- */

function graficoBarrasPainel(dados, opts){
  const w = 760, h = (opts && opts.h) || 240, padBottom = 30, padTop = 12, padLeft = 44, gap = 18;
  const max = Math.max(1, ...dados.map(d => d.valor));
  const plotH = h - padBottom - padTop;
  const plotW = w - padLeft - 12;
  const barW = Math.min(70, (plotW / Math.max(dados.length,1)) - gap);
  const grade = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padTop + plotH - f*plotH;
    return `<line x1="${padLeft}" y1="${y}" x2="${w-12}" y2="${y}" stroke="#F1F5F9" stroke-width="1"/>
            <text x="${padLeft-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#94A3B8">${Math.round(max*f).toLocaleString('pt-BR')}</text>`;
  }).join('');
  const barras = dados.map((d,i) => {
    const bh = max > 0 ? (d.valor/max)*plotH : 0;
    const x = padLeft + (plotW/dados.length)*i + (plotW/dados.length - barW)/2;
    const y = padTop + plotH - bh;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(bh,1)}" rx="5" fill="${esc(corDoVendedor(d.vendedor))}"><title>${esc(d.vendedor)}: ${d.valor.toLocaleString('pt-BR')}</title></rect>
            <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">${d.valor ? d.valor.toLocaleString('pt-BR') : ''}</text>
            <text x="${x+barW/2}" y="${h-10}" text-anchor="middle" font-size="11" fill="#64748B">${esc(d.vendedor)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;overflow:visible;">${grade}${barras}</svg>`;
}

function graficoLinhaPainel(vends, opts){
  const w = 760, h = (opts && opts.h) || 260, padBottom = 28, padTop = 12, padLeft = 44;
  const plotH = h - padBottom - padTop;
  const plotW = w - padLeft - 12;
  const serie = v => MONTHS.map(m => valorMetrica(v, m, painelMetricaFoco));
  const todos = vends.flatMap(serie);
  const max = Math.max(1, ...todos);
  const px = i => padLeft + (plotW/11)*i;
  const py = val => padTop + plotH - (val/max)*plotH;
  const grade = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padTop + plotH - f*plotH;
    return `<line x1="${padLeft}" y1="${y}" x2="${w-12}" y2="${y}" stroke="#F1F5F9" stroke-width="1"/>
            <text x="${padLeft-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#94A3B8">${Math.round(max*f).toLocaleString('pt-BR')}</text>`;
  }).join('');
  const rotulos = MONTHS.map((m,i) =>
    `<text x="${px(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#94A3B8">${monthNumber(m)}</text>`).join('');
  const linhas = vends.map(v => {
    const vals = serie(v);
    const pontos = vals.map((val,i) => `${px(i)},${py(val)}`).join(' ');
    const cor = esc(corDoVendedor(v));
    const bolinhas = vals.map((val,i) =>
      `<circle cx="${px(i)}" cy="${py(val)}" r="2.5" fill="${cor}"><title>${esc(v)} · ${MONTHS[i]}: ${val.toLocaleString('pt-BR')}</title></circle>`).join('');
    return `<polyline points="${pontos}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round"/>${bolinhas}`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;overflow:visible;">${grade}${rotulos}${linhas}</svg>`;
}

/* Gráfico de evolução do Marketing: barras agrupadas por mês (Open e
   Foco Tributário lado a lado), 12 meses do ano do filtro. Era um
   gráfico de linha, mas com só 1 ou 2 meses lançados a linha virava um
   traço fino sem contexto nenhum. Barra lê mais fácil quando o ano
   ainda tem poucos meses preenchidos — cada mês é a própria barra, sem
   precisar de dois pontos pra "formar linha". Mês sem lançamento
   simplesmente não tem barra ali (não é barra de altura zero — é
   ausência mesmo). */
function graficoBarrasMarketing(series, opts){
  const w = 760, h = (opts && opts.h) || 260, padBottom = 28, padTop = 12, padLeft = 44;
  const plotH = h - padBottom - padTop;
  const plotW = w - padLeft - 12;
  const todos = series.flatMap(function(s){ return s.valores.filter(function(v){ return v !== null && v !== undefined; }); });
  const max = Math.max(1, ...todos);
  const grupoW = plotW / 12;
  const barW = Math.min(20, (grupoW - 8) / Math.max(series.length,1));
  const grade = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padTop + plotH - f*plotH;
    return `<line x1="${padLeft}" y1="${y}" x2="${w-12}" y2="${y}" stroke="#F1F5F9" stroke-width="1"/>
            <text x="${padLeft-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#94A3B8">${Math.round(max*f).toLocaleString('pt-BR')}</text>`;
  }).join('');
  const rotulos = MONTHS.map((m,i) =>
    `<text x="${padLeft + grupoW*i + grupoW/2}" y="${h-8}" text-anchor="middle" font-size="10" fill="#94A3B8">${monthNumber(m)}</text>`).join('');
  const barras = MONTHS.map(function(m, i){
    const gx = padLeft + grupoW*i + (grupoW - barW*series.length)/2;
    return series.map(function(s, si){
      const val = s.valores[i];
      if(val === null || val === undefined) return '';
      const bh = max > 0 ? Math.max((val/max)*plotH, 1) : 1;
      const x = gx + si*barW;
      const y = padTop + plotH - bh;
      return `<rect x="${x}" y="${y}" width="${Math.max(barW-3,1)}" height="${bh}" rx="3" fill="${esc(s.cor)}"><title>${esc(s.label)} · ${m}: ${val.toLocaleString('pt-BR')}</title></rect>`;
    }).join('');
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;overflow:visible;">${grade}${rotulos}${barras}</svg>`;
}

/* Painel de empresas novas de uma pessoa, no ano aberto. É a lista que dá
   nome ao número "contratos assinados": quais empresas entraram e se o
   negócio valeu a pena. Vai em largura total, embaixo dos quadros — a
   tabela não caberia na coluna estreita da direita. */
function painelEmpresasNovas(pessoa, slugPessoa){
  const lista = contratosNovosDe(pessoa);
  const editavel = isAdmin;
  const rent     = lista.filter(function(c){ return c.rentavel === true;  }).length;
  const naoRent  = lista.filter(function(c){ return c.rentavel === false; }).length;
  const semAval  = lista.length - rent - naoRent;

  const linhas = lista.map(function(c){
    const avisoCnpj = (cnpjDigitos(c.cnpj) && !cnpjValido(c.cnpj)) ? 'CNPJ incompleto' : '';
    return `<tr>
      <td class="col-mes">${editavel
        ? `<select class="contrato-linha-select" onchange="setContratoNovoMes(this,${c.id})">${
            MONTHS.map(function(m){ return `<option value="${m}" ${c.mes===m?'selected':''}>${monthShort(m)}</option>`; }).join('')
          }</select>`
        : esc(monthShort(c.mes))}</td>
      <td class="col-nome">${editavel
        ? `<input class="contrato-linha-input" id="contrato-emp-${c.id}" type="text" placeholder="Nome da empresa"
                  value="${esc(c.empresa)}" oninput="onContratoNovoTexto(this,${c.id},'empresa')" />`
        : esc(c.empresa || '—')}</td>
      <td class="col-cnpj">${editavel
        ? `<input class="contrato-linha-input" type="text" inputmode="numeric" placeholder="00.000.000/0000-00"
                  value="${esc(formatCnpj(c.cnpj))}" oninput="onContratoNovoTexto(this,${c.id},'cnpj')" />
           <span class="contrato-cnpj-aviso" id="contrato-cnpj-aviso-${c.id}">${esc(avisoCnpj)}</span>`
        : esc(formatCnpj(c.cnpj) || '—')}</td>
      <td class="col-rent">
        <div class="rent-toggle">
          <button type="button" class="rent-btn sim${c.rentavel===true?' on':''}" ${editavel?'':'disabled'}
                  title="O negócio valeu a pena" onclick="setContratoRentavel(${c.id},true)">Rentável</button>
          <button type="button" class="rent-btn nao${c.rentavel===false?' on':''}" ${editavel?'':'disabled'}
                  title="O negócio não valeu a pena" onclick="setContratoRentavel(${c.id},false)">Não rentável</button>
        </div>
      </td>
      ${editavel ? `<td class="del-cell"><div class="row-actions">
        <button class="action-btn danger" title="Excluir esta empresa" onclick="excluirContratoNovo(${c.id})">✕</button>
      </div></td>` : ''}
    </tr>`;
  }).join('');

  const tabela = lista.length ? `
    <div class="table-scroll">
      <table class="table-plain">
        <thead><tr>
          <th class="col-mes">Mês</th>
          <th class="col-nome">Empresa</th>
          <th class="col-cnpj">CNPJ</th>
          <th class="col-rent">O negócio foi</th>
          ${editavel ? '<th></th>' : ''}
        </tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>
    <div class="contrato-resumo">
      <span>${lista.length} empresa${lista.length===1?'':'s'} em ${yearFilter}:</span>
      <span class="contrato-tag sim">${rent} rentáve${rent===1?'l':'is'}</span>
      <span class="contrato-tag nao">${naoRent} não rentáve${naoRent===1?'l':'is'}</span>
      ${semAval ? `<span class="contrato-tag aval">${semAval} sem avaliação</span>` : ''}
    </div>`
    : `<div class="meta-empty" style="padding:22px 16px;">Nenhuma empresa cadastrada para ${esc(pessoa)} em ${yearFilter}.</div>`;

  // Conferência: o número digitado em "contratos assinados" e a quantidade
  // de empresas cadastradas deveriam bater. Quando não batem, avisa — sem
  // corrigir nada sozinho, porque só ela sabe qual dos dois está certo.
  let nota = '';
  if(editavel){
    const divergentes = MONTHS.map(function(m){
      const lancado = valorMetrica(pessoa, m, 'contratos') || 0;
      const cadastradas = lista.filter(function(c){ return c.mes === m; }).length;
      return { mes:m, lancado:lancado, cadastradas:cadastradas };
    }).filter(function(d){ return (d.lancado || d.cadastradas) && d.lancado !== d.cadastradas; });
    if(divergentes.length){
      const itens = divergentes.map(function(d){
        const faltam = d.lancado - d.cadastradas;
        // Num só <span>: o li é flex, e deixar o <b> solto abriria o gap
        // entre o nome do mês e os dois-pontos ("Julho  : 2 lançados").
        const texto = `<span><b>${esc(d.mes)}</b>: ${d.lancado} lançado${d.lancado===1?'':'s'}, ${d.cadastradas} cadastrada${d.cadastradas===1?'':'s'}</span>`;
        // Faltando empresa, o aviso oferece o atalho. Sobrando, não há o
        // que oferecer: ou o número digitado está errado, ou há linha a mais.
        const acao = faltam > 0
          ? `<button type="button" class="contrato-nota-btn"
                     title="Cria ${faltam} linha${faltam===1?'':'s'} em branco em ${esc(d.mes)} para você preencher os nomes"
                     onclick="cadastrarContratosFaltantes('${escJs(pessoa)}','${escJs(d.mes)}',${faltam})"
             >+ cadastrar ${faltam} que falta${faltam===1?'':'m'}</button>`
          : '';
        return `<li>${texto}${acao}</li>`;
      }).join('');
      nota = `<div class="contrato-nota">
        <div>⚖️ Confira: o número de <b>contratos assinados</b> não bate com as empresas cadastradas.</div>
        <ul class="contrato-nota-lista">${itens}</ul>
      </div>`;
    }
  }

  const botao = editavel ? `<div class="contrato-add">
    <button class="modal-btn modal-btn-ghost" style="width:100%;" onclick="addContratoNovo('${escJs(pessoa)}')">+ Empresa com contrato assinado</button>
  </div>` : '';

  // Baixar a relação (nome + CNPJ) é pedido o tempo todo — some quando não
  // há nada para baixar, pra não oferecer um arquivo vazio.
  const baixar = lista.length
    ? `<button type="button" class="eye-toggle" title="Baixa a lista de empresas com nome, CNPJ e avaliação, para abrir no Excel"
               onclick="exportarEmpresasContratoCSV('${escJs(pessoa)}')">📊 Baixar lista (CSV)</button>`
    : '';

  return panel('painel-empresas-' + slugPessoa, 'Empresas com contrato assinado — ' + esc(pessoa),
    tabela + nota + botao, {
      meta: `<b>${lista.length}</b> empresa${lista.length===1?'':'s'} · <b>${rent}</b> rentáve${rent===1?'l':'is'}`,
      actions: baixar,
      flush: true,
    });
}


/* Aba "Renovações": empresas que estão renovando o sistema, quem cuidou de
   cada uma e o desfecho. Não entra no ranking — renovar não é vender. */
function renderPainelRenovacoes(){
  const pessoas = pessoasDeRenovacao();
  const editavel = isAdmin;
  /* O recorte de mês e busca vem ANTES dos cartões: quando ela filtra
     Janeiro, os números do topo têm que ser os de Janeiro, senão o painel
     diz uma coisa e a tabela mostra outra. */
  const doAno = renovacoesDoAno();
  const busca = semAcento(renovacaoBusca);
  const todas = doAno.filter(function(r){
    if(renovacaoMes !== 'Todos' && r.mes !== renovacaoMes) return false;
    if(busca && semAcento(r.empresa).indexOf(busca) === -1) return false;
    return true;
  });
  const recortado = renovacaoMes !== 'Todos' || !!busca;
  const prontas = renovacoesProntasParaSistema(renovacaoMes).length;

  /* Upgrade também é cliente que ficou: entra em "renovadas" para a taxa
     de renovação não registrar como perda uma conta que na verdade cresceu.
     O cartão separado mostra quanto ela cresceu. */
  const renovadas   = todas.filter(function(r){ return r.renovado === true; });
  const upgrades    = todas.filter(function(r){ return !!r.upgrade; });
  const perdidas    = todas.filter(function(r){ return r.renovado === false; });
  const emAberto    = todas.filter(function(r){ return r.renovado === null || r.renovado === undefined; });
  const decididas   = renovadas.length + perdidas.length;
  const taxa        = decididas ? Math.round(1000 * renovadas.length / decididas) / 10 : null;
  const somaValor   = function(l){ return l.reduce(function(a,r){ return a + valorDeRenovacao(r); }, 0); };
  const ganhoUp     = upgrades.reduce(function(a,r){ return a + ganhoDeUpgrade(r); }, 0);

  const lista = todas.filter(function(r){
    if(renovacaoFiltro === 'Renovado') return r.renovado === true && !r.upgrade;
    if(renovacaoFiltro === 'Upgrade')  return !!r.upgrade;
    if(renovacaoFiltro === 'Nao')      return r.renovado === false;
    if(renovacaoFiltro === 'Aberto')   return r.renovado === null || r.renovado === undefined;
    return true;
  });

  const editor = (editavel && renovacaoEditandoPessoas) ? panel('painel-renov-quem', 'Quem cuida das renovações', `
    <div class="painel-equipe-nota">
      Marque quem trata as renovações. Só quem estiver aqui aparece na coluna “Responsável”.
      Desmarcar alguém não apaga as renovações que já estão no nome dela.
    </div>
    <div class="painel-equipe-lista">
      ${pessoasConhecidas().map(function(n){
        const on = pessoas.some(function(v){ return name_matches_client(v, n); });
        return `<label class="painel-equipe-item${on?' on':''}">
          <input type="checkbox" ${on?'checked':''} onchange="togglePessoaRenovacao('${escJs(n)}')" />
          <span>${esc(n)}</span>
        </label>`;
      }).join('')}
    </div>
  `) : '';

  const opcoesPessoa = function(atual){
    const nomes = pessoas.slice();
    if(atual && !nomes.some(function(v){ return name_matches_client(v, atual); })) nomes.push(atual);
    return `<option value="">—</option>` + nomes.map(function(n){
      return `<option value="${esc(n)}" ${atual===n?'selected':''}>${esc(n)}</option>`;
    }).join('');
  };

  const linhas = lista.map(function(r){
    const semDados = !r.empresa || !r.pessoa;
    return `<tr class="${semDados ? 'row-pending' : ''}">
      <td class="col-mes">${editavel
        ? `<select class="contrato-linha-select" onchange="setRenovacaoCampo(this,${r.id},'mes')">${
            MONTHS.map(function(m){ return `<option value="${m}" ${r.mes===m?'selected':''}>${monthShort(m)}</option>`; }).join('')
          }</select>`
        : esc(monthShort(r.mes))}</td>
      <td class="col-nome">${editavel
        ? `<input class="contrato-linha-input" id="renov-emp-${r.id}" type="text" placeholder="Nome da empresa"
                  value="${esc(r.empresa)}" oninput="onRenovacaoTexto(this,${r.id})" />`
        : esc(r.empresa || '—')}${r.vendaId ? `<button class="selo-sistema${destinoDaRenovacao(r)==='publicos'?' selo-publicos':''}"
                title="Já lançada na aba ${esc(NOME_DA_ABA_DESTINO[destinoDaRenovacao(r)])} — clique para ver"
                onclick="irParaVendaDaRenovacao(${r.id})">${destinoDaRenovacao(r)==='publicos'?'em Órgãos Públicos':'no Sistema'}</button>` : ''}</td>
      <td class="col-valor col-valor-larga">${editavel
        ? `<div class="currency-wrap"><span class="currency-prefix">R$</span><input class="num contrato-linha-input" type="number" step="0.01" placeholder="—"
                  value="${r.valor===null||r.valor===undefined?'':r.valor}" oninput="onRenovacaoValor(this,${r.id})" /></div>`
        : (r.valor === null || r.valor === undefined ? '—' : fmtMoney(r.valor))}${
          r.upgrade ? `<button class="upgrade-novo" title="Valor do plano novo — clique para corrigir" onclick="abrirUpgradeRenovacao(${r.id})">⬆ ${esc(fmtMoney(valorDeRenovacao(r)))}</button>` : ''}</td>
      <td class="col-resp">${editavel
        ? `<select class="contrato-linha-select" onchange="setRenovacaoCampo(this,${r.id},'pessoa')">${opcoesPessoa(r.pessoa)}</select>`
        : esc(r.pessoa || '—')}</td>
      <td class="col-rent">
        <div class="rent-toggle">
          <button type="button" class="rent-btn sim${(r.renovado===true && !r.upgrade)?' on':''}" ${editavel?'':'disabled'}
                  title="A empresa renovou o mesmo plano" onclick="setRenovacaoStatus(${r.id},true)">Renovado</button>
          <button type="button" class="rent-btn up${r.upgrade?' on':''}" ${editavel?'':'disabled'}
                  title="O cliente ficou e migrou para um plano maior — pede o valor novo" onclick="abrirUpgradeRenovacao(${r.id})">Upgrade</button>
          <button type="button" class="rent-btn nao${r.renovado===false?' on':''}" ${editavel?'':'disabled'}
                  title="A empresa não renovou" onclick="setRenovacaoStatus(${r.id},false)">Não renovado</button>
        </div>
      </td>
      ${editavel ? `<td class="del-cell"><div class="row-actions">
        <button class="action-btn danger" title="Excluir" onclick="excluirRenovacao(${r.id})">✕</button>
      </div></td>` : ''}
    </tr>`;
  }).join('');

  const pillsMes = ['Todos'].concat(MONTHS).map(function(m){
    const n = m === 'Todos' ? doAno.length : doAno.filter(function(r){ return r.mes === m; }).length;
    return `<button class="pill${renovacaoMes===m?' active':''}" onclick="setRenovacaoMes('${m}')">${m === 'Todos' ? 'Todos' : m}${n ? ' · '+n : ''}</button>`;
  }).join('');

  const filtros = [
    {k:'Todos',    rot:'Todas',        n: todas.length},
    {k:'Renovado', rot:'Renovadas',    n: renovadas.length - upgrades.length},
    {k:'Upgrade',  rot:'Upgrades',     n: upgrades.length},
    {k:'Nao',      rot:'Não renovadas',n: perdidas.length},
    {k:'Aberto',   rot:'Em aberto',    n: emAberto.length},
  ].map(function(f){
    return `<button class="pill seller-pill${renovacaoFiltro===f.k?' active':''}" onclick="setRenovacaoFiltro('${f.k}')">${f.rot} · ${f.n}</button>`;
  }).join('');

  const cartoes = `
    <div class="kpis">
      <div class="kpi-card" style="--kc:#15803D">
        <div class="kpi-label"><span class="kpi-dot"></span>Renovadas</div>
        <div class="kpi-value">${renovadas.length}</div>
        <div class="kpi-sub" id="renov-kpi-sim" data-sufixo="${upgrades.length ? ' · ' + upgrades.length + ' com upgrade' : ''}">${fmtMoney(somaValor(renovadas))}${upgrades.length ? ' · ' + upgrades.length + ' com upgrade' : ''}</div>
      </div>
      ${upgrades.length ? `
      <div class="kpi-card" style="--kc:#B45309">
        <div class="kpi-label"><span class="kpi-dot"></span>Upgrades</div>
        <div class="kpi-value">${upgrades.length}</div>
        <div class="kpi-sub">${ganhoUp >= 0 ? '+' : ''}${fmtMoney(ganhoUp)} de aumento</div>
      </div>` : ''}
      <div class="kpi-card" style="--kc:var(--danger)">
        <div class="kpi-label"><span class="kpi-dot"></span>Não renovadas</div>
        <div class="kpi-value">${perdidas.length}</div>
        <div class="kpi-sub" id="renov-kpi-nao" data-sufixo=" perdidos">${fmtMoney(somaValor(perdidas))} perdidos</div>
      </div>
      <div class="kpi-card" style="--kc:var(--ink-faint)">
        <div class="kpi-label"><span class="kpi-dot"></span>Em aberto</div>
        <div class="kpi-value">${emAberto.length}</div>
        <div class="kpi-sub" id="renov-kpi-aberto" data-sufixo=" em jogo">${fmtMoney(somaValor(emAberto))} em jogo</div>
      </div>
      <div class="kpi-card total">
        <div class="kpi-label">Taxa de renovação</div>
        <div class="kpi-value">${taxa === null ? '—' : taxa.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%'}</div>
        <div class="kpi-sub" id="renov-kpi-total" data-sufixo=" ${esc(rotuloRenovacao())}">${fmtMoney(somaValor(todas))} ${esc(rotuloRenovacao())}</div>
      </div>
    </div>`;

  const porPessoa = pessoas.map(function(v){
    const minhas = todas.filter(function(r){ return name_matches_client(r.pessoa, v); });
    const ok  = minhas.filter(function(r){ return r.renovado === true; }).length;
    const up  = minhas.filter(function(r){ return !!r.upgrade; }).length;
    const nao = minhas.filter(function(r){ return r.renovado === false; }).length;
    const ab  = minhas.length - ok - nao;
    return `<tr>
      <td><span class="th-dot" style="background:${esc(corDoVendedor(v))}"></span>${esc(v)}</td>
      <td class="num">${minhas.length}</td>
      <td class="num">${fmtMoney(minhas.reduce(function(a,r){ return a + valorDeRenovacao(r); }, 0))}</td>
      <td class="num">${ok}${up ? ` <span class="col-apoio">(${up} up)</span>` : ''}</td>
      <td class="num">${nao}</td>
      <td class="num col-apoio">${ab}</td>
      <td class="num">${(ok+nao) ? (Math.round(1000*ok/(ok+nao))/10).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%' : '—'}</td>
    </tr>`;
  }).join('');

  const tabela = panel('painel-renovacoes', 'Empresas em renovação', `
    ${lista.length ? `
    <div class="table-scroll">
      <table class="table-plain">
        <thead><tr>
          <th class="col-mes">Mês</th>
          <th class="col-nome">Empresa</th>
          <th class="num col-valor col-valor-larga" title="Valor do contrato">Valor</th>
          <th class="col-resp">Responsável</th>
          <th class="col-rent">Situação</th>
          ${editavel ? '<th></th>' : ''}
        </tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>`
    : `<div class="meta-empty" style="padding:22px 16px;">${
         doAno.length ? 'Nenhuma empresa nesse filtro.' : 'Nenhuma empresa em renovação lançada em ' + yearFilter + '.'
       }</div>`}
    <div class="totais-nota">
      Cada linha é uma empresa que está renovando o sistema. A situação começa <b>em aberto</b> e recebe
      <b>Renovado</b>, <b>Upgrade</b> ou <b>Não renovado</b> quando se sabe o desfecho — clicar de novo no botão aceso volta para em aberto.
      <b>Upgrade</b> é o cliente que ficou mas migrou para um plano maior: ele pede o <b>valor do plano novo</b>,
      conta como renovação na taxa (o cliente não saiu) e, ao ir para o Sistema, é o único que <b>entra no ranking</b> —
      subir o plano de um cliente é venda, renovar o mesmo plano não é.
      A <b>taxa de renovação</b> só conta as decididas, então as em aberto não puxam o número para baixo.
      Esta lista sozinha <b>não entra</b> no ranking nem nos totais de venda. Quando você usa
      <b>“Lançar no Sistema”</b>, as renovadas viram venda do mês na aba Sistema, no nome de quem renovou —
      e aí sim entram nas comissões e no desempenho. A etiqueta <b>“no Sistema”</b> marca as que já foram.
    </div>
    ${editavel ? `<div class="contrato-add">
      <button class="modal-btn modal-btn-ghost" style="width:100%;" onclick="addRenovacao()">+ Empresa em renovação</button>
    </div>` : ''}
  `, {
    flush: true,
    meta: `<b>${todas.length}</b> empresa${todas.length===1?'':'s'} ${esc(rotuloRenovacao())}${recortado ? ` <span class="col-apoio">de ${doAno.length} no ano</span>` : ''}`,
    actions: editavel ? `${prontas ? `<button class="eye-toggle" onclick="abrirLancarNoSistema()">📤 Lançar ${prontas} no Sistema</button>` : ''}${(doAno.length || contratosNovosParaCarteira(yearFilter, yearFilter+1).length) ? `<button class="eye-toggle" title="Traz as renovações do ano e os contratos novos marcados com ✨, que vencem no ano seguinte" onclick="repetirCarteiraNoProximoAno()">📅 Montar carteira de ${yearFilter+1}</button>` : ''}<button class="btn-add" onclick="abrirImportarRenovacoes()">📄 Importar planilha</button>` : '',
  });

  const resumo = pessoas.length ? panel('painel-renov-pessoas', 'Por responsável', `
    <div class="table-scroll">
      <table class="table-plain">
        <thead><tr>
          <th>Responsável</th>
          <th class="num">Empresas</th>
          <th class="num">Valor</th>
          <th class="num">Renovadas</th>
          <th class="num">Não renovadas</th>
          <th class="num col-apoio">Em aberto</th>
          <th class="num">Taxa</th>
        </tr></thead>
        <tbody>${porPessoa}</tbody>
      </table>
    </div>
  `, { flush: true, meta: esc(rotuloRenovacao()) }) : '';

  /* O lembrete que ela pediu: ao abrir um ano, o sistema mostra sozinho o
     que ficou para trás — as renovações e os contratos novos do ano
     anterior que ainda não entraram nesta carteira. Não depende de ninguém
     lembrar de apertar botão em janeiro. */
  const faltamRenov = editavel ? renovacoesParaCarteira(yearFilter - 1, yearFilter).length : 0;
  const faltamNovos = editavel ? contratosNovosParaCarteira(yearFilter - 1, yearFilter).length : 0;
  const lembrete = (faltamRenov + faltamNovos) ? `
    <div class="storage-warning aviso-resp">
      🔔 Faltam na carteira de <b>${yearFilter}</b>:
      ${[faltamNovos ? `<b>${faltamNovos}</b> contrato${faltamNovos===1?'':'s'} novo${faltamNovos===1?'':'s'} de ${yearFilter-1}` : '',
         faltamRenov ? `<b>${faltamRenov}</b> renovaç${faltamRenov===1?'ão':'ões'} de ${yearFilter-1}` : ''].filter(Boolean).join(' e ')}.
      O que foi contrato novo num ano vence no seguinte — é renovação de ${yearFilter}.
      <button class="modal-btn modal-btn-ghost" style="margin-left:10px;padding:6px 12px;" onclick="trazerAnoAnterior()">Trazer para ${yearFilter}</button>
    </div>` : '';

  return `
    <div class="painel-topo-sub">
      ${editavel ? `<button class="eye-toggle" onclick="setRenovacaoEditandoPessoas(${renovacaoEditandoPessoas?'false':'true'})">${renovacaoEditandoPessoas?'✕ Fechar':'👤 Quem cuida das renovações'}</button>` : ''}
    </div>
    ${editor}
    ${lembrete}
    ${cartoes}
    <div class="filters-row">
      <div class="months">${pillsMes}</div>
    </div>
    <div class="filters-row">
      <div class="months seller-filter">${filtros}</div>
    </div>
    <div class="search-row">
      <input id="busca-renovacao" class="search-input" type="text" placeholder="🔍 Buscar empresa..."
             value="${esc(renovacaoBusca)}" oninput="onRenovacaoBusca(this)" />
    </div>
    ${tabela}
    ${resumo}
  `;
}

function setPainelContratoMesDireto(mes){ painelContratoMes = mes; carregarFormContratos(); render(); }

function renderPainelLancamento(vends){
  const jaExiste = !!getRelatorio(painelVendedor, painelMes);

  const chips = vends.map(v => `
    <button class="painel-chip${name_matches_client(v,painelVendedor)?' active':''}"
            style="--vc:${esc(corDoVendedor(v))}" onclick="setPainelVendedor('${escJs(v)}')">${esc(v)}</button>
  `).join('');

  const campos = METRICAS_MANUAIS.map(m => `
    <label class="painel-campo">
      <span>${esc(m.label)}</span>
      <input type="number" min="0" step="1" inputmode="numeric" placeholder="0"
             value="${esc(painelForm[m.key] ?? '')}" oninput="onPainelFormInput(this,'${m.key}')" />
    </label>
  `).join('');

  // Os indicadores de venda não são digitados: saem dos lançamentos.
  const calculados = `
    <div class="painel-calc">
      <div class="painel-calc-tit">Vem dos lançamentos — não precisa digitar</div>
      ${METRICAS.filter(m => m.auto).map(m => `
        <div class="painel-calc-linha">
          <span>${esc(m.label)}</span>
          <b>${fmtMetrica(m, valorMetrica(painelVendedor, painelMes, m.key))}</b>
        </div>
      `).join('')}
      <div class="painel-calc-nota">Calculado a partir das abas Sistema e Cursos, para ${esc(painelVendedor)} em ${esc(painelMes)}.</div>
    </div>`;

  const formulario = panel('painel-form', 'Lançar mês', `
    <label class="painel-campo"><span>Vendedora</span></label>
    <div class="painel-chips">${chips}</div>
    <label class="painel-campo">
      <span>Mês</span>
      <select onchange="setPainelMes(this)">
        ${MONTHS.map(m => `<option value="${m}" ${painelMes===m?'selected':''}>${m} de ${yearFilter}</option>`).join('')}
      </select>
    </label>
    <div class="painel-campos">${campos}</div>
    ${calculados}
    <button class="painel-salvar" onclick="salvarPainelLancamento()">
      ${jaExiste ? 'Atualizar lançamento' : 'Salvar lançamento'}
    </button>
  `, { meta: jaExiste ? '<span class="meta-tag ok">mês já lançado</span>' : '' });

  const listas = vends.map(v => {
    const meses = mesesLancados(v);
    const corpo = meses.length === 0
      ? `<div class="meta-empty" style="padding:10px 16px 14px;">Nenhum mês lançado ainda para ${esc(v)}.</div>`
      : `<div class="table-scroll">
          <table class="table-plain">
            <thead>
              <tr>
                <th>Mês</th>
                <th class="num">Reuniões</th>
                <th class="num">Sistemas</th>
                <th class="num">Qtd. sist.</th>
                <th class="num">Cursos</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${meses.map(r => `
                <tr>
                  <td>${esc(r.mes)}</td>
                  <td class="num">${valorMetrica(v, r.mes, 'reunioes').toLocaleString('pt-BR')}</td>
                  <td class="num">${fmtMoney(valorMetrica(v, r.mes, 'vendasSistemas'))}</td>
                  <td class="num">${valorMetrica(v, r.mes, 'qtdSistemas').toLocaleString('pt-BR')}</td>
                  <td class="num">${fmtMoney(valorMetrica(v, r.mes, 'vendasCursos'))}</td>
                  <td class="del-cell">
                    <div class="row-actions" style="opacity:1;">
                      <button class="action-btn" title="Editar este mês" onclick="editarPainelLancamento('${escJs(v)}','${escJs(r.mes)}')">✎</button>
                      <button class="action-btn danger" title="Excluir este mês" onclick="excluirPainelLancamento('${escJs(v)}','${escJs(r.mes)}')">✕</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    return panel('painel-lista-'+slug(v), esc(v), corpo, {
      flush: true,
      meta: `<b>${meses.length}</b> de 12 meses lançados`,
    });
  }).join('');

  return `<div class="painel-grid">
    <div class="painel-col-form">${formulario}</div>
    <div class="painel-col-listas">${listas}</div>
  </div>`;
}

function renderPainelDashboard(vends){
  const totais = totaisPorVendedorPainel();
  const metricaLabel = (METRICAS.find(m => m.key === painelMetricaFoco) || {}).label || '';
  const ehMes = painelPeriodo !== 'Ano';
  const doPeriodo = ehMes ? ('de ' + painelPeriodo) : ('de ' + yearFilter);

  // Um filtro só, valendo para todos os quadros do painel.
  const seletorPeriodo = `
    <div class="painel-periodo">
      <span>Período</span>
      <select onchange="setPainelPeriodo(this)">
        <option value="Ano" ${painelPeriodo==='Ano'?'selected':''}>Ano inteiro · ${yearFilter}</option>
        ${MONTHS.map(m => `<option value="${m}" ${painelPeriodo===m?'selected':''}>${m} de ${yearFilter}</option>`).join('')}
      </select>
      <b>${ehMes ? esc(painelPeriodo) : 'Ano inteiro'}</b>
    </div>`;

  const cartoes = panel('painel-cartoes', `Totais ${doPeriodo} por vendedora`, `
    <div class="kpis painel-kpis" style="margin:0;">
      ${vends.map(v => `
        <div class="kpi-card" style="--kc:${esc(corDoVendedor(v))}">
          <div class="kpi-label"><span class="kpi-dot"></span>${esc(v)}</div>
          <div class="painel-duplo">
            <div>
              <div class="painel-num">${fmtMoney(totais[v]?.vendasSistemas||0)}</div>
              <div class="painel-num-rot">em sistemas · ${(totais[v]?.qtdSistemas||0).toLocaleString('pt-BR')} venda${(totais[v]?.qtdSistemas||0)===1?'':'s'}</div>
            </div>
            <div>
              <div class="painel-num">${fmtMoney(totais[v]?.vendasPublicos||0)}</div>
              <div class="painel-num-rot">em órgãos públicos · ${(totais[v]?.qtdPublicos||0).toLocaleString('pt-BR')} venda${(totais[v]?.qtdPublicos||0)===1?'':'s'}</div>
            </div>
            <div>
              <div class="painel-num">${fmtMoney(totais[v]?.vendasCursos||0)}</div>
              <div class="painel-num-rot">em cursos</div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `);

  let ranking = '';
  {
    // "sem dados" tem que olhar os totais consolidados: um mês pode ter
    // venda registrada mesmo sem ninguém ter lançado os indicadores à mão.
    const semLancamento = vends.every(v => METRICAS.every(m => valorNoPeriodo(v, m.key) === 0));
    const rk = rankingDoMes(painelPeriodo);
    const corpo = semLancamento
      ? `<div class="meta-empty">Nenhum lançamento registrado em ${esc(rotuloPeriodo())} ainda.</div>`
      : `
        ${rk.campeoes.length ? `
        <div class="painel-melhor">
          <div class="painel-melhor-globo">${logoGloboSvg(150, '#ffffff')}</div>
          <div class="painel-melhor-esq">
            <div class="painel-melhor-rot">${rk.campeoes.length > 1 ? (ehMes ? 'Melhores do mês · empate' : 'Melhores do ano · empate') : (ehMes ? 'Melhor do mês' : 'Melhor do ano')}</div>
            <div class="painel-melhor-nome">${rk.campeoes.map(c => esc(c.vendedor)).join(' e ')}</div>

              <div class="rank-lider">

    ranking = panel('painel-ranking', ehMes ? ('Ranking de ' + painelPeriodo) : 'Ranking do ano', corpo, {

        <b>peso 0</b> tira o indicador da pontuação, mas ele continua aparecendo no painel.

        ${METRICAS.map(function(m){
          const peso = pesoDaMetrica(m.key);
          return `<label class="peso-item${peso===0?' zerado':''}">

  }

  const seletorMetrica = `<label class="ordem-wrap"><span>Indicador</span>
    <select onchange="setPainelMetricaFoco(this)">
      ${METRICAS.map(m => `<option value="${m.key}" ${painelMetricaFoco===m.key?'selected':''}>${esc(m.label)}</option>`).join('')}

  const barras = panel('painel-barras', 'Comparativo por indicador',
    graficoBarrasPainel(vends.map(v => ({vendedor: v, valor: totais[v]?.[painelMetricaFoco] || 0})))
    + `<div class="painel-nota">${esc(metricaLabel)} em ${esc(rotuloPeriodo())}.</div>`,
    { actions: seletorMetrica });

  const linha = panel('painel-linha', `Evolução mensal — ${esc(metricaLabel)}`,
    graficoLinhaPainel(vends)
    + `<div class="painel-nota">Este quadro mostra sempre os 12 meses de ${yearFilter} — é a linha do tempo, não muda com o período escolhido.</div>`
    + `<div class="painel-legenda">${vends.map(v => `
        <span><i style="background:${esc(corDoVendedor(v))}"></i>${esc(v)}</span>`).join('')}</div>`,
    {});

  const tabela = panel('painel-totais', ehMes ? ('Totais de ' + painelPeriodo + ' por indicador') : 'Totais anuais por indicador', `
    <div class="table-scroll">
      <table class="table-plain">
        <thead>
          <tr><th>Indicador</th>${vends.map(v => `<th class="num">${esc(v)}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${METRICAS.map(m => `
            <tr>
              <td>${esc(m.label)}</td>
