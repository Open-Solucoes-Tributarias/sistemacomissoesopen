function addEntityRow(key){
  const cfg = ENTITIES[key];
  const st = state[key];
  const mes = st.filter === "Todos" ? "Janeiro" : st.filter;
  if(isMonthClosed(yearFilter, mes)){
    showAlert("Este mês está fechado para novos lançamentos. Reabra em Resumo Geral para poder editar.");
    return;
  }
  const row = {id: st.nextId++, mes, ano: yearFilter, comissaoPercent:null, vendedor: st.vendorFilter!=="Todos" ? st.vendorFilter : "", comissaoPercent2:null, vendedor2:"", comissaoPercent3:null, vendedor3:""};
  if(cfg.hasPagamento){ row.pago = false; row.mesPagamento = null; }
  cfg.fields.forEach(f => { row[f.key] = f.type==="select" ? f.options[0] : (f.type==="number" ? null : ""); });
  st.rows.unshift(row);
  persistEntityRows(key);
  render();
}

function addExtraVendedorSlot(key, rowId){
  const r = state[key].rows.find(r => r.id === rowId);
  if(!r) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    return;
  }
  if(!Array.isArray(r.extraVendedores)) r.extraVendedores = [];
  r.extraVendedores.push({id: Date.now() + r.extraVendedores.length, vendedor:"", percent:null});
  persistEntityRows(key);
  render();
}

function removeExtraVendedorSlot(key, rowId, slotId){
  const r = state[key].rows.find(r => r.id === rowId);
  if(!r || !Array.isArray(r.extraVendedores)) return;
  r.extraVendedores = r.extraVendedores.filter(ev => ev.id !== slotId);
  persistEntityRows(key);
  render();
}

function updateExtraVendedorField(key, rowId, slotId, field, value){
  const r = state[key].rows.find(r => r.id === rowId);
  if(!r || !Array.isArray(r.extraVendedores)) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    render();
    return;
  }
  const ev = r.extraVendedores.find(e => e.id === slotId);
  if(!ev) return;
  ev[field] = value;
  persistEntityRows(key);
  render();
}

function deleteEntityRow(key, id){
  const r = state[key].rows.find(r => r.id === id);
  if(r && isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado. Reabra em Resumo Geral para poder excluir.");
    return;
  }
  showConfirm("Excluir este lançamento?", () => {
    state[key].rows = state[key].rows.filter(r => r.id !== id);
    persistEntityRows(key);
  });
}

function duplicateEntityRow(key, id){
  const st = state[key];
  const r = st.rows.find(r => r.id === id);
  if(!r) return;
  const copy = {...r, id: st.nextId++};
  st.rows.unshift(copy);
  persistEntityRows(key);
  render();
}

function parcelarEntityRow(key, id){
  const st = state[key];
  const r = st.rows.find(r => r.id === id);
  if(!r) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    return;
  }
  if(!r.valorContrato || Number(r.valorContrato) <= 0){
    showAlert("Preencha o Valor do Contrato antes de parcelar.");
    return;
  }
  showPrompt("Em quantas parcelas mensais? (2 a 24)", (val) => {
    const n = parseInt(val, 10);
    if(!n || n < 2 || n > 24){ showAlert("Digite um número de parcelas entre 2 e 24."); return; }
    const amounts = splitIntoInstallments(Number(r.valorContrato), n);
    const origMes = r.mes, origAno = r.ano||2026;
    r.valorContrato = amounts[0];
    r.parcelaLabel = `1/${n}`;
    for(let i=1;i<n;i++){
      const nm = nextMonthYear(origMes, origAno, i);
      const copy = {...r, id: st.nextId++, mes: nm.mes, ano: nm.ano, valorContrato: amounts[i],
                    extraVendedores: Array.isArray(r.extraVendedores) ? r.extraVendedores.map(ev => ({...ev})) : [],
                    parcelaLabel:`${i+1}/${n}`};
      if(cfg_hasPagamento(key)){ copy.pago = false; copy.mesPagamento = null; }
      st.rows.push(copy);
    }
    persistEntityRows(key);
  });
}
function cfg_hasPagamento(key){ return !!ENTITIES[key].hasPagamento; }

function repeatEntityRowForYear(key, id){
  const st = state[key];
  const r = st.rows.find(r => r.id === id);
  if(!r) return;
  const startIdx = MONTHS.indexOf(r.mes);
  if(startIdx === -1 || startIdx === MONTHS.length - 1){
    showAlert("Esse lançamento já está em Dezembro — não há meses seguintes pra repetir.");
    return;
  }
  const remainingMonths = MONTHS.slice(startIdx + 1);
  const mainField = ENTITIES[key].fields[0].key;
  const label = r[mainField] || "esse lançamento";
  showConfirm(
    `Repetir "${label}" para todos os meses restantes de ${r.ano} (${remainingMonths.join(', ')})? Meses que já tiverem um lançamento igual (mesmo ${ENTITIES[key].fields[0].label.toLowerCase()}) serão pulados.`,
    () => {
      remainingMonths.forEach(targetMonth => {
        const exists = st.rows.some(x => x.ano===r.ano && x.mes===targetMonth && (x[mainField]||"")===(r[mainField]||""));
        if(exists) return;
        const copy = {...r, id: st.nextId++, mes: targetMonth};
        st.rows.push(copy);
      });
      persistEntityRows(key);
    },
    "Repetir"
  );
}

function addEntityVendor(key){
  showPrompt("Nome do(a) vendedor(a):", (name) => {
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    const exists = state[key].vendors.some(v => v.toLowerCase() === trimmed.toLowerCase());
    if(exists){ showAlert("Esse vendedor já está na lista."); return; }
    state[key].vendors.push(trimmed);
    persistEntityVendors(key);
  });
}

function setEntityFilter(key, m){ state[key].filter = m; render(); }
function setEntityVendorFilter(el){ state[el.dataset.entity].vendorFilter = el.dataset.vendor; render(); }
function setEntityFieldFilter(key, fieldKey, value){ state[key].fieldFilters[fieldKey] = value; render(); }

function updateEntityCell(key, id, field, value){
  const r = state[key].rows.find(r => r.id === id);
  if(!r) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    render();
    return;
  }
  r[field] = value;
  persistEntityRows(key);
  if(field === "mes" || field === "vendedor" || field === "vendedor2" || field === "vendedor3" || field === "parceiro") render();
  else {
    updateEntitySummaries(key);
    if(field === "valorContrato" || field === "comissaoPercent" || field === "comissaoPercent2" || field === "comissaoPercent3" || field === "participacao"){
      updateEntityRowCalc(key, id);
    }
  }
}

function getEntityVisible(key){
  const st = state[key];
  let list = st.rows.filter(r => (r.ano||2026) === yearFilter);
  list = st.filter === "Todos" ? list : list.filter(r => r.mes === st.filter);
  if(st.vendorFilter !== "Todos"){
    list = list.filter(r => getRowSellerAssignments(r).some(a => a.vendedor === st.vendorFilter));
  }
  ENTITIES[key].fields.forEach(f => {
    if(f.type === "select" && st.fieldFilters[f.key] && st.fieldFilters[f.key] !== "Todos"){
      list = list.filter(r => r[f.key] === st.fieldFilters[f.key]);
    }
  });
  const mainField = ENTITIES[key].fields[0].key;
  if(st.search.main.trim()){
    const q = st.search.main.trim().toLowerCase();
    list = list.filter(r => (r[mainField]||"").toLowerCase().includes(q));
  }
  if(st.search.parceiro.trim()){
    const q = st.search.parceiro.trim().toLowerCase();
    list = list.filter(r => (r.parceiro||"").toLowerCase().includes(q));
  }
  if(st.search.colaborador.trim()){
    const q = st.search.colaborador.trim().toLowerCase();
    list = list.filter(r => (r.colaborador||"").toLowerCase().includes(q));
  }
  return list;
}
function onEntitySearchInput(el, key, field){
  const pos = el.selectionStart;
  const id = el.id;
  state[key].search[field] = el.value;
  render();
  const ne = document.getElementById(id);
  if(ne){ ne.focus(); try{ ne.setSelectionRange(pos,pos); }catch(e){} }
}

function entityRemainingAfterPartner(row){
  const valorContrato = Number(row.valorContrato)||0;
  if(!row.parceiro) return valorContrato;
  const partnerPct = parsePercent(row.participacao);
  return valorContrato - (valorContrato * (partnerPct/100));
}

function getRowSellerAssignments(r){
  const list = [];
  if(r.vendedor) list.push({vendedor: r.vendedor, percent: Number(r.comissaoPercent)||0});
  if(r.vendedor2) list.push({vendedor: r.vendedor2, percent: Number(r.comissaoPercent2)||0});
  if(r.vendedor3) list.push({vendedor: r.vendedor3, percent: Number(r.comissaoPercent3)||0});
  if(Array.isArray(r.extraVendedores)){
    r.extraVendedores.forEach(ev => {
      if(ev.vendedor) list.push({vendedor: ev.vendedor, percent: Number(ev.percent)||0});
    });
  }
  return list;
}

function computeEntityTotals(key, visible){
  const st = state[key];
  const t = {contrato:0, comissao:0, byVendor:{}};
  st.vendors.forEach(v => t.byVendor[v] = 0);
  visible.forEach(r => {
    const valorContrato = Number(r.valorContrato)||0;
    t.contrato += valorContrato;
    const baseAposParceiro = entityRemainingAfterPartner(r);
    getRowSellerAssignments(r).forEach(a => {
      const commission = baseAposParceiro * (a.percent/100);
      t.comissao += commission;
      if(t.byVendor[a.vendedor] === undefined) t.byVendor[a.vendedor] = 0;
      t.byVendor[a.vendedor] += commission;
    });
  });
  return t;
}

function entityRowCommission(r, slot){
  const base = entityRemainingAfterPartner(r);
  const pctField = slot === 3 ? 'comissaoPercent3' : (slot === 2 ? 'comissaoPercent2' : 'comissaoPercent');
  const pct = Number(r[pctField])||0;
  return base * (pct/100);
}

function updateEntityRowCalc(key, id){
  const r = state[key].rows.find(r => r.id === id);
  if(!r) return;
  const el1 = document.getElementById('calc1-'+key+'-'+id);
  if(el1) el1.textContent = fmtMoney(entityRowCommission(r, 1));
  const el2 = document.getElementById('calc2-'+key+'-'+id);
  if(el2) el2.textContent = fmtMoney(entityRowCommission(r, 2));
  const el3 = document.getElementById('calc3-'+key+'-'+id);
  if(el3) el3.textContent = fmtMoney(entityRowCommission(r, 3));
  const elP = document.getElementById('calcParceiro-'+key+'-'+id);
  if(elP) elP.textContent = fmtMoney((Number(r.valorContrato)||0) * (parsePercent(r.participacao)/100));
}

function updateEntitySummaries(key){
  const st = state[key];
  const visible = getEntityVisible(key);
  const totals = computeEntityTotals(key, visible);
  const visibleVendors = st.vendorFilter === "Todos" ? entityVendorsForCurrentUser(key) : [st.vendorFilter];
  visibleVendors.forEach(v => {
    const el = document.getElementById('kpi-'+key+'-'+slug(v));
    if(el) el.textContent = st.valuesRevealed ? fmtMoney(totals.byVendor[v]||0) : '••••••';
  });
  const totalEl = document.getElementById('kpi-'+key+'-total');
  if(totalEl) totalEl.textContent = fmtMoney(totals.contrato);
  const countEl = document.getElementById('count-'+key);
  if(countEl){
    countEl.innerHTML = `<b>${visible.length}</b> ${ENTITIES[key].itemLabel}${visible.length===1?"":"s"} ${st.filter!=="Todos" ? "em <b>"+esc(st.filter)+"</b>" : ""}`;
  }
}

          <div class="calc-value" id="calc2-${key}-${row.id}">${fmtMoney(entityRowCommission(row,2))}</div>
        </td>`;
        cells += `<td><select data-entity="${key}" data-id="${row.id}" data-field="vendedor2" onchange="onEntitySelectField(this)"><option value="">—</option>${entityVendorsForCurrentUser(key).map(v => `<option value="${esc(v)}" ${row.vendedor2===v?'selected':''}>${esc(v)}</option>`).join('')}</select></td>`;
        cells += `<td class="col-pct">
          <div class="pct-wrap"><input class="num" type="number" step="0.1" min="0" placeholder="0" value="${row.comissaoPercent3===null||row.comissaoPercent3===undefined?'':row.comissaoPercent3}" data-entity="${key}" data-id="${row.id}" data-field="comissaoPercent3" oninput="onEntityNumInput(this)" /><span class="pct-suffix">%</span></div>
          <div class="calc-value" id="calc3-${key}-${row.id}">${fmtMoney(entityRowCommission(row,3))}</div>
        </td>`;
        cells += `<td><select data-entity="${key}" data-id="${row.id}" data-field="vendedor3" onchange="onEntitySelectField(this)"><option value="">—</option>${entityVendorsForCurrentUser(key).map(v => `<option value="${esc(v)}" ${row.vendedor3===v?'selected':''}>${esc(v)}</option>`).join('')}</select></td>`;
        for(let i=0; i<maxExtra; i++){
          const ev = (row.extraVendedores||[])[i];
          const slotNum = 4+i;
          if(ev){
            const evValor = entityRemainingAfterPartner(row) * ((Number(ev.percent)||0)/100);
            cells += `<td class="col-pct">
              <div class="pct-wrap"><input class="num" type="number" step="0.1" min="0" placeholder="0" value="${ev.percent===null||ev.percent===undefined?'':ev.percent}" onchange="updateExtraVendedorField('${key}',${row.id},${ev.id},'percent',this.value===''?null:parseFloat(this.value))" /><span class="pct-suffix">%</span></div>
              <div class="calc-value">${fmtMoney(evValor)}</div>
            </td>`;
            cells += `<td>
              <div style="display:flex;align-items:center;gap:2px;">
                <select style="flex:1;" onchange="updateExtraVendedorField('${key}',${row.id},${ev.id},'vendedor',this.value)"><option value="">—</option>${entityVendorsForCurrentUser(key).map(v => `<option value="${esc(v)}" ${ev.vendedor===v?'selected':''}>${esc(v)}</option>`).join('')}</select>
                <button class="action-btn danger" title="Remover Vendedor ${slotNum}" onclick="removeExtraVendedorSlot('${key}',${row.id},${ev.id})">✕</button>
              </div>
            </td>`;
          } else {
            cells += `<td class="col-pct"><span class="pct-disabled">—</span></td><td><span class="pct-disabled">—</span></td>`;
          }
        }
        cells += `<td class="del-cell">
          <div class="row-actions">
            <button class="action-btn" title="Adicionar mais um vendedor" onclick="addExtraVendedorSlot('${key}',${row.id})">➕</button>
            <button class="action-btn" title="Duplicar" onclick="duplicateEntityRow('${key}',${row.id})">⎘</button>
            <button class="action-btn" title="Parcelar em vários meses" onclick="parcelarEntityRow('${key}',${row.id})">🧩</button>
            <button class="action-btn" title="Repetir até dezembro (assinatura mensal)" onclick="repeatEntityRowForYear('${key}',${row.id})">🔁</button>
            <button class="action-btn danger" title="Excluir" onclick="deleteEntityRow('${key}',${row.id})">✕</button>
          </div>
        </td>`;
        return `<tr class="${isEntityRowPending(row) ? 'row-pending' : ''}${isMonthClosed(row.ano||2026,row.mes) ? ' row-locked' : ''}${isEntityRowDuplicate(key,row) ? ' row-duplicate' : ''}">${cells}</tr>`;
      }).join('');

  return `
    ${kpiToggleHtml}
    <div class="kpis">${kpiCardsHtml}</div>

    <div class="filters-row">
      <div class="months">${pillsHtml}</div>
      <div class="months seller-filter">${vendorPillsHtml}</div>
    </div>

    ${fieldFilterRowsHtml}

    <div class="search-row">
      <input id="search-${key}-main" class="search-input" type="text" placeholder="🔍 Buscar ${cfg.fields[0].label.toLowerCase()}..." value="${esc(st.search.main)}" oninput="onEntitySearchInput(this,'${key}','main')" />
      <input id="search-${key}-parceiro" class="search-input" type="text" placeholder="🔍 Buscar parceiro..." value="${esc(st.search.parceiro)}" oninput="onEntitySearchInput(this,'${key}','parceiro')" />
      <input id="search-${key}-colaborador" class="search-input" type="text" placeholder="🔍 Buscar colaborador..." value="${esc(st.search.colaborador)}" oninput="onEntitySearchInput(this,'${key}','colaborador')" />
    </div>

    ${panel('entity-'+key, esc(cfg.tabLabel), `
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:58px">Mês</th>
              ${cfg.fields.map(f => `<th${f.key==='valorContrato'?' class="num col-valor"':(f.key==='participacao'?' class="num col-pct"':(f.type==='number'?' class="num"':''))}>${f.label}</th>${f.key==='formaPagamento'&&cfg.hasPagamento?'<th style="width:110px">Pagamento</th>':''}`).join('')}
              <th class="num">% Comissão</th>
              <th>Vendedor</th>
              <th class="num">% Comissão V2</th>
              <th>Vendedor 2</th>
              <th class="num">% Comissão V3</th>
              <th>Vendedor 3</th>
              ${Array.from({length:maxExtra}).map((_,i) => `<th class="num">% Comissão V${4+i}</th><th>Vendedor ${4+i}</th>`).join('')}
              <th></th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `, {
      flush: true,
      meta: `<span id="count-${key}"><b>${visible.length}</b> ${cfg.itemLabel}${visible.length===1?"":"s"}${st.filter!=="Todos" ? " em <b>"+esc(st.filter)+"</b>" : ""}${visible.filter(isEntityRowPending).length ? ` · <span style="color:#B45309;">⚠️ ${visible.filter(isEntityRowPending).length} incompleto${visible.filter(isEntityRowPending).length===1?'':'s'}</span>` : ''}${visible.filter(r=>isEntityRowDuplicate(key,r)).length ? ` · <span style="color:#6D28D9;">🔁 ${visible.filter(r=>isEntityRowDuplicate(key,r)).length} duplicado${visible.filter(r=>isEntityRowDuplicate(key,r)).length===1?'':'s'}</span>` : ''}</span>`,
      actions: `<div class="btn-row">
        <button class="btn-add btn-secondary" onclick="addEntityVendor('${key}')">+ Vendedor</button>
        <button class="btn-add" onclick="addEntityRow('${key}')">+ Novo lançamento</button>
      </div>`,
    })}
  `;
}

/* ---------------- App shell ---------------- */

function setTab(t){ activeTab = t; render(); }

function render(){
  const root = document.getElementById('root');
  if(!authSession){ renderAuthScreen(); return; }
  if(!initialDataLoaded){
    root.innerHTML = `<div class="app-loading"><div class="spinner"></div><div>Carregando seus dados...</div></div>`;
    return;
  }
  ensurePartnersIncludeCurrent();
  const sectionHtml = activeTab === "vendas" ? renderVendasSection()
    : activeTab === "parceiros" ? renderParceirosSection()
    : activeTab === "bonus" ? renderBonusSection()
    : activeTab === "pagamentos" ? renderPagamentosSection()
    : renderEntitySection(activeTab);

  const tabsHtml = TABS.map(t => {
    const active = t.key === activeTab ? ' active' : '';
    return `<button class="tab-btn${active}" onclick="setTab('${t.key}')">${t.label}</button>`;
  }).join('');

  const years = getKnownYears();
  const yearPillsHtml = years.map(y => {
    const active = y === yearFilter ? ' active' : '';
    return `<button class="pill year-pill${active}" onclick="setYearFilter(${y})">${y}</button>`;
  }).join('') + `<button class="pill year-pill year-add" onclick="addYear()">+ Ano</button>`;

  root.innerHTML = `
    <div class="wrap${isAdmin ? '' : ' read-only-mode'}">
      <div class="topbar">
        <div class="title-block">
          <div class="company-name">Open Soluções Tributárias</div>
          <h1>Comissões — Equipe Comercial</h1>
          <div class="sub">Controle mensal de vendas e comissões · ${yearFilter}</div>
        </div>
        <div class="topbar-actions">
          <button class="eye-toggle" onclick="showExport()" title="Copia todos os dados em texto, pra guardar ou levar pra outro navegador">⬇ Exportar dados</button>
          <button class="eye-toggle admin-only-btn" onclick="showImport()" title="Cola um texto exportado antes e restaura os dados">⬆ Importar dados</button>
          <button class="eye-toggle admin-only-btn" onclick="normalizeAllText()" title="Coloca Primeira Letra Maiúscula em todos os textos já lançados">Aa Normalizar textos</button>
          <button class="eye-toggle danger-toggle admin-only-btn" onclick="wipeAllData()" title="Apaga todos os lançamentos das três abas, mantendo produtos/vendedores/parceiros cadastrados">🗑 Zerar tudo</button>
          <div class="save-chip">
            <span id="save-dot" class="dot${saveError?' error':(saving?' saving':'')}"></span>
            <span id="save-label">${saveError?'erro ao salvar':(saving?'salvando':'salvo')}</span>
          </div>
          <div class="user-chip">
            <span title="Conectado como">${esc((authSession.user && authSession.user.email) || '')}</span>
            ${!isAdmin ? '<span class="read-only-badge" title="Você só vê e não edita os próprios lançamentos">somente leitura</span>' : ''}
            <button class="logout-btn" onclick="logout()" title="Sair da conta">Sair</button>
          </div>
        </div>
      </div>

      ${!isAdmin ? `
        <div class="storage-warning read-only-notice">
          👁 Modo somente leitura — você só vê os lançamentos relacionados a você${currentPersonName ? ` (<b>${esc(currentPersonName)}</b>)` : ''} e não pode editar. Pra lançar ou alterar algo, fale com a administração do sistema.
        </div>
      ` : ''}

      ${storageAvailable === false ? `
        <div class="storage-warning">
          ⚠️ Não foi possível conectar ao banco de dados agora — os lançamentos podem não estar sendo salvos nem sincronizados entre pessoas. Verifique sua internet e recarregue a página.
        </div>
      ` : ''}

      <div class="year-row">
        <span class="year-row-label">Ano:</span>
        <div class="months">${yearPillsHtml}</div>
      </div>

      <div class="tabs-nav">${tabsHtml}</div>

      ${sectionHtml}
    </div>
    ${renderModal()}
  `;
  if(!isAdmin){
    root.querySelectorAll('tbody td input, tbody td select, .meta-input-wrap input').forEach(function(el){ el.disabled = true; });
  }
}

function boot(){
  loadDataSync();
  checkStorageAvailability();
  const loaders = [
    loadCurrentUserAccess(),
    tryLoadFromStorageAsync(),
    tryLoadVendaProductsFromStorageAsync(),
    tryLoadSistemaSellersFromStorageAsync(),
    tryLoadPartnersFromStorageAsync(),
    tryLoadExtraYearsFromStorageAsync(),
    tryLoadEntityFromStorageAsync('consultoria'),
    tryLoadEntityFromStorageAsync('publicos'),
    tryLoadEntityFromStorageAsync('cursos'),
    tryLoadBonusFromStorageAsync(),
    tryLoadClosedMonthsFromStorageAsync(),
    tryLoadMetasFromStorageAsync(),
  ];
  Promise.allSettled(loaders).then(function(){
    initialDataLoaded = true;
    render();
  });
  render();
}

/* Link de recuperação de senha do Supabase volta com #access_token=...&type=recovery */
(function initAuth(){
  const hash = window.location.hash;
  if(hash && hash.length > 1){
    const params = new URLSearchParams(hash.slice(1));
    if(params.get('type') === 'recovery' && params.get('access_token')){
      authRecoveryToken = params.get('access_token');
      authScreen = 'reset';
      renderAuthScreen();
      return;
    }
  }
  authSession = loadStoredAuthSession();
  if(authSession) boot();
  else renderAuthScreen();
})();
</script>
</body>
