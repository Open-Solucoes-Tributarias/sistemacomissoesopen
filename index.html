<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://ogkrrlssdrtctdyyvkql.supabase.co; base-uri 'none'; object-src 'none'; form-action 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Painel Diretoria Comercial · Open Soluções Tributárias</title>
</head>
<body>
<div id="root"></div>
<style>
  :root{
    /* Identidade visual da Open Soluções Tributárias (mapa de produto):
       marinho profundo na marca e nas faixas, azul claro como destaque,
       fundo azulado bem claro, cartões brancos de borda azul com filete
       colorido no topo, e rótulos em caixa alta bem espaçados. */
    --bg:#F4F7FB;
    --surface:#FFFFFF;
    --ink:#11243D;
    --ink-soft:#5A6E88;
    --ink-faint:#93A3B8;
    --border:#D8E4F0;
    --border-soft:#EDF3F9;
    --navy:#0A2540;          /* marinho da marca */
    --navy-2:#14508C;        /* fim do degradê da faixa */
    --azul-claro:#4FA3E3;    /* destaque do título e do filete */
    --primary:#1C6FBF;
    --primary-hover:#155A9E;
    --primary-soft:#E6F0FA;
    --ring:#A9CDEC;
    --danger:#EF4444;
    --danger-soft:#FEECEC;
    --shadow-sm:0 1px 2px rgba(21,34,56,.04), 0 1px 1px rgba(21,34,56,.03);
    --shadow-md:0 4px 14px rgba(21,34,56,.06), 0 1px 3px rgba(21,34,56,.04);
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body,#root{margin:0;padding:0;}
  #root{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    min-height:100vh;
    padding:0;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:100%;margin:0 auto;}

  /* ---------- Casca: barra lateral + conteúdo ---------- */
  .shell{display:flex;align-items:stretch;min-height:100vh;}
  .sidebar{
    width:238px;flex:none;background:var(--surface);
    border-right:1px solid var(--border);
    padding:18px 14px 20px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
    display:flex;flex-direction:column;
  }
  /* ---------- Marca ---------- */
  .marca-open{display:flex;align-items:center;gap:9px;}
  .marca-open .logo-globo{flex:none;display:block;}
  .marca-texto{min-width:0;line-height:1;}
  .marca-nome{
    font-size:var(--marca-nome,21px);font-weight:800;letter-spacing:.01em;
    color:var(--navy);line-height:.95;
  }
  .marca-assinatura{
    font-size:calc(var(--marca-nome,21px) * .30);font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);
    margin-top:3px;white-space:nowrap;
  }
  .marca-open.clara .marca-nome{color:#fff;}
  .marca-open.clara .marca-assinatura{color:rgba(255,255,255,.62);}

  .brand{display:block;padding:2px 6px 10px;border-bottom:1px solid var(--border-soft);}
  .brand-text{min-width:0;margin-top:10px;}
  .brand-sub{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.3;}
  .nav{margin-top:6px;}
  .nav-group-label{
    font-size:9.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);padding:0 9px;margin:18px 0 6px;
  }
  .nav-item{
    display:flex;align-items:center;gap:9px;width:100%;
    font-family:var(--font);font-size:13px;font-weight:600;color:var(--ink-soft);
    background:none;border:none;cursor:pointer;text-align:left;line-height:1.3;
    padding:8px 9px;border-radius:8px;margin-bottom:1px;
    transition:background .13s,color .13s;
  }
  .nav-item svg{flex:none;width:16px;height:16px;opacity:.7;}
  .nav-item:hover{background:var(--border-soft);color:var(--ink);}
  .nav-item.active{
    background:var(--primary-soft);color:var(--primary);font-weight:800;
    box-shadow:inset 3px 0 0 var(--primary);
  }
  .nav-item.active svg{opacity:1;}
  .sidebar-foot{
    margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);
    font-size:11.5px;color:var(--ink-faint);font-weight:600;
  }
  .sidebar-foot .sidebar-user{
    display:block;color:var(--ink-soft);word-break:break-all;line-height:1.4;margin-bottom:8px;
  }
  .sidebar-foot .logout-btn{
    background:none;border:1px solid var(--border);border-radius:8px;
    color:var(--ink-soft);cursor:pointer;font-family:var(--font);
    font-weight:700;font-size:12px;padding:6px 12px;transition:all .13s;
  }
  .sidebar-foot .logout-btn:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .main{flex:1;min-width:0;padding:20px 22px 60px;}

  /* ---------- Faixa de título (padrão do mapa de produto) ---------- */
  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(100deg,#071B30 0%,var(--navy) 42%,var(--navy-2) 100%);
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    color:#fff;padding:22px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;
  }
  /* filete azul claro embaixo, como no material impresso */
  .hero-linha{
    height:4px;border-radius:0 0 var(--radius-lg) var(--radius-lg);margin-bottom:18px;
    background:linear-gradient(90deg,var(--azul-claro) 0%,#2E82CE 55%,var(--navy-2) 100%);
  }
  .hero-marca{display:flex;align-items:center;gap:20px;min-width:0;position:relative;z-index:1;}
  .hero-divisor{width:1px;height:40px;background:rgba(255,255,255,.22);flex:none;}
  .hero-eyebrow{
    font-size:9.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;
    color:var(--azul-claro);margin-bottom:5px;
  }
  .hero h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0;color:#fff;line-height:1.15;}
  .hero h1 em{font-style:normal;color:var(--azul-claro);}
  .hero-right{
    display:flex;flex-direction:column;align-items:flex-end;gap:6px;
    position:relative;z-index:1;text-align:right;
  }
  .hero-info{font-size:12.5px;font-weight:700;color:#fff;}
  .hero-info-sub{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);}
  .hero .save-chip{
    background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);
    color:rgba(255,255,255,.92);box-shadow:none;
  }
  /* globo d'água no canto, como na arte */
  .hero-globo{
    position:absolute;right:-40px;top:50%;transform:translateY(-50%);
    width:210px;height:210px;opacity:.07;pointer-events:none;
  }
  .hero-globo svg{width:100%;height:100%;}

  @media (max-width:900px){
    .shell{flex-direction:column;}
    .sidebar{
      width:auto;height:auto;position:static;border-right:none;
      border-bottom:1px solid var(--border);padding:12px 14px;
    }
    .nav{display:flex;gap:5px;overflow-x:auto;margin-top:10px;padding-bottom:2px;}
    .nav-group{display:contents;}
    .nav-group-label{display:none;}
    .nav-item{width:auto;white-space:nowrap;margin-bottom:0;}
    .sidebar-foot{margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .sidebar-foot .sidebar-user{margin-bottom:0;}
    .main{padding:16px 14px 60px;}
    .hero{padding:20px 18px;}
  }

  /* Header */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:16px;margin-bottom:22px;
  }
  .company-name{
    font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--primary);margin-bottom:4px;
  }
  .title-block h1{
    font-size:24px;font-weight:800;letter-spacing:-0.02em;
    margin:0 0 4px;color:var(--ink);
  }
  .title-block .sub{font-size:14px;color:var(--ink-soft);font-weight:500;}
  .topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .year-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .year-row .topbar-actions{margin-left:auto;}
  .year-row-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .year-pill{font-weight:800;}
  .year-pill.year-add{color:var(--primary);}
  .year-pill.year-add:hover{background:var(--primary-soft);}
  .save-chip{
    display:flex;align-items:center;gap:7px;
    font-size:12.5px;font-weight:600;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--border);
    padding:7px 13px 7px 10px;border-radius:999px;box-shadow:var(--shadow-sm);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#22C55E;transition:background .25s;}
  .dot.saving{background:var(--primary);animation:pulse 1s infinite;}
  .dot.error{background:var(--danger);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .storage-warning{
    background:var(--danger-soft);border:1px solid #F5B5B5;color:#9A2E2E;
    border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:18px;
    font-size:13px;font-weight:600;line-height:1.5;
  }
  .storage-warning.read-only-notice{
    background:var(--primary-soft);border-color:var(--ring);color:var(--primary);
  }
  .read-only-badge{
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
    background:var(--primary-soft);color:var(--primary);padding:3px 8px;border-radius:999px;
  }

  /* Modo somente leitura: some com tudo que edita/apaga e trava os campos */
  .read-only-mode .btn-add,
  .read-only-mode .action-btn,
  .read-only-mode .admin-only-btn,
  .read-only-mode .year-add{
    display:none !important;
  }
  .read-only-mode tbody td input,
  .read-only-mode tbody td select,
  .read-only-mode .meta-input-wrap input{
    pointer-events:none;background:var(--border-soft);color:var(--ink-soft);
  }
  .read-only-mode tbody td input[type="checkbox"]{
    pointer-events:none;opacity:.55;
  }

  .metas-panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);padding:16px 18px;margin-bottom:26px;
  }
  .meta-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
  .meta-row:last-child{border-bottom:none;}
  .meta-name{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;width:110px;flex:none;}
  .meta-input-wrap{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px;width:140px;flex:none;}
  .meta-input-wrap input{border:none;background:transparent;width:100%;font-size:13px;padding:3px 0;outline:none;}
  .meta-bar-track{flex:1;height:10px;background:var(--border-soft);border-radius:999px;overflow:hidden;}
  .meta-bar-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s;}
  .meta-bar-fill.complete{background:#22C55E;}
  .meta-pct{width:44px;text-align:right;font-weight:800;font-size:13px;flex:none;}

  .chart-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);padding:18px 18px 10px;margin-bottom:26px;
  }

  tr.row-pending{background:#FFF8E8;}
  tr.row-pending:hover{background:#FFF2D6;}
  tr.row-locked{background:#F3F3F6;}
  tr.row-locked input, tr.row-locked select{color:var(--ink-faint);}
  .pending-badge{margin-left:4px;font-size:11px;vertical-align:middle;}
  .parcela-badge{
    display:inline-block;margin-left:4px;font-size:10px;font-weight:700;
    background:var(--primary-soft);color:var(--primary);padding:2px 6px;border-radius:999px;
    vertical-align:middle;white-space:nowrap;
  }
  .dup-badge{
    display:inline-block;margin-left:4px;font-size:10px;font-weight:700;
    background:#EDE9FE;color:#6D28D9;padding:2px 6px;border-radius:999px;
    vertical-align:middle;white-space:nowrap;
  }
  tr.row-duplicate{background:#F5F3FF;}
  tr.row-duplicate:hover{background:#EDE9FE;}

  .pagamento-cell{padding:8px 10px !important;}
  .pay-toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .pay-toggle input{width:15px;height:15px;accent-color:#22C55E;cursor:pointer;}
  .pagamento-cell select{margin-top:4px;font-size:11.5px;padding:4px 6px !important;}

  /* ---------- Relatório mensal (só existe na impressão) ---------- */
  #relatorio-print{display:none;}
  .rel-doc{
    color:#111;font-family:var(--font);font-size:10.5px;line-height:1.45;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;   /* cores dos gráficos saem no papel */
  }
  /* Faixa do relatório: a mesma do topo do sistema. */
  .rel-faixa{
    position:relative;overflow:hidden;
    background:linear-gradient(100deg,#071B30 0%,#0A2540 42%,#14508C 100%);
    color:#fff;padding:14px 18px;border-radius:5px 5px 0 0;
    display:flex;justify-content:space-between;align-items:center;gap:18px;
  }
  .rel-faixa-linha{
    height:3px;border-radius:0 0 5px 5px;margin-bottom:14px;
    background:linear-gradient(90deg,#4FA3E3 0%,#2E82CE 55%,#14508C 100%);
  }
  .rel-faixa-globo{
    position:absolute;right:-26px;top:50%;transform:translateY(-50%);
    width:150px;height:150px;opacity:.08;pointer-events:none;
  }
  .rel-faixa-globo svg{width:100%;height:100%;}
  .rel-marca{display:flex;align-items:center;gap:14px;min-width:0;position:relative;z-index:1;}
  .rel-divisor{width:1px;height:30px;background:rgba(255,255,255,.25);flex:none;}
  .rel-empresa{font-size:8px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#4FA3E3;}
  .rel-faixa h1{font-size:15px;font-weight:800;margin:3px 0 0;color:#fff;}
  .rel-emissao{position:relative;z-index:1;text-align:right;white-space:nowrap;}
  .rel-emissao-tit{font-size:9.5px;font-weight:700;color:#fff;}
  .rel-emissao-sub{font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:3px;}
  .rel-sec{margin-bottom:13px;}
  .rel-sec h2{
    font-size:11px;font-weight:800;margin:0 0 6px;padding-bottom:3px;
    letter-spacing:.1em;text-transform:uppercase;color:#0A2540;
    border-bottom:1.5px solid #1C6FBF;display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  }
  .rel-sub{font-size:9px;font-weight:700;color:#666;letter-spacing:.02em;text-transform:none;}
  .rel-cards{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
  .rel-card{
    border:1px solid #ccc;border-top:2.5px solid #1C6FBF;
    border-radius:4px;padding:6px 10px;min-width:118px;flex:1;
  }
  .rel-card span{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:#666;font-weight:700;}
  .rel-card b{font-size:12.5px;}
  .rel-card-total{background:#0A2540;color:#fff;border-color:#0A2540;border-top-color:#4FA3E3;}
  .rel-card-total span{color:rgba(255,255,255,.6);}
  .rel-tabela{width:100%;border-collapse:collapse;}
  .rel-tabela th{
    text-align:left;font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;
    color:#444;border-bottom:1px solid #999;padding:4px 6px;font-weight:800;
  }
  .rel-tabela td{padding:4px 6px;border-bottom:1px solid #e4e4e4;vertical-align:top;}
  .rel-tabela th.num, .rel-tabela td.num{text-align:right;white-space:nowrap;}
  .rel-tabela td.destaque{font-weight:800;}
  .rel-tabela td.mini{font-size:9px;color:#444;}
  .rel-vazio{font-size:9.5px;color:#777;font-style:italic;margin:4px 0 0;}
  .rel-ranking{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-bottom:9px;}
  .rel-ranking-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:4px 7px;border:1px solid #e0e0e0;border-radius:4px;font-size:9.5px;
  }
  .rel-lideres{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .rel-lider{display:inline-flex;align-items:center;gap:3px;font-weight:700;}
  .rel-lider i{width:7px;height:7px;border-radius:2px;display:inline-block;}
  .rel-sem{color:#999;font-style:italic;}
  .rel-campea{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    border:1.5px solid #333;border-radius:5px;padding:8px 11px;margin-bottom:6px;
  }
  .rel-campea-rot{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:#666;font-weight:700;}
  .rel-campea b{font-size:14px;}
  .rel-campea-sub{display:block;font-size:9px;color:#666;}
  .rel-campea-lista{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;font-size:9px;color:#555;}
  .rel-nota{font-size:8.5px;color:#777;margin:0;}
  .rel-graf{margin-bottom:10px;break-inside:avoid;}
  .rel-graf h3{font-size:10px;font-weight:800;margin:0 0 4px;color:#333;}
  .rel-legenda{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-size:9px;color:#555;}
  .rel-legenda span{display:inline-flex;align-items:center;gap:4px;}
  .rel-legenda i{width:8px;height:8px;border-radius:2px;display:inline-block;}
  @media (max-width:640px){ .rel-ranking{grid-template-columns:1fr;} }
  .rel-rodape{margin-top:14px;padding-top:8px;border-top:1px solid #bbb;font-size:8.5px;color:#777;text-align:center;}

  @media print{
    body.imprimindo-relatorio > #root{ display:none !important; }
    body.imprimindo-relatorio #relatorio-print{ display:block !important; }
    /* Nada de quebra forçada: o conteúdo corre e só evita cortar no meio de
       um bloco pequeno. Quebra à força deixava meia página em branco. */
    body.imprimindo-relatorio .rel-sec h2{ break-after:avoid; }
    body.imprimindo-relatorio .rel-graf,
    body.imprimindo-relatorio .rel-campea,
    body.imprimindo-relatorio .rel-faixa{ break-inside:avoid; }
    body.imprimindo-relatorio .rel-tabela tr{ break-inside:avoid; }
    /* Tabela que atravessa a página repete o cabeçalho */
    body.imprimindo-relatorio .rel-tabela thead{ display:table-header-group; }
    @page{ margin:10mm; }
    .topbar-actions, .tabs-nav, .filters-row, .toolbar, .kpi-toggle-row, .row-actions, .del-cell, .search-row, .year-row{
      display:none !important;
    }
    body, #root{ background:#fff; }
    .sidebar{ display:none !important; }
    .main{ padding:0 !important; }
    .hero{ background:#fff !important; color:#000 !important; padding:0 0 10px !important; }
    .hero h1, .hero-info, .hero-info-sub, .marca-open.clara .marca-nome{ color:#000 !important; }
    .hero-globo, .hero-linha{ display:none !important; }
    .table-card, .chart-card, .metas-panel{ box-shadow:none; border:1px solid #999; break-inside:avoid; }
    input, select{ border:none !important; background:transparent !important; color:#000 !important; }
    .kpi-value.masked{ display:none; }
    /* No papel tudo sai aberto, mesmo o que estiver minimizado na tela */
    .sections-toolbar, .panel-chevron{ display:none !important; }
    .panel .panel-body, .panel.collapsed .panel-body{ display:block !important; }
    .panel{ box-shadow:none; border:1px solid #999; break-inside:avoid; }
    .panel-head{ border-bottom:1px solid #999 !important; }
  }

  /* Tabs nav */
  .tabs-nav{
    display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border);
  }
  .tab-btn{
    font-family:var(--font);font-weight:700;font-size:14.5px;
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    padding:11px 4px;margin-right:26px;border-bottom:2.5px solid transparent;
    transition:all .15s;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}

  /* KPI cards */
  .kpis{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;margin-bottom:26px;
  }
  .kpi-card{
    background:var(--surface);border:1px solid var(--border);
    border-top:3px solid var(--kc,var(--primary));
    border-radius:var(--radius-sm);padding:14px 16px 13px;
    box-shadow:var(--shadow-sm);
    transition:transform .15s, box-shadow .15s;
    min-width:0;
  }
  .kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .kpi-card .kpi-label{
    font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-faint);margin-bottom:8px;display:flex;align-items:center;gap:6px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .kpi-dot{width:8px;height:8px;border-radius:50%;background:var(--kc,var(--primary));flex:none;}
  .kpi-card .kpi-value{
    font-size:19px;font-weight:800;letter-spacing:-0.01em;color:var(--ink);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .kpi-card.total{
    background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 100%);
    border-color:var(--navy);border-top-color:var(--azul-claro);
  }
  .kpi-card.total .kpi-label{color:rgba(255,255,255,.55);}
  .kpi-card.total .kpi-value{color:#fff;font-size:20px;}

  .kpi-toggle-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .resumo-section-title{
    font-size:13px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;
    letter-spacing:.04em;margin:0 0 10px;
  }
  .eye-toggle{
    font-family:var(--font);font-weight:700;font-size:12.5px;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:7px 14px;cursor:pointer;color:var(--ink-soft);box-shadow:var(--shadow-sm);
    transition:all .15s;
  }
  .eye-toggle:hover{border-color:var(--primary);color:var(--primary);}
  .danger-toggle:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .kpi-value.masked{letter-spacing:3px;color:var(--ink-faint);font-weight:800;}

  /* Month / vendor pills */
  .filters-row{
    display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center;
  }
  .months{
    display:flex;gap:4px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--border);
    padding:5px;border-radius:999px;
    box-shadow:var(--shadow-sm);width:fit-content;max-width:100%;overflow-x:auto;
  }
  .months.seller-filter{background:var(--border-soft);border-color:var(--border);}
  .seller-pill.active{
    background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(18,51,94,.28);
  }

  .search-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .search-input{
    font-family:var(--font);font-size:13px;font-weight:500;
    padding:9px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);color:var(--ink);outline:none;
    min-width:190px;flex:1 1 190px;box-shadow:var(--shadow-sm);
    transition:border-color .15s, box-shadow .15s;
  }
  .search-input::placeholder{color:var(--ink-faint);font-weight:400;}
  .search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .pill{
    font-size:13px;font-weight:600;letter-spacing:-0.005em;
    padding:8px 15px;border-radius:999px;border:none;
    background:transparent;color:var(--ink-soft);cursor:pointer;
    transition:all .15s;white-space:nowrap;
  }
  .pill:hover{color:var(--ink);background:var(--border-soft);}
  .pill.active{
    background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(10,37,64,.28);
    letter-spacing:.03em;
  }

  /* Toolbar */
  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;flex-wrap:wrap;gap:10px;
  }
  .count{font-size:13.5px;color:var(--ink-soft);font-weight:500;}
  .count b{color:var(--ink);font-weight:700;}
  .btn-row{display:flex;gap:8px;}
  .btn-add{
    font-family:var(--font);font-weight:700;font-size:13.5px;
    background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);
    padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    box-shadow:0 2px 10px rgba(29,78,216,.28);
    transition:background .15s, transform .1s;
  }
  .btn-add:hover{background:var(--primary-hover);}
  .btn-add:active{transform:scale(.97);}
  .btn-secondary{
    background:var(--surface);color:var(--ink);border:1px solid var(--border);
    box-shadow:none;
  }
  .btn-secondary:hover{background:var(--border-soft);}

  /* Table */
  .table-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
    overflow:hidden;
  }
  .table-scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;table-layout:auto;}
  thead th{
    background:var(--surface);color:var(--ink-faint);
    font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.13em;
    text-align:left;padding:12px 10px 10px;white-space:nowrap;
    border-bottom:1px solid var(--border);
  }
  thead th.num{text-align:right;}
  thead th .th-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;}
  tbody td{padding:0;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tbody tr{transition:background .1s;}
  tbody tr:hover{background:#F7FAFE;}
  tbody tr:last-child td{border-bottom:none;}
  tbody td input, tbody td select{
    width:100%;border:none;background:transparent;
    font-family:var(--font);font-size:12.5px;color:var(--ink);font-weight:500;
    padding:8px 8px;outline:none;border-radius:0;
  }
  tbody td select{font-weight:600;cursor:pointer;color:var(--primary);}
  tbody td input.num{text-align:right;font-variant-numeric:tabular-nums;}
  tbody td input::placeholder{color:var(--ink-faint);font-weight:400;}
  tbody td input:focus, tbody td select:focus{
    background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--ring);border-radius:6px;
  }
  td.cliente input{min-width:230px;}
  td.venda select{min-width:150px;}
  /* Larguras das colunas das tabelas de lançamento.
     Como a tabela é larga e rola na horizontal, o navegador encolhe cada
     coluna até o conteúdo do cabeçalho — por isso o piso vai em min-width,
     e não em width, que ele ignora nessa situação. */
  .col-valor{min-width:96px;width:96px;}
  .col-mes{min-width:104px;}
  /* Nome da empresa / órgão / curso: sem piso a coluna encolhia e cortava o
     nome. O piso empurra o resto para a rolagem horizontal, que já existe. */
  .col-nome{min-width:290px;}
  .col-nome input{min-width:270px;}
  .currency-wrap{display:flex;align-items:center;}
  .currency-wrap input{text-align:right;padding-left:2px;}
  .currency-prefix{
    display:inline-block;color:var(--ink-faint);font-size:12px;font-weight:600;
    padding-left:8px;user-select:none;flex:none;
  }
  .pct-wrap{display:flex;align-items:center;justify-content:flex-end;}
  .pct-wrap input{text-align:right;padding-right:2px;}
  .pct-suffix{color:var(--ink-faint);font-size:12px;font-weight:600;padding-right:10px;user-select:none;}
  .pct-disabled{display:block;text-align:right;padding-right:14px;color:var(--ink-faint);}
  /* Comissão do Sistema: % em cima, valor embaixo */
  .com-cell{padding:4px 0 !important;min-width:96px;}
  .com-cell .pct-wrap input.pct-mini{
    font-size:11.5px;padding:2px 0;color:var(--ink-soft);font-weight:600;
  }
  .com-cell .pct-wrap .pct-suffix{font-size:10.5px;padding-right:8px;}
  .com-cell.por-pct .pct-wrap input.pct-mini{color:var(--primary);font-weight:800;}
  .com-cell.por-pct input[data-field]{color:var(--primary);font-weight:700;}
  .col-pct{width:110px;}
  .extra-vendedores-btn{
    background:var(--primary-soft);border:1px solid var(--ring);color:var(--primary);
    font-family:var(--font);font-weight:700;font-size:11.5px;
    padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;
    transition:all .15s;
  }
  .extra-vendedores-btn:hover{background:var(--ring);}
  .extra-vendedor-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .extra-vendedor-row{display:flex;align-items:center;gap:8px;}
  .extra-vendedor-row select{
    flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-family:var(--font);font-size:13px;color:var(--ink);background:var(--surface);
  }
  .extra-vendedor-row .pct-wrap{width:100px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px 0;}
  .calc-value{
    text-align:right;padding:0 14px 8px;font-size:11px;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;font-weight:600;
  }
  .del-cell{width:96px;text-align:center;}
  .row-actions{display:flex;gap:2px;justify-content:center;opacity:0;transition:opacity .15s;}
  tr:hover .row-actions{opacity:1;}
  .action-btn{
    background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:13.5px;
    width:26px;height:26px;border-radius:7px;
    display:inline-flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .action-btn:hover{background:var(--primary-soft);color:var(--primary);}
  .action-btn.danger:hover{background:var(--danger-soft);color:var(--danger);}

  .empty-row td{padding:48px 10px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .empty-row .empty-icon{font-size:26px;display:block;margin-bottom:8px;}

  .footnote{margin-top:16px;text-align:right;}
  .reset-link{
    font-size:12px;color:var(--ink-faint);background:none;border:none;cursor:pointer;
    font-family:var(--font);font-weight:600;padding:6px 10px;border-radius:6px;
    transition:all .15s;
  }
  .reset-link:hover{color:var(--danger);background:var(--danger-soft);}

  @media (max-width:980px){
    .kpis{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width:560px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    #root{padding:20px 14px 60px;}
  }

  /* Modal (replaces native confirm/prompt/alert, which can be blocked in sandboxed iframes) */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(21,34,56,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:1000;padding:20px;
  }
  .modal-box{
    background:var(--surface);border-radius:var(--radius-lg);
    box-shadow:0 20px 50px rgba(20,22,43,.25);
    padding:22px;max-width:380px;width:100%;
  }
  .modal-box.modal-box-wide{max-width:640px;}
  .modal-textarea{
    width:100%;min-height:220px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-family:'Courier New',Consolas,monospace;font-size:12px;color:var(--ink);outline:none;
    margin-bottom:12px;resize:vertical;background:var(--border-soft);
  }
  .modal-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .modal-error{
    font-size:13px;color:var(--danger);font-weight:600;margin:-4px 0 12px;
  }
  .modal-msg{font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.5;margin-bottom:14px;}
  .modal-input{
    width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-family:var(--font);font-size:14px;color:var(--ink);outline:none;margin-bottom:16px;
  }
  .modal-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  .modal-btn{
    font-family:var(--font);font-weight:700;font-size:13.5px;
    border:none;border-radius:var(--radius-sm);padding:9px 16px;cursor:pointer;
    transition:opacity .15s;
  }
  .modal-btn:hover{opacity:.88;}
  .modal-btn-ghost{background:var(--border-soft);color:var(--ink-soft);}
  .modal-btn-primary{background:var(--primary);color:#fff;}
  .modal-btn-danger{background:var(--danger);color:#fff;}

  /* Auth (login / recuperar senha) */
  /* ---------- Tela de login com a cara da empresa ---------- */
  .auth-screen{
    position:relative;overflow:hidden;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:20px;
    background:linear-gradient(125deg,#061626 0%,var(--navy) 45%,var(--navy-2) 100%);
  }
  .auth-globo{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:620px;height:620px;opacity:.055;pointer-events:none;
  }
  .auth-globo svg{width:100%;height:100%;}
  .auth-card{
    position:relative;z-index:1;
    background:var(--surface);border:1px solid rgba(255,255,255,.14);
    border-radius:var(--radius-lg);box-shadow:0 24px 60px rgba(0,0,0,.35);
    padding:0;max-width:400px;width:100%;overflow:hidden;
  }
  .auth-topo{
    background:linear-gradient(100deg,#071B30 0%,var(--navy) 55%,var(--navy-2) 100%);
    padding:20px 30px;display:flex;justify-content:center;
    border-bottom:3px solid var(--azul-claro);
  }
  .auth-corpo{padding:28px 30px 30px;}
  .auth-eyebrow{
    font-size:9.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
    color:var(--primary);margin-bottom:7px;
  }
  .auth-rodape{
    position:relative;z-index:1;
    font-size:11px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.42);
  }
  .auth-logo{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:6px;}
  .auth-card h1{font-size:19px;margin:0 0 5px;font-weight:800;color:var(--ink);letter-spacing:-.01em;line-height:1.2;}
  .auth-card .auth-sub{font-size:13px;color:var(--ink-soft);margin:0 0 22px;font-weight:500;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .auth-input-wrap{position:relative;}
  .auth-input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:14px;color:var(--ink);outline:none;}
  .auth-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .auth-input-wrap .auth-input{padding-right:44px;}
  .auth-toggle-pwd{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:12.5px;font-weight:700;padding:6px 8px;border-radius:6px;}
  .auth-toggle-pwd:hover{color:var(--primary);background:var(--primary-soft);}
  .auth-error{background:var(--danger-soft);color:#9A2E2E;border:1px solid #F5B5B5;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px;line-height:1.4;}
  .auth-notice{background:var(--primary-soft);color:var(--primary);border:1px solid var(--ring);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px;line-height:1.4;}
  .auth-submit{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;transition:background .15s;}
  .auth-submit:hover{background:var(--primary-hover);}
  .auth-submit:disabled{opacity:.6;cursor:not-allowed;}
  .auth-link{background:none;border:none;color:var(--primary);font-family:var(--font);font-weight:700;font-size:12.5px;cursor:pointer;padding:6px 0;}
  .auth-link:hover{text-decoration:underline;}
  .auth-foot{text-align:center;margin-top:16px;}

  .user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface);border:1px solid var(--border);padding:7px 12px;border-radius:999px;}
  .user-chip .logout-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-family:var(--font);font-weight:700;font-size:12px;padding:0;}
  .user-chip .logout-btn:hover{color:var(--danger);}

  /* ---------- Painéis recolhíveis ----------
     Filete azul no topo e título em caixa alta espaçada, como os cartões
     das linhas de produto do mapa. */
  .panel{
    background:var(--surface);border:1px solid var(--border);
    border-top:3px solid var(--primary);
    border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    margin-bottom:18px;overflow:hidden;
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:13px 16px;border-bottom:1px solid var(--border-soft);
    transition:border-color .18s, background .15s;
  }
  .panel-head:hover{background:#FAFCFF;}
  .panel.collapsed .panel-head{border-bottom-color:transparent;}
  .panel-toggle{
    display:flex;align-items:center;gap:10px;flex:1;min-width:0;
    background:none;border:none;cursor:pointer;padding:2px 0;
    font-family:var(--font);text-align:left;color:var(--ink);
  }
  .panel-chevron{
    flex:none;width:18px;height:18px;border-radius:5px;
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink-faint);transition:transform .2s ease, color .15s;
  }
  .panel-chevron::before{
    content:"";width:5px;height:5px;
    border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;
    transform:rotate(45deg);margin-top:-2px;
  }
  .panel.collapsed .panel-chevron{transform:rotate(-90deg);}
  .panel-toggle:hover .panel-chevron{color:var(--primary);}
  .panel-title{
    font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .panel-toggle:hover .panel-title{color:var(--primary);}
  .panel-head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .panel-meta{font-size:12.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
  .panel-meta b{color:var(--ink);font-weight:800;}
  tr.linha-subtotal td{
    background:var(--border-soft);font-weight:800;font-size:12.5px;color:var(--ink);
    border-top:1px solid var(--border);
  }
  .dica-filtro{
    font-size:12px;color:var(--ink-faint);font-weight:600;
    margin:-4px 16px 12px;line-height:1.45;
  }
  .dica-filtro b{color:var(--ink-soft);}
  .aviso-previsao{
    background:#FFF8E8;border:1px solid #F5DFA8;color:#8A6114;
    border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;font-weight:600;
    line-height:1.5;margin:0 16px 14px;
  }

  .ordem-wrap{display:inline-flex;align-items:center;gap:7px;}
  .ordem-wrap > span{font-size:12px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
  .ordem-wrap select{
    font-family:var(--font);font-size:13px;font-weight:600;color:var(--ink);
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:9px 10px;cursor:pointer;outline:none;
  }
  .ordem-wrap select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .read-only-mode .ordem-wrap{display:inline-flex !important;}

  /* ---------- Painel da Equipe ---------- */
  .painel-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .painel-titulo{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-0.01em;}
  .painel-sub{font-size:13px;color:var(--ink-soft);font-weight:500;margin-top:2px;}
  .painel-abas{display:flex;gap:3px;background:var(--border-soft);border-radius:10px;padding:3px;}
  .painel-aba{
    font-family:var(--font);font-size:13px;font-weight:700;border:none;cursor:pointer;
    background:transparent;color:var(--ink-soft);padding:8px 15px;border-radius:8px;transition:all .15s;
  }
  .painel-aba:hover{color:var(--ink);}
  .painel-aba.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}

  .painel-grid{display:grid;grid-template-columns:minmax(300px,2fr) 3fr;gap:18px;align-items:start;}
  @media (max-width:900px){ .painel-grid{grid-template-columns:1fr;} }

  .painel-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin-bottom:14px;}
  .painel-chip{
    font-family:var(--font);font-size:12.5px;font-weight:700;cursor:pointer;
    padding:9px 6px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-soft);transition:all .15s;
  }
  .painel-chip:hover{border-color:var(--ink-faint);color:var(--ink);}
  .painel-chip.active{background:var(--vc);border-color:transparent;color:#fff;}

  .painel-campo{display:block;margin-bottom:12px;}
  .painel-campo > span{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .painel-campo select, .painel-campo input{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-family:var(--font);font-size:13.5px;color:var(--ink);background:var(--surface);outline:none;
    font-variant-numeric:tabular-nums;
  }

<script>
const SEED_DATA = [];
const NEXT_ID_START = 1;

const MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function monthNumber(m){
  const idx = MONTHS.indexOf(m);
  return idx === -1 ? '—' : String(idx+1).padStart(2,'0');
}
// Rótulo do mês nas listas de lançamento: "08 Ago". Só o número deixava a
// coluna ilegível de relance — o nome curto resolve sem alargar demais.
function monthShort(m){
  const idx = MONTHS.indexOf(m);
  if(idx === -1) return '—';
  return String(idx+1).padStart(2,'0') + ' ' + m.slice(0,3);
}
let SELLERS = [

function loadStoredAuthSession(){
  try{
    const raw = localStorage.getItem(AUTH_STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.access_token || !parsed.refresh_token) return null;
    return parsed;
  } catch(e){ return null; }
}
function storeAuthSession(session){
  authSession = session;
  try{
    if(session) localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
    else localStorage.removeItem(AUTH_STORAGE_KEY);
  } catch(e){ /* localStorage indisponível (ex: modo privado) — sessão fica só em memória */ }
}
function sessionFromAuthResponse(data){
  return {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + (Number(data.expires_in || 3600) * 1000),
    user: data.user ? { id: data.user.id, email: data.user.email } : null,
  };
}
async function authFetch(path, body, extraHeaders){
  const res = await fetch(SUPABASE_URL + path, {
    method: 'POST',
    headers: Object.assign({ 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, extraHeaders || {}),
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(function(){ return {}; });
  if(!res.ok){
    const err = new Error((data && (data.error_description || data.msg || data.message)) || 'Falha na autenticação.');
    err.status = res.status;
    throw err;
  }
  return data;
}
async function ensureFreshToken(){
  if(!authSession) return null;
  if(authSession.expires_at - Date.now() > 60000) return authSession.access_token;
  if(!authRefreshPromise){
    authRefreshPromise = authFetch('/auth/v1/token?grant_type=refresh_token', { refresh_token: authSession.refresh_token })
      .then(function(data){ storeAuthSession(sessionFromAuthResponse(data)); return authSession.access_token; })
      .catch(function(){ storeAuthSession(null); return null; })
      .finally(function(){ authRefreshPromise = null; });
  }
  return authRefreshPromise;
}

async function login(email, password){
  authLoading = true; authError = ''; renderAuthScreen();
  try{
    const data = await authFetch('/auth/v1/token?grant_type=password', { email: email, password: password });
    storeAuthSession(sessionFromAuthResponse(data));
    authLoading = false;
    boot();
  } catch(e){
    authLoading = false;
    authError = e.status === 400 ? 'E-mail ou senha incorretos.'
      : e.status === 429 ? 'Muitas tentativas. Aguarde um pouco e tente de novo.'
      : 'Não foi possível entrar. Verifique sua internet e tente novamente.';
    renderAuthScreen();
  }
}
function logout(){
  const token = authSession && authSession.access_token;
  storeAuthSession(null);
  if(token){
    fetch(SUPABASE_URL + '/auth/v1/logout', { method:'POST', headers:{ apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token } }).catch(function(){});
  }
  location.reload();
}
async function requestPasswordRecovery(email){
  authLoading = true; authError = ''; authNotice = ''; renderAuthScreen();
  try{
    await authFetch('/auth/v1/recover', { email: email, redirect_to: window.location.href.split('#')[0] });
  } catch(e){ /* não revelamos se o e-mail existe ou não */ }
  authLoading = false;
  authNotice = 'Se esse e-mail estiver cadastrado, enviamos um link pra redefinir a senha. Confira sua caixa de entrada.';
  renderAuthScreen();
}
async function submitNewPassword(newPassword){
  authLoading = true; authError = ''; renderAuthScreen();
  try{
    if(!authRecoveryToken) throw new Error('Link inválido ou expirado.');
    const res = await fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + authRecoveryToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: newPassword }),
    });
    const data = await res.json().catch(function(){ return {}; });
    if(!res.ok) throw new Error((data && (data.error_description || data.msg)) || 'Falha ao redefinir senha.');
    authRecoveryToken = null;
    authScreen = 'login';
    authNotice = 'Senha alterada! Faça login com a nova senha.';
    authLoading = false;
    history.replaceState(null, '', window.location.pathname + window.location.search);
    renderAuthScreen();
  } catch(e){
    authLoading = false;
    authError = 'Não foi possível redefinir a senha. Peça um novo link em "Esqueci minha senha".';
    renderAuthScreen();
  }
}

async function sb(path, opts){
  opts = opts || {};
  const token = await ensureFreshToken();
  if(!token){
    renderAuthScreen();
    throw new Error('Sessão expirada. Faça login novamente.');
  }
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json',
  }, opts.headers || {});
  const res = await fetch(SUPABASE_URL + path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if(res.status === 401){
    storeAuthSession(null);
    renderAuthScreen();
    throw new Error('Sessão expirada. Faça login novamente.');
  }
  if(!res.ok){
    const text = await res.text().catch(function(){ return ''; });
    throw new Error('Supabase ' + res.status + ': ' + text);
  }
  if(res.status === 204) return null;
  const ct = res.headers.get('content-type') || '';
  if(ct.indexOf('application/json') !== -1) return res.json();
  return null;
}
/* Leitura passa pelas views "_safe": elas escondem, linha a linha, os
   vendedores/percentuais que não são da pessoa logada. Para admin as views
   devolvem tudo. A escrita continua indo direto nas tabelas base (só admin
   tem permissão de escrever nelas). */
const READ_VIEWS = {
  vendas: 'vendas_safe',
  lancamentos: 'lancamentos_safe',
  lancamentos_extra_vendedores: 'lancamentos_extra_vendedores_safe',
};
/* Colunas numéricas no Postgres não aceitam "" — e um único campo vazio
   derruba o POST inteiro, fazendo a aba parar de salvar. Tudo que vai para
   coluna numérica passa por aqui. */
/* Cada coleção só pode apagar linhas no banco depois de ter lido o banco
   com sucesso. Sem isso, uma leitura que falha (token expirado, rede caindo)
   deixa a lista local vazia e o próximo salvamento apaga tudo. */
const carregouDoBanco = {};
/* Aba que não conseguiu carregar do banco. Sem isso a tela ficava vazia
   igualzinho a "não tem nada lançado", e ninguém sabia que era falha. */
const falhaAoCarregar = {};

function numOrNull(v){
  if(v === null || v === undefined) return null;
  if(typeof v === 'number') return isFinite(v) ? v : null;
  const t = String(v).trim().replace(',', '.');
  if(t === '') return null;
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}

function sbSelect(table, query){
  const source = READ_VIEWS[table] || table;
  return sb('/rest/v1/' + source + (query ? '?' + query : ''), { method: 'GET' });
}
function sbUpsert(table, rows, onConflict){
  if(!rows || rows.length === 0) return Promise.resolve();
  return sb('/rest/v1/' + table + '?on_conflict=' + (onConflict||'id'), {
    method: 'POST',
    headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: rows,
  });
}
function sbDeleteIn(table, column, values){
  if(!values || values.length === 0) return Promise.resolve();
  const list = values.map(function(v){ return typeof v === 'string' ? '"'+v.replace(/"/g,'')+'"' : v; }).join(',');
  return sb('/rest/v1/' + table + '?' + column + '=in.(' + list + ')', { method:'DELETE', headers:{'Prefer':'return=minimal'} });
}
function sbDeleteAll(table, filter){
  return sb('/rest/v1/' + table + '?' + filter, { method:'DELETE', headers:{'Prefer':'return=minimal'} });
}

const VENDA_NON_SELLER_FIELDS = new Set(['id','ano','mes','cliente','venda','valor','parceiro','participacao','formaPagamento','colaborador','observacoes','vendedor2','vendedor3','vendedorResponsavel','pago','mesPagamento','parcelaLabel','comissaoPercents']);

function persist(){
  saving = true; updateSaveStatus();
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    (async function(){
      try{
        const dbRows = rows.map(function(r){
          return {
            id: r.id, ano: r.ano||2026, mes: r.mes, cliente: r.cliente||'', venda: r.venda||'',
            valor: numOrNull(r.valor), parceiro: r.parceiro||'', participacao: numOrNull(r.participacao),
            forma_pagamento: r.formaPagamento||'', colaborador: r.colaborador||'', observacoes: r.observacoes||'',
            vendedor2: r.vendedor2||'', vendedor3: r.vendedor3||'', pago: !!r.pago, mes_pagamento: r.mesPagamento||null,
            parcela_label: r.parcelaLabel || null,
            vendedor_responsavel: r.vendedorResponsavel || '',
          };
        });
        await sbUpsert('vendas', dbRows, 'id');

        const existing = carregouDoBanco.vendas ? ((await sbSelect('vendas','select=id')) || []) : [];
        const localIds = rows.map(function(r){ return r.id; });
        const toDelete = existing.map(function(x){ return x.id; }).filter(function(id){ return localIds.indexOf(id) === -1; });
        if(toDelete.length) await sbDeleteIn('vendas','id', toDelete);

        const comissaoRows = [];
        rows.forEach(function(r){
          Object.keys(r).forEach(function(k){
            if(VENDA_NON_SELLER_FIELDS.has(k)) return;
            comissaoRows.push({
              venda_id: r.id, seller_key: k, valor: numOrNull(r[k]),
              percent: numOrNull((r.comissaoPercents||{})[k]),
            });
          });
        });
        if(comissaoRows.length) await sbUpsert('vendas_comissoes', comissaoRows, 'venda_id,seller_key');
        saveError = false;
        agendarRefreshPainel();   // "quem vendeu" e o valor alimentam o painel
      } catch(e){
        console.error('Falha ao salvar vendas', e);
        saveError = true;
      } finally {
        saving = false; updateSaveStatus();
      }
    })();
  }, 450);
}

  entityTimers[tk] = setTimeout(function(){
    (async function(){
      try{
        const cfg = ENTITIES[key];

          const row = {
            id: r.id, entidade: key, ano: r.ano||2026, mes: r.mes,
            comissao_percent: numOrNull(r.comissaoPercent), vendedor: r.vendedor||'',

            comissao_percent3: numOrNull(r.comissaoPercent3), vendedor3: r.vendedor3||'',
            parcela_label: r.parcelaLabel || null,
            nome:'', valor_contrato:null, tipo:null, parceiro:'', participacao:null,
            forma_pagamento:'', colaborador:'', observacoes:'',
            pago:false, mes_pagamento:null,
          };
          cfg.fields.forEach(function(f){
            if(f.key === 'valorContrato') row.valor_contrato = numOrNull(r.valorContrato);
            else if(f.key === 'tipo') row.tipo = r.tipo;
            else if(f.key === 'parceiro') row.parceiro = r.parceiro||'';
            else if(f.key === 'participacao') row.participacao = numOrNull(r.participacao);
            else if(f.key === 'formaPagamento') row.forma_pagamento = r.formaPagamento||'';
            else if(f.key === 'colaborador') row.colaborador = r.colaborador||'';
            else if(f.key === 'observacoes') row.observacoes = r.observacoes||'';
            else row.nome = r[f.key] || '';
          });
          if(cfg.hasPagamento){ row.pago = !!r.pago; row.mes_pagamento = r.mesPagamento||null; }
          return row;
        });
        await sbUpsert('lancamentos', dbRows, 'id');

        const existing = carregouDoBanco['lanc-'+key] ? ((await sbSelect('lancamentos','select=id&entidade=eq.'+key)) || []) : [];
        const localIds = state[key].rows.map(function(r){ return r.id; });
        const toDelete = existing.map(function(x){ return x.id; }).filter(function(id){ return localIds.indexOf(id) === -1; });
        if(toDelete.length) await sbDeleteIn('lancamentos','id', toDelete);

        if(localIds.length){
          await sbDeleteAll('lancamentos_extra_vendedores', 'lancamento_id=in.(' + localIds.join(',') + ')');
        }
        const extraRows = [];
        state[key].rows.forEach(function(r){
          (r.extraVendedores||[]).forEach(function(ev){
            extraRows.push({ id: ev.id, lancamento_id: r.id, vendedor: ev.vendedor||'', percent: numOrNull(ev.percent) });
          });
        });
        if(extraRows.length) await sbUpsert('lancamentos_extra_vendedores', extraRows, 'id');

        // Divisão do faturamento por vendedora (hoje só a aba Cursos usa)
        if(cfg.hasVendasPorVendedor && localIds.length){
          await sbDeleteAll('lancamento_vendas', 'lancamento_id=in.(' + localIds.join(',') + ')');
          const vendaRows = [];
          state[key].rows.forEach(function(r){
            (r.vendasVendedoras||[]).forEach(function(vv){
              if(!String(vv.vendedor||'').trim()) return;
              vendaRows.push({ id: vv.id, lancamento_id: r.id, vendedor: vv.vendedor.trim(), valor: numOrNull(vv.valor) });
            });
          });
          if(vendaRows.length) await sbUpsert('lancamento_vendas', vendaRows, 'id');

        saveError = false;
        if(cfg.hasVendasPorVendedor) agendarRefreshPainel();
      } catch(e){
        console.error('Falha ao salvar '+key, e);
        saveError = true;
      } finally {
        saving = false; updateSaveStatus();
      }
    })();
  }, 450);
}

/* Consulta que pode falhar sem derrubar o resto: devolve o padrão em vez de
   estourar. Era o que faltava — uma consulta secundária falhando levava junto
   os lançamentos da aba, que ficava vazia e sem nenhum aviso. */
async function sbSelectOpcional(table, query, padrao){
  try{
    const r = await sbSelect(table, query);
    return r || padrao;
  }catch(e){
    console.error('Consulta opcional falhou: ' + table, e);
    return padrao;
  }
}

/* ---------- Marca da Open ----------
   O globo de meridianos e a assinatura, desenhados em SVG aqui mesmo:
   acompanham a cor do texto, imprimem nítidos em qualquer tamanho e não
   dependem de arquivo de imagem (que o sistema teria de carregar de fora). */
let __logoSeq = 0;
function logoGloboSvg(tam, cor){
  const id = 'og' + (++__logoSeq);
  const c = cor || null;
  const traco = c ? `stroke="${c}"` : `stroke="url(#${id})"`;
  return `<svg class="logo-globo" width="${tam}" height="${tam}" viewBox="0 0 100 100" aria-hidden="true">
    ${c ? '' : `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC6F5"/><stop offset="0.55" stop-color="#2E82CE"/><stop offset="1" stop-color="#0B3D73"/>
    </linearGradient></defs>`}
    <g fill="none" ${traco} stroke-width="4.5" stroke-linecap="round">
      <circle cx="50" cy="50" r="45"/>
      <ellipse cx="50" cy="50" rx="45" ry="17"/>
      <ellipse cx="50" cy="50" rx="45" ry="34"/>
      <ellipse cx="50" cy="50" rx="17" ry="45"/>
      <ellipse cx="50" cy="50" rx="34" ry="45"/>
      <line x1="50" y1="5" x2="50" y2="95"/>
      <line x1="5" y1="50" x2="95" y2="50"/>
    </g>
  </svg>`;
}
/* Marca completa: globo + "OPEN" + assinatura. `escala` ajusta o conjunto. */
function marcaOpenHtml(opts){
  const o = opts || {};
  const tam = o.tam || 34;
  return `<div class="marca-open${o.clara ? ' clara' : ''}" style="--marca-globo:${tam}px;--marca-nome:${Math.round(tam*0.62)}px">
    ${logoGloboSvg(tam, o.cor)}

      <div class="marca-nome">OPEN</div>
      <div class="marca-assinatura">Soluções Tributárias</div>
    </div>
  </div>`;
}

function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

/* Nome que vai virar string JS dentro de um atributo HTML (onclick="f('...')").
   Sem escapar a aspa simples, um nome com apóstrofo — D'Ávila — quebra o
   atributo; escapamos primeiro pro JS e depois pro HTML. */
function escJs(s){
  if(s===null||s===undefined) return "";
  return esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
}

/* ---------------- Painéis recolhíveis ----------------
   Cada bloco de tabela/resumo vira um painel que a pessoa pode minimizar.
   O que está aberto/fechado fica salvo no navegador de quem usa (não vai
   pro banco), então cada um monta a tela do jeito que preferir. */
const COLLAPSE_KEY = 'comissoes_paineis_v1';
let collapsedSections = {};
try{
  collapsedSections = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}') || {};
} catch(e){ collapsedSections = {}; }

function isSectionCollapsed(id){ return !!collapsedSections[id]; }
function toggleSection(id){
  collapsedSections[id] = !collapsedSections[id];
  try{ localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsedSections)); } catch(e){}
  const el = document.getElementById('sec-'+id);
  if(el){
    el.classList.toggle('collapsed', collapsedSections[id]);
    const btn = el.querySelector('.panel-toggle');
    if(btn) btn.setAttribute('aria-expanded', collapsedSections[id] ? 'false' : 'true');
  }
}
function setAllSections(collapsed){
  document.querySelectorAll('.panel[id^="sec-"]').forEach(function(el){
    collapsedSections[el.id.slice(4)] = collapsed;
  });
  try{ localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsedSections)); } catch(e){}
  render();
}

/* panel(id, titulo, corpo, {meta, actions, flush})
   `titulo`, `meta` e `actions` entram como HTML — quem chama escapa o texto. */
function panel(id, title, bodyHtml, opts){
  opts = opts || {};
  const collapsed = isSectionCollapsed(id);
  return `
    <section class="panel${collapsed ? ' collapsed' : ''}" id="sec-${id}">
      <div class="panel-head">
        <button type="button" class="panel-toggle" aria-expanded="${collapsed ? 'false' : 'true'}"
                aria-controls="secbody-${id}" onclick="toggleSection('${id}')">
          <span class="panel-chevron" aria-hidden="true"></span>
          <span class="panel-title">${title}</span>

/* ---------------- Custom modal (confirm / prompt / alert) ----------------
   Native window.confirm/prompt/alert can be silently blocked inside a
   sandboxed artifact iframe, which made buttons look unresponsive.
   This in-app modal replaces them so actions always work. */

function showConfirm(message, onConfirm, confirmLabel){
  modalState = {type:'confirm', message, onConfirm, confirmLabel: confirmLabel || 'Excluir'};
  render();
}
function showPrompt(message, onSubmit){
  modalState = {type:'prompt', message, value:'', onSubmit};
  render();
}
function showAlert(message){
  modalState = {type:'alert', message};
  render();
}
function closeModal(){
  modalState = null;
  render();
}
function confirmModal(){
  if(!modalState) return;
  const m = modalState;
  if(m.type === 'import'){
    const ok = applyImportedData(m.value || '');
    if(ok){ modalState = null; }
    render();
    return;
  }
  modalState = null;
  if(m.type === 'confirm' && m.onConfirm) m.onConfirm();
  else if(m.type === 'prompt' && m.onSubmit) m.onSubmit(m.value);
  render();
}
function onModalInputChange(el){
  if(modalState) modalState.value = el.value;
}
function onModalInputKey(el, ev){
  if(ev.key === 'Enter'){ confirmModal(); }
  else if(ev.key === 'Escape'){ closeModal(); }
}
function onModalTextareaChange(el){
  if(modalState) modalState.value = el.value;
}

                <option value="percentual_total" ${f.premioTipo==='percentual_total'?'selected':''}>% sobre o total faturado</option>
              </select>
            </label>
            <label class="meta-field">
              <span>${f.premioTipo==='fixo' ? 'Valor do prêmio' : 'Porcentagem'}</span>
              <div class="meta-field-money">
                <span class="currency-prefix">${f.premioTipo==='fixo' ? 'R$' : '%'}</span>
                <input type="number" step="${f.premioTipo==='fixo'?'50':'0.1'}" min="0"
                       placeholder="${f.premioTipo==='fixo'?'500':'1'}"
                       value="${f.premioValor===null||f.premioValor===undefined?'':f.premioValor}"
                       oninput="onMetaFormChange(this,'premioValor')" />
              </div>
            </label>
          </div>

          <div class="meta-form-preview">
            ${f.premioTipo==='fixo'
              ? 'Ex: batendo o alvo, a pessoa ganha o valor fixo, não importa quanto passou.'
              : 'A porcentagem incide sobre o <b>total faturado</b>, não sobre o que passou do alvo. Ex: alvo de R$ 200.000 com 1% — se a empresa faturar R$ 400.000, o prêmio é R$ 4.000.'}
          </div>

          <div class="modal-actions">
            <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="modal-btn modal-btn-primary" onclick="salvarMeta()">${novo ? 'Criar meta' : 'Salvar'}</button>
          </div>
        </div>
      </div>
    `;
  }
  let bodyHtml = `<div class="modal-msg">${esc(m.message)}</div>`;
  let actionsHtml = '';
  let wideClass = '';
  if(m.type === 'confirm'){
    actionsHtml = `
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn modal-btn-danger" onclick="confirmModal()">${esc(m.confirmLabel)}</button>
    `;
  } else if(m.type === 'prompt'){
    bodyHtml += `<input id="modal-input" class="modal-input" type="text" autofocus
      oninput="onModalInputChange(this)" onkeydown="onModalInputKey(this, event)" />`;
    actionsHtml = `
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn modal-btn-primary" onclick="confirmModal()">Adicionar</button>
    `;
  } else if(m.type === 'export'){
    wideClass = ' modal-box-wide';
    bodyHtml += `<textarea id="modal-textarea" class="modal-textarea" readonly onclick="this.select()">${esc(m.value)}</textarea>`;
    actionsHtml = `<button class="modal-btn modal-btn-primary" onclick="closeModal()">Fechar</button>`;
  } else if(m.type === 'import'){
    wideClass = ' modal-box-wide';
    bodyHtml += `<textarea id="modal-textarea" class="modal-textarea" placeholder="Cole aqui o texto exportado..." oninput="onModalTextareaChange(this)"></textarea>`;
    if(m.error) bodyHtml += `<div class="modal-error">${esc(m.error)}</div>`;
    actionsHtml = `
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn modal-btn-primary" onclick="confirmModal()">Restaurar</button>
    `;
  } else {
    actionsHtml = `<button class="modal-btn modal-btn-primary" onclick="closeModal()">OK</button>`;
  }
  return `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal-box${wideClass}">
        ${bodyHtml}
        <div class="modal-actions">${actionsHtml}</div>
      </div>
    </div>
  `;
}

function csvNum(v){ return (Number(v)||0).toFixed(2).replace('.', ','); }

function exportResumoCSV(){
  try{
    const sellerBreakdown = getSellerBreakdown();
    const partnerBreakdown = getPartnerBreakdown();
    const scope = partnerMonthFilter === "Todos" ? ('Ano '+yearFilter) : (partnerMonthFilter+'/'+yearFilter);
    let csv = 'Resumo de Comissoes - ' + scope + '\n\n';

    csv += 'VENDEDORAS\n';
    csv += 'Vendedora;Sistema;Consultoria;Orgaos Publicos;Cursos;Bonus;Total\n';
    sellersForCurrentUser().forEach(s => {
      const b = sellerBreakdown[s.label] || {sistema:0,consultoria:0,publicos:0,cursos:0,bonus:0};
      const total = b.sistema+b.consultoria+b.publicos+b.cursos+b.bonus;
      csv += [s.label, csvNum(b.sistema), csvNum(b.consultoria), csvNum(b.publicos), csvNum(b.cursos), csvNum(b.bonus), csvNum(total)].join(';') + '\n';
    });

    csv += '\nPARCEIROS\n';
    csv += 'Parceiro;Sistema;Consultoria;Orgaos Publicos;Cursos;Total\n';
    partners.forEach(p => {
      const b = partnerBreakdown[p] || {sistema:0,consultoria:0,publicos:0,cursos:0};
      const total = b.sistema+b.consultoria+b.publicos+b.cursos;
      csv += [p, csvNum(b.sistema), csvNum(b.consultoria), csvNum(b.publicos), csvNum(b.cursos), csvNum(total)].join(';') + '\n';
    });

    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'resumo-comissoes-' + yearFilter + (partnerMonthFilter!=="Todos" ? '-'+partnerMonthFilter : '') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e){
    console.error('Falha ao exportar CSV', e);
    showAlert('Não foi possível gerar o arquivo. Tente novamente.');
  }
}

/* O fechamento em CSV: é o arquivo que a Soraya manda para a
   contabilidade, então sai com uma linha por pessoa e o total no fim. */
function exportFechamentoCSV(){
  try{
    const periodo = bonusFilter === 'Todos' ? ('Ano ' + yearFilter) : (bonusFilter + '/' + yearFilter);
    const linhas = fechamentoPagamentos(bonusFilter);
    let csv = 'Fechamento para a contabilidade - ' + periodo + '\n\n';
    csv += 'Pessoa;Sistema;Orgaos Publicos;Cursos;Bonus;Salario fixo;Total a pagar;Consultoria (a receber);Com Consultoria\n';
    const soma = {sistema:0, publicos:0, cursos:0, bonus:0, salario:0, aPagar:0, consultoria:0, comConsultoria:0};
    linhas.forEach(function(l){
      Object.keys(soma).forEach(function(k){ soma[k] += l[k]; });
      csv += [l.pessoa, csvNum(l.sistema), csvNum(l.publicos), csvNum(l.cursos), csvNum(l.bonus),
              csvNum(l.salario), csvNum(l.aPagar), csvNum(l.consultoria), csvNum(l.comConsultoria)].join(';') + '\n';
    });
    csv += ['TOTAL', csvNum(soma.sistema), csvNum(soma.publicos), csvNum(soma.cursos), csvNum(soma.bonus),
            csvNum(soma.salario), csvNum(soma.aPagar), csvNum(soma.consultoria), csvNum(soma.comConsultoria)].join(';') + '\n';
    csv += '\nA Consultoria nao entra no total a pagar: a comissao dela so se realiza quando o cliente paga.\n';

    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fechamento-' + yearFilter + (bonusFilter !== 'Todos' ? '-'+bonusFilter : '') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e){
    console.error('Falha ao exportar o fechamento', e);
    showAlert('Não foi possível gerar o arquivo. Tente novamente.');
  }
}

function applyImportedData(text){
  try{
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.rows)) throw new Error('formato inválido');

    rows = data.rows;
    migrateYear(rows, 2026);
    nextId = rows.length ? Math.max(...rows.map(r=>r.id||0)) + 1 : 1;

    ENTITY_KEYS.forEach(key => {
      // New export format: data.entities[key] / data.entities[key+'Vendors']
      // Old export format (pre Órgãos Públicos): data[key] / data[key+'Vendors']
      const rowsSrc = (data.entities && Array.isArray(data.entities[key])) ? data.entities[key]
        : (Array.isArray(data[key]) ? data[key] : null);
      const vendorsSrc = (data.entities && Array.isArray(data.entities[key+'Vendors']) && data.entities[key+'Vendors'].length) ? data.entities[key+'Vendors']
        : (Array.isArray(data[key+'Vendors']) && data[key+'Vendors'].length ? data[key+'Vendors'] : null);
      if(rowsSrc) state[key].rows = rowsSrc;
      if(vendorsSrc) state[key].vendors = vendorsSrc;
      migrateYear(state[key].rows, 2026);
      state[key].nextId = state[key].rows.length ? Math.max(...state[key].rows.map(r=>r.id||0)) + 1 : 1;
    });

    if(Array.isArray(data.bonusRows)){
      bonusRows = data.bonusRows;
      migrateYear(bonusRows, 2026);
      bonusNextId = bonusRows.length ? Math.max(...bonusRows.map(r=>r.id||0)) + 1 : 1;
    }
    if(Array.isArray(data.vendaProducts)) vendaProducts = data.vendaProducts;
    if(Array.isArray(data.partners)) partners = data.partners;
    if(Array.isArray(data.extraYears)) extraYears = data.extraYears;
    if(Array.isArray(data.closedMonths)) closedMonths = data.closedMonths;
    // metas mudaram de objeto (chave->valor) para lista de regras; backups
    // antigos vêm no formato velho e são descartados de propósito.
    if(Array.isArray(data.metas)){
      metas = data.metas;
      metasNextId = metas.length ? Math.max(...metas.map(m=>m.id||0)) + 1 : 1;
    }
    if(Array.isArray(data.sistemaSellers) && data.sistemaSellers.length) SELLERS = data.sistemaSellers;

    persist();
    ENTITY_KEYS.forEach(key => {
      persistEntityRows(key);
      persistEntityVendors(key);
    });
    persistBonus();
    persistVendaProducts();
    persistPartners();
    persistClosedMonths();
    persistMetas();
    persistSistemaSellers();
    persistExtraYears();

    return true;
  } catch(e){
    console.error('Falha ao importar', e);
    modalState.error = 'Não consegui ler esse texto — confira se colou exatamente o que foi exportado, sem cortar nada.';
    return false;
  }
}

function migrateYear(list, defaultYear){
  list.forEach(r => { if(r.ano === undefined || r.ano === null){ r.ano = defaultYear; } });
}

function getKnownYears(){
  const set = new Set();
  rows.forEach(r => { if(r.ano) set.add(r.ano); });
  ENTITY_KEYS.forEach(key => { state[key].rows.forEach(r => { if(r.ano) set.add(r.ano); }); });
  bonusRows.forEach(r => { if(r.ano) set.add(r.ano); });
  extraYears.forEach(y => set.add(y));
  set.add(yearFilter);
  set.add(new Date().getFullYear());
  return Array.from(set).sort((a,b) => a-b);
}

function uniqueSellerKey(name){
  let base = slug(name) || 'vendedor';
  let key = base;
  let i = 2;
  while(SELLERS.some(s => s.key === key)){
    key = base + '-' + i;
    i++;
  }
  return key;
}

function addSistemaVendedor(){
  showPrompt("Nome da nova vendedora/vendedor:", (name) => {
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    if(SELLERS.some(s => s.label.toLowerCase() === trimmed.toLowerCase())){
      showAlert("Essa pessoa já está na lista.");
      return;
    }
    const key = uniqueSellerKey(trimmed);
    const color = VENDOR_PALETTE[SELLERS.length % VENDOR_PALETTE.length];
    SELLERS.push({key, label: trimmed, color});
    persistSistemaSellers();
  });
}

function parsePercent(v){

}

function isVendasRowPending(r){
  const hasContent = (r.cliente && r.cliente.trim()) || (r.venda && r.venda.trim());
  if(!hasContent) return false;
  if(!r.valor || Number(r.valor) <= 0) return true;
  if(r.parceiro && !(Number(r.participacao) > 0)) return true;
  return false;
}
function isVendasRowDuplicate(r){
  if(!r.cliente || !r.cliente.trim()) return false;
  const name = r.cliente.trim().toLowerCase();
  return rows.some(x => x.id !== r.id && x.mes === r.mes && (x.ano||2026) === (r.ano||2026) && x.cliente && x.cliente.trim().toLowerCase() === name);
}
function isEntityRowDuplicate(key, r){
  const mainField = ENTITIES[key].fields[0].key;
  if(!r[mainField] || !r[mainField].trim()) return false;
  const name = r[mainField].trim().toLowerCase();
  return state[key].rows.some(x => x.id !== r.id && x.mes === r.mes && (x.ano||2026) === (r.ano||2026) && x[mainField] && x[mainField].trim().toLowerCase() === name);
}
function isEntityRowPending(r){
  const mainVal = Object.values(r).some(v => typeof v === 'string' && v.trim());
  if(!r.valorContrato || Number(r.valorContrato) <= 0) return true;
  if(r.vendedor && !(Number(r.comissaoPercent) > 0)) return true;
  if(r.vendedor2 && !(Number(r.comissaoPercent2) > 0)) return true;
  if(r.vendedor3 && !(Number(r.comissaoPercent3) > 0)) return true;
  if(r.parceiro && !(Number(r.participacao) > 0)) return true;
  if(Array.isArray(r.extraVendedores) && r.extraVendedores.some(ev => ev.vendedor && !(Number(ev.percent) > 0))) return true;
  return false;
}
function isBonusRowPending(r){
  if(!r.vendedor) return true;
  if(!r.valor || Number(r.valor) <= 0) return true;
  return false;
}

function getPagamentosRealizados(){

  });
  ENTITY_KEYS.forEach(key => {

/* ---------------- Comissões por status de recebimento ----------------
   A consultoria só recebe quando o cliente paga a nota. Como cada
   lançamento já tem "Pago" + mês do pagamento, dá pra separar o que já
   está liberado do que ainda depende do cliente pagar — e mostrar, por
   pessoa, de qual cliente veio cada valor.
   Uma conta restrita só enxerga as próprias linhas: o banco já devolve
   os lançamentos dela com o vendedor/percentual dos colegas em branco. */
function getComissoesPorStatus(pago){
  const out = [];

  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(!!r.pago !== pago) return;
    SELLERS.forEach(s => {
      const comissao = Number(r[s.key])||0;
      if(comissao <= 0) return;
      out.push({
        vendedor: s.label, origem: 'Sistema', cliente: r.cliente || r.venda || '—',
        mesVenda: r.mes, mesPagamento: r.mesPagamento || null,
        valorPago: Number(r.valor)||0, pct: null, comissao: comissao,
      });
    });
  });

  ENTITY_KEYS.forEach(key => {
    if(!ENTITIES[key].hasPagamento) return;
    const mainField = ENTITIES[key].fields[0].key;
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      if(!!r.pago !== pago) return;
      const base = entityRemainingAfterPartner(r);
      getRowSellerAssignments(r).forEach(a => {
        const comissao = base * (a.percent/100);
        if(comissao <= 0) return;
        out.push({
          vendedor: a.vendedor, origem: ENTITIES[key].tabLabel, cliente: r[mainField] || '—',
          mesVenda: r.mes, mesPagamento: r.mesPagamento || null,
          valorPago: Number(r.valorContrato)||0, pct: a.percent, comissao: comissao,
        });
      });
    });
  });

  return out;
}

function agruparPorVendedor(lista){
  const por = {};
  lista.forEach(e => {
    if(!por[e.vendedor]) por[e.vendedor] = {total:0, itens:[]};
    por[e.vendedor].total += e.comissao;
    por[e.vendedor].itens.push(e);
  });
  return Object.keys(por).sort((a,b) => por[b].total - por[a].total)
    .map(nome => ({nome, total: por[nome].total, itens: por[nome].itens}));
}
