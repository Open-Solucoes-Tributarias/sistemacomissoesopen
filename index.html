<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://ogkrrlssdrtctdyyvkql.supabase.co; base-uri 'none'; object-src 'none'; form-action 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Comissões — Equipe Comercial</title>
</head>
<body>
<div id="root"></div>
<style>
  :root{
    --bg:#F6F7FB;
    --surface:#FFFFFF;
    --ink:#14162B;
    --ink-soft:#6B7280;
    --ink-faint:#9CA3AF;
    --border:#E7E9F3;
    --border-soft:#F0F1F8;
    --primary:#5046E5;
    --primary-hover:#4038CC;
    --primary-soft:#EEECFE;
    --ring:#C7C2FB;
    --danger:#EF4444;
    --danger-soft:#FEECEC;
    --shadow-sm:0 1px 2px rgba(20,22,43,.04), 0 1px 1px rgba(20,22,43,.03);
    --shadow-md:0 4px 14px rgba(20,22,43,.06), 0 1px 3px rgba(20,22,43,.04);
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body,#root{margin:0;padding:0;}
  #root{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    min-height:100vh;
    padding:24px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:100%;margin:0 auto;}

  /* Header */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:16px;margin-bottom:22px;
  }
  .company-name{
    font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--primary);margin-bottom:4px;
  }
  .title-block h1{
    font-size:24px;font-weight:800;letter-spacing:-0.02em;
    margin:0 0 4px;color:var(--ink);
  }
  .title-block .sub{font-size:14px;color:var(--ink-soft);font-weight:500;}
  .topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .year-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .year-row-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .year-pill{font-weight:800;}
  .year-pill.year-add{color:var(--primary);}
  .year-pill.year-add:hover{background:var(--primary-soft);}
  .save-chip{
    display:flex;align-items:center;gap:7px;
    font-size:12.5px;font-weight:600;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--border);
    padding:7px 13px 7px 10px;border-radius:999px;box-shadow:var(--shadow-sm);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#22C55E;transition:background .25s;}
  .dot.saving{background:var(--primary);animation:pulse 1s infinite;}
  .dot.error{background:var(--danger);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .storage-warning{
    background:var(--danger-soft);border:1px solid #F5B5B5;color:#9A2E2E;
    border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:18px;
    font-size:13px;font-weight:600;line-height:1.5;
  }
  .storage-warning.read-only-notice{
    background:var(--primary-soft);border-color:var(--ring);color:var(--primary);
  }
  .read-only-badge{
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
    background:var(--primary-soft);color:var(--primary);padding:3px 8px;border-radius:999px;
  }

  /* Modo somente leitura: some com tudo que edita/apaga e trava os campos */
  .read-only-mode .btn-add,
  .read-only-mode .action-btn,
  .read-only-mode .admin-only-btn,
  .read-only-mode .year-add{
    display:none !important;
  }
  .read-only-mode tbody td input,
  .read-only-mode tbody td select,
  .read-only-mode .meta-input-wrap input{
    pointer-events:none;background:var(--border-soft);color:var(--ink-soft);
  }
  .read-only-mode tbody td input[type="checkbox"]{
    pointer-events:none;opacity:.55;
  }

  .metas-panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);padding:16px 18px;margin-bottom:26px;
  }
  .meta-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
  .meta-row:last-child{border-bottom:none;}
  .meta-name{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;width:110px;flex:none;}
  .meta-input-wrap{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px;width:140px;flex:none;}
  .meta-input-wrap input{border:none;background:transparent;width:100%;font-size:13px;padding:3px 0;outline:none;}
  .meta-bar-track{flex:1;height:10px;background:var(--border-soft);border-radius:999px;overflow:hidden;}
  .meta-bar-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s;}
  .meta-bar-fill.complete{background:#22C55E;}
  .meta-pct{width:44px;text-align:right;font-weight:800;font-size:13px;flex:none;}

  .chart-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);padding:18px 18px 10px;margin-bottom:26px;
  }

  tr.row-pending{background:#FFF8E8;}
  tr.row-pending:hover{background:#FFF2D6;}
  tr.row-locked{background:#F3F3F6;}
  tr.row-locked input, tr.row-locked select{color:var(--ink-faint);}
  .pending-badge{margin-left:4px;font-size:11px;vertical-align:middle;}
  .parcela-badge{
    display:inline-block;margin-left:4px;font-size:10px;font-weight:700;
    background:var(--primary-soft);color:var(--primary);padding:2px 6px;border-radius:999px;
    vertical-align:middle;white-space:nowrap;
  }
  .dup-badge{
    display:inline-block;margin-left:4px;font-size:10px;font-weight:700;
    background:#EDE9FE;color:#6D28D9;padding:2px 6px;border-radius:999px;
    vertical-align:middle;white-space:nowrap;
  }
  tr.row-duplicate{background:#F5F3FF;}
  tr.row-duplicate:hover{background:#EDE9FE;}

  .pagamento-cell{padding:8px 10px !important;}
  .pay-toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .pay-toggle input{width:15px;height:15px;accent-color:#22C55E;cursor:pointer;}
  .pagamento-cell select{margin-top:4px;font-size:11.5px;padding:4px 6px !important;}

  @media print{
    .topbar-actions, .tabs-nav, .filters-row, .toolbar, .kpi-toggle-row, .row-actions, .del-cell, .search-row, .year-row{
      display:none !important;
    }
    body, #root{ background:#fff; }
    .table-card, .chart-card, .metas-panel{ box-shadow:none; border:1px solid #999; break-inside:avoid; }
    input, select{ border:none !important; background:transparent !important; color:#000 !important; }
    .kpi-value.masked{ display:none; }
    /* No papel tudo sai aberto, mesmo o que estiver minimizado na tela */
    .sections-toolbar, .panel-chevron{ display:none !important; }
    .panel .panel-body, .panel.collapsed .panel-body{ display:block !important; }
    .panel{ box-shadow:none; border:1px solid #999; break-inside:avoid; }
    .panel-head{ border-bottom:1px solid #999 !important; }
  }

  /* Tabs nav */
  .tabs-nav{
    display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border);
  }
  .tab-btn{
    font-family:var(--font);font-weight:700;font-size:14.5px;
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    padding:11px 4px;margin-right:26px;border-bottom:2.5px solid transparent;
    transition:all .15s;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}

  /* KPI cards */
  .kpis{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;margin-bottom:26px;
  }
  .kpi-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:16px 16px 14px;
    box-shadow:var(--shadow-sm);
    border-left:3px solid var(--kc,var(--primary));
    transition:transform .15s, box-shadow .15s;
    min-width:0;
  }
  .kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .kpi-card .kpi-label{
    font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-faint);margin-bottom:8px;display:flex;align-items:center;gap:6px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .kpi-dot{width:8px;height:8px;border-radius:50%;background:var(--kc,var(--primary));flex:none;}
  .kpi-card .kpi-value{
    font-size:19px;font-weight:800;letter-spacing:-0.01em;color:var(--ink);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .kpi-card.total{
    background:linear-gradient(135deg,var(--ink) 0%,#2A2D4F 100%);
    border-left:none;
  }
  .kpi-card.total .kpi-label{color:rgba(255,255,255,.55);}
  .kpi-card.total .kpi-value{color:#fff;font-size:20px;}

  .kpi-toggle-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .resumo-section-title{
    font-size:13px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;
    letter-spacing:.04em;margin:0 0 10px;
  }
  .eye-toggle{
    font-family:var(--font);font-weight:700;font-size:12.5px;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:7px 14px;cursor:pointer;color:var(--ink-soft);box-shadow:var(--shadow-sm);
    transition:all .15s;
  }
  .eye-toggle:hover{border-color:var(--primary);color:var(--primary);}
  .danger-toggle:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .kpi-value.masked{letter-spacing:3px;color:var(--ink-faint);font-weight:800;}

  /* Month / vendor pills */
  .filters-row{
    display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center;
  }
  .months{
    display:flex;gap:4px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--border);
    padding:5px;border-radius:999px;
    box-shadow:var(--shadow-sm);width:fit-content;max-width:100%;overflow-x:auto;
  }
  .months.seller-filter{background:var(--border-soft);border-color:var(--border);}
  .seller-pill.active{
    background:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(20,22,43,.25);
  }

  .search-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .search-input{
    font-family:var(--font);font-size:13px;font-weight:500;
    padding:9px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);color:var(--ink);outline:none;
    min-width:190px;flex:1 1 190px;box-shadow:var(--shadow-sm);
    transition:border-color .15s, box-shadow .15s;
  }
  .search-input::placeholder{color:var(--ink-faint);font-weight:400;}
  .search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .pill{
    font-size:13px;font-weight:600;letter-spacing:-0.005em;
    padding:8px 15px;border-radius:999px;border:none;
    background:transparent;color:var(--ink-soft);cursor:pointer;
    transition:all .15s;white-space:nowrap;
  }
  .pill:hover{color:var(--ink);background:var(--border-soft);}
  .pill.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(80,70,229,.35);}

  /* Toolbar */
  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;flex-wrap:wrap;gap:10px;
  }
  .count{font-size:13.5px;color:var(--ink-soft);font-weight:500;}
  .count b{color:var(--ink);font-weight:700;}
  .btn-row{display:flex;gap:8px;}
  .btn-add{
    font-family:var(--font);font-weight:700;font-size:13.5px;
    background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);
    padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    box-shadow:0 2px 10px rgba(80,70,229,.30);
    transition:background .15s, transform .1s;
  }
  .btn-add:hover{background:var(--primary-hover);}
  .btn-add:active{transform:scale(.97);}
  .btn-secondary{
    background:var(--surface);color:var(--ink);border:1px solid var(--border);
    box-shadow:none;
  }
  .btn-secondary:hover{background:var(--border-soft);}

  /* Table */
  .table-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
    overflow:hidden;
  }
  .table-scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;table-layout:auto;}
  thead th{
    background:var(--surface);color:var(--ink-faint);
    font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    text-align:left;padding:12px 10px 10px;white-space:nowrap;
    border-bottom:1px solid var(--border);
  }
  thead th.num{text-align:right;}
  thead th .th-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;}
  tbody td{padding:0;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tbody tr{transition:background .1s;}
  tbody tr:hover{background:#FAFAFE;}
  tbody tr:last-child td{border-bottom:none;}
  tbody td input, tbody td select{
    width:100%;border:none;background:transparent;
    font-family:var(--font);font-size:12.5px;color:var(--ink);font-weight:500;
    padding:8px 8px;outline:none;border-radius:0;
  }
  tbody td select{font-weight:600;cursor:pointer;color:var(--primary);}
  tbody td input.num{text-align:right;font-variant-numeric:tabular-nums;}
  tbody td input::placeholder{color:var(--ink-faint);font-weight:400;}
  tbody td input:focus, tbody td select:focus{
    background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--ring);border-radius:6px;
  }
  td.cliente input{min-width:230px;}
  td.venda select{min-width:150px;}
  .col-valor{width:105px;}
  .currency-wrap{display:flex;align-items:center;}
  .currency-wrap input{text-align:right;padding-left:2px;}
  .currency-prefix{
    display:inline-block;color:var(--ink-faint);font-size:12px;font-weight:600;
    padding-left:8px;user-select:none;flex:none;
  }
  .pct-wrap{display:flex;align-items:center;justify-content:flex-end;}
  .pct-wrap input{text-align:right;padding-right:2px;}
  .pct-suffix{color:var(--ink-faint);font-size:12px;font-weight:600;padding-right:10px;user-select:none;}
  .pct-disabled{display:block;text-align:right;padding-right:14px;color:var(--ink-faint);}
  .col-pct{width:110px;}
  .extra-vendedores-btn{
    background:var(--primary-soft);border:1px solid var(--ring);color:var(--primary);
    font-family:var(--font);font-weight:700;font-size:11.5px;
    padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;
    transition:all .15s;
  }
  .extra-vendedores-btn:hover{background:var(--ring);}
  .extra-vendedor-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .extra-vendedor-row{display:flex;align-items:center;gap:8px;}
  .extra-vendedor-row select{
    flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-family:var(--font);font-size:13px;color:var(--ink);background:var(--surface);
  }
  .extra-vendedor-row .pct-wrap{width:100px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px 0;}
  .calc-value{
    text-align:right;padding:0 14px 8px;font-size:11px;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;font-weight:600;
  }
  .del-cell{width:96px;text-align:center;}
  .row-actions{display:flex;gap:2px;justify-content:center;opacity:0;transition:opacity .15s;}
  tr:hover .row-actions{opacity:1;}
  .action-btn{
    background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:13.5px;
    width:26px;height:26px;border-radius:7px;
    display:inline-flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .action-btn:hover{background:var(--primary-soft);color:var(--primary);}
  .action-btn.danger:hover{background:var(--danger-soft);color:var(--danger);}

  .empty-row td{padding:48px 10px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .empty-row .empty-icon{font-size:26px;display:block;margin-bottom:8px;}

  .footnote{margin-top:16px;text-align:right;}
  .reset-link{
    font-size:12px;color:var(--ink-faint);background:none;border:none;cursor:pointer;
    font-family:var(--font);font-weight:600;padding:6px 10px;border-radius:6px;
    transition:all .15s;
  }
  .reset-link:hover{color:var(--danger);background:var(--danger-soft);}

  @media (max-width:980px){
    .kpis{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width:560px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    #root{padding:20px 14px 60px;}
  }

  /* Modal (replaces native confirm/prompt/alert, which can be blocked in sandboxed iframes) */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,22,43,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:1000;padding:20px;
  }
  .modal-box{
    background:var(--surface);border-radius:var(--radius-lg);
    box-shadow:0 20px 50px rgba(20,22,43,.25);
    padding:22px;max-width:380px;width:100%;
  }
  .modal-box.modal-box-wide{max-width:640px;}
  .modal-textarea{
    width:100%;min-height:220px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-family:'Courier New',Consolas,monospace;font-size:12px;color:var(--ink);outline:none;
    margin-bottom:12px;resize:vertical;background:var(--border-soft);
  }
  .modal-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .modal-error{
    font-size:13px;color:var(--danger);font-weight:600;margin:-4px 0 12px;
  }
  .modal-msg{font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.5;margin-bottom:14px;}
  .modal-input{
    width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-family:var(--font);font-size:14px;color:var(--ink);outline:none;margin-bottom:16px;
  }
  .modal-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  .modal-btn{
    font-family:var(--font);font-weight:700;font-size:13.5px;
    border:none;border-radius:var(--radius-sm);padding:9px 16px;cursor:pointer;
    transition:opacity .15s;
  }
  .modal-btn:hover{opacity:.88;}
  .modal-btn-ghost{background:var(--border-soft);color:var(--ink-soft);}
  .modal-btn-primary{background:var(--primary);color:#fff;}
  .modal-btn-danger{background:var(--danger);color:#fff;}

  /* Auth (login / recuperar senha) */
  .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:34px 30px;max-width:380px;width:100%;}
  .auth-logo{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:6px;}
  .auth-card h1{font-size:20px;margin:0 0 4px;font-weight:800;color:var(--ink);}
  .auth-card .auth-sub{font-size:13px;color:var(--ink-soft);margin:0 0 22px;font-weight:500;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .auth-input-wrap{position:relative;}
  .auth-input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:14px;color:var(--ink);outline:none;}
  .auth-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .auth-input-wrap .auth-input{padding-right:44px;}
  .auth-toggle-pwd{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:12.5px;font-weight:700;padding:6px 8px;border-radius:6px;}
  .auth-toggle-pwd:hover{color:var(--primary);background:var(--primary-soft);}
  .auth-error{background:var(--danger-soft);color:#9A2E2E;border:1px solid #F5B5B5;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px;line-height:1.4;}

const AUTH_STORAGE_KEY = 'comissoes_auth_session_v1';

async function loadCurrentUserAccess(){

    const rows = await sbSelect('app_user_access', 'select=full_access,person_name');

function loadStoredAuthSession(){
  try{
    const raw = localStorage.getItem(AUTH_STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.access_token || !parsed.refresh_token) return null;
    return parsed;
  } catch(e){ return null; }
}
function storeAuthSession(session){
  authSession = session;
  try{
    if(session) localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
    else localStorage.removeItem(AUTH_STORAGE_KEY);
  } catch(e){ /* localStorage indisponível (ex: modo privado) — sessão fica só em memória */ }
}
function sessionFromAuthResponse(data){
  return {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + (Number(data.expires_in || 3600) * 1000),
    user: data.user ? { id: data.user.id, email: data.user.email } : null,
  };
}
async function authFetch(path, body, extraHeaders){
  const res = await fetch(SUPABASE_URL + path, {
    method: 'POST',
    headers: Object.assign({ 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, extraHeaders || {}),
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(function(){ return {}; });
  if(!res.ok){
    const err = new Error((data && (data.error_description || data.msg || data.message)) || 'Falha na autenticação.');
    err.status = res.status;
    throw err;
  }
  return data;
}
async function ensureFreshToken(){
  if(!authSession) return null;
  if(authSession.expires_at - Date.now() > 60000) return authSession.access_token;
  if(!authRefreshPromise){
    authRefreshPromise = authFetch('/auth/v1/token?grant_type=refresh_token', { refresh_token: authSession.refresh_token })
      .then(function(data){ storeAuthSession(sessionFromAuthResponse(data)); return authSession.access_token; })
      .catch(function(){ storeAuthSession(null); return null; })
      .finally(function(){ authRefreshPromise = null; });
  }
  return authRefreshPromise;
}

async function login(email, password){

    renderAuthScreen();
  }
}
function logout(){
  const token = authSession && authSession.access_token;

  if(token){

  }
  location.reload();
}
async function requestPasswordRecovery(email){
  authLoading = true; authError = ''; authNotice = ''; renderAuthScreen();

  authLoading = false;
  authNotice = 'Se esse e-mail estiver cadastrado, enviamos um link pra redefinir a senha. Confira sua caixa de entrada.';

}
async function submitNewPassword(newPassword){
  authLoading = true; authError = ''; renderAuthScreen();
  try{
    if(!authRecoveryToken) throw new Error('Link inválido ou expirado.');
    const res = await fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + authRecoveryToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: newPassword }),
    });
    const data = await res.json().catch(function(){ return {}; });
    if(!res.ok) throw new Error((data && (data.error_description || data.msg)) || 'Falha ao redefinir senha.');
    authRecoveryToken = null;
    authScreen = 'login';
    authNotice = 'Senha alterada! Faça login com a nova senha.';
    authLoading = false;
    history.replaceState(null, '', window.location.pathname + window.location.search);
    renderAuthScreen();
  } catch(e){
    authLoading = false;
    authError = 'Não foi possível redefinir a senha. Peça um novo link em "Esqueci minha senha".';
    renderAuthScreen();
  }
}

async function sb(path, opts){
  opts = opts || {};
  const token = await ensureFreshToken();
  if(!token){
    renderAuthScreen();
    throw new Error('Sessão expirada. Faça login novamente.');
  }
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json',
  }, opts.headers || {});
  const res = await fetch(SUPABASE_URL + path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if(res.status === 401){
    storeAuthSession(null);
    renderAuthScreen();
    throw new Error('Sessão expirada. Faça login novamente.');
  }
  if(!res.ok){
    const text = await res.text().catch(function(){ return ''; });
    throw new Error('Supabase ' + res.status + ': ' + text);
  }
  if(res.status === 204) return null;
  const ct = res.headers.get('content-type') || '';
  if(ct.indexOf('application/json') !== -1) return res.json();
  return null;
}
/* Leitura passa pelas views "_safe": elas escondem, linha a linha, os
   vendedores/percentuais que não são da pessoa logada. Para admin as views
   devolvem tudo. A escrita continua indo direto nas tabelas base (só admin
   tem permissão de escrever nelas). */
const READ_VIEWS = {
  vendas: 'vendas_safe',
  lancamentos: 'lancamentos_safe',
  lancamentos_extra_vendedores: 'lancamentos_extra_vendedores_safe',
};
function sbSelect(table, query){
  const source = READ_VIEWS[table] || table;
  return sb('/rest/v1/' + source + (query ? '?' + query : ''), { method: 'GET' });
}
function sbUpsert(table, rows, onConflict){
  if(!rows || rows.length === 0) return Promise.resolve();
  return sb('/rest/v1/' + table + '?on_conflict=' + (onConflict||'id'), {
    method: 'POST',
    headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: rows,
  });
}
function sbDeleteIn(table, column, values){
  if(!values || values.length === 0) return Promise.resolve();
  const list = values.map(function(v){ return typeof v === 'string' ? '"'+v.replace(/"/g,'')+'"' : v; }).join(',');
  return sb('/rest/v1/' + table + '?' + column + '=in.(' + list + ')', { method:'DELETE', headers:{'Prefer':'return=minimal'} });
}
function sbDeleteAll(table, filter){
  return sb('/rest/v1/' + table + '?' + filter, { method:'DELETE', headers:{'Prefer':'return=minimal'} });
}

const VENDA_NON_SELLER_FIELDS = new Set(['id','ano','mes','cliente','venda','valor','parceiro','participacao','formaPagamento','colaborador','observacoes','vendedor2','vendedor3','pago','mesPagamento','parcelaLabel']);

function persist(){
  saving = true; updateSaveStatus();
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    (async function(){
      try{
        const dbRows = rows.map(function(r){
          return {
            id: r.id, ano: r.ano||2026, mes: r.mes, cliente: r.cliente||'', venda: r.venda||'',
            valor: r.valor, parceiro: r.parceiro||'', participacao: r.participacao,
            forma_pagamento: r.formaPagamento||'', colaborador: r.colaborador||'', observacoes: r.observacoes||'',
            vendedor2: r.vendedor2||'', vendedor3: r.vendedor3||'', pago: !!r.pago, mes_pagamento: r.mesPagamento||null,
            parcela_label: r.parcelaLabel || null,
          };
        });
        await sbUpsert('vendas', dbRows, 'id');

        const existing = (await sbSelect('vendas','select=id')) || [];
        const localIds = rows.map(function(r){ return r.id; });
        const toDelete = existing.map(function(x){ return x.id; }).filter(function(id){ return localIds.indexOf(id) === -1; });
        if(toDelete.length) await sbDeleteIn('vendas','id', toDelete);

        const comissaoRows = [];
        rows.forEach(function(r){
          Object.keys(r).forEach(function(k){
            if(VENDA_NON_SELLER_FIELDS.has(k)) return;
            comissaoRows.push({ venda_id: r.id, seller_key: k, valor: (r[k]===undefined?null:r[k]) });
          });
        });
        if(comissaoRows.length) await sbUpsert('vendas_comissoes', comissaoRows, 'venda_id,seller_key');
        saveError = false;
      } catch(e){
        console.error('Falha ao salvar vendas', e);
        saveError = true;
      } finally {
        saving = false; updateSaveStatus();
      }
    })();
  }, 450);
}

function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

/* ---------------- Painéis recolhíveis ----------------
   Cada bloco de tabela/resumo vira um painel que a pessoa pode minimizar.
   O que está aberto/fechado fica salvo no navegador de quem usa (não vai
   pro banco), então cada um monta a tela do jeito que preferir. */
const COLLAPSE_KEY = 'comissoes_paineis_v1';
let collapsedSections = {};
try{
  collapsedSections = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}') || {};
} catch(e){ collapsedSections = {}; }

function isSectionCollapsed(id){ return !!collapsedSections[id]; }
function toggleSection(id){
  collapsedSections[id] = !collapsedSections[id];
  try{ localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsedSections)); } catch(e){}
  const el = document.getElementById('sec-'+id);
  if(el){
    el.classList.toggle('collapsed', collapsedSections[id]);
    const btn = el.querySelector('.panel-toggle');
    if(btn) btn.setAttribute('aria-expanded', collapsedSections[id] ? 'false' : 'true');
  }
}
function setAllSections(collapsed){
  document.querySelectorAll('.panel[id^="sec-"]').forEach(function(el){
    collapsedSections[el.id.slice(4)] = collapsed;
  });
  try{ localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsedSections)); } catch(e){}
  render();
}

/* panel(id, titulo, corpo, {meta, actions, flush})
   `titulo`, `meta` e `actions` entram como HTML — quem chama escapa o texto. */
function panel(id, title, bodyHtml, opts){
  opts = opts || {};
  const collapsed = isSectionCollapsed(id);
  return `
    <section class="panel${collapsed ? ' collapsed' : ''}" id="sec-${id}">
      <div class="panel-head">
        <button type="button" class="panel-toggle" aria-expanded="${collapsed ? 'false' : 'true'}"
                aria-controls="secbody-${id}" onclick="toggleSection('${id}')">
          <span class="panel-chevron" aria-hidden="true"></span>
          <span class="panel-title">${title}</span>
        </button>
        <div class="panel-head-right">
          ${opts.meta ? `<span class="panel-meta">${opts.meta}</span>` : ''}
          ${opts.actions || ''}
        </div>
      </div>
      <div class="panel-body${opts.flush ? ' panel-body-flush' : ''}" id="secbody-${id}">${bodyHtml}</div>
    </section>
  `;
}

function titleCase(str){
  if(str===null || str===undefined || str==='') return str;
  return String(str).split(' ').map(w => w.length ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : w).join(' ');
}

    () => {
      rows.forEach(r => {
        r.cliente = titleCase(r.cliente);
        r.venda = titleCase(r.venda);
        r.parceiro = titleCase(r.parceiro);
        r.colaborador = titleCase(r.colaborador);
        r.formaPagamento = titleCase(r.formaPagamento);
      });
      vendaProducts = Array.from(new Set(vendaProducts.map(p => titleCase(p)))).sort((a,b)=>a.localeCompare(b,'pt-BR'));
      persist();
      persistVendaProducts();

      ENTITY_KEYS.forEach(key => {

          r[mainField] = titleCase(r[mainField]);

          r.formaPagamento = titleCase(r.formaPagamento);

}
function slug(s){

}

/* ---------------- Custom modal (confirm / prompt / alert) ----------------
   Native window.confirm/prompt/alert can be silently blocked inside a
   sandboxed artifact iframe, which made buttons look unresponsive.
   This in-app modal replaces them so actions always work. */

function showConfirm(message, onConfirm, confirmLabel){
  modalState = {type:'confirm', message, onConfirm, confirmLabel: confirmLabel || 'Excluir'};
  render();
}
function showPrompt(message, onSubmit){
  modalState = {type:'prompt', message, value:'', onSubmit};
  render();
}
function showAlert(message){
  modalState = {type:'alert', message};
  render();
}
function closeModal(){
  modalState = null;
  render();
}
function confirmModal(){
  if(!modalState) return;
  const m = modalState;
  if(m.type === 'import'){
    const ok = applyImportedData(m.value || '');
    if(ok){ modalState = null; }
    render();
    return;
  }
  modalState = null;
  if(m.type === 'confirm' && m.onConfirm) m.onConfirm();
  else if(m.type === 'prompt' && m.onSubmit) m.onSubmit(m.value);
  render();
}
function onModalInputChange(el){
  if(modalState) modalState.value = el.value;
}
function onModalInputKey(el, ev){
  if(ev.key === 'Enter'){ confirmModal(); }
  else if(ev.key === 'Escape'){ closeModal(); }
}
function onModalTextareaChange(el){
  if(modalState) modalState.value = el.value;
}
function renderModal(){
  if(!modalState) return '';
  const m = modalState;
  if(m.type === 'manage-sellers'){
    let bodyHtml = `<div class="modal-msg">Vendedoras do Sistema</div>`;
    bodyHtml += `<div class="extra-vendedor-list">` + SELLERS.map(s => `
      <div class="extra-vendedor-row">
        <span style="display:flex;align-items:center;gap:8px;flex:1;font-weight:600;font-size:13.5px;"><span class="th-dot" style="background:${s.color}"></span>${esc(s.label)}</span>
        <button class="action-btn danger" title="Remover" onclick="removeSistemaVendedor('${s.key}')">✕</button>
      </div>
    `).join('') + `</div>`;
    bodyHtml += `<button class="modal-btn modal-btn-ghost" style="width:100%;margin-top:10px;" onclick="addSistemaVendedor()">+ Adicionar vendedora</button>`;
    return `
      <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
        <div class="modal-box modal-box-wide">
          ${bodyHtml}
          <div class="modal-actions"><button class="modal-btn modal-btn-primary" onclick="closeModal()">Fechar</button></div>
        </div>
      </div>
    `;
  }
  if(m.type === 'meta-form'){
    const f = m.meta;
    const novo = f.id === null;
    const vendedorOptions = SELLERS.map(x =>
      `<option value="${esc(x.label)}" ${f.vendedor===x.label?'selected':''}>${esc(x.label)}</option>`).join('');
    const origemOptions = META_ORIGENS.map(o =>
      `<option value="${o.key}" ${f.origem===o.key?'selected':''}>${esc(o.label)}</option>`).join('');
    return `
      <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
        <div class="modal-box modal-box-wide">
          <div class="modal-msg">${novo ? 'Nova meta' : 'Editar meta'} — ${esc(f.mes)}/${f.ano}</div>
          ${m.error ? `<div class="modal-error">${esc(m.error)}</div>` : ''}

          <div class="meta-form-grid">
            <label class="meta-field">
              <span>Quem recebe o prêmio</span>
              <select onchange="onMetaFormChange(this,'vendedor')">
                <option value="">— escolher —</option>${vendedorOptions}
              </select>
            </label>
            <label class="meta-field">
              <span>Onde o faturamento é medido</span>
              <select onchange="onMetaFormChange(this,'origem')">${origemOptions}</select>
            </label>
          </div>

          <label class="meta-field">
            <span>A empresa precisa faturar (no mês)</span>
            <div class="meta-field-money">
              <span class="currency-prefix">R$</span>
              <input type="number" step="1000" min="0" placeholder="200000" value="${f.alvo===null||f.alvo===undefined?'':f.alvo}"
                     oninput="onMetaFormChange(this,'alvo')" />
            </div>
          </label>

          <div class="meta-form-grid">
            <label class="meta-field">
              <span>Tipo de prêmio</span>
              <select onchange="onMetaFormChange(this,'premioTipo')">
                <option value="fixo" ${f.premioTipo==='fixo'?'selected':''}>Valor fixo em R$</option>
                <option value="percentual_total" ${f.premioTipo==='percentual_total'?'selected':''}>% sobre o total faturado</option>
              </select>
            </label>
            <label class="meta-field">
              <span>${f.premioTipo==='fixo' ? 'Valor do prêmio' : 'Porcentagem'}</span>
              <div class="meta-field-money">
                <span class="currency-prefix">${f.premioTipo==='fixo' ? 'R$' : '%'}</span>
                <input type="number" step="${f.premioTipo==='fixo'?'50':'0.1'}" min="0"
                       placeholder="${f.premioTipo==='fixo'?'500':'1'}"
                       value="${f.premioValor===null||f.premioValor===undefined?'':f.premioValor}"
                       oninput="onMetaFormChange(this,'premioValor')" />
              </div>
            </label>
          </div>

          <div class="meta-form-preview">
            ${f.premioTipo==='fixo'
              ? 'Ex: batendo o alvo, a pessoa ganha o valor fixo, não importa quanto passou.'
              : 'A porcentagem incide sobre o <b>total faturado</b>, não sobre o que passou do alvo. Ex: alvo de R$ 200.000 com 1% — se a empresa faturar R$ 400.000, o prêmio é R$ 4.000.'}
          </div>

          <div class="modal-actions">
            <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="modal-btn modal-btn-primary" onclick="salvarMeta()">${novo ? 'Criar meta' : 'Salvar'}</button>
          </div>
        </div>
      </div>
    `;
  }
  let bodyHtml = `<div class="modal-msg">${esc(m.message)}</div>`;
  let actionsHtml = '';
  let wideClass = '';
  if(m.type === 'confirm'){
    actionsHtml = `
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn modal-btn-danger" onclick="confirmModal()">${esc(m.confirmLabel)}</button>
    `;
  } else if(m.type === 'prompt'){
    bodyHtml += `<input id="modal-input" class="modal-input" type="text" autofocus
      oninput="onModalInputChange(this)" onkeydown="onModalInputKey(this, event)" />`;
    actionsHtml = `
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn modal-btn-primary" onclick="confirmModal()">Adicionar</button>
    `;
  } else if(m.type === 'export'){
    wideClass = ' modal-box-wide';
    bodyHtml += `<textarea id="modal-textarea" class="modal-textarea" readonly onclick="this.select()">${esc(m.value)}</textarea>`;
    actionsHtml = `<button class="modal-btn modal-btn-primary" onclick="closeModal()">Fechar</button>`;
  } else if(m.type === 'import'){
    wideClass = ' modal-box-wide';
    bodyHtml += `<textarea id="modal-textarea" class="modal-textarea" placeholder="Cole aqui o texto exportado..." oninput="onModalTextareaChange(this)"></textarea>`;
    if(m.error) bodyHtml += `<div class="modal-error">${esc(m.error)}</div>`;
    actionsHtml = `
      <button class="modal-btn modal-btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn modal-btn-primary" onclick="confirmModal()">Restaurar</button>
    `;
  } else {
    actionsHtml = `<button class="modal-btn modal-btn-primary" onclick="closeModal()">OK</button>`;
  }
  return `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal-box${wideClass}">
        ${bodyHtml}
        <div class="modal-actions">${actionsHtml}</div>
      </div>
    </div>
  `;
}

function csvNum(v){ return (Number(v)||0).toFixed(2).replace('.', ','); }

function exportResumoCSV(){
  try{
    const sellerBreakdown = getSellerBreakdown();
    const partnerBreakdown = getPartnerBreakdown();
    const scope = partnerMonthFilter === "Todos" ? ('Ano '+yearFilter) : (partnerMonthFilter+'/'+yearFilter);
    let csv = 'Resumo de Comissoes - ' + scope + '\n\n';

    csv += 'VENDEDORAS\n';
    csv += 'Vendedora;Sistema;Consultoria;Orgaos Publicos;Cursos;Bonus;Total\n';
    sellersForCurrentUser().forEach(s => {
      const b = sellerBreakdown[s.label] || {sistema:0,consultoria:0,publicos:0,cursos:0,bonus:0};
      const total = b.sistema+b.consultoria+b.publicos+b.cursos+b.bonus;
      csv += [s.label, csvNum(b.sistema), csvNum(b.consultoria), csvNum(b.publicos), csvNum(b.cursos), csvNum(b.bonus), csvNum(total)].join(';') + '\n';
    });

    csv += '\nPARCEIROS\n';
    csv += 'Parceiro;Sistema;Consultoria;Orgaos Publicos;Cursos;Total\n';
    partners.forEach(p => {
      const b = partnerBreakdown[p] || {sistema:0,consultoria:0,publicos:0,cursos:0};
      const total = b.sistema+b.consultoria+b.publicos+b.cursos;
      csv += [p, csvNum(b.sistema), csvNum(b.consultoria), csvNum(b.publicos), csvNum(b.cursos), csvNum(total)].join(';') + '\n';
    });

    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'resumo-comissoes-' + yearFilter + (partnerMonthFilter!=="Todos" ? '-'+partnerMonthFilter : '') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e){
    console.error('Falha ao exportar CSV', e);
    showAlert('Não foi possível gerar o arquivo. Tente novamente.');
  }
}

function applyImportedData(text){
  try{
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.rows)) throw new Error('formato inválido');

    rows = data.rows;
    migrateYear(rows, 2026);
    nextId = rows.length ? Math.max(...rows.map(r=>r.id||0)) + 1 : 1;

    ENTITY_KEYS.forEach(key => {
      // New export format: data.entities[key] / data.entities[key+'Vendors']
      // Old export format (pre Órgãos Públicos): data[key] / data[key+'Vendors']
      const rowsSrc = (data.entities && Array.isArray(data.entities[key])) ? data.entities[key]
        : (Array.isArray(data[key]) ? data[key] : null);
      const vendorsSrc = (data.entities && Array.isArray(data.entities[key+'Vendors']) && data.entities[key+'Vendors'].length) ? data.entities[key+'Vendors']
        : (Array.isArray(data[key+'Vendors']) && data[key+'Vendors'].length ? data[key+'Vendors'] : null);
      if(rowsSrc) state[key].rows = rowsSrc;
      if(vendorsSrc) state[key].vendors = vendorsSrc;
      migrateYear(state[key].rows, 2026);
      state[key].nextId = state[key].rows.length ? Math.max(...state[key].rows.map(r=>r.id||0)) + 1 : 1;
    });

    if(Array.isArray(data.bonusRows)){
      bonusRows = data.bonusRows;
      migrateYear(bonusRows, 2026);
      bonusNextId = bonusRows.length ? Math.max(...bonusRows.map(r=>r.id||0)) + 1 : 1;
    }
    if(Array.isArray(data.vendaProducts)) vendaProducts = data.vendaProducts;
    if(Array.isArray(data.partners)) partners = data.partners;
    if(Array.isArray(data.extraYears)) extraYears = data.extraYears;
    if(Array.isArray(data.closedMonths)) closedMonths = data.closedMonths;
    // metas mudaram de objeto (chave->valor) para lista de regras; backups
    // antigos vêm no formato velho e são descartados de propósito.
    if(Array.isArray(data.metas)){
      metas = data.metas;
      metasNextId = metas.length ? Math.max(...metas.map(m=>m.id||0)) + 1 : 1;
    }
    if(Array.isArray(data.sistemaSellers) && data.sistemaSellers.length) SELLERS = data.sistemaSellers;

    persist();
    ENTITY_KEYS.forEach(key => {
      persistEntityRows(key);
      persistEntityVendors(key);
    });
    persistBonus();
    persistVendaProducts();
    persistPartners();
    persistClosedMonths();
    persistMetas();
    persistSistemaSellers();
    persistExtraYears();

    return true;
  } catch(e){
    console.error('Falha ao importar', e);
    modalState.error = 'Não consegui ler esse texto — confira se colou exatamente o que foi exportado, sem cortar nada.';
    return false;
  }
}

function migrateYear(list, defaultYear){
  list.forEach(r => { if(r.ano === undefined || r.ano === null){ r.ano = defaultYear; } });
}

function getKnownYears(){
  const set = new Set();
  rows.forEach(r => { if(r.ano) set.add(r.ano); });
  ENTITY_KEYS.forEach(key => { state[key].rows.forEach(r => { if(r.ano) set.add(r.ano); }); });
  bonusRows.forEach(r => { if(r.ano) set.add(r.ano); });
  extraYears.forEach(y => set.add(y));
  set.add(yearFilter);
  set.add(new Date().getFullYear());
  return Array.from(set).sort((a,b) => a-b);
}

function setYearFilter(y){
  yearFilter = Number(y);
  render();
}

function addYear(){

    if(!y || isNaN(y)) return;
    if(!extraYears.includes(y)) extraYears.push(y);
    yearFilter = y;
    persistExtraYears();
  });
}

function uniqueSellerKey(name){
  let base = slug(name) || 'vendedor';
  let key = base;
  let i = 2;
  while(SELLERS.some(s => s.key === key)){
    key = base + '-' + i;
    i++;
  }
  return key;
}

function addSistemaVendedor(){
  showPrompt("Nome da nova vendedora/vendedor:", (name) => {
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    if(SELLERS.some(s => s.label.toLowerCase() === trimmed.toLowerCase())){
      showAlert("Essa pessoa já está na lista.");
      return;
    }
    const key = uniqueSellerKey(trimmed);
    const color = VENDOR_PALETTE[SELLERS.length % VENDOR_PALETTE.length];
    SELLERS.push({key, label: trimmed, color});
    persistSistemaSellers();
  });
}

function removeSistemaVendedor(key){
  const s = SELLERS.find(s => s.key === key);
  if(!s) return;
  showConfirm(
    `Remover "${s.label}" da lista de vendedoras do Sistema? Os valores já lançados para ela continuam guardados nos lançamentos antigos, mas a coluna some da tabela e ela deixa de poder ser escolhida em novos lançamentos.`,
    () => {
      SELLERS = SELLERS.filter(s => s.key !== key);
      if(sellerFilter === key) sellerFilter = "Todas";
      persistSistemaSellers();
    },
    "Remover"
  );
}

      }

  if(changed) vendaProducts.sort((a,b)=>a.localeCompare(b,'pt-BR'));

function ensurePartnersIncludeCurrent(){
  let changed = false;
  const scan = (list) => list.forEach(r => {
    if(r.parceiro && r.parceiro.trim()){
      const v = r.parceiro.trim();
      if(!partners.some(p => p.toLowerCase() === v.toLowerCase())){

        changed = true;

  ENTITY_KEYS.forEach(key => scan(state[key].rows));

}

function parsePercent(v){
  if(v===null || v===undefined || v==='') return 0;
  const n = parseFloat(String(v).replace('%','').replace(',','.').trim());
  return isNaN(n) ? 0 : n;
}

function isEntityRowPending(r){

/* ---------------- Comissões por status de recebimento ----------------
   A consultoria só recebe quando o cliente paga a nota. Como cada
   lançamento já tem "Pago" + mês do pagamento, dá pra separar o que já
   está liberado do que ainda depende do cliente pagar — e mostrar, por
   pessoa, de qual cliente veio cada valor.
   Uma conta restrita só enxerga as próprias linhas: o banco já devolve
   os lançamentos dela com o vendedor/percentual dos colegas em branco. */
function getComissoesPorStatus(pago){
  const out = [];

  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(!!r.pago !== pago) return;
    SELLERS.forEach(s => {
      const comissao = Number(r[s.key])||0;
      if(comissao <= 0) return;
      out.push({
        vendedor: s.label, origem: 'Sistema', cliente: r.cliente || r.venda || '—',
        mesVenda: r.mes, mesPagamento: r.mesPagamento || null,
        valorPago: Number(r.valor)||0, pct: null, comissao: comissao,
      });
    });
  });

  ENTITY_KEYS.forEach(key => {
    if(!ENTITIES[key].hasPagamento) return;
    const mainField = ENTITIES[key].fields[0].key;
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      if(!!r.pago !== pago) return;
      const base = entityRemainingAfterPartner(r);
      getRowSellerAssignments(r).forEach(a => {
        const comissao = base * (a.percent/100);
        if(comissao <= 0) return;
        out.push({
          vendedor: a.vendedor, origem: ENTITIES[key].tabLabel, cliente: r[mainField] || '—',
          mesVenda: r.mes, mesPagamento: r.mesPagamento || null,
          valorPago: Number(r.valorContrato)||0, pct: a.percent, comissao: comissao,
        });
      });
    });
  });

  return out;
}

function agruparPorVendedor(lista){
  const por = {};
  lista.forEach(e => {
    if(!por[e.vendedor]) por[e.vendedor] = {total:0, itens:[]};
    por[e.vendedor].total += e.comissao;
    por[e.vendedor].itens.push(e);
  });
  return Object.keys(por).sort((a,b) => por[b].total - por[a].total)
    .map(nome => ({nome, total: por[nome].total, itens: por[nome].itens}));
}

/* ---------------- Parcelamento de contratos ---------------- */

function nextMonthYear(mes, ano, stepsForward){
  let idx = MONTHS.indexOf(mes) + stepsForward;
  const yearOffset = Math.floor(idx / 12);
  idx = ((idx % 12) + 12) % 12;
  return {mes: MONTHS[idx], ano: (ano||2026) + yearOffset};
}

function splitIntoInstallments(total, n){
  const amounts = [];
  let remaining = total;
  const base = Math.round((total/n)*100)/100;
  for(let i=0;i<n;i++){
    if(i === n-1) amounts.push(Math.round(remaining*100)/100);
    else { amounts.push(base); remaining -= base; }
  }
  return amounts;
}

function parcelarRow(id){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    return;
  }
  if(!r.valor || Number(r.valor) <= 0){
    showAlert("Preencha o Valor do Contrato antes de parcelar.");
    return;
  }
  showPrompt("Em quantas parcelas mensais? (2 a 24)", (val) => {
    const n = parseInt(val, 10);
    if(!n || n < 2 || n > 24){ showAlert("Digite um número de parcelas entre 2 e 24."); return; }
    const amounts = splitIntoInstallments(Number(r.valor), n);
    const origMes = r.mes, origAno = r.ano||2026;
    r.valor = amounts[0];
    r.parcelaLabel = `1/${n}`;
    for(let i=1;i<n;i++){
      const nm = nextMonthYear(origMes, origAno, i);
      const copy = {...r, id: nextId++, mes: nm.mes, ano: nm.ano, valor: amounts[i], pago:false, mesPagamento:null, parcelaLabel:`${i+1}/${n}`};
      rows.push(copy);
    }
    persist();
  });
}

function isMonthClosed(ano, mes){
  return closedMonths.indexOf(ano+'-'+mes) !== -1;
}
function toggleMonthClosed(ano, mes){
  const key = ano+'-'+mes;
  const idx = closedMonths.indexOf(key);
  if(idx === -1) closedMonths.push(key);
  else closedMonths.splice(idx,1);
  persistClosedMonths();
  render();
}



/* ---------------- Metas mensais ----------------
   Uma meta é um GATILHO DA EMPRESA que premia uma pessoa:
   "quando a empresa faturar R$ X em <origem> no mês, fulana ganha Y".
   O prêmio é um valor fixo em R$ ou uma % sobre o total faturado
   (sobre o total inteiro, não sobre o que passou do alvo).
   Como depende do faturamento geral, só admin configura e acompanha. */

const META_ORIGENS = [
  {key:'cursos',      label:'Cursos'},
  {key:'sistema',     label:'Sistema'},
  {key:'consultoria', label:'Consultoria'},
  {key:'publicos',    label:'Consultoria Órgãos Públicos'},
  {key:'todas',       label:'Todas as abas somadas'},
];
function origemLabel(key){
  const o = META_ORIGENS.find(x => x.key === key);
  return o ? o.label : key;
}

/* Total faturado pela empresa numa origem, no mês/ano informado.
   Usa o valor cheio do contrato, antes de comissões e parceiros. */
function faturamentoDaOrigem(origem, ano, mes){
  let total = 0;
  if(origem === 'sistema' || origem === 'todas'){
    rows.forEach(r => {
      if((r.ano||2026) !== ano || r.mes !== mes) return;
      total += Number(r.valor)||0;
    });
  }
  ENTITY_KEYS.forEach(key => {
    if(origem !== 'todas' && origem !== key) return;
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== ano || r.mes !== mes) return;
      total += Number(r.valorContrato)||0;
    });
  });
  return total;
}

/* Situação de uma meta: quanto já faturou, se bateu e quanto vale o prêmio. */
function avaliarMeta(m){
  const faturado = faturamentoDaOrigem(m.origem, m.ano, m.mes);
  const bateu = m.alvo > 0 && faturado >= m.alvo;
  const premio = !bateu ? 0
    : (m.premioTipo === 'fixo' ? Number(m.premioValor)||0
                               : faturado * ((Number(m.premioValor)||0) / 100));
  const pct = m.alvo > 0 ? Math.round((faturado / m.alvo) * 100) : 0;
  return { faturado, bateu, premio, pct, falta: Math.max(0, m.alvo - faturado) };
}

function metaDescricaoRegra(m){
  const gatilho = `Quando a empresa faturar ${fmtMoney(m.alvo)} em ${origemLabel(m.origem)}`;
  const premio = m.premioTipo === 'fixo'
    ? `${fmtMoney(m.premioValor)} fixos`
    : `${String(m.premioValor).replace('.',',')}% do total faturado`;
  return `${gatilho} → ${premio}`;
}

function metasDoMes(){
  if(partnerMonthFilter === "Todos") return [];
  return metas.filter(m => m.ano === yearFilter && m.mes === partnerMonthFilter);
}
function bonusDaMeta(metaId){
  return bonusRows.find(b => b.metaId === metaId);
}

/* ---- criar / editar / excluir uma meta ---- */
function novaMeta(){
  if(partnerMonthFilter === "Todos"){
    showAlert("Escolha um mês no filtro acima para criar uma meta — metas são mensais.");
    return;
  }
  modalState = {
    type:'meta-form',
    meta:{ id:null, ano:yearFilter, mes:partnerMonthFilter, vendedor:'',
           origem:'cursos', alvo:null, premioTipo:'fixo', premioValor:null },
    error:'',
  };
  render();
}
function editarMeta(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  modalState = { type:'meta-form', meta: Object.assign({}, m), error:'' };
  render();
}
function excluirMeta(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  showConfirm(
    `Excluir a meta de ${m.vendedor}? ${metaDescricaoRegra(m)}. O bônus já lançado a partir dela, se houver, continua na aba Bônus e Metas.`,
    () => {
      metas = metas.filter(x => x.id !== id);
      persistMetas();
      render();
    },
    "Excluir"
  );
}
function onMetaFormChange(el, campo){
  if(!modalState || modalState.type !== 'meta-form') return;
  const v = el.value;
  if(campo === 'alvo' || campo === 'premioValor') modalState.meta[campo] = v === '' ? null : parseFloat(v);
  else modalState.meta[campo] = v;
  if(campo === 'premioTipo') render();
}
function salvarMeta(){
  if(!modalState || modalState.type !== 'meta-form') return;
  const m = modalState.meta;
  if(!m.vendedor){ modalState.error = 'Escolha quem recebe o prêmio.'; render(); return; }
  if(!(Number(m.alvo) > 0)){ modalState.error = 'Informe o valor que a empresa precisa faturar.'; render(); return; }
  if(!(Number(m.premioValor) > 0)){ modalState.error = 'Informe o valor do prêmio.'; render(); return; }
  if(m.premioTipo === 'percentual_total' && Number(m.premioValor) > 100){
    modalState.error = 'A porcentagem do prêmio não pode passar de 100%.'; render(); return;
  }
  if(m.id === null){
    m.id = metasNextId++;
    metas.push(m);
  } else {
    const i = metas.findIndex(x => x.id === m.id);
    if(i !== -1) metas[i] = m;
  }
  modalState = null;
  persistMetas();
  render();
}

/* Regras costumam valer o ano inteiro; isso evita recadastrar toda virada
   de mês. Pula meses que já tiverem uma regra idêntica. */
function mesmaRegra(a, b){
  return a.vendedor === b.vendedor && a.origem === b.origem
      && Number(a.alvo) === Number(b.alvo)
      && a.premioTipo === b.premioTipo
      && Number(a.premioValor) === Number(b.premioValor);
}
function repetirMetaNoAno(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  const idx = MONTHS.indexOf(m.mes);
  const restantes = MONTHS.slice(idx + 1);
  if(restantes.length === 0){
    showAlert("Dezembro é o último mês do ano — não há meses seguintes para repetir.");
    return;
  }
  const alvos = restantes.filter(mes =>
    !metas.some(x => x.ano === m.ano && x.mes === mes && mesmaRegra(x, m)));
  if(alvos.length === 0){
    showAlert("Todos os meses seguintes de " + m.ano + " já têm essa mesma regra.");
    return;
  }
  showConfirm(
    `Repetir esta regra de ${m.vendedor} (${metaDescricaoRegra(m)}) em ${alvos.join(', ')} de ${m.ano}? Meses que já tiverem uma regra igual serão pulados.`,
    () => {
      alvos.forEach(mes => {
        metas.push(Object.assign({}, m, {id: metasNextId++, mes: mes}));
      });
      persistMetas();
      render();
    },
    "Repetir"
  );
}

/* ---- lançar o bônus da meta batida (com confirmação) ---- */
function lancarBonusDaMeta(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  const av = avaliarMeta(m);
  if(!av.bateu){ showAlert("Esta meta ainda não foi batida."); return; }
  if(bonusDaMeta(id)){ showAlert("O bônus desta meta já foi lançado."); return; }
  if(isMonthClosed(m.ano, m.mes)){
    showAlert("Este mês está fechado para novos lançamentos. Reabra em Resumo Geral para poder lançar.");
    return;
  }
  showConfirm(
    `Lançar ${fmtMoney(av.premio)} de bônus para ${m.vendedor} em ${m.mes}/${m.ano}? A empresa faturou ${fmtMoney(av.faturado)} em ${origemLabel(m.origem)} (meta: ${fmtMoney(m.alvo)}). O lançamento vai para a aba Bônus e Metas e pode ser editado lá.`,
    () => {
      const desc = m.premioTipo === 'fixo'
        ? `Meta batida — ${origemLabel(m.origem)} ${fmtMoney(m.alvo)}`
        : `Meta batida — ${String(m.premioValor).replace('.',',')}% de ${fmtMoney(av.faturado)} em ${origemLabel(m.origem)}`;
      bonusRows.unshift({
        id: bonusNextId++, ano: m.ano, mes: m.mes, vendedor: m.vendedor,
        descricao: desc, valor: Math.round(av.premio*100)/100, metaId: m.id,
      });
      persistBonus();
      render();
    },
    "Lançar bônus"
  );
}

function getPartnerEntries(){
  const out = [];
  const sources = [
    {origem:'Sistema', list: rows, valorField:'valor', labelFn: r => r.cliente || r.venda || ''},
    {origem:'Consultoria', list: state.consultoria.rows, valorField:'valorContrato', labelFn: r => r.empresa || ''},
    {origem:'Consultoria Órgãos Públicos', list: state.publicos.rows, valorField:'valorContrato', labelFn: r => r.orgao || ''},
    {origem:'Cursos', list: state.cursos.rows, valorField:'valorContrato', labelFn: r => r.curso || ''},
  ];
  sources.forEach(src => {
    src.list.forEach(r => {
      if(!r.parceiro) return;
      if((r.ano||2026) !== yearFilter) return;
      if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
      const valorContrato = Number(r[src.valorField])||0;
      const pct = parsePercent(r.participacao);
      const honorario = valorContrato * (pct/100);
      out.push({ origem: src.origem, mes: r.mes, label: src.labelFn(r), valorContrato, parceiro: r.parceiro, pct, honorario });
    });
  });
  return out;
}

function computePartnerTotals(entries){
  const t = {};
  partners.forEach(p => t[p] = 0);
  entries.forEach(e => {
    if(t[e.parceiro] === undefined) t[e.parceiro] = 0;
    t[e.parceiro] += e.honorario;
  });
  return t;
}

function getSellerBreakdown(){
  const by = {};
  SELLERS.forEach(s => { by[s.label] = {sistema:0, consultoria:0, publicos:0, cursos:0, bonus:0}; });
  const ensure = (name) => { if(!by[name]) by[name] = {sistema:0, consultoria:0, publicos:0, cursos:0, bonus:0}; };

  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
    SELLERS.forEach(s => { by[s.label].sistema += Number(r[s.key])||0; });
  });

  ENTITY_KEYS.forEach(key => {
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
      const base = entityRemainingAfterPartner(r);
      getRowSellerAssignments(r).forEach(a => {
        ensure(a.vendedor);
        by[a.vendedor][key] += base * (a.percent/100);
      });
    });
  });

  bonusRows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
    if(!r.vendedor) return;
    ensure(r.vendedor);
    by[r.vendedor].bonus += Number(r.valor)||0;
  });

  return by;
}

function getSellerGrandTotals(){
  const breakdown = getSellerBreakdown();
  const totals = {};
  Object.keys(breakdown).forEach(name => {
    const b = breakdown[name];
    totals[name] = b.sistema + b.consultoria + b.publicos + b.cursos + b.bonus;
  });
  return totals;
}

function getPartnerBreakdown(){
  const by = {};
  partners.forEach(p => { by[p] = {sistema:0, consultoria:0, publicos:0, cursos:0}; });
  const ensure = (name) => { if(!by[name]) by[name] = {sistema:0, consultoria:0, publicos:0, cursos:0}; };

  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
    if(!r.parceiro) return;
    ensure(r.parceiro);
    by[r.parceiro].sistema += (Number(r.valor)||0) * (parsePercent(r.participacao)/100);
  });

  ENTITY_KEYS.forEach(key => {
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
      if(!r.parceiro) return;
      ensure(r.parceiro);
      by[r.parceiro][key] += (Number(r.valorContrato)||0) * (parsePercent(r.participacao)/100);
    });
  });

  return by;
}

function getMonthlyTotals(){
  const totals = {};
  MONTHS.forEach(m => totals[m] = 0);
  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    SELLERS.forEach(s => { totals[r.mes] += Number(r[s.key])||0; });
  });
  ENTITY_KEYS.forEach(key => {
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      const base = entityRemainingAfterPartner(r);
      getRowSellerAssignments(r).forEach(a => {
        totals[r.mes] += base * (a.percent/100);
      });
    });
  });
  bonusRows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    totals[r.mes] += Number(r.valor)||0;
  });
  return totals;
}

function renderMonthlyChart(){
  const totals = getMonthlyTotals();
  const values = MONTHS.map(m => totals[m]);
  const max = Math.max(...values, 1);
  const w = 760, h = 180, padBottom = 24, padTop = 10, barGap = 6;
  const barW = (w / 12) - barGap;
  const bars = MONTHS.map((m,i) => {
    const val = values[i];
    const barH = Math.max((val/max) * (h-padTop-padBottom), val>0?2:0);
    const x = i * (w/12) + barGap/2;
    const y = h - padBottom - barH;
    const fill = m === partnerMonthFilter ? 'var(--primary)' : '#C7C2FB';
    const tooltipVal = partnersValuesRevealed ? fmtMoney(val) : 'valor oculto';
    return `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="${fill}">
      <title>${m}: ${tooltipVal}</title>
    </rect>
    <text x="${x+barW/2}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--ink-faint)">${monthNumber(m)}</text>`;
  }).join('');
  /* O título e a moldura vêm do painel que envolve o gráfico. */
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="overflow:visible;display:block;">${bars}</svg>`;
}

function onVendaSelect(el){
  const id = Number(el.dataset.id);
  if(el.value === '__new__'){
    showPrompt("Nome do novo produto:", (name) => {
      if(!name) return;
      const trimmed = name.trim();
      if(!trimmed) return;
      if(!vendaProducts.some(p => p.toLowerCase() === trimmed.toLowerCase())){
        vendaProducts.push(trimmed);
        vendaProducts.sort((a,b)=>a.localeCompare(b,'pt-BR'));
        persistVendaProducts();
      }
      updateCell(id, 'venda', trimmed);
    });
    return;
  }
  updateCell(id, 'venda', el.value);
}





function updateSaveStatus(){
  const dot = document.getElementById('save-dot');
  const label = document.getElementById('save-label');
  if(!dot) return;
  if(saveError){
    dot.className = "dot error";
    label.textContent = "erro ao salvar";
  } else {
    dot.className = "dot" + (saving ? " saving" : "");
    label.textContent = saving ? "salvando" : "salvo";
  }
}



function updateCell(id, field, value){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    render();
    return;
  }
  r[field] = value;
  persist();
  if(field === "mes" || field === "parceiro") render();
  else {
    updateSummaries();
    if(field === "valor" || field === "participacao"){
      updateRowPartnerCalc(id);
    }
  }
}

function updateRowPartnerCalc(id){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  const el = document.getElementById('calcParceiro-'+id);
  if(el) el.textContent = fmtMoney((Number(r.valor)||0) * (parsePercent(r.participacao)/100));
}

function addRow(){
  const mes = filter === "Todos" ? "Janeiro" : filter;
  if(isMonthClosed(yearFilter, mes)){
    showAlert("Este mês está fechado para novos lançamentos. Reabra em Resumo Geral para poder editar.");
    return;
  }
  const newRow = {id: nextId++, mes, ano: yearFilter, cliente:"", venda:"", valor:null,
                   parceiro:"", participacao:"", formaPagamento:"", colaborador:"", vendedor2:"", vendedor3:"",
                   pago:false, mesPagamento:null, observacoes:"",
                   soraya:null, angela:null, rios:null, uilma:null, luciana:null};
  if(sellerFilter !== "Todas"){
    newRow[sellerFilter] = 0;
  }
  rows.unshift(newRow);
  persist();
  render();
}

function deleteRow(id){
  const r = rows.find(r => r.id === id);
  if(r && isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado. Reabra em Resumo Geral para poder excluir.");
    return;
  }
  showConfirm("Excluir esta venda?", () => {
    rows = rows.filter(r => r.id !== id);
    persist();
  });
}

function duplicateRow(id){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  const copy = {...r, id: nextId++};
  rows.unshift(copy);
  persist();
  render();
}

function repeatRowForYear(id){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  const startIdx = MONTHS.indexOf(r.mes);
  if(startIdx === -1 || startIdx === MONTHS.length - 1){
    showAlert("Esse lançamento já está em Dezembro — não há meses seguintes pra repetir.");
    return;
  }
  const remainingMonths = MONTHS.slice(startIdx + 1);
  const label = r.cliente || r.venda || "esse lançamento";
  showConfirm(
    `Repetir "${label}" para todos os meses restantes de ${r.ano} (${remainingMonths.join(', ')})? Meses que já tiverem um lançamento igual (mesmo cliente e produto) serão pulados.`,
    () => {
      remainingMonths.forEach(targetMonth => {
        const exists = rows.some(x => x.ano===r.ano && x.mes===targetMonth && (x.cliente||"")===(r.cliente||"") && (x.venda||"")===(r.venda||""));
        if(exists) return;
        const copy = {...r, id: nextId++, mes: targetMonth};
        rows.push(copy);
      });
      persist();
    },
    "Repetir"
  );
}

function resetToOriginal(){
  showConfirm(
    "Isso vai substituir os dados atuais pelos dados originais (Jan–Jul reais + recorrentes Ago–Dez). Continuar?",
    () => {
      rows = SEED_DATA.slice();
      migrateYear(rows, 2026);
      nextId = NEXT_ID_START;
      yearFilter = 2026;
      persist();
    },
    "Restaurar"
  );
}

function wipeAllData(){
  showConfirm(
    "⚠️ ISSO VAI APAGAR TODOS OS LANÇAMENTOS de todas as abas (Sistema, Consultoria, Consultoria Órgãos Públicos, Cursos e Bônus e Metas), de todos os anos — não dá pra desfazer. Os produtos, vendedores e parceiros cadastrados continuam. Recomendo exportar os dados antes (botão ⬇ Exportar dados), caso precise deles depois. Tem certeza que quer zerar tudo?",
    () => {
      rows = [];
      nextId = 1;
      persist();

      ENTITY_KEYS.forEach(key => {
        state[key].rows = [];
        state[key].nextId = 1;
        persistEntityRows(key);
      });

      bonusRows = [];
      bonusNextId = 1;
      persistBonus();

      closedMonths = [];
      persistClosedMonths();
    },
    "Zerar tudo"
  );
}

function setFilter(m){ filter = m; render(); }
function setSellerFilter(key){ sellerFilter = key; render(); }
function getVisibleSellers(){
  let list = sellerFilter === "Todas" ? SELLERS : SELLERS.filter(s => s.key === sellerFilter);
  if(!isAdmin && currentPersonName){
    list = list.filter(s => name_matches_client(s.label, currentPersonName));
  }
  return list;
}
/* Em modo restrito a tela não deve nem listar o nome dos colegas (o banco já
   não manda os valores deles, mas a lista de nomes vinha do catálogo). */
function sellersForCurrentUser(){
  if(isAdmin) return SELLERS;
  return SELLERS.filter(s => name_matches_client(s.label, currentPersonName));
}
function entityVendorsForCurrentUser(key){
  const all = state[key].vendors || [];
  if(isAdmin) return all;
  return all.filter(v => name_matches_client(v, currentPersonName));
}
function name_matches_client(a, b){
  return !!a && !!b && String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
}
function getVisible(){
  let list = rows.filter(r => (r.ano||2026) === yearFilter);
  list = filter === "Todos" ? list : list.filter(r => r.mes === filter);
  if(sellerFilter !== "Todas"){
    list = list.filter(r => r[sellerFilter] !== null && r[sellerFilter] !== undefined && r[sellerFilter] !== "");
  }
  if(searchCliente.trim()){
    const q = searchCliente.trim().toLowerCase();
    list = list.filter(r => (r.cliente||"").toLowerCase().includes(q));
  }
  if(searchParceiro.trim()){
    const q = searchParceiro.trim().toLowerCase();
    list = list.filter(r => (r.parceiro||"").toLowerCase().includes(q));
  }
  if(searchColaborador.trim()){
    const q = searchColaborador.trim().toLowerCase();
    list = list.filter(r => (r.colaborador||"").toLowerCase().includes(q));
  }
  return list;
}
function onVendasSearchInput(el, field){
  const pos = el.selectionStart;
  const id = el.id;
  if(field==='cliente') searchCliente = el.value;
  else if(field==='parceiro') searchParceiro = el.value;
  else if(field==='colaborador') searchColaborador = el.value;
  render();
  const ne = document.getElementById(id);
  if(ne){ ne.focus(); try{ ne.setSelectionRange(pos,pos); }catch(e){} }
}
function computeTotals(visible){
  const t = {valor:0};
  SELLERS.forEach(s => { t[s.key] = 0; });
  visible.forEach(r => {
    t.valor += Number(r.valor)||0;
    SELLERS.forEach(s => t[s.key] += Number(r[s.key])||0);
  });
  return t;
}
function numInputHtml(row, field){
  const v = (row[field] === null || row[field] === undefined) ? "" : row[field];
  return `<input class="num" type="number" step="0.01" placeholder="—" value="${esc(v)}"
            data-id="${row.id}" data-field="${field}" oninput="onNumInput(this)" />`;
}
function onNumInput(el){
  const id = Number(el.dataset.id);
  const field = el.dataset.field;
  const v = el.value;
  updateCell(id, field, v === "" ? null : parseFloat(v));
}
function onTextInput(el){
  const id = Number(el.dataset.id);
  const field = el.dataset.field;
  updateCell(id, field, el.value);
}
function onMonthSelect(el){
  const id = Number(el.dataset.id);
  updateCell(id, "mes", el.value);
}
function onVendedor2Select(el){
  const id = Number(el.dataset.id);
  updateCell(id, "vendedor2", el.value);
}
function onVendedor3Select(el){

function updateSummaries(){
  const visible = getVisible();
  const totals = computeTotals(visible);
  const totalContract = document.getElementById('kpi-total');
  if(totalContract) totalContract.textContent = fmtMoney(totals.valor);
  SELLERS.forEach(s => {
    const el = document.getElementById('kpi-' + s.key);
    if(el) el.textContent = sellerValuesRevealed ? fmtMoney(totals[s.key]) : '••••••';
  });
  const countEl = document.getElementById('count-label');
  if(countEl){
    countEl.innerHTML = `<b>${visible.length}</b> venda${visible.length===1?"":"s"} ${filter!=="Todos" ? "em <b>"+esc(filter)+"</b>" : ""}`;
  }
}
