            <div class="rel-empresa">HUB Comercial · Painel Diretoria Comercial</div>
            <h1>Relatório de notas emitidas</h1>
          </div>
        </div>
        <div class="rel-emissao">
          <div class="rel-emissao-tit">Notas emitidas em ${esc(periodo)}</div>
          <div class="rel-emissao-sub">Emitido em ${esc(emitido)}</div>
        </div>
      </header>
      <div class="rel-faixa-linha"></div>

      <section class="rel-sec">
        <div class="rel-cards">
          <div class="rel-card rel-card-total"><span>${linhas.length} nota${linhas.length===1?'':'s'} emitida${linhas.length===1?'':'s'}</span><b>${fmtMoney(total)}</b></div>
        </div>
        ${relTabela(
          [{label:'Emitida em'},{label:'Origem'},{label:'Cliente/Empresa'},{label:'Mês do lançamento'},{label:'Valor',num:true}],
          linhasHtml, 'Nenhuma nota emitida em ' + periodo + (busca ? ' pra "' + busca + '"' : '') + '.')}
      </section>
    </div>
  `;
}

function imprimirRelatorioNotasEmitidas(ano, mes, busca){
  let div = document.getElementById('relatorio-print');
  if(!div){
    div = document.createElement('div');
    div.id = 'relatorio-print';
    document.body.appendChild(div);
  }
  div.innerHTML = montarRelatorioNotasEmitidas(ano, mes, busca);
  document.body.classList.add('imprimindo-relatorio');
  const limpar = function(){
    document.body.classList.remove('imprimindo-relatorio');
    window.removeEventListener('afterprint', limpar);
  };
  window.addEventListener('afterprint', limpar);
  setTimeout(function(){ window.print(); setTimeout(limpar, 1500); }, 60);
}

/* ---------- O visto de "nota emitida" ----------
   É o único dado que a conta do financeiro escreve. Por isso ele não vai
   pelo caminho normal de gravação (a conta não tem permissão de escrever
   em vendas nem em lancamentos, e não pode ter: RLS filtra linha, não
   coluna) e sim por uma função do banco que mexe em exatamente uma coluna.

   A tela muda na hora e desfaz se a gravação falhar: um visto que aparece
   marcado sem ter sido gravado é pior do que visto nenhum — ela passaria
   para a próxima nota achando que aquela já estava resolvida. */
let notaFiltro = 'Todas';   // 'Todas' | 'Pendentes' | 'Emitidas' | 'PodeEmitir'
function setNotaFiltro(f){ notaFiltro = f; render(); }

function acharEmpresaPorId(id){
  for(let k = 0; k < ENTITY_KEYS.length; k++){
    const key = ENTITY_KEYS[k];
    if(!ENTITIES[key].hasEmpresas) continue;
    const entRows = state[key].rows;
    for(let i = 0; i < entRows.length; i++){
      const e = (entRows[i].empresas||[]).find(function(x){ return x.id === id; });
      if(e) return e;
    }
  }
  return null;
}

function acharAlvoNota(tabela, id, entKey){
  if(tabela === 'vendas') return rows.find(function(r){ return r.id === id; });
  if(tabela === 'lancamento_empresas') return acharEmpresaPorId(id);
  return state[entKey] ? state[entKey].rows.find(function(r){ return r.id === id; }) : null;
}

async function toggleNotaEmitida(tabela, id, entKey){
  if(!isAdmin && !isFinanceiro) return;
  const alvo = acharAlvoNota(tabela, id, entKey);
  if(!alvo) return;
  const novo = !alvo.notaEmitida;
  alvo.notaEmitida = novo;
  alvo.notaEmitidaEm = novo ? new Date().toISOString() : null;
  render();
  saving = true; updateSaveStatus();
  try{
    const quando = await sbRpc('marcar_nota_emitida', { p_tabela: tabela, p_id: id, p_emitida: novo });
    alvo.notaEmitidaEm = novo ? (quando || alvo.notaEmitidaEm) : null;
    saveError = false;
  }catch(e){
    console.error(e);
    alvo.notaEmitida = !novo;
    alvo.notaEmitidaEm = null;
    saveError = true;
    showAlert(mensagemErroSupabase(e) || 'Não consegui gravar o visto desta nota. Confira a internet e tente de novo.');
  }finally{
    saving = false; updateSaveStatus(); render();
  }
}

/* "Pode emitir" é um visto à parte de "Emitida" — libera pro financeiro
   que aquele lançamento já está conferido e pronto pra gerar a nota,
   sem precisar já marcar como emitida (que é o passo seguinte, quando a
   nota sai de fato). As duas travas ficam independentes de propósito:
   nada aqui impede marcar "Emitida" sem "Pode emitir" antes, é só um
   sinal a mais na tela. */
async function togglePodeEmitir(tabela, id, entKey){
  if(!isAdmin && !isFinanceiro) return;
  const alvo = acharAlvoNota(tabela, id, entKey);
  if(!alvo) return;
  const novo = !alvo.podeEmitir;
  alvo.podeEmitir = novo;
  alvo.podeEmitirEm = novo ? new Date().toISOString() : null;
  render();
  saving = true; updateSaveStatus();
  try{
    const quando = await sbRpc('marcar_pode_emitir', { p_tabela: tabela, p_id: id, p_pode: novo });
    alvo.podeEmitirEm = novo ? (quando || alvo.podeEmitirEm) : null;
    saveError = false;
  }catch(e){
    console.error(e);
    alvo.podeEmitir = !novo;
    alvo.podeEmitirEm = null;
    saveError = true;
    showAlert(mensagemErroSupabase(e) || 'Não consegui gravar "Pode emitir". Confira a internet e tente de novo.');
  }finally{
    saving = false; updateSaveStatus(); render();
  }
}

/* Monta os dois botões da coluna "Nota fiscal" — "Pode emitir" e
   "Emitida" — de um jeito só, reaproveitado nas 3 telas que mostram
   nota fiscal (Sistema, Empresas por lançamento e o quadro
   consolidado "Notas lançadas"). entKeyLiteral já deve vir pronto pra
   entrar direto no onclick (aspas simples, escapado se precisar). */
function notaEmissaoBotoesHtml(tabela, id, entKeyLiteral, podeEmitir, podeEmitirEm, notaEmitida, notaEmitidaEm, podeVisar, dataMinimaEmissao){
  // Pedido de nota pediu pra não emitir antes de uma data — enquanto ela
  // não chega, nem "Pode emitir" nem "Emitir" aparecem pra ninguém (o
  // bloqueio de verdade está no banco, nas RPCs marcar_pode_emitir e
  // marcar_nota_emitida; isto aqui só evita a pessoa clicar pra nada).
  const bloqueadoAte = (!notaEmitida && dataMinimaEmissao && dataMinimaEmissao > hojeIsoDate()) ? dataMinimaEmissao : null;
  if(!podeVisar){
    if(notaEmitida) return '<span class="nota-selo">✓ Emitida</span>';
    if(podeEmitir) return '<span class="nota-selo nota-selo-pode">Pode emitir</span>';
    if(bloqueadoAte) return `<span class="nota-selo nota-selo-bloqueada" title="Pedido pediu pra não emitir antes desta data">🔒 até ${formatarDataIso(bloqueadoAte)}</span>`;
    return '—';
  }
  if(bloqueadoAte){
    return `<span class="nota-selo nota-selo-bloqueada" title="Este pedido só pode ser liberado/emitido a partir de ${formatarDataIso(bloqueadoAte)}">🔒 Só a partir de ${formatarDataIso(bloqueadoAte)}</span>`;
  }
  const podeBtn = `<button type="button" class="pode-emitir-btn${podeEmitir?' on':''}"
                     title="${podeEmitir ? 'Liberada para emitir — clique para desmarcar' : 'Marcar que este lançamento já está conferido e pronto pra emitir a nota'}"
                     onclick="togglePodeEmitir('${tabela}',${id},'${entKeyLiteral}')">${podeEmitir ? '✓ Pode emitir' : 'Pode emitir'}</button>`;
  const emitirBtn = `<button type="button" class="nota-btn${notaEmitida?' on':''}"
                     title="${notaEmitida ? 'Nota emitida — clique para desmarcar' : 'Marcar que a nota foi emitida'}"
                     onclick="toggleNotaEmitida('${tabela}',${id},'${entKeyLiteral}')">${
                 notaEmitida ? '✓ Emitida' + (dataCurta(notaEmitidaEm) ? ' · ' + dataCurta(notaEmitidaEm) : '') : 'Emitir'
               }</button>${notaEmitida ? `<button type="button" class="nota-editar-data" title="Corrigir a data de emissão" onclick="editarDataEmissao('${tabela}',${id},'${entKeyLiteral}')">✏️</button>` : ''}`;
  return podeBtn + emitirBtn;
}

/* Corrigir a data em que a nota foi emitida — sem isso, uma nota que
   precisa ser cancelada e reemitida em outro dia fica com a data errada
   pra sempre, porque marcar/desmarcar "Emitida" sempre grava a data de
   HOJE. Mesma porta estreita do visto (marcar_nota_emitida), só que
   agora aceitando uma data específica em vez de "agora". */
function editarDataEmissao(tabela, id, entKey){
  if(!isAdmin && !isFinanceiro) return;
  const alvo = acharAlvoNota(tabela, id, entKey);
  if(!alvo || !alvo.notaEmitida) return;
  showPrompt(
    'Corrigir a data em que esta nota foi emitida. Data atual: ' + (dataCurta(alvo.notaEmitidaEm) || '—') + '. Digite no formato DD/MM/AAAA:',
    function(v){
      const iso = parseDataBr(v);
      if(!iso){ showAlert('Data inválida. Use o formato DD/MM/AAAA, por exemplo 05/12/2026.'); return; }
      gravarDataEmissao(tabela, id, entKey, iso);
    }
  );
}

function parseDataBr(texto){
  const m = String(texto||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  const dia = parseInt(m[1],10), mes = parseInt(m[2],10), ano = parseInt(m[3],10);
  if(mes < 1 || mes > 12 || dia < 1 || dia > 31) return null;
  const d = new Date(ano, mes-1, dia, 12, 0, 0);
  if(d.getFullYear() !== ano || d.getMonth() !== mes-1 || d.getDate() !== dia) return null;
  return d.toISOString();
}

async function gravarDataEmissao(tabela, id, entKey, isoData){
  const alvo = acharAlvoNota(tabela, id, entKey);
  if(!alvo) return;
  const anterior = alvo.notaEmitidaEm;
  alvo.notaEmitidaEm = isoData;
  render();
  saving = true; updateSaveStatus();
  try{
    await sbRpc('marcar_nota_emitida', { p_tabela: tabela, p_id: id, p_emitida: true, p_quando: isoData });
    saveError = false;
  }catch(e){
    console.error('Falha ao corrigir a data de emissão', e);
    alvo.notaEmitidaEm = anterior;
    saveError = true;
    showAlert(mensagemErroSupabase(e) || 'Não consegui corrigir a data. Confira a internet e tente de novo.');
  }finally{
    saving = false; updateSaveStatus(); render();
  }
}

function dataCurta(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return isNaN(d.getTime()) ? '' : d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
}

/* Formata uma data "pura" (YYYY-MM-DD, sem hora — o formato de
   <input type="date"> e da coluna data_minima_emissao) como DD/MM/AAAA
   direto no texto, sem passar por Date: um new Date('YYYY-MM-DD') é lido
   como meia-noite UTC, e em fuso negativo (Brasil) isso pode voltar um
   dia — nunca é a data que a pessoa realmente digitou. */
function formatarDataIso(isoDate){
  const m = String(isoDate||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3]+'/'+m[2]+'/'+m[1]) : '';
}
function hojeIsoDate(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* A tela carrega os dados uma vez só, quando a aba abre — edições de
   outra pessoa (ou da mesma pessoa numa outra aba) não chegam sozinhas.
   Esse botão busca de novo, sem precisar recarregar a página inteira e
   perder o que estiver sendo editado em outro lugar da tela. */
async function atualizarNotasLancadas(){
  if(atualizandoNotas) return;
  atualizandoNotas = true; render();
  try{
    await Promise.allSettled([
      tryLoadFromStorageAsync(),
      tryLoadEntityFromStorageAsync('consultoria'),
      tryLoadEntityFromStorageAsync('publicos'),
      tryLoadEntityFromStorageAsync('cursos'),
    ]);
  } finally {
    atualizandoNotas = false; render();
  }
}

/* ---------------- Pedidos de Nota: lado do admin ----------------
   A conta solicitante manda os dados sem saber a qual lançamento eles
   pertencem — quem sabe é o admin, e é ele quem vincula. Vincular a
   Sistema marca "Pode emitir" direto na venda (só tem CNPJ pra puxar
   de lá, o resto vendas nem guarda). Vincular a Consultoria/Órgãos
   Públicos/Cursos cria uma EMPRESA nova dentro do contrato escolhido,
   já com "Pode emitir" — mesmo caminho de addEmpresaCurso, só que
   pré-preenchido com o que a solicitante mandou. */
function candidatosVinculoPedido(produto, busca){
  const termo = String(busca||'').trim().toLowerCase();
  const bate = (nome) => !termo || String(nome||'').toLowerCase().indexOf(termo) !== -1;
  const out = [];
  if(!produto || produto === 'vendas'){
    rows.forEach(function(r){
      const nome = r.cliente || r.venda || '';
      if(!bate(nome)) return;
      out.push({ produtoKey:'vendas', id:r.id, cliente:nome, rotulo: 'Sistema · ' + monthShort(r.mes) + '/' + (r.ano||2026) });
    });
  }
  ENTITY_KEYS.forEach(function(key){
    if(produto && produto !== key) return;
    const mainField = ENTITIES[key].fields[0].key;
    state[key].rows.forEach(function(r){
      const nome = r[mainField] || '';
      if(!bate(nome)) return;
      out.push({ produtoKey:key, id:r.id, cliente:nome, rotulo: ENTITIES[key].tabLabel + ' · ' + monthShort(r.mes) + '/' + (r.ano||2026) });
    });
  });
  return out.slice(0, 40);
}
function abrirVincularPedido(pedidoId){
  if(!isAdmin) return;
  modalState = { type:'vincular-pedido', pedidoId: pedidoId, produto:'', busca:'', escolhido:null };
  render();
}
function setVincularProduto(v){ modalState.produto = v; modalState.escolhido = null; render(); }
function onVincularBuscaInput(el){
  const pos = el.selectionStart;
  modalState.busca = el.value; modalState.escolhido = null;
  render();
  const novo = document.getElementById('vincular-busca');
  if(novo){ novo.focus(); try{ novo.setSelectionRange(pos, pos); }catch(e){} }
}
function escolherCandidatoVinculo(produtoKey, id){
  const c = candidatosVinculoPedido(modalState.produto, modalState.busca).find(function(x){ return x.produtoKey === produtoKey && x.id === id; });
  modalState.escolhido = c || null;
  render();
}
async function finalizarVinculoPedido(pedidoId, tabela, id){
  try{
    await sb('/rest/v1/pedidos_nota?id=eq.'+pedidoId, {
      method:'PATCH', headers:{'Prefer':'return=minimal'},
      body:{ status:'vinculado', vinculado_tabela:tabela, vinculado_id:id, vinculado_em:new Date().toISOString(), vinculado_por: authSession.user.id },
    });
  }catch(e){
    console.error('Falha ao marcar pedido como vinculado', e);
    showAlert('O lançamento foi criado/atualizado, mas não consegui marcar o pedido como resolvido no banco. Recarregue a página pra conferir.');
  }
  await tryLoadPedidosNotaAsync();
  render();
}
function confirmarVinculoPedido(){
  const m = modalState;
  if(!m || !isAdmin || !m.escolhido) return;
  const pedido = (pedidosNota||[]).find(function(p){ return p.id === m.pedidoId; });
  if(!pedido) return;
  const alvo = m.escolhido;
  // Se o pedido veio com "não emitir antes de" no futuro, o vínculo já
  // nasce travado — "Pode emitir" só liga sozinho quando a data chegar
  // (o bloqueio de verdade está nas RPCs marcar_pode_emitir/marcar_nota_emitida).
  const minima = pedido.dataMinimaEmissao || null;
  const liberaJa = !minima || minima <= hojeIsoDate();
  closeModal();
  if(alvo.produtoKey === 'vendas'){
    const r = rows.find(function(x){ return x.id === alvo.id; });
    if(!r) return;
    if(!r.cnpj && pedido.cnpj) r.cnpj = pedido.cnpj;
    r.dataMinimaEmissao = minima;
    if(liberaJa){ r.podeEmitir = true; r.podeEmitirEm = new Date().toISOString(); }
    persist();
    render();
    finalizarVinculoPedido(pedido.id, 'vendas', r.id);
  } else {
    const key = alvo.produtoKey;
    const r = state[key].rows.find(function(x){ return x.id === alvo.id; });
    if(!r) return;
    if(!Array.isArray(r.empresas)) r.empresas = [];
    const nova = {
      id: Date.now() + r.empresas.length,
      nome: pedido.cliente, cnpj: pedido.cnpj||'', responsavel: pedido.responsavel||'',
      telefone: pedido.telefone||'', email: pedido.email||'', valor: pedido.valor,
      observacoes: pedido.observacoes||'', notaEmitida:false, notaEmitidaEm:null,
      dataMinimaEmissao: minima,
      podeEmitir: liberaJa, podeEmitirEm: liberaJa ? new Date().toISOString() : null,
    };
    r.empresas.push(nova);
    persistEmpresaCurso(nova, r.id, { pode_emitir: nova.podeEmitir, pode_emitir_em: nova.podeEmitirEm, data_minima_emissao: nova.dataMinimaEmissao });
    render();
    finalizarVinculoPedido(pedido.id, 'lancamento_empresas', nova.id);
  }
}
/* "Vinculado ✓" sozinho não dizia ONDE — a pessoa via o pedido resolvido
   mas não achava o lançamento correspondente na tela. Isto leva direto
   pra lá: Sistema rola até a linha e pisca; Consultoria/Órgãos
   Públicos/Cursos abre o modal "Empresas por lançamento" já na empresa
   certa, que é onde ela mora de fato. */
function irParaLancamentoVinculado(pedidoId){
  if(!isAdmin) return;
  const pedido = (pedidosNota||[]).find(function(p){ return p.id === pedidoId; });
  if(!pedido || pedido.status !== 'vinculado' || !pedido.vinculadoTabela || !pedido.vinculadoId) return;
  if(pedido.vinculadoTabela === 'vendas'){
    const r = rows.find(function(x){ return x.id === pedido.vinculadoId; });
    if(!r){ showAlert('Não encontrei mais esse lançamento no Sistema — pode ter sido apagado.'); return; }
    yearFilter = r.ano || 2026;
    activeTab = 'vendas';
    filter = 'Todos'; naturezaFilter = 'Todas'; sellerFilter = 'Todas';
    searchCliente = ''; searchParceiro = ''; searchColaborador = '';
    render();
    setTimeout(function(){
      const el = document.getElementById('venda-row-' + r.id);
      if(!el) return;
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add('linha-destacada');
      setTimeout(function(){ el.classList.remove('linha-destacada'); }, 2500);
    }, 60);
    return;
  }
  for(let k = 0; k < ENTITY_KEYS.length; k++){
    const key = ENTITY_KEYS[k];
    if(!ENTITIES[key].hasEmpresas) continue;
    const pai = state[key].rows.find(function(r){ return (r.empresas||[]).some(function(e){ return e.id === pedido.vinculadoId; }); });
    if(pai){
      yearFilter = pai.ano || 2026;
      activeTab = key;
      state[key].filter = 'Todos';
      state[key].search.main = '';
      abrirEmpresasCurso(key, pai.id);
      return;
    }
  }
  showAlert('Não encontrei mais esse lançamento — pode ter sido apagado.');
}
/* Exclui só o REGISTRO do pedido — o lançamento que já foi vinculado
   (vendas/empresa) não é tocado aqui, continua do jeito que ficou. É só
   tirar da fila algo que ficou errado, duplicado ou já resolvido. */
function excluirPedidoNota(pedidoId){
  if(!isAdmin) return;
  const pedido = (pedidosNota||[]).find(function(p){ return p.id === pedidoId; });
  if(!pedido) return;
  showConfirm(
    'Excluir o pedido de "' + (pedido.cliente || 'sem nome') + '"?' + (pedido.status==='vinculado' ? ' Ele já está vinculado — o lançamento em si não muda, só o registro do pedido some da fila.' : ''),
    async function(){
      try{
        await sb('/rest/v1/pedidos_nota?id=eq.'+pedidoId, { method:'DELETE', headers:{'Prefer':'return=minimal'} });
        pedidosNota = (pedidosNota||[]).filter(function(p){ return p.id !== pedidoId; });
        render();
      }catch(e){
        console.error('Falha ao excluir pedido de nota', e);
        showAlert('Não consegui excluir o pedido. Confira a internet e tente de novo.');
      }
    },
    'Excluir'
  );
}

  const linha = function(p){

  `, { flush:true, meta: `<b>${lista.length}</b> pedido${lista.length===1?'':'s'}` });

          return `<tr class="${n.emitida ? '' : 'row-pending'}">

            <td>${notaEmissaoBotoesHtml(n.tabela, n.id, escJs(n.entKey), n.podeEmitir, n.podeEmitirEm, n.emitida, n.emitidaEm, podeVisar, n.dataMinimaEmissao)}</td>

function addEntityRow(key){
  const cfg = ENTITIES[key];
  const st = state[key];
  const mes = st.filter === "Todos" ? "Janeiro" : st.filter;
  if(isMonthClosedFor(key, yearFilter, mes)){
    showAlert("Este mês está fechado para novos lançamentos. Reabra em Resumo Geral para poder editar.");
    return;
  }
  const row = {id: st.nextId++, mes, ano: yearFilter, comissaoPercent:null, vendedor: st.vendorFilter!=="Todos" ? st.vendorFilter : "", comissaoPercent2:null, vendedor2:"", comissaoPercent3:null, vendedor3:""};
  if(cfg.hasVendasPorVendedor) row.vendasVendedoras = [];
  if(cfg.hasPagamento){ row.pago = false; row.mesPagamento = null; }
  // participacao vira coluna numérica no banco, então nasce null e não ""
  const CAMPOS_NUMERICOS = new Set(["valorContrato","participacao"]);
  cfg.fields.forEach(f => {
    row[f.key] = f.type==="select" ? f.options[0]
      : ((f.type==="number" || CAMPOS_NUMERICOS.has(f.key)) ? null : "");
  });
  st.rows.unshift(row);
  persistEntityRows(key);
  render();
}

function addExtraVendedorSlot(key, rowId){

/* Ordena só o que aparece na tela — a ordem guardada no banco não muda.
   localeCompare com 'pt-BR' resolve acento e maiúscula (Ácua vem antes de
   Alfa, e "alfa" e "Alfa" ficam juntos). */
function ordenarEntityRows(list, ordem, mainField, campoValor){
  if(!ordem || ordem === "padrao") return list;
  const copia = list.slice();
  const nome = r => String(r[mainField] || "").trim();
  const valor = r => Number(r[campoValor || 'valorContrato']) || 0;
  if(ordem === "az" || ordem === "za"){
    const dir = ordem === "az" ? 1 : -1;
    copia.sort((a,b) => {
      const na = nome(a), nb = nome(b);
      // linha nova (ainda sem nome) fica no topo pra não sumir de vista
      if(!na && !nb) return 0;
      if(!na) return -1;
      if(!nb) return 1;
      return dir * na.localeCompare(nb, 'pt-BR', {sensitivity:'base'});
    });
  } else if(ordem === "maior"){
    copia.sort((a,b) => valor(b) - valor(a));
  } else if(ordem === "menor"){
    copia.sort((a,b) => valor(a) - valor(b));
  }
  return copia;
}

function entityRemainingAfterPartner(row){
  const valorContrato = Number(row.valorContrato)||0;
  if(!row.parceiro) return valorContrato;
  const partnerPct = parsePercent(row.participacao);
  return valorContrato - (valorContrato * (partnerPct/100));
}

function getRowSellerAssignments(r){
  const list = [];
  if(r.vendedor) list.push({vendedor: r.vendedor, percent: Number(r.comissaoPercent)||0});
  if(r.vendedor2) list.push({vendedor: r.vendedor2, percent: Number(r.comissaoPercent2)||0});
  if(r.vendedor3) list.push({vendedor: r.vendedor3, percent: Number(r.comissaoPercent3)||0});
  if(Array.isArray(r.extraVendedores)){
    r.extraVendedores.forEach(ev => {
      if(ev.vendedor) list.push({vendedor: ev.vendedor, percent: Number(ev.percent)||0});
    });
  }
  return list;
}

function computeEntityTotals(key, visible){
  const st = state[key];
  const cfg = ENTITIES[key];
  const t = {contrato:0, comissao:0, byVendor:{}};
  st.vendors.forEach(v => t.byVendor[v] = 0);
  visible.forEach(r => {
    const valorContrato = Number(r.valorContrato)||0;
    t.contrato += valorContrato;
    const baseAposParceiro = entityRemainingAfterPartner(r);
    getRowSellerAssignments(r).forEach(a => {
      const commission = baseAposParceiro * (a.percent/100);
      t.comissao += commission;
      /* Quem não é vendedora de Sistema só aparece no próprio card com o
         que já foi pago — senão o número dá a entender que aquele
         dinheiro já é dela antes da hora, e ninguém pode confiar nele
         pra se planejar. Vendedora de Sistema continua vendo tudo, como
         sempre foi. */
      if(cfg.hasPagamento && !ehVendedorDeSistema(a.vendedor) && !r.pago) return;
      if(t.byVendor[a.vendedor] === undefined) t.byVendor[a.vendedor] = 0;
      t.byVendor[a.vendedor] += commission;
    });
  });
  return t;
}

function entityRowCommission(r, slot){
  const base = entityRemainingAfterPartner(r);
  const pctField = slot === 3 ? 'comissaoPercent3' : (slot === 2 ? 'comissaoPercent2' : 'comissaoPercent');
  const pct = Number(r[pctField])||0;
  return base * (pct/100);
}

/* ---------- Divisão do faturamento de um curso entre as vendedoras ----------
   Um lançamento de curso é o faturamento TOTAL daquele curso, e ele vem de
   várias vendedoras: parte uma trouxe, parte outra. Não dá pra resolver com
   um nome só. Aqui a pessoa informa quanto cada uma vendeu, em reais.
   Nada disso toca na comissão, que continua saindo dos campos
   "Vendedor / % Comissão" do lançamento. */
function resumoDivisao(row){
  const lista = row.vendasVendedoras || [];
  const somado = lista.reduce(function(a, x){ return a + (Number(x.valor)||0); }, 0);
  const total = Number(row.valorContrato) || 0;
  const diferenca = total - somado;
  const fecha = lista.length > 0 && Math.abs(diferenca) < 0.005;
  return {
    lista: lista, somado: somado, total: total, diferenca: diferenca, fecha: fecha,
    rotuloDiferenca: diferenca > 0 ? ('falta ' + fmtMoney(diferenca))
                   : (diferenca < 0 ? (fmtMoney(-diferenca) + ' a mais') : 'confere'),
  };
}

  const kpiToggleHtml = `

      <button class="eye-toggle" onclick="toggleEntityValues('${key}')">${st.valuesRevealed ? '🙈 Ocultar valores' : '👁 Mostrar valores'}</button>

    <div class="kpi-card" style="--kc:${vendorColor(v, st.vendors)}">

      <div class="kpi-value${st.valuesRevealed?'':' masked'}" id="kpi-${key}-${slug(v)}">${st.valuesRevealed ? fmtMoney(totals.byVendor[v]||0) : '••••••'}</div>

  `).join('') + `
    <div class="kpi-card total">
      <div class="kpi-label">Total em contratos</div>
      <div class="kpi-value" id="kpi-${key}-total">${fmtMoney(totals.contrato)}</div>
    </div>
  `;

  const emptyMsg = st.vendorFilter !== "Todos"
    ? `Nenhum lançamento de ${esc(st.vendorFilter)} neste filtro.`
    : `Nenhum lançamento ainda. Clique em "+ Novo lançamento" para começar.`;

  const maxExtra = visible.reduce((max,r) => Math.max(max, Array.isArray(r.extraVendedores)?r.extraVendedores.length:0), 0);
  const colCount = 2 + cfg.fields.length + 7 + (maxExtra*2) + (cfg.hasPagamento?1:0) + (cfg.hasVendasPorVendedor?1:0) + (cfg.hasVendedorResponsavel?1:0);
  const rowsHtml = visible.length === 0
    ? `<tr class="empty-row"><td colspan="${colCount}"><span class="empty-icon">◌</span>${emptyMsg}</td></tr>`
    : visible.map(row => {
        let cells = `<td class="col-mes"><select data-entity="${key}" data-id="${row.id}" onchange="onEntityMonthSelect(this)" title="${esc(row.mes)}">${MONTHS.map(m => `<option value="${m}" ${row.mes===m?'selected':''}>${monthShort(m)}</option>`).join('')}</select>${isEntityRowPending(row) ? '<span class="pending-badge" title="Lançamento incompleto: falta valor ou percentual">⚠️</span>' : ''}${isMonthClosedFor(key,row.ano||2026,row.mes) ? '<span class="pending-badge" title="Mês fechado">🔒</span>' : ''}${row.parcelaLabel ? `<span class="parcela-badge" title="Parcela ${row.parcelaLabel} deste contrato">🧩 ${row.parcelaLabel}</span>` : ''}${isEntityRowDuplicate(key,row) ? `<span class="dup-badge" title="Já existe outro lançamento com o mesmo nome, mês e valor — confira se não é duplicado">🔁 Duplicado</span>` : ''}</td>`;
        cfg.fields.forEach((f, fi) => {
          if(fi === 1 && cfg.hasVendedorResponsavel && !isFinanceiro){
            cells += `<td class="resp-cell">
              <select class="${(row.vendedorResponsavel||'').trim() || row.renovacao ? '' : 'sem-resp'}" data-entity="${key}" data-id="${row.id}" data-field="vendedorResponsavel" onchange="onEntitySelectField(this)"
                      title="${row.renovacao ? 'Renovação não conta no Relatório de Desempenho — "quem vendeu" é opcional aqui' : 'Quem efetivamente fez esta venda — é essa pessoa que o Relatório de Desempenho conta'}">
                <option value="">— quem vendeu?</option>
                <option value="${SEM_VENDEDORA}" ${row.vendedorResponsavel===SEM_VENDEDORA?'selected':''}>Sem vendedora (não se aplica)</option>
                ${entityVendorsForCurrentUser(key).map(v => `<option value="${esc(v)}" ${row.vendedorResponsavel===v?'selected':''}>${esc(v)}</option>`).join('')}
              </select>
            </td>`;
          }
          if(fi === 1 && cfg.hasVendasPorVendedor && !isFinanceiro){
            const d = resumoDivisao(row);
            if(!isAdmin){
              // A vendedora vê só a própria participação — sem o botão de
              // dividir e sem o aviso de "falta", que é conferência de admin.
              const meu = d.lista.reduce(function(a,x){ return a + (Number(x.valor)||0); }, 0);
              cells += `<td class="divisao-cell">
                ${meu > 0
                  ? `<div class="divisao-minha">${fmtMoney(meu)}<span>vendido por você</span></div>`
                  : `<div class="divisao-nada">—</div>`}
              </td>`;
            } else {
              cells += `<td class="divisao-cell">
                <button class="divisao-btn${d.fecha ? ' ok' : ''}" onclick="abrirDivisaoVendas('${key}',${row.id})"
                        title="Divide o faturamento deste curso entre quem realmente vendeu">
                  ${d.lista.length ? `${d.lista.length} vendedora${d.lista.length===1?'':'s'}` : '— dividir'}
                </button>

              </td>`;
            }

          if(f.key === "parceiro"){
            cells += `<td><select data-entity="${key}" data-id="${row.id}" onchange="onEntityParceiroSelect(this)">${partnerOptionsHtml(row.parceiro)}</select></td>`;
          } else if(f.key === "participacao"){
            cells += `<td class="col-pct">
              <div class="pct-wrap"><input class="num" type="number" step="0.1" min="0" placeholder="0" value="${row.participacao===null||row.participacao===undefined?'':row.participacao}" data-entity="${key}" data-id="${row.id}" data-field="participacao" oninput="onEntityNumInput(this)" /><span class="pct-suffix">%</span></div>
              ${row.parceiro ? `<div class="calc-value" id="calcParceiro-${key}-${row.id}">${fmtMoney((Number(row.valorContrato)||0) * (parsePercent(row.participacao)/100))}</div>` : ''}

          } else if(f.type === "text"){

            // Fica verde quando TODAS as empresas do lançamento já têm a

            const seloEmpresas = (cfg.hasEmpresas && fi === 0 && (isAdmin || isFinanceiro))

              : '';
            const mostraPrazo = cfg.hasPrazoEmissao && fi === 0 && (row.tipo === 'Mensal' || row.tipo === 'Plano Premium') && (isAdmin || isFinanceiro);
            const prazoRow = mostraPrazo ? prazoEmissaoPara(key, row[f.key]) : null;

            cells += `<td><select data-entity="${key}" data-id="${row.id}" data-field="${f.key}" onchange="onEntitySelectField(this)">${f.options.map(o => `<option value="${o}" ${row[f.key]===o?'selected':''}>${o||'—'}</option>`).join('')}</select></td>`;
          }
        });
        if(!isFinanceiro){
        cells += `<td class="col-pct">
          <div class="pct-wrap"><input class="num" type="number" step="0.1" min="0" placeholder="0" value="${row.comissaoPercent===null||row.comissaoPercent===undefined?'':row.comissaoPercent}" data-entity="${key}" data-id="${row.id}" data-field="comissaoPercent" oninput="onEntityNumInput(this)" /><span class="pct-suffix">%</span></div>
          <div class="calc-value" id="calc1-${key}-${row.id}">${fmtMoney(entityRowCommission(row,1))}</div>

        cells += `<td><select data-entity="${key}" data-id="${row.id}" data-field="vendedor" onchange="onEntitySelectField(this)"><option value="">—</option>${entityVendorsForCurrentUser(key).map(v => `<option value="${esc(v)}" ${row.vendedor===v?'selected':''}>${esc(v)}</option>`).join('')}</select></td>`;
        cells += `<td class="col-pct">
          <div class="pct-wrap"><input class="num" type="number" step="0.1" min="0" placeholder="0" value="${row.comissaoPercent2===null||row.comissaoPercent2===undefined?'':row.comissaoPercent2}" data-entity="${key}" data-id="${row.id}" data-field="comissaoPercent2" oninput="onEntityNumInput(this)" /><span class="pct-suffix">%</span></div>
          <div class="calc-value" id="calc2-${key}-${row.id}">${fmtMoney(entityRowCommission(row,2))}</div>

        cells += `<td><select data-entity="${key}" data-id="${row.id}" data-field="vendedor2" onchange="onEntitySelectField(this)"><option value="">—</option>${entityVendorsForCurrentUser(key).map(v => `<option value="${esc(v)}" ${row.vendedor2===v?'selected':''}>${esc(v)}</option>`).join('')}</select></td>`;
        cells += `<td class="col-pct">
          <div class="pct-wrap"><input class="num" type="number" step="0.1" min="0" placeholder="0" value="${row.comissaoPercent3===null||row.comissaoPercent3===undefined?'':row.comissaoPercent3}" data-entity="${key}" data-id="${row.id}" data-field="comissaoPercent3" oninput="onEntityNumInput(this)" /><span class="pct-suffix">%</span></div>
          <div class="calc-value" id="calc3-${key}-${row.id}">${fmtMoney(entityRowCommission(row,3))}</div>
        </td>`;
        cells += `<td><select data-entity="${key}" data-id="${row.id}" data-field="vendedor3" onchange="onEntitySelectField(this)"><option value="">—</option>${entityVendorsForCurrentUser(key).map(v => `<option value="${esc(v)}" ${row.vendedor3===v?'selected':''}>${esc(v)}</option>`).join('')}</select></td>`;
        for(let i=0; i<maxExtra; i++){
          const ev = (row.extraVendedores||[])[i];
          const slotNum = 4+i;
          if(ev){
            const evValor = entityRemainingAfterPartner(row) * ((Number(ev.percent)||0)/100);
            cells += `<td class="col-pct">
              <div class="pct-wrap"><input class="num" type="number" step="0.1" min="0" placeholder="0" value="${ev.percent===null||ev.percent===undefined?'':ev.percent}" onchange="updateExtraVendedorField('${key}',${row.id},${ev.id},'percent',this.value===''?null:parseFloat(this.value))" /><span class="pct-suffix">%</span></div>
              <div class="calc-value">${fmtMoney(evValor)}</div>

            cells += `<td>
              <div style="display:flex;align-items:center;gap:2px;">
                <select style="flex:1;" onchange="updateExtraVendedorField('${key}',${row.id},${ev.id},'vendedor',this.value)"><option value="">—</option>${entityVendorsForCurrentUser(key).map(v => `<option value="${esc(v)}" ${ev.vendedor===v?'selected':''}>${esc(v)}</option>`).join('')}</select>

        cells += `<td class="del-cell">
          <div class="row-actions">
            ${key === 'cursos' ? `<button class="action-btn${row.inCompany?' ativo-incompany':''}" title="${row.inCompany?'Curso In Company — clique para desmarcar':'Marcar como curso In Company (entra no ranking)'}" onclick="toggleCursoInCompany(${row.id})">🏢</button>` : ''}
            <button class="action-btn" title="Adicionar mais um vendedor" onclick="addExtraVendedorSlot('${key}',${row.id})">➕</button>
            <button class="action-btn" title="Duplicar" onclick="duplicateEntityRow('${key}',${row.id})">⎘</button>
            <button class="action-btn" title="Parcelar em vários meses" onclick="parcelarEntityRow('${key}',${row.id})">🧩</button>
            <button class="action-btn" title="Repetir até dezembro (assinatura mensal)" onclick="repeatEntityRowForYear('${key}',${row.id})">🔁</button>
            <button class="action-btn${row.upgrade ? ' ativo-upgrade' : ''}" title="${row.upgrade ? 'É um upgrade — clique para desmarcar' : 'Marcar como upgrade (cliente que subiu de plano)'}" onclick="toggleEntityUpgrade('${key}',${row.id})">⬆️</button>
            <button class="action-btn${row.renovacao ? ' ativo' : ''}" title="${row.renovacao ? 'É uma renovação — clique para desmarcar' : 'Marcar como renovação (vale comissão, mas não é contrato novo)'}" onclick="toggleEntityRenovacao('${key}',${row.id})">♻️</button>
            <button class="action-btn danger" title="Excluir" onclick="deleteEntityRow('${key}',${row.id})">✕</button>
          </div>
        </td>`;
        return `<tr class="${isEntityRowPending(row) ? 'row-pending' : ''}${isMonthClosedFor(key,row.ano||2026,row.mes) ? ' row-locked' : ''}${isEntityRowDuplicate(key,row) ? ' row-duplicate' : ''}">${cells}</tr>`;
      }).join('');

  const semDivEnt = isAdmin ? entityRowsSemDivisao(key) : [];
  const avisoRespEnt = semDivEnt.length ? `
    <div class="storage-warning aviso-resp">
      🧭 <b>${semDivEnt.length}</b> ${cfg.itemLabel}${semDivEnt.length===1?'':'s'} de ${yearFilter} com a
      <b>divisão das vendas</b> em aberto. Cada curso é o faturamento total, vindo de mais de uma vendedora —
      abra a coluna <b>“Vendas por vendedora”</b> e informe quanto cada uma vendeu.
      Os campos “Vendedor / % Comissão” continuam como estão.
    </div>` : '';

  return `
    ${empresasDatalistHtml()}
    ${avisoFalhaHtml('lanc-'+key, 'os lançamentos desta aba')}
    ${avisoRespEnt}
    ${kpiToggleHtml}

    <div class="filters-row">
      <div class="months">${pillsHtml}</div>

    ${fieldFilterRowsHtml}

      <input id="search-${key}-main" class="search-input" type="text" placeholder="🔍 Buscar ${cfg.fields[0].label.toLowerCase()}..." value="${esc(st.search.main)}" oninput="onEntitySearchInput(this,'${key}','main')" />
      <input id="search-${key}-parceiro" class="search-input" type="text" placeholder="🔍 Buscar parceiro..." value="${esc(st.search.parceiro)}" oninput="onEntitySearchInput(this,'${key}','parceiro')" />
      <input id="search-${key}-colaborador" class="search-input" type="text" placeholder="🔍 Buscar colaborador..." value="${esc(st.search.colaborador)}" oninput="onEntitySearchInput(this,'${key}','colaborador')" />
    </div>

    ${panel('entity-'+key, esc(cfg.tabLabel), `
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="col-mes">Mês</th>
              ${cfg.fields.map((f,fi) => `<th${f.key==='valorContrato'?' class="num col-valor" title="Valor do Contrato"':(f.key==='participacao'?' class="num col-pct"':(f.type==='number'?' class="num"':(fi===0?' class="col-nome"':'')))}>${f.key==='valorContrato'?'Valor':f.label}</th>${fi===0&&cfg.hasVendasPorVendedor&&!isFinanceiro?('<th style="width:150px">'+(isAdmin?'Vendas por vendedora':'Sua venda')+'</th>'):''}${fi===0&&cfg.hasVendedorResponsavel&&!isFinanceiro?'<th style="width:150px">Quem vendeu?</th>':''}${f.key==='formaPagamento'&&cfg.hasPagamento?'<th style="width:110px">Pagamento</th>':''}`).join('')}

              <th>Vendedor 2</th>
              <th class="num">% Comissão V3</th>

              ${Array.from({length:maxExtra}).map((_,i) => `<th class="num">% Comissão V${4+i}</th><th>Vendedor ${4+i}</th>`).join('')}`}

    `, {
      flush: true,
      meta: `<span id="count-${key}"><b>${visible.length}</b> ${cfg.itemLabel}${visible.length===1?"":"s"}${st.filter!=="Todos" ? " em <b>"+esc(st.filter)+"</b>" : ""}${visible.filter(isEntityRowPending).length ? ` · <span style="color:#B45309;">⚠️ ${visible.filter(isEntityRowPending).length} incompleto${visible.filter(isEntityRowPending).length===1?'':'s'}</span>` : ''}${visible.filter(r=>isEntityRowDuplicate(key,r)).length ? ` · <span style="color:#6D28D9;">🔁 ${visible.filter(r=>isEntityRowDuplicate(key,r)).length} duplicado${visible.filter(r=>isEntityRowDuplicate(key,r)).length===1?'':'s'}</span>` : ''}</span>`,
      actions: `<div class="btn-row">
        <label class="ordem-wrap">
          <span>Ordenar</span>
          <select data-entity="${key}" onchange="setEntityOrdem(this)">
            <option value="padrao" ${st.ordem==='padrao'?'selected':''}>Mês de lançamento</option>

            <option value="za" ${st.ordem==='za'?'selected':''}>${esc(cfg.fields[0].label)} — Z a A</option>
            <option value="maior" ${st.ordem==='maior'?'selected':''}>Maior valor de contrato</option>
            <option value="menor" ${st.ordem==='menor'?'selected':''}>Menor valor de contrato</option>

        ${cfg.hasPagamento ? `<label class="ordem-wrap">
          <span>Pagamento</span>
          <select data-entity="${key}" onchange="setEntityFiltroPago(this)">
            <option value="Todos" ${st.filtroPago==='Todos'?'selected':''}>Todos</option>
            <option value="Pago" ${st.filtroPago==='Pago'?'selected':''}>Pagos</option>
            <option value="Pendente" ${st.filtroPago==='Pendente'?'selected':''}>Pendentes</option>
          </select>
        </label>` : ''}
        <button class="btn-add btn-secondary" onclick="addEntityVendor('${key}')">+ Vendedor</button>
        ${key === 'consultoria' ? `<button class="btn-add btn-secondary" onclick="abrirImportarConsultoria()">📄 Importar planilha</button>` : ''}
        <button class="btn-add" onclick="addEntityRow('${key}')">+ Novo lançamento</button>
      </div>`,
    })}
  `;
}

/* ---------------- Painel da Equipe: dados e ações ---------------- */

/* O painel mostra a equipe toda, inclusive para contas restritas: os
   totais vêm de uma view que expõe só os agregados, sem os contratos.

   Quem aparece aqui é uma lista PRÓPRIA do painel, não a lista de
   vendedoras do sistema: este painel acompanha só a equipe comercial que
   lança andamento, e não todo mundo que aparece nos lançamentos. A lista
   fica no banco (entity_vendors, entidade='painel') e quem é admin edita
   pelo botão "Quem aparece", sem mexer em nenhuma outra aba. */
const PAINEL_VENDEDORAS_PADRAO = ['Angela','Rios','Uilma','Luciana'];
let painelVendedoras = null;
let painelEditandoEquipe = false;

function vendedoresDoPainel(){
  return (painelVendedoras || PAINEL_VENDEDORAS_PADRAO).slice();
}

/* Todo mundo que o sistema conhece, pra montar a lista de marcar/desmarcar. */
function pessoasConhecidas(){
  const out = [], vistos = {};
  const push = function(n){
    const t = String(n === null || n === undefined ? '' : n).trim();
    if(!t) return;
    const k = t.toLowerCase();
    if(vistos[k]) return;
    vistos[k] = true; out.push(t);
  };
  SELLERS.forEach(function(x){ push(x.label); });
  ENTITY_KEYS.forEach(function(k){ (state[k].vendors || []).forEach(push); });
  vendedoresDoPainel().forEach(push);
  pessoasDeContratos().forEach(push);
  return out.sort(function(a,b){ return a.localeCompare(b, 'pt-BR', {sensitivity:'base'}); });
}

/* Renovado / Upgrade / Não renovado, com um quarto estado: em aberto. A
   empresa entra na lista quando a renovação começa a ser tratada, e só
   depois se sabe o desfecho — clicar de novo no botão aceso volta para em
   aberto.

   "Upgrade" é o caso do cliente que não renova o plano em que estava: ele
   migra para um plano maior. Não é perda (ele ficou, e a taxa de renovação
   não pode contar isso como churn) e também não é renovação comum (o valor
   mudou, e crescer a conta é venda de verdade — conta no ranking). Por
   isso ele é um estado próprio, que por dentro também vale como renovado. */
function setRenovacaoStatus(id, valor){
  if(!isAdmin) return;
  const r = renovacoes.find(function(x){ return x.id === id; });
  if(!r) return;
  const novo = (r.renovado === valor && !r.upgrade) ? null : valor;

  // lançada, então o sistema avisa e não apaga nada sozinho.
  if(renovacaoPresaNaVenda(r) && r.renovado === true && novo !== true){
    showConfirm(
      'Esta renovação já foi lançada como venda na aba Sistema. Mudar a situação aqui NÃO apaga a venda de lá — se ela não valer mais, exclua também na aba Sistema. Continuar?',
      function(){
        r.renovado = novo; r.upgrade = false;
        persistRenovacoes();
        render();
      },
      'Mudar mesmo assim'
    );
    return;
  }
  r.renovado = novo;
  r.upgrade = false;
  persistRenovacoes();
  render();
}

/* O upgrade pede uma pergunta a mais: o plano novo custa outro valor, e é

/* ---------- Importar a planilha de renovações ----------
   São muitas empresas e elas já existem numa planilha. Ler o arquivo é
   trabalho do sistema, não dela.

   O .xlsx é um ZIP de XMLs, e o navegador sabe descompactar sozinho
   (DecompressionStream), então dá para ler o arquivo direto, sem depender
   de biblioteca externa — o que seria impossível aqui, porque a política
   de segurança da página bloqueia scripts de fora. CSV e colar do Excel
   funcionam pelo mesmo caminho, só mudando como as linhas são separadas. */

async function lerZip(buffer){
  const dv = new DataView(buffer);
  const N = buffer.byteLength;
  let eocd = -1;
  for(let i = N - 22; i >= 0 && i >= N - 22 - 65535; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('Não consegui ler o arquivo — ele não parece uma planilha .xlsx.');
  const total = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const arquivos = {};
  for(let i = 0; i < total; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const metodo   = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nomeLen  = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const comLen   = dv.getUint16(p + 32, true);
    const offset   = dv.getUint32(p + 42, true);
    const nome = new TextDecoder().decode(new Uint8Array(buffer, p + 46, nomeLen));
    arquivos[nome] = { metodo: metodo, compSize: compSize, offset: offset };
    p += 46 + nomeLen + extraLen + comLen;
  }
  return { buffer: buffer, dv: dv, arquivos: arquivos };
}

async function lerDoZip(zip, nome){
  const e = zip.arquivos[nome];
  if(!e) return null;
  if(zip.dv.getUint32(e.offset, true) !== 0x04034b50) return null;
  const nomeLen  = zip.dv.getUint16(e.offset + 26, true);
  const extraLen = zip.dv.getUint16(e.offset + 28, true);
  const inicio = e.offset + 30 + nomeLen + extraLen;
  const dados = new Uint8Array(zip.buffer, inicio, e.compSize);
  if(e.metodo === 0) return new TextDecoder().decode(dados);
  if(typeof DecompressionStream === 'undefined'){
    throw new Error('Este navegador não consegue abrir .xlsx. Salve a planilha como CSV, ou copie as células no Excel e cole no campo abaixo.');
  }
  const fluxo = new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(fluxo).text();
}

function colunaParaIndice(ref){
  const letras = String(ref || '').replace(/[^A-Z]/g, '');
  let n = 0;
  for(let i = 0; i < letras.length; i++) n = n * 26 + (letras.charCodeAt(i) - 64);
  return n - 1;
}

/* Data no Excel é um número de dias desde 1900 (com o bug do ano bissexto
   de 1900 que a Microsoft nunca corrigiu, daí o -2). */
function dataDoExcel(n){
  const ms = (Number(n) - 25569) * 86400000;
  const d = new Date(ms);
  return isNaN(d.getTime()) ? null : d;
}

async function linhasDoXlsx(buffer){
  const zip = await lerZip(buffer);
  const textos = [];
  const ss = await lerDoZip(zip, 'xl/sharedStrings.xml');
  if(ss){
    const itens = ss.match(/<si>[\s\S]*?<\/si>/g) || [];
    itens.forEach(function(si){
      const partes = si.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
      textos.push(partes.map(function(t){
        return t.replace(/<[^>]+>/g, '')
                .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
                .replace(/&apos;/g,"'").replace(/&amp;/g,'&');
      }).join(''));
    });
  }
  const nomeAba = Object.keys(zip.arquivos)
    .filter(function(n){ return /^xl\/worksheets\/sheet\d+\.xml$/.test(n); })
    .sort()[0];
  if(!nomeAba) throw new Error('Não achei nenhuma aba dentro da planilha.');
  const xml = await lerDoZip(zip, nomeAba);
  if(!xml) throw new Error('Não consegui abrir a primeira aba da planilha.');

  const linhas = [];
  const blocos = xml.match(/<row[\s\S]*?(?:\/>|<\/row>)/g) || [];
  blocos.forEach(function(bloco){
    const celulas = bloco.match(/<c[\s\S]*?(?:\/>|<\/c>)/g) || [];
    const linha = [];
    celulas.forEach(function(c){
      const ref  = (c.match(/\sr="([A-Z]+\d+)"/) || [])[1] || '';
      const tipo = (c.match(/\st="([a-zA-Z]+)"/) || [])[1] || 'n';
      const idx  = ref ? colunaParaIndice(ref) : linha.length;
      let valor = null;
      if(tipo === 'inlineStr'){
        const t = c.match(/<t[^>]*>([\s\S]*?)<\/t>/);
        valor = t ? t[1].replace(/<[^>]+>/g,'') : '';
      } else {
        const v = c.match(/<v[^>]*>([\s\S]*?)<\/v>/);
        const bruto = v ? v[1] : '';
        if(tipo === 's') valor = textos[Number(bruto)] !== undefined ? textos[Number(bruto)] : '';
        else if(tipo === 'b') valor = bruto === '1';
        else if(tipo === 'str' || tipo === 'd') valor = bruto;
        else valor = bruto === '' ? null : Number(bruto);
      }
      if(typeof valor === 'string'){
        valor = valor.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
                     .replace(/&apos;/g,"'").replace(/&amp;/g,'&');
      }
      while(linha.length < idx) linha.push(null);
      linha[idx] = valor;
    });
    if(linha.some(function(x){ return x !== null && x !== undefined && String(x).trim() !== ''; })) linhas.push(linha);
  });
  return linhas;
}

/* CSV/TSV: separador é o que mais aparece na primeira linha. Aspas com
   vírgula dentro são respeitadas. */
function linhasDeTexto(texto){
  const bruto = String(texto || '').replace(/\r\n?/g, '\n').replace(/^﻿/, '');
  const primeira = bruto.split('\n')[0] || '';
  const conta = function(ch){ return (primeira.split(ch).length - 1); };
  const sep = conta('\t') ? '\t' : (conta(';') >= conta(',') && conta(';') ? ';' : ',');
  const linhas = [];
  let campo = '', linha = [], entreAspas = false;
  for(let i = 0; i < bruto.length; i++){
    const ch = bruto[i];
    if(entreAspas){
      if(ch === '"'){
        if(bruto[i+1] === '"'){ campo += '"'; i++; } else entreAspas = false;
      } else campo += ch;
    } else if(ch === '"'){ entreAspas = true; }
    else if(ch === sep){ linha.push(campo); campo = ''; }
    else if(ch === '\n'){ linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else campo += ch;
  }
  linha.push(campo);
  if(linha.length) linhas.push(linha);
  return linhas.filter(function(l){ return l.some(function(x){ return String(x||'').trim() !== ''; }); });
}

function semAcento(t){
  return String(t === null || t === undefined ? '' : t)
    .normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}

/* Aceita "Agosto", "ago", "08", "8", "08/2026", "2026-08-15" e a data
   serial do Excel. Devolve {mes, ano} — o ano só quando a célula traz. */
function mesDaPlanilha(v){
  if(v === null || v === undefined || v === '') return null;
  if(typeof v === 'number'){
    if(v >= 1 && v <= 12 && Number.isInteger(v)) return { mes: MONTHS[v-1], ano: null };
    const d = dataDoExcel(v);
    if(d && d.getFullYear() > 1950 && d.getFullYear() < 2200) return { mes: MONTHS[d.getUTCMonth()], ano: d.getUTCFullYear() };
    return null;
  }
  const t = semAcento(v);
  if(!t) return null;
  const iso = t.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/);
  if(iso) return { mes: MONTHS[Number(iso[2])-1] || null, ano: Number(iso[1]) };
  const barra = t.match(/^(\d{1,2})\s*[\/\-.]\s*(\d{2,4})$/);
  if(barra){
    const m = Number(barra[1]);
    let a = Number(barra[2]); if(a < 100) a += 2000;
    if(m >= 1 && m <= 12) return { mes: MONTHS[m-1], ano: a };
  }
  const br = t.match(/^(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})$/);
  if(br){
    const m = Number(br[2]); let a = Number(br[3]); if(a < 100) a += 2000;
    if(m >= 1 && m <= 12) return { mes: MONTHS[m-1], ano: a };
  }
  const so = t.match(/^(\d{1,2})$/);
  if(so && Number(so[1]) >= 1 && Number(so[1]) <= 12) return { mes: MONTHS[Number(so[1])-1], ano: null };
  const nome = t.replace(/[^a-z]/g, '');
  const achou = MONTHS.find(function(m){ return semAcento(m).slice(0,3) === nome.slice(0,3); });
  if(achou){
    const ano = (String(v).match(/(20\d{2})/) || [])[1];
    return { mes: achou, ano: ano ? Number(ano) : null };
  }
  return null;
}

/* "R$ 1.234,56" → 1234.56. Ponto sozinho em grupos de 3 é milhar. */
function valorDaPlanilha(v){
  if(v === null || v === undefined || v === '') return null;
  if(typeof v === 'number') return v;
  let t = String(v).replace(/[R$\s ]/gi, '').trim();
  if(!t) return null;
  if(t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}

/* Descobre quais colunas são empresa, valor e mês. Se a primeira linha for
   cabeçalho, usa os nomes; senão assume a ordem que ela combinou. */
function mapearColunas(linhas){
  const cab = linhas[0] || [];
  const rotulos = cab.map(semAcento);
  const acha = function(re){ return rotulos.findIndex(function(r){ return re.test(r); }); };
  const iEmp = acha(/empresa|cliente|razao|nome/);
  const iVal = acha(/valor|preco|mensalidade|contrato/);
  const iMes = acha(/mes|renova|vencim|data/);
  if(iEmp >= 0 && (iVal >= 0 || iMes >= 0)){
    return { empresa: iEmp, valor: iVal, mes: iMes, temCabecalho: true };
  }
  return { empresa: 0, valor: 1, mes: 2, temCabecalho: false };
}

function prepararImportacaoRenovacoes(linhas, origem){
  if(!linhas.length) throw new Error('A planilha veio vazia.');
  const cols = mapearColunas(linhas);
  const corpo = cols.temCabecalho ? linhas.slice(1) : linhas;
  const existentes = {};
  renovacoes.forEach(function(r){
    existentes[semAcento(r.empresa) + '|' + r.mes + '|' + r.ano] = true;
  });

  const itens = [];
  corpo.forEach(function(l){
    const empresa = String(l[cols.empresa] === null || l[cols.empresa] === undefined ? '' : l[cols.empresa]).trim();
    if(!empresa) return;
    const valor = cols.valor >= 0 ? valorDaPlanilha(l[cols.valor]) : null;
    const m = cols.mes >= 0 ? mesDaPlanilha(l[cols.mes]) : null;
    const ano = (m && m.ano) ? m.ano : yearFilter;
    const mes = m ? m.mes : null;
    const chave = semAcento(empresa) + '|' + mes + '|' + ano;
    const duplicada = !!existentes[chave];
    if(!duplicada && mes) existentes[chave] = true;
    itens.push({
      empresa: empresa, valor: valor, mes: mes, ano: ano,
      duplicada: duplicada,
      aviso: !mes ? 'mês não reconhecido' : (duplicada ? 'já cadastrada' : ''),
    });
  });
  if(!itens.length) throw new Error('Não achei nenhuma empresa na planilha. Confira se a primeira coluna tem o nome da empresa.');
  return { itens: itens, cols: cols, origem: origem };
}

/* ---------- Importar a planilha de Consultoria ----------
   Mesmo mecanismo da planilha de renovações (linhasDoXlsx, linhasDeTexto,
   mesDaPlanilha, valorDaPlanilha já existem pra isso) — só muda o que cada
   coluna vira. Notas de antes do sistema existir não precisam ser
   digitadas uma a uma. */
function mapearColunasConsultoria(linhas){
  const cab = linhas[0] || [];
  const rotulos = cab.map(semAcento);
  const acha = function(re){ return rotulos.findIndex(function(r){ return re.test(r); }); };
  const empresa = acha(/empresa|cliente|razao|nome/);
  const valor = acha(/valor.*contrato|^valor$|mensalidade/);
  const mes = acha(/^mes$|mes de|data|vencim/);
  if(empresa >= 0 && (valor >= 0 || mes >= 0)){
    return {
      temCabecalho: true, empresa: empresa, valor: valor, mes: mes,
      tipo: acha(/tipo.*contrato|^tipo$/),
      parceiro: acha(/parceiro/),
      participacao: acha(/participa/),
      formaPagamento: acha(/forma.*pagamento|^pagamento$/),
      colaborador: acha(/colaborador/),
      vendedor: acha(/^vendedor$|^vendedor 1$|^vendedor1$/),
      comissaoPercent: acha(/comiss/),
      observacoes: acha(/observa/),
    };
  }
  // Sem cabeçalho reconhecido: assume a ordem descrita — mês, empresa,
  // valor, tipo, parceiro, forma de pagamento, colaborador, vendedor,
  // % comissão.
  return {
    temCabecalho: false, mes:0, empresa:1, valor:2, tipo:3, parceiro:4,
    formaPagamento:5, colaborador:6, vendedor:7, comissaoPercent:8,
    participacao:-1, observacoes:-1,
  };
}
function prepararImportacaoConsultoria(linhas){
  if(!linhas.length) throw new Error('A planilha veio vazia.');
  const cols = mapearColunasConsultoria(linhas);
  const corpo = cols.temCabecalho ? linhas.slice(1) : linhas;
  const tiposValidos = ENTITIES.consultoria.fields.find(function(f){ return f.key === 'tipo'; }).options;
  const celula = function(l, idx){ return idx >= 0 && l[idx] !== null && l[idx] !== undefined ? String(l[idx]).trim() : ''; };

  const existentes = {};
  state.consultoria.rows.forEach(function(r){
    existentes[semAcento(r.empresa) + '|' + r.mes + '|' + (r.ano||2026) + '|' + (Number(r.valorContrato)||0)] = true;
  });

  const itens = [];
  corpo.forEach(function(l){
    const empresa = celula(l, cols.empresa);
    if(!empresa) return;
    const valor = cols.valor >= 0 ? valorDaPlanilha(l[cols.valor]) : null;
    const m = cols.mes >= 0 ? mesDaPlanilha(l[cols.mes]) : null;
    const ano = (m && m.ano) ? m.ano : yearFilter;
    const mes = m ? m.mes : null;
    const tipoTexto = celula(l, cols.tipo);
    const tipo = tiposValidos.find(function(t){ return semAcento(t) === semAcento(tipoTexto); }) || tiposValidos[0];
    const participacaoBruta = cols.participacao >= 0 ? valorDaPlanilha(l[cols.participacao]) : null;
    const comissaoBruta = cols.comissaoPercent >= 0 ? l[cols.comissaoPercent] : null;
    const comissaoPercent = (comissaoBruta === null || comissaoBruta === undefined || comissaoBruta === '')
      ? null : (Number(String(comissaoBruta).replace(',', '.').replace('%', '')) || null);
    const chave = semAcento(empresa) + '|' + mes + '|' + ano + '|' + (valor||0);
    const duplicada = !!existentes[chave];
    if(!duplicada && mes) existentes[chave] = true;
    itens.push({
      empresa: empresa, valor: valor, mes: mes, ano: ano, tipo: tipo,
      parceiro: celula(l, cols.parceiro), participacao: participacaoBruta,
      formaPagamento: celula(l, cols.formaPagamento), colaborador: celula(l, cols.colaborador),
      vendedor: celula(l, cols.vendedor), comissaoPercent: comissaoPercent,
      observacoes: celula(l, cols.observacoes),
      duplicada: duplicada,
      aviso: !mes ? 'mês não reconhecido' : (duplicada ? 'já cadastrada' : ''),
    });
  });
  if(!itens.length) throw new Error('Não achei nenhuma empresa na planilha. Confira se a coluna de empresa tem dado.');
  return { itens: itens, cols: cols };
}

/* ---------- Empresas inscritas num curso só (dados pra nota fiscal) ----------
   Um lançamento de Cursos é o faturamento TOTAL — só que às vezes vem de
   várias empresas inscritas juntas, cada uma com sua própria nota fiscal
   (CNPJ, responsável, valor). Isso é outra coisa que "quem vendeu" e que
   comissão: fica numa tabela própria (lancamento_empresas), gravada linha
   a linha — nunca pelo ciclo de persistEntityRows, porque esse sempre
   reenvia o lançamento inteiro com o que a aba tem em memória, e ia
   sobrescrever o visto de "nota emitida" que o financeiro grava por fora
   (mesmo bug que já pegou o fechamento — aprendido, não repetido aqui). */

function empresasRowAtual(){
  if(!modalState || (modalState.type !== 'empresas-curso' && modalState.type !== 'import-empresas-curso')) return null;
  const st = state[modalState.entKey];
  return st ? (st.rows.find(function(r){ return r.id === modalState.rowId; }) || null) : null;
}

function resumoEmpresas(row){
  const lista = row.empresas || [];
  const somado = lista.reduce(function(a,x){ return a + (Number(x.valor)||0); }, 0);
  const total = Number(row.valorContrato) || 0;
  const diferenca = total - somado;
  const fecha = lista.length > 0 && Math.abs(diferenca) < 0.005;
  return {
    lista: lista, somado: somado, total: total, diferenca: diferenca, fecha: fecha,
    rotuloDiferenca: diferenca > 0 ? ('falta ' + fmtMoney(diferenca))
                   : (diferenca < 0 ? (fmtMoney(-diferenca) + ' a mais') : 'confere'),
  };
}

function abrirEmpresasCurso(entKey, rowId){
  if(!isAdmin && !isFinanceiro) return;
  modalState = { type:'empresas-curso', entKey: entKey, rowId: rowId };
  render();
  // A tela carrega os dados uma vez só, quando a aba abre — se alguém
  // mexeu nas empresas deste lançamento depois disso (outra pessoa
  // logada, ou a mesma pessoa em outra aba), essa cópia em memória fica
  // desatualizada até a página recarregar. Como é exatamente aqui que
  // isso mais importa (admin cadastra, financeiro confere/emite logo
  // depois), busca de novo do banco toda vez que o modal abre.
  refrescarEmpresasDoLancamento(entKey, rowId);
}

async function refrescarEmpresasDoLancamento(entKey, rowId){
  try{
    const db = await sbSelectOpcional('lancamento_empresas', 'select=*&lancamento_id=eq.'+rowId+'&order=id.asc', []);
    const r = state[entKey] && state[entKey].rows.find(function(x){ return x.id === rowId; });
    if(!r) return;
    if(!Array.isArray(r.empresas)) r.empresas = [];
    // Nunca troca a lista inteira: se a pessoa acabou de adicionar uma
    // empresa nesse meio-tempo (ainda no debounce, não gravada), um
    // "replace" apagaria essa edição em andamento. Por isso só atualiza
    // quem já existe e acrescenta quem é novo — nunca remove (excluir
    // continua sendo uma ação explícita, via removeEmpresaCurso).
    const porId = {};
    r.empresas.forEach(function(e){ porId[e.id] = e; });
    (db||[]).forEach(function(e){
      const doServidor = {
        id: e.id, nome: e.nome||'', cnpj: e.cnpj||'', responsavel: e.responsavel||'',
        valor: e.valor, observacoes: e.observacoes||'',
        telefone: e.telefone||'', email: e.email||'',
        notaEmitida: !!e.nota_emitida, notaEmitidaEm: e.nota_emitida_em || null,
        podeEmitir: !!e.pode_emitir, podeEmitirEm: e.pode_emitir_em || null,
        dataMinimaEmissao: e.data_minima_emissao || null,
        notaArquivoPath: e.nota_arquivo_path || null, notaArquivoNome: e.nota_arquivo_nome || null,
      };
      if(porId[e.id]) Object.assign(porId[e.id], doServidor);
      else { r.empresas.push(doServidor); porId[e.id] = doServidor; }
    });
    render();
  }catch(e){ console.error('Falha ao atualizar as empresas deste lançamento', e); }
}

const empresaTimers = {};
/* extra: só usado ao CRIAR a empresa (ver confirmarVinculoPedido) — pode
   levar pode_emitir/pode_emitir_em/data_minima_emissao junto, porque
   nesse momento a linha ainda não existe no banco, então não tem o visto
   de ninguém pra atropelar. Fora daí, esses campos continuam de fora
   deste payload — ver nota acima. */
function persistEmpresaCurso(empresa, rowId, extra){
  if(!isAdmin && !isFinanceiro) return;
  const tk = 'empresa-' + empresa.id;
  if(empresaTimers[tk]) clearTimeout(empresaTimers[tk]);
  empresaTimers[tk] = setTimeout(function(){
    (async function(){
      saving = true; updateSaveStatus();
      try{
        // nota_emitida/nota_emitida_em nunca vão nesse payload — ver nota acima.
        await sbUpsert('lancamento_empresas', [Object.assign({
          id: empresa.id, lancamento_id: rowId,
          nome: empresa.nome||'', cnpj: cnpjDigitos(empresa.cnpj), responsavel: empresa.responsavel||'',
          valor: numOrNull(empresa.valor), observacoes: empresa.observacoes||'',
          telefone: empresa.telefone||'', email: empresa.email||'',
        }, extra||{})], 'id');
        saveError = false;
      }catch(e){
        console.error('Falha ao salvar empresa do curso', e);
        saveError = true;
        // Diferente dos outros pontos de gravação: aqui o alerta é visível
        // de propósito, não só o pontinho "erro ao salvar" — já aconteceu
        // de um import inteiro "dar certo" na tela e nada ter sido gravado
        // (id gerado pelo cliente contra uma coluna auto-incremento no
        // banco), e isso só apareceu quando a página foi recarregada.
        showAlert('Não consegui gravar "' + (empresa.nome || 'esta empresa') + '" no banco. Confira a internet e tente de novo — sem isso, ela some se a página recarregar.');
      }
      finally{ saving = false; updateSaveStatus(); }
    })();
  }, 450);
}

/* Anexo do arquivo da nota fiscal (PDF/imagem), não só o visto de
   "emitida" — vale para as notas de Sistema, Consultoria, Órgãos
   Públicos e Cursos (inclusive cada empresa de um curso), sempre pela
   mesma porta estreita (anexar_nota_arquivo), porque o financeiro não
   tem UPDATE direto em nenhuma dessas tabelas. */
async function anexarNotaArquivo(tabela, id, entKey, input){
  if(!isAdmin && !isFinanceiro) return;
  const arq = input.files && input.files[0];
  if(!arq) return;
  const alvo = acharAlvoNota(tabela, id, entKey);
  if(!alvo) return;
  saving = true; updateSaveStatus();
  try{
    const nomeLimpo = arq.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
    const path = tabela + '-' + id + '/' + Date.now() + '-' + nomeLimpo;
    await sbUploadFile('notas-fiscais', path, arq);
    await sbRpc('anexar_nota_arquivo', { p_tabela: tabela, p_id: id, p_path: path, p_nome: arq.name });
    alvo.notaArquivoPath = path;
    alvo.notaArquivoNome = arq.name;
    saveError = false;
  }catch(e){
    console.error('Falha ao anexar nota fiscal', e);
    saveError = true;
    showAlert('Não consegui anexar o arquivo. Confira a internet e tente de novo.');
  }finally{
    saving = false; updateSaveStatus(); input.value = ''; render();
  }
}
async function verNotaAnexada(tabela, id, entKey){
  const alvo = acharAlvoNota(tabela, id, entKey);
  if(!alvo || !alvo.notaArquivoPath) return;
  // A aba precisa abrir NA HORA do clique, ainda síncrona — se abrir só
  // depois do "await" da URL assinada, o navegador não reconhece mais
  // como ação direta da pessoa e bloqueia como pop-up (sem erro nenhum
  // aparecer, o anexo simplesmente "não abre"). Por isso abre em branco
  // primeiro e só troca o endereço quando a URL chega.
  const aba = window.open('', '_blank');
  try{
    const url = await sbSignedUrl('notas-fiscais', alvo.notaArquivoPath, 120);
    if(aba) aba.location.href = url;
    else window.open(url, '_blank');
  }catch(e){
    if(aba) aba.close();
    console.error('Falha ao abrir a nota anexada', e);
    showAlert('Não consegui abrir o arquivo anexado. Tente de novo.');
  }
}
function removerNotaAnexada(tabela, id, entKey){

      }catch(e){
        console.error('Falha ao remover o anexo', e);
        showAlert('Não consegui remover o anexo no banco. Tente de novo.');
      }
    },
    'Remover'
  );
}

/* Na imensa maioria dos lançamentos só existe UMA empresa (em
   Consultoria/Órgãos Públicos, a própria Consultoria/Órgão já é a
   empresa em si — "empresas" só serve pra separar quando são várias.
   Em Cursos é diferente: o lançamento é o CURSO, e quem paga a nota é
   outra coisa, cadastrada aqui dentro). Nesse caso comum, forçar a
   pessoa a redigitar nome, CNPJ e valor que já estão ali do lado — o
   nome do lançamento (quando já é o da empresa), o cadastro de
   Empresas e o próprio valor do contrato — é retrabalho sem
   necessidade. Por isso a PRIMEIRA empresa nasce pré-preenchida com o
   que já se sabe; a pessoa só confere e corrige se for o caso. A
   partir da segunda, não tem o que copiar — nasce em branco como
   sempre. */
function addEmpresaCurso(){
  const r = empresasRowAtual();
  if(!r || (!isAdmin && !isFinanceiro)) return;
  if(!Array.isArray(r.empresas)) r.empresas = [];
  const ehPrimeira = r.empresas.length === 0;
  const cfg = ENTITIES[modalState.entKey];
  const mainField = cfg.fields[0].key;
  /* Em Consultoria e Órgãos Públicos, o nome do lançamento JÁ É o nome da
     empresa — dá pra herdar e puxar o CNPJ do cadastro de cara. Em Cursos
     não: o campo principal é o nome do CURSO ("RTO Presencial", por
     exemplo), não de quem vai receber a nota. Herdar esse nome ali
     enganava — a caixa aparecia com "algo preenchido" (o título do
     curso), então ninguém corrigia, e como esse texto nunca bate com
     nenhuma empresa cadastrada, o CNPJ nunca vinha sozinho. Por isso só
     herda o nome do lançamento quando o campo principal é mesmo uma
     empresa (hasVendasPorVendedor é a marca de "isso aqui é produto, não
     empresa" — hoje só Cursos). */
  const nomeLancamento = (ehPrimeira && !cfg.hasVendasPorVendedor) ? (r[mainField] || '') : '';
  const cadastro = nomeLancamento ? empresasCadastro.find(function(e){ return name_matches_client(e.nome, nomeLancamento); }) : null;
  const nova = {
    id: Date.now() + r.empresas.length,
    nome: nomeLancamento,
    cnpj: cadastro ? cadastro.cnpj : '',
    responsavel: cadastro ? cadastro.responsavel : '',
    telefone: cadastro ? cadastro.telefone : '',
    email: cadastro ? cadastro.email : '',
    valor: ehPrimeira ? r.valorContrato : null,
    observacoes: '', notaEmitida: false, notaEmitidaEm: null,
  };
  r.empresas.push(nova);
  persistEmpresaCurso(nova, r.id);
  render();
}

function removeEmpresaCurso(empresaId){

  r.empresas = (r.empresas||[]).filter(function(x){ return x.id !== empresaId; });
  if(empresaTimers['empresa-'+empresaId]) clearTimeout(empresaTimers['empresa-'+empresaId]);
  sbDeleteAll('lancamento_empresas', 'id=eq.'+empresaId).catch(function(e){ console.error('Falha ao excluir empresa', e); });

function updateEmpresaCurso(empresaId, campo, valor){
  const r = empresasRowAtual();
  if(!r || (!isAdmin && !isFinanceiro)) return;
  const item = (r.empresas||[]).find(function(x){ return x.id === empresaId; });
  if(!item) return;
  item[campo] = campo === 'valor' ? numOrNull(valor) : valor;
  persistEmpresaCurso(item, r.id);
  if(campo === 'cnpj'){
    const aviso = document.getElementById('empresa-cnpj-aviso-'+empresaId);
    if(aviso) aviso.textContent = (cnpjDigitos(item.cnpj) && !cnpjValido(item.cnpj)) ? 'CNPJ incompleto' : '';
  }
}

/* Igual ao que já acontece no Sistema: se o nome digitado bate com uma
   empresa do cadastro, CNPJ, responsável, telefone e e-mail vêm sozinhos
   — só quando ainda estão vazios, pra nunca sobrescrever o que a pessoa
   já tinha corrigido ali de propósito. */
function onEmpresaCursoNomeChange(el, empresaId){
  updateEmpresaCurso(empresaId, 'nome', el.value);
  const r = empresasRowAtual();
  const item = r && (r.empresas||[]).find(function(x){ return x.id === empresaId; });
  if(!item) return;
  const cadastro = empresasCadastro.find(function(e){ return name_matches_client(e.nome, item.nome); });
  if(!cadastro) return;
  if(!item.cnpj && cadastro.cnpj) updateEmpresaCurso(empresaId, 'cnpj', cadastro.cnpj);
  if(!item.responsavel && cadastro.responsavel) updateEmpresaCurso(empresaId, 'responsavel', cadastro.responsavel);
  if(!item.telefone && cadastro.telefone) updateEmpresaCurso(empresaId, 'telefone', cadastro.telefone);
  if(!item.email && cadastro.email) updateEmpresaCurso(empresaId, 'email', cadastro.email);
  render();
}

function mapearColunasEmpresas(linhas){
  const cab = linhas[0] || [];
  const rotulos = cab.map(semAcento);
  const acha = function(re){ return rotulos.findIndex(function(r){ return re.test(r); }); };
  const nome = acha(/empresa|razao|nome/);
  const cnpj = acha(/cnpj/);
  if(nome >= 0 && (cnpj >= 0 || acha(/valor/) >= 0)){
    return {
      temCabecalho: true, nome: nome, cnpj: cnpj,
      responsavel: acha(/respons/),
      telefone: acha(/telefone|fone|celular/),
      email: acha(/e-?mail/),
      valor: acha(/valor|mensalidade|contrato/),
      vendedora: acha(/vended/),
      observacoes: acha(/observa/),
    };
  }
  return { temCabecalho: false, nome: 0, cnpj: 1, responsavel: 2, valor: 3, vendedora: 4, observacoes: 5, telefone: 6, email: 7 };
}

function prepararImportacaoEmpresas(linhas, entKey, rowId){
  if(!linhas.length) throw new Error('A planilha veio vazia.');
  const r = state[entKey].rows.find(function(x){ return x.id === rowId; });
  const cols = mapearColunasEmpresas(linhas);
  const corpo = cols.temCabecalho ? linhas.slice(1) : linhas;
  const celula = function(l, idx){ return idx >= 0 && l[idx] !== null && l[idx] !== undefined ? String(l[idx]).trim() : ''; };

  const existentes = {};
  (r && r.empresas || []).forEach(function(e){
    existentes[semAcento(e.nome) + '|' + cnpjDigitos(e.cnpj)] = true;
  });

  const itens = [];
  corpo.forEach(function(l){
    const nome = celula(l, cols.nome);
    if(!nome) return;
    const cnpj = celula(l, cols.cnpj);
    const chave = semAcento(nome) + '|' + cnpjDigitos(cnpj);
    const duplicada = !!existentes[chave];
    if(!duplicada) existentes[chave] = true;
    itens.push({
      nome: nome, cnpj: cnpj, responsavel: celula(l, cols.responsavel),
      telefone: celula(l, cols.telefone), email: celula(l, cols.email),
      valor: cols.valor >= 0 ? valorDaPlanilha(l[cols.valor]) : null,
      vendedora: celula(l, cols.vendedora),
      observacoes: celula(l, cols.observacoes),
      duplicada: duplicada,
      aviso: duplicada ? 'já cadastrada' : (cnpj && !cnpjValido(cnpj) ? 'CNPJ incompleto' : ''),
    });
  });
  if(!itens.length) throw new Error('Não achei nenhuma empresa na planilha. Confira se a coluna de nome tem dado.');
  return { itens: itens, cols: cols };
}

function voltarParaEmpresasCurso(entKey, rowId){
