                 value="${esc(usuarioForm.senha)}" oninput="onUsuarioFormInput(this,'senha')" />
          <button class="eye-toggle" onclick="onGerarSenha()">Gerar</button>
        </div>
      </label>
    </div>

    <label class="usuario-tipo">
      <input type="checkbox" ${usuarioForm.admin?'checked':''} onchange="onUsuarioFormInput(this,'admin')" />
      <span><b>Administrador</b> — vê e edita tudo, e pode gerenciar usuários</span>
    </label>

    ${!usuarioForm.admin ? `
      <label class="meta-field">
        <span>Nome nos lançamentos</span>
        <input type="text" autocomplete="off" placeholder="Ex: Rios"
               value="${esc(usuarioForm.pessoa)}" oninput="onUsuarioFormInput(this,'pessoa')" />
      </label>
      <div class="usuario-dica">
        Precisa ser <b>exatamente</b> o nome que aparece nos campos de vendedor dos lançamentos —
        é por ele que o sistema decide o que essa pessoa enxerga. "Rios" e "Ana Rios" são nomes
        diferentes para o sistema.
      </div>` : `
      <div class="usuario-dica">Conta de administrador não precisa de nome: ela vê tudo.</div>`}

    <button class="painel-salvar" ${usuariosCarregando?'disabled':''} onclick="criarUsuario()">
      ${usuariosCarregando ? 'Criando...' : 'Criar conta'}
    </button>
  `);

  const linhas = (usuariosLista || []).map(function(u){
    const quando = u.ultimoAcesso
      ? new Date(u.ultimoAcesso).toLocaleDateString('pt-BR')
      : '<span class="usuario-nunca">nunca entrou</span>';
    return `<tr>
      <td>${esc(u.email)}</td>
      <td>${u.semAcesso
        ? '<span class="usuario-tag alerta">sem acesso</span>'
        : (u.admin ? '<span class="usuario-tag admin">Administrador</span>'
                   : '<span class="usuario-tag">Restrita</span>')}</td>
      <td>${u.pessoa ? esc(u.pessoa) : '—'}</td>
      <td>${quando}</td>
      <td class="del-cell"><div class="row-actions">
        <button class="action-btn" title="Definir senha provisória nova" onclick="redefinirSenhaUsuario('${escJs(u.id)}','${escJs(u.email)}')">🔑</button>
        <button class="action-btn" title="Mudar o nível de acesso" onclick="abrirAcessoUsuario('${escJs(u.id)}')">✎</button>
      </div></td>
    </tr>`;
  }).join('');

  const corpoLista = usuariosErro
    ? `<div class="storage-warning">⚠️ ${esc(usuariosErro)}</div>`
    : (usuariosLista === null || usuariosCarregando)
      ? `<div class="meta-empty">Carregando as contas...</div>`
      : (linhas ? `<div class="table-scroll"><table class="table-plain">
            <thead><tr><th>E-mail</th><th>Acesso</th><th>Nome nos lançamentos</th><th>Último acesso</th><th></th></tr></thead>
            <tbody>${linhas}</tbody>
          </table></div>`
        : `<div class="meta-empty">Nenhuma conta cadastrada ainda.</div>`);

  const lista = panel('usuarios-lista', 'Contas do sistema', corpoLista, {
    meta: usuariosLista ? `<b>${usuariosLista.length}</b> conta${usuariosLista.length===1?'':'s'}` : '',
    flush: !!linhas && !usuariosErro,
    actions: `<button class="eye-toggle" onclick="carregarUsuarios()">↻ Atualizar</button>`,
  });

  return `
    <div class="usuario-aviso">
      🔐 O cadastro de contas roda no servidor, não aqui no navegador — a chave que cria usuário
      nunca chega ao seu computador. Só quem é administrador consegue usar esta área, e isso é
      conferido de novo no servidor a cada ação.
    </div>
    ${senhaMostrada}
    ${sectionsToolbarHtml()}
    ${formulario}
    ${lista}
  `;
}

/* ---------------- App shell ---------------- */

function setTab(t){
  activeTab = t;
  // Ao abrir o painel, relê os totais: eles podem ter mudado em outra aba
  // (ou por outra pessoa) desde que a página abriu.
  if(t === 'painel') tryLoadPainelTotaisAsync();
  render();
}

function render(){
  const root = document.getElementById('root');
  if(!authSession){ renderAuthScreen(); return; }
  if(!initialDataLoaded){
    root.innerHTML = `<div class="app-loading"><div class="spinner"></div><div>Carregando seus dados...</div></div>`;
    return;
  }
  ensurePartnersIncludeCurrent();
  const sectionHtml = activeTab === "vendas" ? renderVendasSection()
    : activeTab === "parceiros" ? renderParceirosSection()
    : activeTab === "bonus" ? renderBonusSection()
    : activeTab === "pagamentos" ? renderPagamentosSection()
    : activeTab === "painel" ? renderPainelSection()
    : activeTab === "usuarios" ? renderUsuariosSection()
    : renderEntitySection(activeTab);

  const years = getKnownYears();
  const yearPillsHtml = years.map(y => {
    const active = y === yearFilter ? ' active' : '';
    return `<button class="pill year-pill${active}" onclick="setYearFilter(${y})">${y}</button>`;
  }).join('') + `<button class="pill year-pill year-add" onclick="addYear()">+ Ano</button>`;

  const abaAtual = TABS.find(t => t.key === activeTab);

  root.innerHTML = `
    <div class="shell${isAdmin ? '' : ' read-only-mode'}">
      <aside class="sidebar">
        <div class="brand">
          ${marcaOpenHtml({tam:30})}
          <div class="brand-text">
            <div class="brand-sub">Painel Diretoria Comercial</div>
          </div>
        </div>
        <nav class="nav">${sidebarNavHtml()}</nav>
        <div class="sidebar-foot">
          <span class="sidebar-user" title="Conectado como">${esc((authSession.user && authSession.user.email) || '')}</span>
          ${!isAdmin ? '<span class="read-only-badge" title="Você só vê e não edita os próprios lançamentos">somente leitura</span> ' : ''}
          <button class="logout-btn" onclick="logout()" title="Sair da conta">Sair</button>
        </div>
      </aside>

      <div class="main">
      <div class="hero">
        <div class="hero-globo">${logoGloboSvg(210, '#ffffff')}</div>
        <div class="hero-marca">
          ${marcaOpenHtml({tam:38, clara:true, cor:'#8FCBF5'})}
          <div class="hero-divisor"></div>
          <div>
            <div class="hero-eyebrow">Painel Diretoria Comercial</div>
            <h1>${esc(abaAtual ? abaAtual.label : 'Comissões')}</h1>
          </div>
        </div>
        <div class="hero-right">
          <div class="hero-info">Controle mensal de vendas e comissões</div>
          <div class="hero-info-sub">Exercício de ${yearFilter}</div>
          <div class="save-chip">
            <span id="save-dot" class="dot${saveError?' error':(saving?' saving':'')}"></span>
            <span id="save-label">${saveError?'erro ao salvar':(saving?'salvando':'salvo')}</span>
          </div>
        </div>
      </div>
      <div class="hero-linha"></div>

      ${!isAdmin ? `
        <div class="storage-warning read-only-notice">
          👁 Modo somente leitura — você só vê os lançamentos relacionados a você${currentPersonName ? ` (<b>${esc(currentPersonName)}</b>)` : ''} e não pode editar. Pra lançar ou alterar algo, fale com a administração do sistema.
        </div>
      ` : ''}

      ${storageAvailable === false ? `
        <div class="storage-warning">
          ⚠️ Não foi possível conectar ao banco de dados agora — os lançamentos podem não estar sendo salvos nem sincronizados entre pessoas. Verifique sua internet e recarregue a página.
        </div>
      ` : ''}

      <div class="year-row">
        <span class="year-row-label">Ano:</span>
        <div class="months">${yearPillsHtml}</div>
        <div class="topbar-actions">
          <button class="eye-toggle admin-only-btn" onclick="abrirRelatorioMes()" title="Gera um relatório do mês inteiro, com todas as abas, pra salvar em PDF ou imprimir">📄 Relatório do mês</button>
          <button class="eye-toggle" onclick="showExport()" title="Copia todos os dados em texto, pra guardar ou levar pra outro navegador">⬇ Exportar dados</button>
          <button class="eye-toggle admin-only-btn" onclick="showImport()" title="Cola um texto exportado antes e restaura os dados">⬆ Importar dados</button>
          <button class="eye-toggle admin-only-btn" onclick="normalizeAllText()" title="Coloca Primeira Letra Maiúscula em todos os textos já lançados">Aa Normalizar textos</button>
          <button class="eye-toggle danger-toggle admin-only-btn" onclick="wipeAllData()" title="Apaga todos os lançamentos das três abas, mantendo produtos/vendedores/parceiros cadastrados">🗑 Zerar tudo</button>
        </div>
      </div>

      ${sectionHtml}
      </div>
    </div>
    ${renderModal()}
  `;
  if(!isAdmin){
    root.querySelectorAll('tbody td input, tbody td select, .meta-input-wrap input').forEach(function(el){ el.disabled = true; });
  }
}

function boot(){
  loadDataSync();
  checkStorageAvailability();
  const loaders = [
    loadCurrentUserAccess(),
    tryLoadFromStorageAsync(),
    tryLoadVendaProductsFromStorageAsync(),
    tryLoadSistemaSellersFromStorageAsync(),
    tryLoadPartnersFromStorageAsync(),
    tryLoadExtraYearsFromStorageAsync(),
    tryLoadEntityFromStorageAsync('consultoria'),
    tryLoadEntityFromStorageAsync('publicos'),
    tryLoadEntityFromStorageAsync('cursos'),
    tryLoadBonusFromStorageAsync(),
    tryLoadClosedMonthsFromStorageAsync(),
    tryLoadMetasFromStorageAsync(),
    tryLoadRelatoriosFromStorageAsync(),
    tryLoadPainelTotaisAsync(),
    tryLoadPainelVendedorasAsync(),
    tryLoadPainelContratosAsync(),
    tryLoadContratosNovosAsync(),
    tryLoadFechamentoForaAsync(),
  ];
  Promise.allSettled(loaders).then(function(){
    initialDataLoaded = true;
    render();
  });
  render();
}

/* Link de recuperação de senha do Supabase volta com #access_token=...&type=recovery */
(function initAuth(){
  const hash = window.location.hash;
  if(hash && hash.length > 1){
    const params = new URLSearchParams(hash.slice(1));
    if(params.get('type') === 'recovery' && params.get('access_token')){
      authRecoveryToken = params.get('access_token');
      authScreen = 'reset';
      renderAuthScreen();
      return;
    }
  }
  authSession = loadStoredAuthSession();
  if(authSession) boot();
  else renderAuthScreen();
})();
</script>
</body>
</html>
