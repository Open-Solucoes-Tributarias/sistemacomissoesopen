/* ---------------- Parcelamento de contratos ---------------- */

function nextMonthYear(mes, ano, stepsForward){
  let idx = MONTHS.indexOf(mes) + stepsForward;
  const yearOffset = Math.floor(idx / 12);
  idx = ((idx % 12) + 12) % 12;
  return {mes: MONTHS[idx], ano: (ano||2026) + yearOffset};
}

function splitIntoInstallments(total, n){
  const amounts = [];
  let remaining = total;
  const base = Math.round((total/n)*100)/100;
  for(let i=0;i<n;i++){
    if(i === n-1) amounts.push(Math.round(remaining*100)/100);
    else { amounts.push(base); remaining -= base; }
  }
  return amounts;
}

function parcelarRow(id){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    return;
  }
  if(!r.valor || Number(r.valor) <= 0){
    showAlert("Preencha o Valor do Contrato antes de parcelar.");
    return;
  }
  showPrompt("Em quantas parcelas mensais? (2 a 24)", (val) => {
    const n = parseInt(val, 10);
    if(!n || n < 2 || n > 24){ showAlert("Digite um número de parcelas entre 2 e 24."); return; }
    const amounts = splitIntoInstallments(Number(r.valor), n);
    const origMes = r.mes, origAno = r.ano||2026;
    r.valor = amounts[0];
    r.parcelaLabel = `1/${n}`;
    for(let i=1;i<n;i++){
      const nm = nextMonthYear(origMes, origAno, i);
      const copy = {...r, id: nextId++, mes: nm.mes, ano: nm.ano, valor: amounts[i], pago:false, mesPagamento:null, parcelaLabel:`${i+1}/${n}`, comissaoPercents: Object.assign({}, r.comissaoPercents)};
      recalcComissoesPorPercent(copy);
      rows.push(copy);
    }
    persist();
  });
}

function isMonthClosed(ano, mes){
  return closedMonths.indexOf(ano+'-'+mes) !== -1;
}
function toggleMonthClosed(ano, mes){
  const key = ano+'-'+mes;
  const idx = closedMonths.indexOf(key);
  if(idx === -1) closedMonths.push(key);
  else closedMonths.splice(idx,1);
  persistClosedMonths();
  render();
}



/* ---------------- Metas mensais ----------------
   Uma meta é um GATILHO DA EMPRESA que premia uma pessoa:
   "quando a empresa faturar R$ X em <origem> no mês, fulana ganha Y".
   O prêmio é um valor fixo em R$ ou uma % sobre o total faturado
   (sobre o total inteiro, não sobre o que passou do alvo).
   Como depende do faturamento geral, só admin configura e acompanha. */

const META_ORIGENS = [
  {key:'cursos',      label:'Cursos'},
  {key:'sistema',     label:'Sistema'},
  {key:'consultoria', label:'Consultoria'},
  {key:'publicos',    label:'Consultoria Órgãos Públicos'},
  {key:'todas',       label:'Todas as abas somadas'},
];
function origemLabel(key){
  const o = META_ORIGENS.find(x => x.key === key);
  return o ? o.label : key;
}

/* Total faturado pela empresa numa origem, no mês/ano informado.
   Usa o valor cheio do contrato, antes de comissões e parceiros. */
function faturamentoDaOrigem(origem, ano, mes){
  let total = 0;
  if(origem === 'sistema' || origem === 'todas'){
    rows.forEach(r => {
      if((r.ano||2026) !== ano || r.mes !== mes) return;
      total += Number(r.valor)||0;
    });
  }
  ENTITY_KEYS.forEach(key => {
    if(origem !== 'todas' && origem !== key) return;
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== ano || r.mes !== mes) return;
      total += Number(r.valorContrato)||0;
    });
  });
  return total;
}

/* Situação de uma meta: quanto já faturou, se bateu e quanto vale o prêmio. */
function avaliarMeta(m){
  const faturado = faturamentoDaOrigem(m.origem, m.ano, m.mes);
  const bateu = m.alvo > 0 && faturado >= m.alvo;
  const premio = !bateu ? 0
    : (m.premioTipo === 'fixo' ? Number(m.premioValor)||0
                               : faturado * ((Number(m.premioValor)||0) / 100));
  const pct = m.alvo > 0 ? Math.round((faturado / m.alvo) * 100) : 0;
  return { faturado, bateu, premio, pct, falta: Math.max(0, m.alvo - faturado) };
}

function metaDescricaoRegra(m){
  const gatilho = `Quando a empresa faturar ${fmtMoney(m.alvo)} em ${origemLabel(m.origem)}`;
  const premio = m.premioTipo === 'fixo'
    ? `${fmtMoney(m.premioValor)} fixos`
    : `${String(m.premioValor).replace('.',',')}% do total faturado`;
  return `${gatilho} → ${premio}`;
}

function metasDoMes(){
  if(partnerMonthFilter === "Todos") return [];
  return metas.filter(m => m.ano === yearFilter && m.mes === partnerMonthFilter);
}
function bonusDaMeta(metaId){
  return bonusRows.find(b => b.metaId === metaId);
}

/* ---- criar / editar / excluir uma meta ---- */
function novaMeta(){
  if(partnerMonthFilter === "Todos"){
    showAlert("Escolha um mês no filtro acima para criar uma meta — metas são mensais.");
    return;
  }
  modalState = {
    type:'meta-form',
    meta:{ id:null, ano:yearFilter, mes:partnerMonthFilter, vendedor:'',
           origem:'cursos', alvo:null, premioTipo:'fixo', premioValor:null },
    error:'',
  };
  render();
}
function editarMeta(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  modalState = { type:'meta-form', meta: Object.assign({}, m), error:'' };
  render();
}
function excluirMeta(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  showConfirm(
    `Excluir a meta de ${m.vendedor}? ${metaDescricaoRegra(m)}. O bônus já lançado a partir dela, se houver, continua na aba Bônus e Metas.`,
    () => {
      metas = metas.filter(x => x.id !== id);
      persistMetas();
      render();
    },
    "Excluir"
  );
}
function onMetaFormChange(el, campo){
  if(!modalState || modalState.type !== 'meta-form') return;
  const v = el.value;
  if(campo === 'alvo' || campo === 'premioValor') modalState.meta[campo] = v === '' ? null : parseFloat(v);
  else modalState.meta[campo] = v;
  if(campo === 'premioTipo') render();
}
function salvarMeta(){
  if(!modalState || modalState.type !== 'meta-form') return;
  const m = modalState.meta;
  if(!m.vendedor){ modalState.error = 'Escolha quem recebe o prêmio.'; render(); return; }
  if(!(Number(m.alvo) > 0)){ modalState.error = 'Informe o valor que a empresa precisa faturar.'; render(); return; }
  if(!(Number(m.premioValor) > 0)){ modalState.error = 'Informe o valor do prêmio.'; render(); return; }
  if(m.premioTipo === 'percentual_total' && Number(m.premioValor) > 100){
    modalState.error = 'A porcentagem do prêmio não pode passar de 100%.'; render(); return;
  }
  if(m.id === null){
    m.id = metasNextId++;
    metas.push(m);
  } else {
    const i = metas.findIndex(x => x.id === m.id);
    if(i !== -1) metas[i] = m;
  }
  modalState = null;
  persistMetas();
  render();
}

/* Regras costumam valer o ano inteiro; isso evita recadastrar toda virada
   de mês. Pula meses que já tiverem uma regra idêntica. */
function mesmaRegra(a, b){
  return a.vendedor === b.vendedor && a.origem === b.origem
      && Number(a.alvo) === Number(b.alvo)
      && a.premioTipo === b.premioTipo
      && Number(a.premioValor) === Number(b.premioValor);
}
function repetirMetaNoAno(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  const idx = MONTHS.indexOf(m.mes);
  const restantes = MONTHS.slice(idx + 1);
  if(restantes.length === 0){
    showAlert("Dezembro é o último mês do ano — não há meses seguintes para repetir.");
    return;
  }
  const alvos = restantes.filter(mes =>
    !metas.some(x => x.ano === m.ano && x.mes === mes && mesmaRegra(x, m)));
  if(alvos.length === 0){
    showAlert("Todos os meses seguintes de " + m.ano + " já têm essa mesma regra.");
    return;
  }
  showConfirm(
    `Repetir esta regra de ${m.vendedor} (${metaDescricaoRegra(m)}) em ${alvos.join(', ')} de ${m.ano}? Meses que já tiverem uma regra igual serão pulados.`,
    () => {
      alvos.forEach(mes => {
        metas.push(Object.assign({}, m, {id: metasNextId++, mes: mes}));
      });
      persistMetas();
      render();
    },
    "Repetir"
  );
}

/* ---- lançar o bônus da meta batida (com confirmação) ---- */
function lancarBonusDaMeta(id){
  const m = metas.find(x => x.id === id);
  if(!m) return;
  const av = avaliarMeta(m);
  if(!av.bateu){ showAlert("Esta meta ainda não foi batida."); return; }
  if(bonusDaMeta(id)){ showAlert("O bônus desta meta já foi lançado."); return; }
  if(isMonthClosed(m.ano, m.mes)){
    showAlert("Este mês está fechado para novos lançamentos. Reabra em Resumo Geral para poder lançar.");
    return;
  }
  showConfirm(
    `Lançar ${fmtMoney(av.premio)} de bônus para ${m.vendedor} em ${m.mes}/${m.ano}? A empresa faturou ${fmtMoney(av.faturado)} em ${origemLabel(m.origem)} (meta: ${fmtMoney(m.alvo)}). O lançamento vai para a aba Bônus e Metas e pode ser editado lá.`,
    () => {
      const desc = m.premioTipo === 'fixo'
        ? `Meta batida — ${origemLabel(m.origem)} ${fmtMoney(m.alvo)}`
        : `Meta batida — ${String(m.premioValor).replace('.',',')}% de ${fmtMoney(av.faturado)} em ${origemLabel(m.origem)}`;
      bonusRows.unshift({
        id: bonusNextId++, ano: m.ano, mes: m.mes, vendedor: m.vendedor,
        descricao: desc, valor: Math.round(av.premio*100)/100, metaId: m.id,
      });
      persistBonus();
      render();
    },
    "Lançar bônus"
  );
}

function getPartnerEntries(){
  const out = [];
  const sources = [
    {origem:'Sistema', list: rows, valorField:'valor', labelFn: r => r.cliente || r.venda || ''},
    {origem:'Consultoria', list: state.consultoria.rows, valorField:'valorContrato', labelFn: r => r.empresa || ''},
    {origem:'Consultoria Órgãos Públicos', list: state.publicos.rows, valorField:'valorContrato', labelFn: r => r.orgao || ''},
    {origem:'Cursos', list: state.cursos.rows, valorField:'valorContrato', labelFn: r => r.curso || ''},
  ];
  sources.forEach(src => {
    src.list.forEach(r => {
      if(!r.parceiro) return;
      if((r.ano||2026) !== yearFilter) return;
      if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
      const valorContrato = Number(r[src.valorField])||0;
      const pct = parsePercent(r.participacao);
      const honorario = valorContrato * (pct/100);
      out.push({ origem: src.origem, mes: r.mes, label: src.labelFn(r), valorContrato, parceiro: r.parceiro, pct, honorario });
    });
  });
  return out;
}

function computePartnerTotals(entries){
  const t = {};
  partners.forEach(p => t[p] = 0);
  entries.forEach(e => {
    if(t[e.parceiro] === undefined) t[e.parceiro] = 0;
    t[e.parceiro] += e.honorario;
  });
  return t;
}

function repeatSalarioForYear(id){
  const r = bonusRows.find(x => x.id === id);
  if(!r) return;
  const startIdx = MONTHS.indexOf(r.mes);
  if(startIdx === -1 || startIdx === MONTHS.length - 1){

  const restantes = MONTHS.slice(startIdx + 1);
  const quem = r.vendedor || "esse colaborador";
  showConfirm(
    `Repetir o salário de ${quem} nos meses restantes de ${r.ano||yearFilter} (${restantes.join(', ')})? Meses fechados, ou que já tenham um salário lançado para a mesma pessoa, serão pulados.`,
    () => {
      const ano = r.ano || yearFilter;
      restantes.forEach(mes => {
        if(isMonthClosed(ano, mes)) return;
        const existe = bonusRows.some(x => (x.ano||2026) === ano && x.mes === mes
          && isSalarioRow(x) && (x.vendedor||"") === (r.vendedor||""));
        if(existe) return;
        bonusRows.push({...r, id: bonusNextId++, mes: mes, metaId: null});
      });
      persistBonus();
      render();
    },
    "Repetir"
  );
}

function duplicateBonusRow(id){
  const r = bonusRows.find(r => r.id === id);
  if(!r) return;
  bonusRows.unshift({...r, id: bonusNextId++});
  persistBonus();
  render();
}

function deleteBonusRow(id){
  const r = bonusRows.find(r => r.id === id);
  if(r && isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado. Reabra em Resumo Geral para poder excluir.");
    return;
  }
  showConfirm(isSalarioRow(r) ? "Excluir este lançamento de salário?" : "Excluir este bônus/meta?", () => {
    bonusRows = bonusRows.filter(r => r.id !== id);
    persistBonus();
  });
}

function updateBonusCell(id, field, value){
  const r = bonusRows.find(r => r.id === id);
  if(!r) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    render();
    return;
  }
  r[field] = value;
  persistBonus();
  if(field === "mes" || field === "vendedor") render();
  else updateBonusSummaries();
}

}

/* Salário fixo do colaborador mora na mesma tabela dos bônus — é outro
   valor que a pessoa recebe no mês —, mas nunca entra nas somas de bônus,
   comissão ou faturamento: é custo da empresa, não prêmio nem venda.
   A separação é feita por esta marca. */
const BONUS_TIPO_SALARIO = 'Salário fixo';
function isSalarioRow(r){ return r && r.tipo === BONUS_TIPO_SALARIO; }

function bonusDoAnoEMes(){
  let list = bonusRows.filter(r => (r.ano||2026) === yearFilter);
  return bonusFilter === "Todos" ? list : list.filter(r => r.mes === bonusFilter);
}
function getBonusVisible(){
  return bonusDoAnoEMes().filter(r => !isSalarioRow(r));
}
function getSalarioVisible(){
  return bonusDoAnoEMes().filter(isSalarioRow);
}

function computeBonusTotals(visible){
  const t = {};
  SELLERS.forEach(s => t[s.label] = 0);
  visible.forEach(r => {
    if(!r.vendedor) return;
    if(t[r.vendedor] === undefined) t[r.vendedor] = 0;
    t[r.vendedor] += Number(r.valor)||0;
  });
  return t;
}

function updateBonusSummaries(){
  const visible = getBonusVisible();
  const totals = computeBonusTotals(visible);
  SELLERS.forEach(s => {
    const el = document.getElementById('kpi-bonus-'+s.key);
    if(el) el.textContent = bonusValuesRevealed ? fmtMoney(totals[s.label]) : '••••••';
  });
  const totalEl = document.getElementById('kpi-bonus-total');
  if(totalEl) totalEl.textContent = fmtMoney(visible.reduce((s,r)=>s+(Number(r.valor)||0),0));
  const countEl = document.getElementById('count-bonus');
  if(countEl){
    countEl.innerHTML = `<b>${visible.length}</b> lançamento${visible.length===1?"":"s"} ${bonusFilter!=="Todos" ? "em <b>"+esc(bonusFilter)+"</b>" : ""}`;
  }
  const salarios = getSalarioVisible();
  const salCountEl = document.getElementById('count-salario');
  if(salCountEl){
    const totSal = salarios.reduce((a,r)=>a+(Number(r.valor)||0),0);
    salCountEl.innerHTML = `<b>${salarios.length}</b> salário${salarios.length===1?'':'s'}${bonusFilter!=="Todos" ? " em <b>"+esc(bonusFilter)+"</b>" : " no ano"}${salarios.length ? ' · '+(bonusValuesRevealed ? fmtMoney(totSal) : '••••••') : ''}`;
  }
}

/* ---------------- Resumo Geral (vendedores + parceiros) ---------------- */

function getSellerBreakdown(){
  const by = {};
  SELLERS.forEach(s => { by[s.label] = {sistema:0, consultoria:0, publicos:0, cursos:0, bonus:0}; });
  const ensure = (name) => { if(!by[name]) by[name] = {sistema:0, consultoria:0, publicos:0, cursos:0, bonus:0}; };

  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
    SELLERS.forEach(s => { by[s.label].sistema += Number(r[s.key])||0; });
  });

  ENTITY_KEYS.forEach(key => {
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
      const base = entityRemainingAfterPartner(r);
      getRowSellerAssignments(r).forEach(a => {
        ensure(a.vendedor);
        by[a.vendedor][key] += base * (a.percent/100);
      });
    });
  });

  bonusRows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(isSalarioRow(r)) return;              // salário não é ganho de comissão
    if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
    if(!r.vendedor) return;
    ensure(r.vendedor);
    by[r.vendedor].bonus += Number(r.valor)||0;
  });

  return by;
}

/* getSellerBreakdown lê o filtro de mês do Resumo Geral. Para usar o
   mesmo cálculo com o filtro de outra aba, aponta o filtro pro mês pedido
   e devolve no fim — mesmo jeito que o relatório em PDF faz. */
function sellerBreakdownDoMes(mes){
  const antigo = partnerMonthFilter;
  partnerMonthFilter = mes || 'Todos';
  const b = getSellerBreakdown();
  partnerMonthFilter = antigo;
  return b;
}

/* Quem NÃO entra no fechamento. Guarda-se a lista de fora, e não a de
   dentro, de propósito: assim uma pessoa nova aparece na folha sozinha, em
   vez de sumir calada — esquecer alguém num relatório de pagamento é bem
   pior do que ter uma linha a mais para tirar. */
let fechamentoFora = [];
let fechamentoEditando = false;
let fechamentoForaTimer = null;

async function tryLoadFechamentoForaAsync(){
  try{
    const db = await sbSelect('entity_vendors', 'select=vendor_name&entidade=eq.fechamento_fora&order=id.asc');
    carregouDoBanco['fechamento-fora'] = true;
    if(db) fechamentoFora = db.map(function(v){ return v.vendor_name; });
    render();
  }catch(e){ console.error(e); }
}

function persistFechamentoFora(){
  saving = true; updateSaveStatus();
  if(fechamentoForaTimer) clearTimeout(fechamentoForaTimer);
  fechamentoForaTimer = setTimeout(function(){
    (async function(){
      try{
        if(!carregouDoBanco['fechamento-fora']) return;   // nunca apagar sem ter lido antes
        await sbDeleteAll('entity_vendors', 'entidade=eq.fechamento_fora');
        const linhas = fechamentoFora.map(function(v){ return { entidade:'fechamento_fora', vendor_name:v }; });
        if(linhas.length) await sbUpsert('entity_vendors', linhas, 'entidade,vendor_name');
        saveError = false;
      }catch(e){ console.error(e); saveError = true; }
      finally{ saving = false; updateSaveStatus(); }
    })();
  }, 450);
}

function estaNoFechamento(nome){
  return !fechamentoFora.some(function(v){ return name_matches_client(v, nome); });
}
function toggleFechamentoPessoa(nome){
  if(!isAdmin) return;
  const i = fechamentoFora.findIndex(function(v){ return name_matches_client(v, nome); });
  if(i >= 0) fechamentoFora.splice(i, 1); else fechamentoFora.push(String(nome).trim());
  persistFechamentoFora();
  render();
}
function setFechamentoEditando(v){ fechamentoEditando = !!v; render(); }

/* O que vai para a contabilidade no mês: por pessoa, a comissão de cada
   origem + bônus + salário fixo. É o número que a Soraya manda pagar.

   A Consultoria fica FORA do total a pagar porque a comissão dela só se
   realiza quando o cliente paga — mandar pagar antes disso seria adiantar
   dinheiro que pode não ter entrado. Ela vem em colunas de apoio.

   A lista de pessoas não é só a das vendedoras do Sistema: quem só recebe
   salário (a equipe de consultoria, por exemplo) também precisa entrar,
   senão faltaria gente na folha. */
function fechamentoPagamentos(mes, todos){
  const bkd = sellerBreakdownDoMes(mes);
  const noPeriodo = function(r){
    return (r.ano||2026) === yearFilter && (mes === 'Todos' || !mes || r.mes === mes);
  };
  const salarioPorPessoa = {};
  bonusRows.forEach(function(r){
    if(!isSalarioRow(r) || !r.vendedor || !noPeriodo(r)) return;
    const chave = Object.keys(salarioPorPessoa).find(function(k){ return name_matches_client(k, r.vendedor); }) || r.vendedor;
    salarioPorPessoa[chave] = (salarioPorPessoa[chave] || 0) + (Number(r.valor)||0);
  });

  const nomes = [];
  const juntar = function(n){
    const t = String(n===null||n===undefined?'':n).trim();
    if(!t) return;
    if(!isAdmin && !name_matches_client(t, currentPersonName)) return;
    if(nomes.some(function(x){ return name_matches_client(x, t); })) return;
    nomes.push(t);
  };
  sellersForCurrentUser().forEach(function(sv){ juntar(sv.label); });
  Object.keys(bkd).forEach(juntar);
  Object.keys(salarioPorPessoa).forEach(juntar);

  return nomes.map(function(nome){
    const b = bkd[nome] || {sistema:0, consultoria:0, publicos:0, cursos:0, bonus:0};
    const chaveSal = Object.keys(salarioPorPessoa).find(function(k){ return name_matches_client(k, nome); });
    const salario = chaveSal ? salarioPorPessoa[chaveSal] : 0;
    const aPagar = b.sistema + b.publicos + b.cursos + b.bonus + salario;
    return {
      pessoa: nome, cor: corDoVendedor(nome),
      sistema: b.sistema, publicos: b.publicos, cursos: b.cursos,
      bonus: b.bonus, salario: salario, aPagar: aPagar,
      consultoria: b.consultoria, comConsultoria: aPagar + b.consultoria,
    };
  }).filter(function(l){
    if(todos) return true;
    if(!estaNoFechamento(l.pessoa)) return false;       // tirada da folha à mão
    return l.aPagar !== 0 || l.consultoria !== 0;       // sem nada no período só polui
  }).sort(function(a,b){ return b.aPagar - a.aPagar; });
}

/* Quem pode aparecer na folha: todo mundo que o sistema conhece, mais
   quem tem valor no período mesmo sem estar em nenhuma lista. */
function fechamentoCandidatos(mes){
  const out = pessoasConhecidas();
  fechamentoPagamentos(mes, true).forEach(function(l){
    if(!out.some(function(x){ return name_matches_client(x, l.pessoa); })) out.push(l.pessoa);
  });
  return out.sort(function(a,b){ return a.localeCompare(b, 'pt-BR', {sensitivity:'base'}); });
}

function getSellerGrandTotals(){
  const breakdown = getSellerBreakdown();
  const totals = {};
  Object.keys(breakdown).forEach(name => {
    const b = breakdown[name];
    totals[name] = b.sistema + b.consultoria + b.publicos + b.cursos + b.bonus;
  });
  return totals;
}

function getPartnerBreakdown(){
  const by = {};
  partners.forEach(p => { by[p] = {sistema:0, consultoria:0, publicos:0, cursos:0}; });
  const ensure = (name) => { if(!by[name]) by[name] = {sistema:0, consultoria:0, publicos:0, cursos:0}; };

  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
    if(!r.parceiro) return;
    ensure(r.parceiro);
    by[r.parceiro].sistema += (Number(r.valor)||0) * (parsePercent(r.participacao)/100);
  });

  ENTITY_KEYS.forEach(key => {
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      if(partnerMonthFilter !== "Todos" && r.mes !== partnerMonthFilter) return;
      if(!r.parceiro) return;
      ensure(r.parceiro);
      by[r.parceiro][key] += (Number(r.valorContrato)||0) * (parsePercent(r.participacao)/100);
    });
  });

  return by;
}

function getMonthlyTotals(){
  const totals = {};
  MONTHS.forEach(m => totals[m] = 0);
  rows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    SELLERS.forEach(s => { totals[r.mes] += Number(r[s.key])||0; });
  });
  ENTITY_KEYS.forEach(key => {
    state[key].rows.forEach(r => {
      if((r.ano||2026) !== yearFilter) return;
      const base = entityRemainingAfterPartner(r);
      getRowSellerAssignments(r).forEach(a => {
        totals[r.mes] += base * (a.percent/100);
      });
    });
  });
  bonusRows.forEach(r => {
    if((r.ano||2026) !== yearFilter) return;
    if(isSalarioRow(r)) return;              // salário é despesa, não faturamento
    totals[r.mes] += Number(r.valor)||0;
  });
  return totals;
}

function renderMonthlyChart(){
  const totals = getMonthlyTotals();
  const values = MONTHS.map(m => totals[m]);
  const max = Math.max(...values, 1);
  const w = 760, h = 180, padBottom = 24, padTop = 10, barGap = 6;
  const barW = (w / 12) - barGap;
  const bars = MONTHS.map((m,i) => {
    const val = values[i];
    const barH = Math.max((val/max) * (h-padTop-padBottom), val>0?2:0);
    const x = i * (w/12) + barGap/2;
    const y = h - padBottom - barH;
    const fill = m === partnerMonthFilter ? 'var(--primary)' : '#C7C2FB';
    const tooltipVal = partnersValuesRevealed ? fmtMoney(val) : 'valor oculto';
    return `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="${fill}">
      <title>${m}: ${tooltipVal}</title>
    </rect>
    <text x="${x+barW/2}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--ink-faint)">${monthNumber(m)}</text>`;
  }).join('');
  /* O título e a moldura vêm do painel que envolve o gráfico. */
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="overflow:visible;display:block;">${bars}</svg>`;
}

/* Quem efetivamente fez a venda. É diferente de quem ganha comissão nela:
   a comissão é dividida entre várias pessoas, mas a venda é de uma só —
   e é essa que o Painel da Equipe conta. */
function onResponsavelSelect(el){

  render();

function vendasSemResponsavel(){

}

/* ---------- Comissão do Sistema por percentual ----------
   A comissão de cada vendedora continua guardada em reais — é dela que
   sai todo o resto do sistema. A % é opcional: quando preenchida, o valor
   passa a ser calculado por ela e se refaz sozinho se o contrato ou a
   participação do parceiro mudarem. Digitar o valor à mão limpa a %.
   A base é a mesma das outras abas: o contrato menos a parte do parceiro. */
function vendaBaseComissao(r){
  const v = Number(r.valor)||0;
  if(!r.parceiro) return v;
  return v - (v * (parsePercent(r.participacao)/100));
}

function recalcComissoesPorPercent(r){
  const pcts = r.comissaoPercents || {};
  const base = vendaBaseComissao(r);
  let mudou = false;
  Object.keys(pcts).forEach(function(k){
    const p = pcts[k];
    if(p === null || p === undefined || p === '') return;
    r[k] = base * (Number(p)/100);
    mudou = true;
  });
  return mudou;
}

/* Escreve os valores recalculados direto nos campos, sem re-renderizar a
   tabela inteira — assim quem está digitando não perde o cursor. */
function pintarComissoesDaLinha(r){
  SELLERS.forEach(function(sv){
    const el = document.querySelector('input[data-id="' + r.id + '"][data-field="' + sv.key + '"]');
    if(!el) return;
    const v = r[sv.key];
    const novo = (v === null || v === undefined) ? '' : String(Math.round(Number(v)*100)/100);
    if(el.value !== novo && document.activeElement !== el) el.value = novo;
  });
}

function onComissaoPctInput(el){
  const id = Number(el.dataset.id), key = el.dataset.seller;
  const r = rows.find(function(x){ return x.id === id; });
  if(!r) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    render();
    return;
  }
  if(!r.comissaoPercents) r.comissaoPercents = {};
  const pct = numOrNull(el.value);
  if(pct === null){
    delete r.comissaoPercents[key];          // voltou a ser valor digitado à mão
  } else {
    r.comissaoPercents[key] = pct;
    r[key] = vendaBaseComissao(r) * (pct/100);
    pintarComissoesDaLinha(r);
  }
  persist();
  updateSummaries();
}

function onVendaSelect(el){
  const id = Number(el.dataset.id);
  if(el.value === '__new__'){
    showPrompt("Nome do novo produto:", (name) => {
      if(!name) return;
      const trimmed = name.trim();
      if(!trimmed) return;
      if(!vendaProducts.some(p => p.toLowerCase() === trimmed.toLowerCase())){
        vendaProducts.push(trimmed);
        vendaProducts.sort((a,b)=>a.localeCompare(b,'pt-BR'));
        persistVendaProducts();
      }
      updateCell(id, 'venda', trimmed);
    });
    return;
  }
  updateCell(id, 'venda', el.value);
}





function updateSaveStatus(){
  const dot = document.getElementById('save-dot');
  const label = document.getElementById('save-label');
  if(!dot) return;
  if(saveError){
    dot.className = "dot error";
    label.textContent = "erro ao salvar";
  } else {
    dot.className = "dot" + (saving ? " saving" : "");
    label.textContent = saving ? "salvando" : "salvo";
  }
}



function updateCell(id, field, value){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    render();
    return;
  }
  // Valor de comissão digitado à mão deixa de seguir a %.
  if(!VENDA_NON_SELLER_FIELDS.has(field) && r.comissaoPercents) delete r.comissaoPercents[field];
  r[field] = value;
  // Mudou o contrato ou a fatia do parceiro: as comissões com % se refazem.
  if(field === "valor" || field === "participacao" || field === "parceiro") recalcComissoesPorPercent(r);
  persist();
  if(field === "mes" || field === "parceiro") render();
  else {
    updateSummaries();
    if(field === "valor" || field === "participacao"){
      pintarComissoesDaLinha(r);
      updateRowPartnerCalc(id);
    }
  }
}

function updateRowPartnerCalc(id){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  const el = document.getElementById('calcParceiro-'+id);
  if(el) el.textContent = fmtMoney((Number(r.valor)||0) * (parsePercent(r.participacao)/100));
}

                   vendedorResponsavel: sellerFilter !== "Todas" ? ((SELLERS.find(x => x.key === sellerFilter)||{}).label || "") : "",
                   pago:false, mesPagamento:null, observacoes:"",
                   soraya:null, angela:null, rios:null, uilma:null, luciana:null,
                   comissaoPercents:{}};
  if(sellerFilter !== "Todas"){
    newRow[sellerFilter] = 0;
  }
  rows.unshift(newRow);
  persist();
  render();
}

function deleteRow(id){
  const r = rows.find(r => r.id === id);
  if(r && isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado. Reabra em Resumo Geral para poder excluir.");
    return;
  }
  showConfirm("Excluir esta venda?", () => {
    rows = rows.filter(r => r.id !== id);
    persist();
  });
}

function duplicateRow(id){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  const copy = {...r, id: nextId++, comissaoPercents: Object.assign({}, r.comissaoPercents)};
  rows.unshift(copy);
  persist();
  render();
}

function repeatRowForYear(id){
  const r = rows.find(r => r.id === id);
  if(!r) return;
  const startIdx = MONTHS.indexOf(r.mes);
  if(startIdx === -1 || startIdx === MONTHS.length - 1){
    showAlert("Esse lançamento já está em Dezembro — não há meses seguintes pra repetir.");
    return;
  }
  const remainingMonths = MONTHS.slice(startIdx + 1);
  const label = r.cliente || r.venda || "esse lançamento";
  showConfirm(
    `Repetir "${label}" para todos os meses restantes de ${r.ano} (${remainingMonths.join(', ')})? Meses que já tiverem um lançamento igual (mesmo cliente e produto) serão pulados.`,
    () => {
      remainingMonths.forEach(targetMonth => {
        const exists = rows.some(x => x.ano===r.ano && x.mes===targetMonth && (x.cliente||"")===(r.cliente||"") && (x.venda||"")===(r.venda||""));
        if(exists) return;
        const copy = {...r, id: nextId++, mes: targetMonth, comissaoPercents: Object.assign({}, r.comissaoPercents)};
        rows.push(copy);
      });
      persist();
    },
    "Repetir"
  );
}

function resetToOriginal(){
  showConfirm(
    "Isso vai substituir os dados atuais pelos dados originais (Jan–Jul reais + recorrentes Ago–Dez). Continuar?",
    () => {
      rows = SEED_DATA.slice();
      migrateYear(rows, 2026);
      nextId = NEXT_ID_START;
      yearFilter = 2026;
      persist();
    },
    "Restaurar"
  );
}

function wipeAllData(){
  showConfirm(
    "⚠️ ISSO VAI APAGAR TODOS OS LANÇAMENTOS de todas as abas (Sistema, Consultoria, Consultoria Órgãos Públicos, Cursos e Bônus e Metas), de todos os anos — não dá pra desfazer. Os produtos, vendedores e parceiros cadastrados continuam. Recomendo exportar os dados antes (botão ⬇ Exportar dados), caso precise deles depois. Tem certeza que quer zerar tudo?",
    () => {
      rows = [];
      nextId = 1;
      persist();

      ENTITY_KEYS.forEach(key => {
        state[key].rows = [];
        state[key].nextId = 1;
        persistEntityRows(key);
      });

      bonusRows = [];
      bonusNextId = 1;
      persistBonus();

      closedMonths = [];
      persistClosedMonths();
    },

  );
}

function addEntityRow(key){
  const cfg = ENTITIES[key];
  const st = state[key];
  const mes = st.filter === "Todos" ? "Janeiro" : st.filter;
  if(isMonthClosed(yearFilter, mes)){
    showAlert("Este mês está fechado para novos lançamentos. Reabra em Resumo Geral para poder editar.");
    return;
  }
  const row = {id: st.nextId++, mes, ano: yearFilter, comissaoPercent:null, vendedor: st.vendorFilter!=="Todos" ? st.vendorFilter : "", comissaoPercent2:null, vendedor2:"", comissaoPercent3:null, vendedor3:""};
  if(cfg.hasVendasPorVendedor) row.vendasVendedoras = [];
  if(cfg.hasPagamento){ row.pago = false; row.mesPagamento = null; }
  // participacao vira coluna numérica no banco, então nasce null e não ""
  const CAMPOS_NUMERICOS = new Set(["valorContrato","participacao"]);
  cfg.fields.forEach(f => {
    row[f.key] = f.type==="select" ? f.options[0]
      : ((f.type==="number" || CAMPOS_NUMERICOS.has(f.key)) ? null : "");
  });
  st.rows.unshift(row);
  persistEntityRows(key);
  render();
}

function addExtraVendedorSlot(key, rowId){
  const r = state[key].rows.find(r => r.id === rowId);
  if(!r) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    return;
  }
  if(!Array.isArray(r.extraVendedores)) r.extraVendedores = [];
  r.extraVendedores.push({id: Date.now() + r.extraVendedores.length, vendedor:"", percent:null});
  persistEntityRows(key);
  render();
}

function removeExtraVendedorSlot(key, rowId, slotId){
  const r = state[key].rows.find(r => r.id === rowId);
  if(!r || !Array.isArray(r.extraVendedores)) return;
  r.extraVendedores = r.extraVendedores.filter(ev => ev.id !== slotId);
  persistEntityRows(key);
  render();
}

function updateExtraVendedorField(key, rowId, slotId, field, value){
  const r = state[key].rows.find(r => r.id === rowId);
  if(!r || !Array.isArray(r.extraVendedores)) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    render();
    return;
  }
  const ev = r.extraVendedores.find(e => e.id === slotId);
  if(!ev) return;
  ev[field] = value;
  persistEntityRows(key);
  render();
}

function deleteEntityRow(key, id){
  const r = state[key].rows.find(r => r.id === id);
  if(r && isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado. Reabra em Resumo Geral para poder excluir.");
    return;
  }
  showConfirm("Excluir este lançamento?", () => {
    state[key].rows = state[key].rows.filter(r => r.id !== id);
    persistEntityRows(key);
  });
}

function duplicateEntityRow(key, id){
  const st = state[key];
  const r = st.rows.find(r => r.id === id);
  if(!r) return;
  const copy = {...r, id: st.nextId++};
  st.rows.unshift(copy);
  persistEntityRows(key);
  render();
}

function parcelarEntityRow(key, id){
  const st = state[key];
  const r = st.rows.find(r => r.id === id);
  if(!r) return;
  if(isMonthClosed(r.ano||2026, r.mes)){
    showAlert("Este mês está fechado para edição. Reabra em Resumo Geral para poder editar.");
    return;
  }
  if(!r.valorContrato || Number(r.valorContrato) <= 0){
    showAlert("Preencha o Valor do Contrato antes de parcelar.");
    return;
  }
  showPrompt("Em quantas parcelas mensais? (2 a 24)", (val) => {
    const n = parseInt(val, 10);
    if(!n || n < 2 || n > 24){ showAlert("Digite um número de parcelas entre 2 e 24."); return; }
    const amounts = splitIntoInstallments(Number(r.valorContrato), n);
    const origMes = r.mes, origAno = r.ano||2026;
    r.valorContrato = amounts[0];
    r.parcelaLabel = `1/${n}`;
    for(let i=1;i<n;i++){
      const nm = nextMonthYear(origMes, origAno, i);
      const copy = {...r, id: st.nextId++, mes: nm.mes, ano: nm.ano, valorContrato: amounts[i],
                    extraVendedores: Array.isArray(r.extraVendedores) ? r.extraVendedores.map(ev => ({...ev})) : [],
                    parcelaLabel:`${i+1}/${n}`};
      if(cfg_hasPagamento(key)){ copy.pago = false; copy.mesPagamento = null; }
      st.rows.push(copy);
    }
    persistEntityRows(key);
  });
}

function repeatEntityRowForYear(key, id){
  const st = state[key];
  const r = st.rows.find(r => r.id === id);
  if(!r) return;
  const startIdx = MONTHS.indexOf(r.mes);
  if(startIdx === -1 || startIdx === MONTHS.length - 1){
    showAlert("Esse lançamento já está em Dezembro — não há meses seguintes pra repetir.");
    return;
  }
  const remainingMonths = MONTHS.slice(startIdx + 1);
  const mainField = ENTITIES[key].fields[0].key;
  const label = r[mainField] || "esse lançamento";
  showConfirm(
    `Repetir "${label}" para todos os meses restantes de ${r.ano} (${remainingMonths.join(', ')})? Meses que já tiverem um lançamento igual (mesmo ${ENTITIES[key].fields[0].label.toLowerCase()}) serão pulados.`,
    () => {
      remainingMonths.forEach(targetMonth => {
        const exists = st.rows.some(x => x.ano===r.ano && x.mes===targetMonth && (x[mainField]||"")===(r[mainField]||""));
        if(exists) return;
        const copy = {...r, id: st.nextId++, mes: targetMonth};
        st.rows.push(copy);
      });
      persistEntityRows(key);
    },
    "Repetir"
  );
}

function getEntityVisible(key){
  const st = state[key];
  let list = st.rows.filter(r => (r.ano||2026) === yearFilter);
  list = st.filter === "Todos" ? list : list.filter(r => r.mes === st.filter);
  if(st.vendorFilter !== "Todos"){
    list = list.filter(r => getRowSellerAssignments(r).some(a => a.vendedor === st.vendorFilter));
  }
  ENTITIES[key].fields.forEach(f => {
    if(f.type === "select" && st.fieldFilters[f.key] && st.fieldFilters[f.key] !== "Todos"){
      list = list.filter(r => r[f.key] === st.fieldFilters[f.key]);
    }
  });
  const mainField = ENTITIES[key].fields[0].key;
  if(st.search.main.trim()){
    const q = st.search.main.trim().toLowerCase();
    list = list.filter(r => (r[mainField]||"").toLowerCase().includes(q));
  }
  if(st.search.parceiro.trim()){
    const q = st.search.parceiro.trim().toLowerCase();
    list = list.filter(r => (r.parceiro||"").toLowerCase().includes(q));
  }
  if(st.search.colaborador.trim()){
    const q = st.search.colaborador.trim().toLowerCase();
    list = list.filter(r => (r.colaborador||"").toLowerCase().includes(q));
  }
  return ordenarEntityRows(list, st.ordem, mainField);
}

/* Ordena só o que aparece na tela — a ordem guardada no banco não muda.
   localeCompare com 'pt-BR' resolve acento e maiúscula (Ácua vem antes de
   Alfa, e "alfa" e "Alfa" ficam juntos). */
function ordenarEntityRows(list, ordem, mainField, campoValor){
  if(!ordem || ordem === "padrao") return list;
  const copia = list.slice();
  const nome = r => String(r[mainField] || "").trim();
  const valor = r => Number(r[campoValor || 'valorContrato']) || 0;
  if(ordem === "az" || ordem === "za"){
    const dir = ordem === "az" ? 1 : -1;
    copia.sort((a,b) => {
      const na = nome(a), nb = nome(b);
      // linha nova (ainda sem nome) fica no topo pra não sumir de vista
      if(!na && !nb) return 0;
      if(!na) return -1;
      if(!nb) return 1;
      return dir * na.localeCompare(nb, 'pt-BR', {sensitivity:'base'});
    });
  } else if(ordem === "maior"){
    copia.sort((a,b) => valor(b) - valor(a));
  } else if(ordem === "menor"){
    copia.sort((a,b) => valor(a) - valor(b));
  }
  return copia;
}

function entityRemainingAfterPartner(row){
  const valorContrato = Number(row.valorContrato)||0;
  if(!row.parceiro) return valorContrato;
  const partnerPct = parsePercent(row.participacao);
  return valorContrato - (valorContrato * (partnerPct/100));
}

function getRowSellerAssignments(r){
  const list = [];
  if(r.vendedor) list.push({vendedor: r.vendedor, percent: Number(r.comissaoPercent)||0});
  if(r.vendedor2) list.push({vendedor: r.vendedor2, percent: Number(r.comissaoPercent2)||0});
  if(r.vendedor3) list.push({vendedor: r.vendedor3, percent: Number(r.comissaoPercent3)||0});
  if(Array.isArray(r.extraVendedores)){
    r.extraVendedores.forEach(ev => {
      if(ev.vendedor) list.push({vendedor: ev.vendedor, percent: Number(ev.percent)||0});
    });
  }
  return list;
}

function computeEntityTotals(key, visible){
  const st = state[key];
  const t = {contrato:0, comissao:0, byVendor:{}};
  st.vendors.forEach(v => t.byVendor[v] = 0);
  visible.forEach(r => {
    const valorContrato = Number(r.valorContrato)||0;
    t.contrato += valorContrato;
    const baseAposParceiro = entityRemainingAfterPartner(r);
    getRowSellerAssignments(r).forEach(a => {
      const commission = baseAposParceiro * (a.percent/100);
      t.comissao += commission;
      if(t.byVendor[a.vendedor] === undefined) t.byVendor[a.vendedor] = 0;
      t.byVendor[a.vendedor] += commission;
    });
  });
  return t;
}

function entityRowCommission(r, slot){
  const base = entityRemainingAfterPartner(r);
  const pctField = slot === 3 ? 'comissaoPercent3' : (slot === 2 ? 'comissaoPercent2' : 'comissaoPercent');
  const pct = Number(r[pctField])||0;
  return base * (pct/100);
}

function updateEntityRowCalc(key, id){
  const r = state[key].rows.find(r => r.id === id);
  if(!r) return;
  const el1 = document.getElementById('calc1-'+key+'-'+id);
  if(el1) el1.textContent = fmtMoney(entityRowCommission(r, 1));
  const el2 = document.getElementById('calc2-'+key+'-'+id);
  if(el2) el2.textContent = fmtMoney(entityRowCommission(r, 2));
  const el3 = document.getElementById('calc3-'+key+'-'+id);
  if(el3) el3.textContent = fmtMoney(entityRowCommission(r, 3));
  const elP = document.getElementById('calcParceiro-'+key+'-'+id);
  if(elP) elP.textContent = fmtMoney((Number(r.valorContrato)||0) * (parsePercent(r.participacao)/100));
}

/* ---------- Divisão do faturamento de um curso entre as vendedoras ----------
   Um lançamento de curso é o faturamento TOTAL daquele curso, e ele vem de
   várias vendedoras: parte uma trouxe, parte outra. Não dá pra resolver com
   um nome só. Aqui a pessoa informa quanto cada uma vendeu, em reais.
   Nada disso toca na comissão, que continua saindo dos campos
   "Vendedor / % Comissão" do lançamento. */
function resumoDivisao(row){
  const lista = row.vendasVendedoras || [];
  const somado = lista.reduce(function(a, x){ return a + (Number(x.valor)||0); }, 0);
  const total = Number(row.valorContrato) || 0;
  const diferenca = total - somado;
  const fecha = lista.length > 0 && Math.abs(diferenca) < 0.005;
  return {
    lista: lista, somado: somado, total: total, diferenca: diferenca, fecha: fecha,
    rotuloDiferenca: diferenca > 0 ? ('falta ' + fmtMoney(diferenca))
                   : (diferenca < 0 ? (fmtMoney(-diferenca) + ' a mais') : 'confere'),
  };
}

function entityRowsSemDivisao(key){
  if(!ENTITIES[key].hasVendasPorVendedor || !isAdmin) return [];
  return (state[key].rows || []).filter(function(r){
    return (r.ano||2026) === yearFilter && !resumoDivisao(r).fecha;
  });
}

function abrirDivisaoVendas(key, rowId){
  modalState = { type:'divisao-vendas', key: key, rowId: rowId };
  render();
}

function divisaoRowAtual(){
  if(!modalState || modalState.type !== 'divisao-vendas') return null;
  return (state[modalState.key].rows || []).find(function(r){ return r.id === modalState.rowId; }) || null;
}

function addDivisaoVenda(){
  const r = divisaoRowAtual();
  if(!r || !isAdmin) return;
  if(!Array.isArray(r.vendasVendedoras)) r.vendasVendedoras = [];
  const usados = r.vendasVendedoras.map(function(x){ return String(x.vendedor||'').toLowerCase(); });
  const livre = entityVendorsForCurrentUser(modalState.key)
    .find(function(v){ return usados.indexOf(v.toLowerCase()) === -1; });
  // id grande e único: a mesma convenção dos vendedores extras
  r.vendasVendedoras.push({ id: Date.now() + r.vendasVendedoras.length, vendedor: livre || '', valor: null });
  persistEntityRows(modalState.key);
  render();
}

function removeDivisaoVenda(itemId){
  const r = divisaoRowAtual();
  if(!r || !isAdmin) return;
  r.vendasVendedoras = (r.vendasVendedoras||[]).filter(function(x){ return x.id !== itemId; });
  persistEntityRows(modalState.key);
  render();
}

function updateDivisaoVenda(itemId, campo, valor){
  const r = divisaoRowAtual();
  if(!r || !isAdmin) return;
  const item = (r.vendasVendedoras||[]).find(function(x){ return x.id === itemId; });
  if(!item) return;
  if(campo === 'vendedor'){
    const repetida = (r.vendasVendedoras||[]).some(function(x){
      return x.id !== itemId && name_matches_client(x.vendedor, valor);
    });
    if(repetida){
      showAlert('Essa vendedora já está na divisão deste curso. Some os dois valores em uma linha só.');
      return;
    }
    item.vendedor = valor;
  } else {
    item.valor = numOrNull(valor);
  }
  persistEntityRows(modalState.key);
  render();
}

/* Enquanto digita, só atualiza o rodapé de conferência — sem re-render,
   pra não perder o cursor do campo. */
function onDivisaoValorInput(el, itemId){
  const r = divisaoRowAtual();
  if(!r) return;
  const item = (r.vendasVendedoras||[]).find(function(x){ return x.id === itemId; });
  if(!item) return;
  item.valor = numOrNull(el.value);
  const d = resumoDivisao(r);
  const alvo = document.getElementById('divisao-conferencia');
  if(alvo){
    alvo.className = 'divisao-conferencia' + (d.fecha ? ' ok' : '');
    alvo.innerHTML = 'Somado: <b>' + fmtMoney(d.somado) + '</b> de ' + fmtMoney(d.total)
      + (d.fecha ? ' — confere' : ' — <b>' + d.rotuloDiferenca + '</b>');
  }
  persistEntityRows(modalState.key);
}

function usarValorTotalNaDivisao(itemId){
  const r = divisaoRowAtual();
  if(!r || !isAdmin) return;
  const d = resumoDivisao(r);
  const item = (r.vendasVendedoras||[]).find(function(x){ return x.id === itemId; });
  if(!item) return;
  item.valor = (Number(item.valor)||0) + d.diferenca;
  persistEntityRows(modalState.key);
  render();
}

  const totalEl = document.getElementById('kpi-'+key+'-total');
  if(totalEl) totalEl.textContent = fmtMoney(totals.contrato);
  const countEl = document.getElementById('count-'+key);
  if(countEl){
    countEl.innerHTML = `<b>${visible.length}</b> ${ENTITIES[key].itemLabel}${visible.length===1?"":"s"} ${st.filter!=="Todos" ? "em <b>"+esc(st.filter)+"</b>" : ""}`;

/* O painel mostra a equipe toda, inclusive para contas restritas: os
   totais vêm de uma view que expõe só os agregados, sem os contratos.

   Quem aparece aqui é uma lista PRÓPRIA do painel, não a lista de
   vendedoras do sistema: este painel acompanha só a equipe comercial que
   lança andamento, e não todo mundo que aparece nos lançamentos. A lista
   fica no banco (entity_vendors, entidade='painel') e quem é admin edita
   pelo botão "Quem aparece", sem mexer em nenhuma outra aba. */
const PAINEL_VENDEDORAS_PADRAO = ['Angela','Rios','Uilma','Luciana'];
let painelVendedoras = null;
let painelEditandoEquipe = false;

function vendedoresDoPainel(){
  return (painelVendedoras || PAINEL_VENDEDORAS_PADRAO).slice();
}

/* Todo mundo que o sistema conhece, pra montar a lista de marcar/desmarcar. */
function pessoasConhecidas(){
  const out = [], vistos = {};
  const push = function(n){
    const t = String(n === null || n === undefined ? '' : n).trim();
    if(!t) return;
    const k = t.toLowerCase();
    if(vistos[k]) return;
    vistos[k] = true; out.push(t);
  };
  SELLERS.forEach(function(x){ push(x.label); });
  ENTITY_KEYS.forEach(function(k){ (state[k].vendors || []).forEach(push); });
  vendedoresDoPainel().forEach(push);
  pessoasDeContratos().forEach(push);
  return out.sort(function(a,b){ return a.localeCompare(b, 'pt-BR', {sensitivity:'base'}); });
}

function persistContratosNovos(){

  if(contratosNovosTimer) clearTimeout(contratosNovosTimer);
  contratosNovosTimer = setTimeout(function(){
    (async function(){
      try{
        const dbRows = contratosNovos.map(function(r){
          return {
            id: r.id, ano: r.ano, mes: r.mes, pessoa: r.pessoa,
            empresa: r.empresa || '', cnpj: r.cnpj || '',
            rentavel: (r.rentavel === null || r.rentavel === undefined) ? null : !!r.rentavel,
          };
        });
        await sbUpsert('contratos_consultoria', dbRows, 'id');
        // só apaga o que sumiu daqui se a lista do banco já tiver sido lida
        const existing = carregouDoBanco['contratos-novos']
          ? ((await sbSelect('contratos_consultoria','select=id')) || []) : [];
        const localIds = contratosNovos.map(function(r){ return r.id; });

          .filter(function(id){ return localIds.indexOf(id) === -1; });

        saveError = false;
      }catch(e){ console.error(e); saveError = true; }
      finally{ saving = false; updateSaveStatus(); }
    })();
  }, 450);
}

/* CNPJ: máscara 00.000.000/0000-00 e conferência dos dois dígitos
   verificadores. A conferência avisa, mas nunca bloqueia — o contrato
   pode ser cadastrado antes de alguém achar o número certo. */
function cnpjDigitos(v){ return String(v===null||v===undefined?'':v).replace(/\D/g,'').slice(0,14); }
function formatCnpj(v){
  const d = cnpjDigitos(v);
  if(!d) return '';
  let s = d.slice(0,2);
  if(d.length > 2)  s += '.' + d.slice(2,5);
  if(d.length > 5)  s += '.' + d.slice(5,8);
  if(d.length > 8)  s += '/' + d.slice(8,12);
  if(d.length > 12) s += '-' + d.slice(12,14);
  return s;
}
function cnpjValido(v){
  const d = cnpjDigitos(v);
  if(d.length !== 14) return false;
  if(/^(\d)\1{13}$/.test(d)) return false;
  const digito = function(len){
    let soma = 0, peso = len - 7;
    for(let i = 0; i < len; i++){
      soma += Number(d[i]) * peso--;
      if(peso < 2) peso = 9;
    }
    const r = soma % 11;
    return r < 2 ? 0 : 11 - r;
  };
  return digito(12) === Number(d[12]) && digito(13) === Number(d[13]);
}

function contratosNovosDe(pessoa){
  return contratosNovos.filter(function(c){
    return c.ano === yearFilter && name_matches_client(c.pessoa, pessoa);

    const d = MONTHS.indexOf(a.mes) - MONTHS.indexOf(b.mes);
    return d !== 0 ? d : ((a.id||0) - (b.id||0));
  });
}

/* Sem render: re-desenhar a cada tecla tiraria o foco do campo. */
function onContratoNovoTexto(el, id, campo){
  const c = contratosNovos.find(function(x){ return x.id === id; });
  if(!c) return;
  if(campo === 'cnpj'){
    const antes = el.value, pos = el.selectionStart;
    el.value = formatCnpj(el.value);
    if(pos !== null){
      const novaPos = pos + (el.value.length - antes.length);
      try{ el.setSelectionRange(novaPos, novaPos); }catch(e){}
    }
    c.cnpj = el.value;
    const aviso = document.getElementById('contrato-cnpj-aviso-' + id);
    if(aviso) aviso.textContent = (cnpjDigitos(c.cnpj) && !cnpjValido(c.cnpj)) ? 'CNPJ incompleto' : '';
  } else {
    c[campo] = el.value;
  }
  persistContratosNovos();
}

function setContratoNovoMes(el, id){
  const c = contratosNovos.find(function(x){ return x.id === id; });
  if(!c) return;
  c.mes = el.value;

  render();

  if(!isAdmin) return;

  const i = lista.findIndex(function(v){ return name_matches_client(v, nome); });
  if(i >= 0) lista.splice(i, 1); else lista.push(String(nome).trim());

  persistPainelContratos();
  render();

function adicionarPessoaContratos(){
  if(!isAdmin) return;
  showPrompt('Nome de quem entra na equipe de consultoria:', function(nome){
    if(!nome) return;
    const t = String(nome).trim();
    if(!t) return;
    const lista = pessoasDeContratos();
    if(lista.some(function(v){ return name_matches_client(v, t); })){
      showAlert('Essa pessoa já está na lista.');

    painelContratos = lista;
    persistPainelContratos();

function salvarContratoLancamento(){
  if(!painelContratoPessoa){ showAlert('Escolha a pessoa antes de salvar.'); return; }
  const existente = getRelatorio(painelContratoPessoa, painelContratoMes);
  const dados = {};
  METRICAS_CONTRATOS.forEach(function(m){ dados[m.key] = numOrNull(painelContratoForm[m.key]) || 0; });
  if(existente){
    Object.assign(existente, dados);
  } else {
    const base = { id: relatoriosNextId++, ano: yearFilter, mes: painelContratoMes, vendedor: painelContratoPessoa };
    METRICAS_MANUAIS.forEach(function(m){ base[m.key] = 0; });
    relatorios.push(Object.assign(base, dados));
  }
  persistRelatorios();
  render();
  setTimeout(tryLoadPainelTotaisAsync, 900);
}

  if(!isAdmin) return;
  const lista = vendedoresDoPainel();
  const i = lista.findIndex(function(v){ return name_matches_client(v, nome); });
  if(i >= 0){
    if(lista.length === 1){
      showAlert('O painel precisa de pelo menos uma pessoa. Marque outra antes de tirar esta.');
      render();
      return;
    }
    lista.splice(i, 1);
  } else {
    lista.push(String(nome).trim());
  }
  painelVendedoras = lista;
  persistPainelVendedoras();
  render();
}

function persistPainelVendedoras(){
  saving = true; updateSaveStatus();
  if(entityTimers['painel-vendors']) clearTimeout(entityTimers['painel-vendors']);
  entityTimers['painel-vendors'] = setTimeout(function(){
    (async function(){
      try{
        if(!carregouDoBanco['painel-vendors']) return;   // nunca apagar sem ter lido antes
        await sbDeleteAll('entity_vendors', 'entidade=eq.painel');
        const linhas = (painelVendedoras || []).map(function(v){ return { entidade:'painel', vendor_name:v }; });
        if(linhas.length) await sbUpsert('entity_vendors', linhas, 'entidade,vendor_name');
        saveError = false;
      } catch(e){ console.error(e); saveError = true; }
      finally { saving = false; updateSaveStatus(); }
    })();
  }, 450);
}

async function tryLoadPainelVendedorasAsync(){

    carregouDoBanco['painel-vendors'] = true;

}

/* Valor de um indicador para uma pessoa num mês. Os manuais vêm do que foi
   lançado; os de venda vêm calculados pelo banco. */
function valorMetrica(vendedor, mes, key){
  const t = painelTotais.find(x => x.ano === yearFilter && x.mes === mes
                                && name_matches_client(x.vendedor, vendedor));
  if(t) return Number(t[key]) || 0;
  const r = getRelatorio(vendedor, mes);
  return r ? (Number(r[key]) || 0) : 0;
}
function fmtMetrica(m, valor){
  return m.moeda ? fmtMoney(valor) : (Number(valor)||0).toLocaleString('pt-BR');
}
function corDoVendedor(nome){
  const s = SELLERS.find(x => name_matches_client(x.label, nome));
  return s ? s.color : VENDOR_PALETTE[0];
}
function relatoriosDoAno(){ return relatorios.filter(r => r.ano === yearFilter); }
function getRelatorio(vendedor, mes){
  return relatoriosDoAno().find(r => name_matches_client(r.vendedor, vendedor) && r.mes === mes);
}
function mesesLancados(vendedor){
  return relatoriosDoAno()
    .filter(r => name_matches_client(r.vendedor, vendedor))
    .sort((a,b) => MONTHS.indexOf(a.mes) - MONTHS.indexOf(b.mes));
}
/* Valor de um indicador no período escolhido: o mês, ou a soma dos 12. */
function valorNoPeriodo(vendedor, key, periodo){
  const p = periodo || painelPeriodo;
  if(p && p !== 'Ano') return valorMetrica(vendedor, p, key);
  return MONTHS.reduce(function(a, mes){ return a + valorMetrica(vendedor, mes, key); }, 0);
}
function rotuloPeriodo(periodo){
  const p = periodo || painelPeriodo;
  return (p && p !== 'Ano') ? (p + ' de ' + yearFilter) : ('todo o ano de ' + yearFilter);
}

function totaisPorVendedorPainel(periodo){
  const out = {};
  vendedoresDoPainel().forEach(v => {
    const t = {};
    METRICAS.forEach(m => { t[m.key] = valorNoPeriodo(v, m.key, periodo); });
    out[v] = t;
  });
  return out;
}

function painelFormVazio(){
  const f = {};
  METRICAS.forEach(m => { f[m.key] = ''; });
  return f;
}
function carregarFormPainel(){
  const existente = getRelatorio(painelVendedor, painelMes);
  if(existente){
    const f = {};
    METRICAS.forEach(m => { f[m.key] = existente[m.key] === 0 ? '0' : String(existente[m.key] ?? ''); });
    painelForm = f;
  } else {
    painelForm = painelFormVazio();
  }
}
/* ================= Relatório mensal do sistema inteiro (PDF) =================
   Junta num documento só tudo o que aconteceu num mês: faturamento por
   origem, ganhos de cada vendedora, honorários de parceiros, os
   lançamentos de cada aba, bônus, comissões já liberadas e o desempenho
   da equipe. Sai pela impressão do navegador ("Salvar como PDF"), que é
   o caminho que funciona sem depender de biblioteca externa — o sistema
   bloqueia carregar script de fora por segurança. */

function abrirRelatorioMes(){
  const mesAtual = (partnerMonthFilter && partnerMonthFilter !== 'Todos') ? partnerMonthFilter
    : (filter && filter !== 'Todos') ? filter
    : MONTHS[new Date().getMonth()];
  modalState = { type:'relatorio-mes', mes: mesAtual };
  render();
}
function onRelatorioMesChange(el){ if(modalState) modalState.mes = el.value; }

function imprimirRelatorioMes(){
  const mes = (modalState && modalState.mes) || MONTHS[new Date().getMonth()];
  closeModal();
  let div = document.getElementById('relatorio-print');
  if(!div){
    div = document.createElement('div');
    div.id = 'relatorio-print';
    document.body.appendChild(div);
  }
  div.innerHTML = montarRelatorioMes(mes);
  document.body.classList.add('imprimindo-relatorio');
  const limpar = function(){
    document.body.classList.remove('imprimindo-relatorio');
    window.removeEventListener('afterprint', limpar);
  };
  window.addEventListener('afterprint', limpar);
  setTimeout(function(){ window.print(); setTimeout(limpar, 1500); }, 60);
}

function relTabela(cabecalho, linhas, vazio){
  if(!linhas.length) return `<p class="rel-vazio">${esc(vazio)}</p>`;
  return `<table class="rel-tabela">
    <thead><tr>${cabecalho.map(function(c){
      return `<th${c.num?' class="num"':''}>${esc(c.label)}</th>`;
    }).join('')}</tr></thead>
    <tbody>${linhas.join('')}</tbody>
  </table>`;
}

    {label:'Cursos',                   valor: faturamentoDaOrigem('cursos', ano, mes)},

    const ta = sellerBreak[a], tb = sellerBreak[b];

      <td class="num">${fmtMoney(b.bonus)}</td><td class="num destaque">${fmtMoney(t)}</td></tr>`;

/* Ranking do mês: em cada indicador, quem lidera soma N pontos, o segundo
   N-1, e assim por diante. Vence quem somar mais no conjunto. */
/* Campeã do mês = quem venceu MAIS INDICADORES, não quem somou mais
   pontos. A soma de pontos premiava quem chegava em segundo lugar em
   tudo: num time de 4, quatro segundos lugares valiam mais que uma
   liderança, e acabava campeã quem não tinha vencido nada.

   Aqui vale o que a Soraya pediu: conta quantas vezes o nome da pessoa
   aparece liderando. Empate num indicador dá vitória para todas as
   empatadas, e quem está zerado não vence nada. */
function rankingDoMes(periodo){
  const vends = vendedoresDoPainel();
  const vitorias = {};
  vends.forEach(v => { vitorias[v] = 0; });

  const porMetrica = METRICAS.map(m => {
    const valores = vends
      .map(v => ({ vendedor: v, valor: valorNoPeriodo(v, m.key, periodo) }))
      .sort((a,b) => b.valor - a.valor);

    const lideres = valores.filter(x => x.valor > 0 && x.valor === valores[0].valor);
    lideres.forEach(l => { vitorias[l.vendedor] += 1; });

    return {
      metrica: m.label,
      lideres: lideres,
      todos: valores,
      formatado: lideres.length ? fmtMetrica(m, lideres[0].valor) : '',
    };
  });

  const geral = vends
    .map(v => ({ vendedor: v, vitorias: vitorias[v] }))
    .sort((a,b) => b.vitorias - a.vitorias);
  // Empate ocupa o mesmo lugar (1º, 1º, 3º...)
  let pos = 0;
  geral.forEach(function(g, idx){
    if(idx === 0 || g.vitorias !== geral[idx-1].vitorias) pos = idx + 1;
    g.posicao = pos;
  });
  const campeoes = geral.filter(g => g.vitorias > 0 && g.vitorias === geral[0].vitorias);
  return { porMetrica, geral, campeoes };
}

/* ---------------- Painel da Equipe: gráficos em SVG ---------------- */

function graficoBarrasPainel(dados, opts){
  const w = 760, h = (opts && opts.h) || 240, padBottom = 30, padTop = 12, padLeft = 44, gap = 18;
  const max = Math.max(1, ...dados.map(d => d.valor));
  const plotH = h - padBottom - padTop;
  const plotW = w - padLeft - 12;
  const barW = Math.min(70, (plotW / Math.max(dados.length,1)) - gap);
  const grade = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padTop + plotH - f*plotH;
    return `<line x1="${padLeft}" y1="${y}" x2="${w-12}" y2="${y}" stroke="#F1F5F9" stroke-width="1"/>
            <text x="${padLeft-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#94A3B8">${Math.round(max*f).toLocaleString('pt-BR')}</text>`;
  }).join('');
  const barras = dados.map((d,i) => {
    const bh = max > 0 ? (d.valor/max)*plotH : 0;
    const x = padLeft + (plotW/dados.length)*i + (plotW/dados.length - barW)/2;
    const y = padTop + plotH - bh;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(bh,1)}" rx="5" fill="${esc(corDoVendedor(d.vendedor))}"><title>${esc(d.vendedor)}: ${d.valor.toLocaleString('pt-BR')}</title></rect>
            <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">${d.valor ? d.valor.toLocaleString('pt-BR') : ''}</text>
            <text x="${x+barW/2}" y="${h-10}" text-anchor="middle" font-size="11" fill="#64748B">${esc(d.vendedor)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;overflow:visible;">${grade}${barras}</svg>`;
}

function graficoLinhaPainel(vends, opts){
  const w = 760, h = (opts && opts.h) || 260, padBottom = 28, padTop = 12, padLeft = 44;
  const plotH = h - padBottom - padTop;
  const plotW = w - padLeft - 12;
  const serie = v => MONTHS.map(m => valorMetrica(v, m, painelMetricaFoco));
  const todos = vends.flatMap(serie);
  const max = Math.max(1, ...todos);
  const px = i => padLeft + (plotW/11)*i;
  const py = val => padTop + plotH - (val/max)*plotH;
  const grade = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padTop + plotH - f*plotH;
    return `<line x1="${padLeft}" y1="${y}" x2="${w-12}" y2="${y}" stroke="#F1F5F9" stroke-width="1"/>
            <text x="${padLeft-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#94A3B8">${Math.round(max*f).toLocaleString('pt-BR')}</text>`;
  }).join('');
  const rotulos = MONTHS.map((m,i) =>
    `<text x="${px(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#94A3B8">${monthNumber(m)}</text>`).join('');
  const linhas = vends.map(v => {
    const vals = serie(v);
    const pontos = vals.map((val,i) => `${px(i)},${py(val)}`).join(' ');
    const cor = esc(corDoVendedor(v));
    const bolinhas = vals.map((val,i) =>
      `<circle cx="${px(i)}" cy="${py(val)}" r="2.5" fill="${cor}"><title>${esc(v)} · ${MONTHS[i]}: ${val.toLocaleString('pt-BR')}</title></circle>`).join('');
    return `<polyline points="${pontos}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round"/>${bolinhas}`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;overflow:visible;">${grade}${rotulos}${linhas}</svg>`;
}

/* Painel de empresas novas de uma pessoa, no ano aberto. É a lista que dá
   nome ao número "contratos assinados": quais empresas entraram e se o
   negócio valeu a pena. Vai em largura total, embaixo dos quadros — a
   tabela não caberia na coluna estreita da direita. */
function painelEmpresasNovas(pessoa, slugPessoa){
  const lista = contratosNovosDe(pessoa);
  const editavel = isAdmin;
  const rent     = lista.filter(function(c){ return c.rentavel === true;  }).length;
  const naoRent  = lista.filter(function(c){ return c.rentavel === false; }).length;
  const semAval  = lista.length - rent - naoRent;

  const linhas = lista.map(function(c){
    const avisoCnpj = (cnpjDigitos(c.cnpj) && !cnpjValido(c.cnpj)) ? 'CNPJ incompleto' : '';
    return `<tr>
      <td class="col-mes">${editavel
        ? `<select class="contrato-linha-select" onchange="setContratoNovoMes(this,${c.id})">${
            MONTHS.map(function(m){ return `<option value="${m}" ${c.mes===m?'selected':''}>${monthShort(m)}</option>`; }).join('')
          }</select>`
        : esc(monthShort(c.mes))}</td>
      <td class="col-nome">${editavel
        ? `<input class="contrato-linha-input" id="contrato-emp-${c.id}" type="text" placeholder="Nome da empresa"
                  value="${esc(c.empresa)}" oninput="onContratoNovoTexto(this,${c.id},'empresa')" />`
        : esc(c.empresa || '—')}</td>
      <td class="col-cnpj">${editavel
        ? `<input class="contrato-linha-input" type="text" inputmode="numeric" placeholder="00.000.000/0000-00"
                  value="${esc(formatCnpj(c.cnpj))}" oninput="onContratoNovoTexto(this,${c.id},'cnpj')" />
           <span class="contrato-cnpj-aviso" id="contrato-cnpj-aviso-${c.id}">${esc(avisoCnpj)}</span>`
        : esc(formatCnpj(c.cnpj) || '—')}</td>
      <td class="col-rent">
        <div class="rent-toggle">
          <button type="button" class="rent-btn sim${c.rentavel===true?' on':''}" ${editavel?'':'disabled'}
                  title="O negócio valeu a pena" onclick="setContratoRentavel(${c.id},true)">Rentável</button>
          <button type="button" class="rent-btn nao${c.rentavel===false?' on':''}" ${editavel?'':'disabled'}
                  title="O negócio não valeu a pena" onclick="setContratoRentavel(${c.id},false)">Não rentável</button>
        </div>
      </td>
      ${editavel ? `<td class="del-cell"><div class="row-actions">
        <button class="action-btn danger" title="Excluir esta empresa" onclick="excluirContratoNovo(${c.id})">✕</button>
      </div></td>` : ''}
    </tr>`;
  }).join('');

  const tabela = lista.length ? `
    <div class="table-scroll">
      <table class="table-plain">
        <thead><tr>
          <th class="col-mes">Mês</th>
          <th class="col-nome">Empresa</th>
          <th class="col-cnpj">CNPJ</th>
          <th class="col-rent">O negócio foi</th>
          ${editavel ? '<th></th>' : ''}
        </tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>
    <div class="contrato-resumo">
      <span>${lista.length} empresa${lista.length===1?'':'s'} em ${yearFilter}:</span>
      <span class="contrato-tag sim">${rent} rentáve${rent===1?'l':'is'}</span>
      <span class="contrato-tag nao">${naoRent} não rentáve${naoRent===1?'l':'is'}</span>
      ${semAval ? `<span class="contrato-tag aval">${semAval} sem avaliação</span>` : ''}
    </div>`
    : `<div class="meta-empty" style="padding:22px 16px;">Nenhuma empresa cadastrada para ${esc(pessoa)} em ${yearFilter}.</div>`;

  // Conferência: o número digitado em "contratos assinados" e a quantidade
  // de empresas cadastradas deveriam bater. Quando não batem, avisa — sem
  // corrigir nada sozinho, porque só ela sabe qual dos dois está certo.
  let nota = '';
  if(editavel){
    const divergentes = MONTHS.map(function(m){
      const lancado = valorMetrica(pessoa, m, 'contratos') || 0;
      const cadastradas = lista.filter(function(c){ return c.mes === m; }).length;
      return { mes:m, lancado:lancado, cadastradas:cadastradas };
    }).filter(function(d){ return (d.lancado || d.cadastradas) && d.lancado !== d.cadastradas; });
    if(divergentes.length){
      nota = `<div class="contrato-nota">⚖️ Confira: o número de <b>contratos assinados</b> não bate com as empresas cadastradas — ${
        divergentes.map(function(d){ return `<b>${esc(d.mes)}</b>: ${d.lancado} lançado${d.lancado===1?'':'s'}, ${d.cadastradas} cadastrada${d.cadastradas===1?'':'s'}`; }).join(' · ')
      }.</div>`;
    }
  }

  const botao = editavel ? `<div class="contrato-add">
    <button class="modal-btn modal-btn-ghost" style="width:100%;" onclick="addContratoNovo('${escJs(pessoa)}')">+ Empresa com contrato assinado</button>
  </div>` : '';

  return panel('painel-empresas-' + slugPessoa, 'Empresas com contrato assinado — ' + esc(pessoa),
    tabela + nota + botao, {
      meta: `<b>${lista.length}</b> empresa${lista.length===1?'':'s'} · <b>${rent}</b> rentáve${rent===1?'l':'is'}`,
      flush: true,
    });
}

/* ================= Usuários e acessos =================
   O cadastro de contas roda numa função no servidor (admin-usuarios), não
   aqui. É de propósito: criar conta e trocar senha exigem a chave de
   serviço do Supabase, e essa chave nunca pode ficar no navegador — com
   ela qualquer pessoa leria e escreveria o banco inteiro, passando por
   cima de todas as regras de acesso. O que vai daqui é só o token de quem
   está logado; o servidor confere se é admin antes de fazer qualquer
   coisa. */

let usuariosLista = null;
let usuariosCarregando = false;
let usuariosErro = '';
let usuarioForm = { email:'', senha:'', admin:false, pessoa:'' };
let usuarioCriado = null;   // {email, senha} — pra mostrar a senha uma vez

async function chamarAdminUsuarios(payload){
  const token = await ensureFreshToken();
  if(!token) throw new Error('Sessão expirada. Entre de novo.');
  const res = await fetch(SUPABASE_URL + '/functions/v1/admin-usuarios', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'apikey': SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(payload),
  });
  let json = {};
  try{ json = await res.json(); }catch(e){}
  if(!res.ok) throw new Error(json.erro || ('Não consegui falar com o servidor (erro ' + res.status + ').'));
  return json;
}

async function carregarUsuarios(){
  if(!isAdmin) return;
  usuariosCarregando = true; usuariosErro = ''; render();
  try{
    const r = await chamarAdminUsuarios({ acao:'listar' });
    usuariosLista = r.usuarios || [];
  }catch(e){
    usuariosErro = e.message || String(e);
  }finally{
    usuariosCarregando = false; render();
  }
}

/* Senha provisória forte, fácil de ditar por telefone: sem caracteres que
   se confundem (0/O, 1/l/I). */
function gerarSenhaProvisoria(){
  const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const minus  = 'abcdefghijkmnopqrstuvwxyz';
  const nums   = '23456789';
  const simb   = '!@#$%&*';
  const todos  = letras + minus + nums + simb;
  const sorteia = (s) => s[Math.floor(Math.random() * s.length)];
  let senha = sorteia(letras) + sorteia(minus) + sorteia(nums) + sorteia(simb);
  for(let i = 0; i < 8; i++) senha += sorteia(todos);
  return senha.split('').sort(() => Math.random() - 0.5).join('');
}
function onGerarSenha(){
  usuarioForm.senha = gerarSenhaProvisoria();
  render();
}
function onUsuarioFormInput(el, campo){
  usuarioForm[campo] = (el.type === 'checkbox') ? el.checked : el.value;
  if(campo === 'admin') render();   // mostra/esconde o campo do nome
}

async function criarUsuario(){
  const f = usuarioForm;
  if(!f.email.trim()){ showAlert('Informe o e-mail.'); return; }
  if((f.senha||'').length < 8){ showAlert('A senha provisória precisa de pelo menos 8 caracteres. Use o botão "Gerar senha".'); return; }
  if(!f.admin && !f.pessoa.trim()){
    showAlert('Para conta restrita, informe o nome exatamente como ele aparece nos lançamentos (ex: Rios).');
    return;
  }
  usuariosCarregando = true; usuariosErro = ''; render();
  try{
    await chamarAdminUsuarios({
      acao:'criar', email:f.email.trim(), senha:f.senha,
      admin:!!f.admin, pessoa:f.pessoa.trim(),
    });
    usuarioCriado = { email: f.email.trim(), senha: f.senha };
    usuarioForm = { email:'', senha:'', admin:false, pessoa:'' };
    await carregarUsuarios();
  }catch(e){
    usuariosErro = e.message || String(e);
    usuariosCarregando = false; render();
  }
}

function redefinirSenhaUsuario(id, email){
  const nova = gerarSenhaProvisoria();
  showConfirm(
    `Definir uma senha provisória nova para ${email}?\n\nA senha atual deixa de funcionar na hora.`,
    async function(){
      usuariosCarregando = true; usuariosErro = ''; render();
      try{
        await chamarAdminUsuarios({ acao:'senha', id: id, senha: nova });
        usuarioCriado = { email: email, senha: nova, trocada: true };
        await carregarUsuarios();
      }catch(e){
        usuariosErro = e.message || String(e);
        usuariosCarregando = false; render();
      }
    },
    'Definir senha nova'
  );
}

function abrirAcessoUsuario(id){
  const u = (usuariosLista||[]).find(x => x.id === id);
  if(!u) return;
  modalState = { type:'acesso-usuario', id: id, email: u.email, admin: !!u.admin, pessoa: u.pessoa || '' };
  render();
}
function onAcessoFormChange(el, campo){
  if(!modalState) return;
  modalState[campo] = (el.type === 'checkbox') ? el.checked : el.value;
  if(campo === 'admin') render();
}
async function salvarAcessoUsuario(){
  if(!modalState) return;
  const m = modalState;
  if(!m.admin && !String(m.pessoa||'').trim()){
    modalState.error = 'Para conta restrita, informe o nome como aparece nos lançamentos.';
    render(); return;
  }
  const dados = { acao:'acesso', id:m.id, admin:!!m.admin, pessoa:String(m.pessoa||'').trim() };
  closeModal();
  usuariosCarregando = true; usuariosErro = ''; render();
  try{
    await chamarAdminUsuarios(dados);
    await carregarUsuarios();
  }catch(e){
    usuariosErro = e.message || String(e);
    usuariosCarregando = false; render();
  }
}
function fecharSenhaMostrada(){ usuarioCriado = null; render(); }
